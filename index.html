["Subordinadas implícitas","dopo aver finito=después de haber terminado;prima di partire=antes de salir;pur di=con tal de;a forza di=a fuerza de;senza farlo=sin hacerlo;nel fare=al hacer;a condizione di=a condición de;allo scopo di=con el fin de","Las subordinadas implícitas (infinitivo, gerundio, participio) dan concisión: «Dopo aver letto il rapporto, ho deciso» (en lugar de «Dopo che ho letto…»). Requieren el mismo sujeto que la principal. «A forza di + infinitivo» = a fuerza de; «pur di + infinitivo» = con tal de.","Dopo aver letto il rapporto, ho deciso.=Tras haber leído el informe, decidí.;A forza di insistere, ha ottenuto il permesso.=A fuerza de insistir, consiguió el permiso.;Pur di vincere, ha rischiato tutto.=Con tal de ganar, lo arriesgó todo.;Allo scopo di migliorare, ha cambiato metodo.=Con el fin de mejorar, cambió de método.","Dopo aver letto il rapporto, ho deciso di cambiare strategia. A forza di insistere, il mio collega ha ottenuto più fondi, pur di non perdere il progetto. Allo scopo di evitare errori, abbiamo ricontrollato tutto prima di firmare, senza avere fretta.","Tras haber leído el informe, decidí cambiar de estrategia. A fuerza de insistir, mi compañero consiguió más fondos con tal de no perder el proyecto. Con el fin de evitar errores, lo revisamos todo antes de firmar, sin tener prisa.","¿Qué decidió tras el informe?|Cambiar de estrategia|Renunciar|Cancelar|0#¿Qué hicieron antes de firmar?|Revisar todo|Votar|Pagar|0","___ aver letto il rapporto, ho deciso.|Dopo|Prima|Mentre#A forza ___ insistere, ha ottenuto.|di|a|da","Con el fin de mejorar=Allo scopo di migliorare#A fuerza de insistir=A forza di insistere"],
["Pronombres: enclisis y colocación","dammelo=dámelo;diglielo=díselo;portamene=tráeme de eso;facendolo=haciéndolo;averlo detto=haberlo dicho;vederla=verla;lasciami stare=déjame en paz;se ne è andato=se ha ido","Con imperativo, infinitivo y gerundio los pronombres van pegados (enclisis): dammelo, diglielo, facendolo, vederla. Con verbos modales hay dos posibilidades: lo voglio fare / voglio farlo. En los pronombres dobles, el indirecto va primero: me lo, te lo, glielo.","Dammelo subito!=¡Dámelo ya!;Diglielo domani.=Díselo mañana.;Voglio farlo da solo.=Quiero hacerlo yo solo.;Lasciami stare, per favore.=Déjame en paz, por favor.","Marco mi ha chiesto il libro: «Dammelo, per favore!» Gliel'ho dato, ma poi mi sono pentita. Avrei dovuto dirglielo: non lo volevo prestare. Adesso, vedendolo felice, non posso più chiederglielo indietro. Lasciamo stare.","Marco me pidió el libro: «¡Dámelo, por favor!» Se lo di, pero luego me arrepentí. Debería habérselo dicho: no quería prestarlo. Ahora, viéndolo feliz, ya no puedo pedírselo de vuelta. Dejémoslo.","¿Qué le pidió Marco?|El libro|El móvil|Dinero|0#¿Cómo se siente ella después?|Arrepentida|Contenta|Enfadada|0","___ subito, per favore!|Dammelo|Dai me lo|Mi lo dare#Voglio ___ da solo.|farlo|fare|fa","Díselo=Diglielo#Dámelo=Dammelo"],
["Concordancia del participio","l'ho vista=la he visto;li ho presi=los he cogido;le ho incontrate=las he encontrado;è andata=ha ido (ella);sono arrivati=han llegado;si è lavata=se ha lavado (ella);se ne sono accorti=se han dado cuenta;ne ho visti=he visto de ellos","El participio concuerda con el sujeto con essere (è andata, sono arrivati), con el objeto directo si este precede con avere (l'ho vista, li ho presi) y con ne partitivo: Quanti libri? Ne ho letti tre. Reflexivos: si è lavata (concuerda con el sujeto).","Maria è andata al mercato.=María ha ido al mercado.;Le ho incontrate ieri.=Las encontré ayer.;Di libri, ne ho letti tre.=De libros, he leído tres.;Si è lavata le mani.=Se ha lavado las manos.","Maria è andata al mercato e ha comprato delle mele. Le ho viste mentre le sceglieva e ne ho prese anch'io tre. I miei amici sono arrivati tardi: li ho aspettati un'ora. Quando si sono accorti dell'errore, si sono scusati.","María ha ido al mercado y ha comprado unas manzanas. Las vi mientras las elegía y yo también cogí tres. Mis amigos llegaron tarde: los esperé una hora. Cuando se dieron cuenta del error, se disculparon.","¿Qué compró María?|Manzanas|Peras|Pan|0#¿Cuánto esperó a los amigos?|Una hora|Diez minutos|Un día|0","Le ho ___ ieri.|incontrate|incontrato|incontrata#Maria è ___ al mercato.|andata|andato|andati","Las he visto=Le ho viste#Han llegado=Sono arrivati"],
["Variantes literarias de se","ove=si (literario);qualora=en caso de que;laddove=allí donde;ove possibile=si es posible;a meno che non=a menos que;ammesso che=suponiendo que;posto che=supuesto que;se mai=si acaso","En el italiano escrito y literario hay variantes de «se»: «Ove possibile, si preferisce…» (si es posible), «Ammesso che + congiuntivo» (suponiendo que), «Posto che» (supuesto que), «Se mai» (si acaso). Se usan en documentos, ensayos y textos legales.","Ove possibile, si preferisce il pagamento online.=Si es posible, se prefiere el pago en línea.;Ammesso che sia vero, cosa cambierebbe?=Suponiendo que sea verdad, ¿qué cambiaría?;Posto che il problema esista, dobbiamo risolverlo.=Supuesto que el problema exista, debemos resolverlo.;Se mai tornasse, avvisami.=Si acaso volviera, avísame.","Ove possibile, l'azienda preferisce trattare i reclami per iscritto. Ammesso che il guasto sia reale, si procederà alla sostituzione. Posto che la richiesta rispetti i termini, il rimborso sarà immediato. Se mai il problema si ripresentasse, si prega di contattare l'ufficio.","Si es posible, la empresa prefiere tramitar las reclamaciones por escrito. Suponiendo que la avería sea real, se procederá a la sustitución. Supuesto que la solicitud respete los plazos, el reembolso será inmediato. Si acaso el problema se repitiera, se ruega contactar con la oficina.","¿Cómo prefiere la empresa tramitar reclamaciones?|Por escrito|Por teléfono|En persona|0#¿Cuándo será inmediato el reembolso?|Si respeta los plazos|Siempre|Nunca|0","___ possibile, si preferisce il pagamento online.|Ove|Dove|Quando#___ che sia vero, cosa cambierebbe?|Ammesso|Ammettere|Ammetto","Suponiendo que=Ammesso che#Si acaso=Se mai"],
["El passato remoto","fu=fue;ebbe=tuvo;fece=hizo;disse=dijo;venne=vino;andò=fue (de ir);nacque=nació;morì=murió","El passato remoto narra acciones lejanas o concluidas, sobre todo en textos literarios e históricos y en el sur de Italia: Dante nacque nel 1265. Formas: -are → -ai, -asti, -ò, -ammo, -aste, -arono. Irregulares frecuentes: fu, ebbe, fece, disse, venne, vide, nacque, morì.","Dante nacque a Firenze nel 1265.=Dante nació en Florencia en 1265.;Napoleone fu sconfitto a Waterloo.=Napoleón fue derrotado en Waterloo.;Disse la verità e partì.=Dijo la verdad y partió.;I Romani costruirono molte strade.=Los romanos construyeron muchas carreteras.","Il poeta nacque in una piccola città e, ancora giovane, venne a Firenze. Ebbe molti amici e scrisse versi bellissimi. Poi la guerra lo costrinse a partire: andò in esilio e non tornò più. Morì lontano dalla sua terra, ma le sue opere sopravvissero.","El poeta nació en una pequeña ciudad y, todavía joven, vino a Florencia. Tuvo muchos amigos y escribió versos hermosísimos. Luego la guerra lo obligó a marcharse: se fue al exilio y no volvió más. Murió lejos de su tierra, pero sus obras sobrevivieron.","¿Qué hizo el poeta tras la guerra?|Se fue al exilio|Volvió|Se calló|0#¿Dónde murió?|Lejos de su tierra|En casa|En Florencia|0","Dante ___ a Firenze nel 1265.|nacque|nasce|nato#Napoleone ___ sconfitto.|fu|è|era","Nació=Nacque#Fue=Fu"],
["Argumentación académica","è lecito supporre=es lícito suponer;si evince che=se deduce que;ne consegue che=de ello se sigue que;a tal proposito=a tal propósito;in tal senso=en tal sentido;nondimeno=no obstante;ciò premesso=dicho esto;alla luce di=a la luz de","En el ensayo académico se usan fórmulas de enlace formales: «Ciò premesso», «A tal proposito», «Nondimeno», «Alla luce di», «Ne consegue che». Se prefiere el impersonal («si evince che») y se evita el lenguaje coloquial.","Ciò premesso, passiamo all'analisi.=Dicho esto, pasemos al análisis.;Alla luce di tali dati, è lecito supporre una crescita.=A la luz de tales datos, es lícito suponer un crecimiento.;Si evince che il fenomeno è complesso.=Se deduce que el fenómeno es complejo.;Nondimeno, restano alcuni dubbi.=No obstante, quedan algunas dudas.","Ciò premesso, analizziamo i dati raccolti. Alla luce di tali risultati, è lecito supporre che il fenomeno sia in crescita. Si evince inoltre che le cause siano molteplici. Nondimeno, restano alcuni dubbi metodologici; a tal proposito, ne consegue che servano ulteriori ricerche.","Dicho esto, analicemos los datos recogidos. A la luz de tales resultados, es lícito suponer que el fenómeno está en crecimiento. Se deduce además que las causas son múltiples. No obstante, quedan algunas dudas metodológicas; a tal propósito, se sigue que hacen falta más investigaciones.","¿Qué es lícito suponer?|Que el fenómeno crece|Que desaparece|Que es estable|0#¿Qué hacen falta?|Más investigaciones|Más datos falsos|Menos análisis|0","___ premesso, passiamo all'analisi.|Ciò|Lo|Ci#Alla ___ di questi dati, è lecito supporre.|luce|luci|luminosa","No obstante=Nondimeno#A tal propósito=A tal proposito"],
["Literatura del siglo XX","il romanzo=la novela;lo scrittore=el escritor;la raccolta=la colección;il neorealismo=el neorrealismo;la testimonianza=el testimonio;lo stile=el estilo;l'ironia=la ironía;la trama=la trama","Para analizar un texto literario: «L'autore descrive con ironia…», «Il narratore è onnisciente / in prima persona», «Il tema centrale è…», «Si nota una critica a…». Autores clave: Calvino, Levi, Pavese, Ginzburg. Verbos: ambientare (situar), narrare, rappresentare.","Il romanzo è ambientato nel dopoguerra.=La novela está ambientada en la posguerra.;Calvino scrive con ironia e fantasia.=Calvino escribe con ironía y fantasía.;Il tema centrale è la memoria.=El tema central es la memoria.;Primo Levi offre una testimonianza essenziale.=Primo Levi ofrece un testimonio esencial.","Il romanzo è ambientato nel dopoguerra e racconta la vita di una famiglia di operai. Il narratore, in prima persona, descrive con ironia le difficoltà quotidiane. Il tema centrale è la memoria, ma si nota anche una critica alla società del tempo. Lo stile, essenziale e diretto, ricorda il neorealismo.","La novela está ambientada en la posguerra y cuenta la vida de una familia de obreros. El narrador, en primera persona, describe con ironía las dificultades cotidianas. El tema central es la memoria, pero también se nota una crítica a la sociedad de la época. El estilo, esencial y directo, recuerda al neorrealismo.","¿En qué época está ambientada?|La posguerra|La Edad Media|El siglo XIX|0#¿Cuál es el tema central?|La memoria|El amor|El dinero|0","Il romanzo è ___ nel dopoguerra.|ambientato|ambientare|ambientando#Il ___ è in prima persona.|narratore|narrare|narrato","El estilo=Lo stile#La trama=La trama"],
["Política y democracia italiana","il parlamento=el parlamento;il governo=el gobierno;la costituzione=la constitución;il referendum=el referéndum;le elezioni=las elecciones;la maggioranza=la mayoría;l'opposizione=la oposición;il Presidente della Repubblica=el Presidente de la República","Italia es una república parlamentaria: el Parlamento (Camera y Senato) vota las leyes; el Presidente della Repubblica es jefe de Estado y nombra al Presidente del Consiglio. Para analizar: «È stato eletto…», «La maggioranza ha approvato…», «Il referendum è stato indetto…» (pasiva).","Il Parlamento ha approvato la legge.=El Parlamento ha aprobado la ley.;Il referendum è stato indetto per giugno.=El referéndum ha sido convocado para junio.;La maggioranza sostiene il governo.=La mayoría apoya al gobierno.;L'opposizione ha votato contro.=La oposición ha votado en contra.","L'Italia è una repubblica parlamentare. Il Parlamento, composto da Camera e Senato, approva le leggi, mentre il Presidente della Repubblica nomina il Presidente del Consiglio. La maggioranza sostiene il governo, l'opposizione lo critica. Alcune decisioni vengono sottoposte a referendum, indetto dai cittadini.","Italia es una república parlamentaria. El Parlamento, compuesto por la Cámara y el Senado, aprueba las leyes, mientras que el Presidente de la República nombra al Presidente del Consejo. La mayoría apoya al gobierno y la oposición lo critica. Algunas decisiones se someten a referéndum, convocado por los ciudadanos.","¿Qué forma de gobierno tiene Italia?|República parlamentaria|Monarquía|República presidencialista|0#¿Quién nombra al Presidente del Consejo?|El Presidente de la República|El Senado|El pueblo|0","Il Parlamento ha ___ la legge.|approvato|approvare|approva#La ___ sostiene il governo.|maggioranza|maggiore|maggio","Las elecciones=Le elezioni#El referéndum=Il referendum"],
["Economía y finanzas","la borsa=la bolsa;l'azione=la acción;l'obbligazione=el bono;il tasso d'interesse=el tipo de interés;il debito pubblico=la deuda pública;la crisi=la crisis;la recessione=la recesión;investire=invertir","Para hablar de finanzas: «Il mercato è crollato / è salito», «gli investitori hanno perso fiducia», «Il debito pubblico supera il…». Gerundio para tendencias: «Il PIL sta crescendo». Cifras: il doppio, il triplo, un calo del cinque per cento.","La borsa è crollata ieri.=La bolsa se desplomó ayer.;Gli investitori hanno perso fiducia.=Los inversores han perdido la confianza.;Il debito pubblico supera il cento per cento del PIL.=La deuda pública supera el cien por cien del PIB.;Il PIL sta crescendo lentamente.=El PIB está creciendo lentamente.","Ieri la borsa è crollata del cinque per cento e gli investitori hanno perso fiducia. Il debito pubblico supera già il cento per cento del PIL e la recessione sembra vicina. Alcuni analisti consigliano di investire in obbligazioni, altri invece preferiscono aspettare e osservare i tassi d'interesse.","Ayer la bolsa se desplomó un cinco por ciento y los inversores perdieron la confianza. La deuda pública supera ya el cien por cien del PIB y la recesión parece cercana. Algunos analistas aconsejan invertir en bonos, otros prefieren esperar y observar los tipos de interés.","¿Cuánto cayó la bolsa?|Cinco por ciento|Diez por ciento|Uno por ciento|0#¿Qué aconsejan algunos analistas?|Invertir en bonos|Vender todo|Comprar acciones|0","La borsa è ___ ieri.|crollata|crollare|crolla#Il PIL sta ___.|crescendo|crescere|cresciuto","La deuda pública=Il debito pubblico#La recesión=La recessione"],
["Bioética y dilemas","la bioetica=la bioética;il consenso informato=el consentimiento informado;il trapianto=el trasplante;la ricerca=la investigación;la clonazione=la clonación;il diritto alla salute=el derecho a la salud;il dilemma=el dilema;la sperimentazione=la experimentación","Para debatir dilemas éticos: «Si pone il problema di…», «È lecito + infinitivo?», «Da un punto di vista etico…», «Un conto è…, un altro è…» (una cosa es…, otra es…). Con congiuntivo: «Non è detto che sia giusto».","Si pone il problema del consenso informato.=Se plantea el problema del consentimiento informado.;È lecito sperimentare sugli animali?=¿Es lícito experimentar con animales?;Un conto è curare, un altro è modificare.=Una cosa es curar, otra es modificar.;Non è detto che sia giusto.=No necesariamente es justo.","Il progresso scientifico pone dilemmi importanti. Si pone il problema del consenso informato: è lecito sperimentare senza l'accordo del paziente? Un conto è curare una malattia, un altro è modificare il genoma. Non è detto che ciò che è tecnicamente possibile sia anche eticamente giusto.","El progreso científico plantea dilemas importantes. Se plantea el problema del consentimiento informado: ¿es lícito experimentar sin el acuerdo del paciente? Una cosa es curar una enfermedad y otra es modificar el genoma. No necesariamente lo que es técnicamente posible sea también éticamente justo.","¿Qué se plantea?|El consentimiento informado|La clonación|Los trasplantes|0#¿Qué no es necesariamente justo?|Lo técnicamente posible|La salud|La ley|0","Un ___ è curare, un altro è modificare.|conto|tanto|certo#Non è detto che ___ giusto.|sia|è|sarà","El dilema=Il dilemma#El consentimiento informado=Il consenso informato"],
["Maquiavelo y el pensamiento político","il principe=el príncipe;il potere=el poder;la virtù=la virtud;la fortuna=la fortuna;lo Stato=el Estado;il consenso=el consenso;la politica=la política;il realismo politico=el realismo político","Maquiavelo (1469-1527) separa política y moral. «Il fine giustifica i mezzi» es una simplificación de su pensamiento. En «Il Principe» analiza el poder con realismo: la virtù (capacidad) y la fortuna (azar). Para exponer ideas: «Secondo Machiavelli…», «Va sottolineato che…».","Secondo Machiavelli, la politica ha regole proprie.=Según Maquiavelo, la política tiene reglas propias.;La virtù e la fortuna decidono il destino.=La virtud y la fortuna deciden el destino.;Va sottolineato che il consenso è essenziale.=Hay que subrayar que el consenso es esencial.;Il Principe analizza il potere con realismo.=El Príncipe analiza el poder con realismo.","Secondo Machiavelli, la politica segue regole proprie e non coincide con la morale. Nel Principe analizza il potere con realismo: la virtù, cioè la capacità del principe, deve confrontarsi con la fortuna, il caso. Va sottolineato che anche il consenso del popolo è essenziale. Spesso la sua frase più famosa viene semplificata.","Según Maquiavelo, la política sigue reglas propias y no coincide con la moral. En El Príncipe analiza el poder con realismo: la virtù, es decir, la capacidad del príncipe, debe enfrentarse a la fortuna, el azar. Hay que subrayar que también el consenso del pueblo es esencial. A menudo su frase más famosa se simplifica.","¿Con qué analiza el poder?|Con realismo|Con ironía|Con miedo|0#¿Qué es esencial también?|El consenso del pueblo|El ejército|El dinero|0","Secondo Machiavelli, la politica ha regole ___.|proprie|proprio|propri#La virtù si confronta con la ___.|fortuna|fortunato|fortunatamente","El poder=Il potere#El Estado=Lo Stato"],
["Figuras retóricas","la metafora=la metáfora;la similitudine=el símil;l'iperbole=la hipérbole;l'ossimoro=el oxímoron;la personificazione=la personificación;l'anafora=la anáfora;il climax=la gradación;la litote=la litotes","Figuras comunes: metafora (la vita è un viaggio), similitudine (con «come»: veloce come il vento), iperbole (ti ho chiamato mille volte), ossimoro (silenzio assordante), litote («non è male» por «es muy bueno»). Para describirlas: «L'autore ricorre a…», «Si nota l'uso di…».","L'autore ricorre a una metafora potente.=El autor recurre a una metáfora potente.;Ti ho chiamato mille volte!=¡Te he llamado mil veces!;Un silenzio assordante riempiva la stanza.=Un silencio ensordecedor llenaba la sala.;Non è male come idea.=No está mal como idea.","Nel discorso il politico ricorre a una metafora potente: «La città è una nave in tempesta.» Poi usa un'iperbole: «Ho ascoltato mille proteste». Si nota anche un ossimoro, «un silenzio assordante», che colpisce il pubblico. Infine, con una litote, dice: «Non è un risultato da poco».","En el discurso el político recurre a una metáfora potente: «La ciudad es un barco en la tormenta.» Luego usa una hipérbole: «He escuchado mil protestas». Se nota también un oxímoron, «un silencio ensordecedor», que impacta al público. Por último, con una litotes, dice: «No es un resultado pequeño».","¿Qué metáfora usa?|La ciudad es un barco en tormenta|La ciudad es una flor|La ciudad es un reloj|0#¿Qué oxímoron aparece?|Un silencio ensordecedor|Un día oscuro|Una luz brillante|0","L'autore ___ a una metafora.|ricorre|ricorrere|ricorso#Un silenzio ___ riempiva la stanza.|assordante|assordare|assordato","Una metáfora=Una metafora#Una hipérbole=Un'iperbole"],
["Puntuación y período largo","il punto e virgola=el punto y coma;i due punti=los dos puntos;le virgolette=las comillas;il trattino=el guion;la parentesi=el paréntesis;il periodo=el período;la subordinata=la subordinada;il paragrafo=el párrafo","En el período largo, el punto y coma separa ideas relacionadas; los dos puntos introducen explicación o enumeración; el guion aísla incisos. La coma antes de «che» relativo explicativo es obligatoria y no se coloca entre sujeto y verbo. Evitar el «e» repetido mejora el estilo.","Era stanco, eppure continuò a lavorare.=Estaba cansado, y aun así siguió trabajando.;Ecco il motivo: non c'erano fondi.=Esta es la razón: no había fondos.;Il libro, che ho letto ieri, è bellissimo.=El libro, que leí ayer, es hermosísimo.;Il periodo è lungo ma ben costruito.=El período es largo pero bien construido.","Il periodo, quando è lungo, richiede attenzione; la punteggiatura guida il lettore. Il punto e virgola separa idee collegate, mentre i due punti introducono una spiegazione: ecco perché è importante usarli bene. Un buon testo non è solo corretto, ma anche chiaro, ritmato, piacevole da leggere.","El período, cuando es largo, requiere atención; la puntuación guía al lector. El punto y coma separa ideas relacionadas, mientras que los dos puntos introducen una explicación: por eso es importante usarlos bien. Un buen texto no es solo correcto, sino también claro, con ritmo, agradable de leer.","¿Qué hace el punto y coma?|Separa ideas relacionadas|Termina el texto|Introduce una cita|0#¿Qué introducen los dos puntos?|Una explicación|Una pregunta|Un título|0","Il punto e ___ separa idee collegate.|virgola|punto|dubbio#I ___ punti introducono una spiegazione.|due|tre|molti","Los dos puntos=I due punti#Las comillas=Le virgolette"],
["Lenguaje jurídico y contratos","il contratto=el contrato;la clausola=la cláusula;l'inadempimento=el incumplimiento;la risoluzione=la rescisión;il risarcimento=la indemnización;la controversia=la controversia;il foro competente=el fuero competente;le parti=las partes","En contratos se usan el futuro de obligación y el congiuntivo jurídico: «Le parti si impegnano a…», «Qualora una delle parti non adempia, l'altra potrà risolvere il contratto». Fórmulas: «a norma di legge», «ai sensi dell'articolo», «fatto salvo».","Le parti si impegnano a rispettare gli accordi.=Las partes se comprometen a respetar los acuerdos.;Qualora una parte non adempia, l'altra potrà risolvere il contratto.=Si una parte incumple, la otra podrá rescindir el contrato.;Ai sensi dell'articolo 5, il contratto è valido.=Con arreglo al artículo 5, el contrato es válido.;La controversia sarà risolta dal foro competente.=La controversia será resuelta por el fuero competente.","Il contratto stabilisce che le parti si impegnano a rispettare tutte le clausole. Qualora una di esse non adempia, l'altra potrà chiedere la risoluzione e il risarcimento dei danni. Ai sensi dell'articolo 7, ogni controversia sarà risolta dal foro competente di Milano.","El contrato establece que las partes se comprometen a respetar todas las cláusulas. Si una de ellas incumple, la otra podrá pedir la rescisión y la indemnización de los daños. Con arreglo al artículo 7, toda controversia será resuelta por el fuero competente de Milán.","¿Qué ocurre si una parte incumple?|La otra puede pedir rescisión|Nada|Se renueva|0#¿Qué fuero resuelve?|El de Milán|El de Roma|El de Turín|0","Qualora una parte non ___, l'altra potrà risolvere.|adempia|adempie|adempirà#___ sensi dell'articolo 7.|Ai|Nei|Dai","La cláusula=La clausola#El incumplimiento=L'inadempimento"],
["Comunicación médica formal","l'anamnesi=la anamnesis;la diagnosi=el diagnóstico;la prognosi=el pronóstico;l'effetto collaterale=el efecto secundario;il trattamento=el tratamiento;l'intervento=la intervención;il referto=el informe médico;la controindicazione=la contraindicación","El médico usa estructuras formales con el paciente: «Le consiglio di sottoporsi a…», «È necessario che Lei segua la terapia», «Non si preoccupi, la prognosi è favorevole». Eufemismos y precisión: «una lieve infiammazione», «nulla di grave».","Le consiglio di sottoporsi a ulteriori esami.=Le aconsejo someterse a más pruebas.;È necessario che Lei segua la terapia.=Es necesario que usted siga el tratamiento.;La prognosi è favorevole.=El pronóstico es favorable.;Può avere qualche effetto collaterale.=Puede tener algún efecto secundario.","Dopo l'anamnesi, la dottoressa spiega: «Il referto mostra una lieve infiammazione. Le consiglio di sottoporsi a ulteriori esami. È necessario che Lei segua la terapia per due settimane. Può avere qualche effetto collaterale, ma non si preoccupi: la prognosi è favorevole.»","Tras la anamnesis, la doctora explica: «El informe muestra una leve inflamación. Le aconsejo someterse a más pruebas. Es necesario que usted siga el tratamiento durante dos semanas. Puede tener algún efecto secundario, pero no se preocupe: el pronóstico es favorable.»","¿Cuánto debe seguir el tratamiento?|Dos semanas|Un mes|Un día|0#¿Cómo es el pronóstico?|Favorable|Grave|Incierto|0","È necessario che Lei ___ la terapia.|segua|segue|seguirà#La ___ è favorevole.|prognosi|prognostica|prognosticare","El diagnóstico=La diagnosi#El efecto secundario=L'effetto collaterale"],
["Arte renacentista","il Rinascimento=el Renacimiento;l'affresco=el fresco;la prospettiva=la perspectiva;il mecenate=el mecenas;la bottega=el taller;il capolavoro=la obra maestra;la cupola=la cúpula;l'umanesimo=el humanismo","Para hablar de arte renacentista: «fu commissionato da…» (fue encargado por), «si caratterizza per…». Passato remoto en textos históricos: Leonardo dipinse la Gioconda; Michelangelo scolpì il David. Vocabulario clave: prospettiva, proporzione, mecenatismo.","Michelangelo scolpì il David tra il 1501 e il 1504.=Miguel Ángel esculpió el David entre 1501 y 1504.;La cupola fu progettata da Brunelleschi.=La cúpula fue proyectada por Brunelleschi.;Il Rinascimento si caratterizza per l'umanesimo.=El Renacimiento se caracteriza por el humanismo.;I mecenati finanziavano gli artisti.=Los mecenas financiaban a los artistas.","Il Rinascimento nacque a Firenze nel Quattrocento e si caratterizza per l'umanesimo e la prospettiva. I mecenati, come i Medici, finanziavano le botteghe degli artisti. Brunelleschi progettò la cupola di Santa Maria del Fiore, mentre Michelangelo scolpì il David e dipinse la Cappella Sistina.","El Renacimiento nació en Florencia en el siglo XV y se caracteriza por el humanismo y la perspectiva. Los mecenas, como los Médici, financiaban los talleres de los artistas. Brunelleschi proyectó la cúpula de Santa Maria del Fiore, mientras que Miguel Ángel esculpió el David y pintó la Capilla Sixtina.","¿Dónde nació el Renacimiento?|En Florencia|En Roma|En Venecia|0#¿Quién proyectó la cúpula?|Brunelleschi|Miguel Ángel|Leonardo|0","Michelangelo ___ il David.|scolpì|scolpisce|scolpito#La cupola fu ___ da Brunelleschi.|progettata|progettato|progettare","El mecenas=Il mecenate#La obra maestra=Il capolavoro"],
["Arquitectura italiana","il barocco=el barroco;il gotico=el gótico;il razionalismo=el racionalismo;la basilica=la basílica;la piazza=la plaza;la colonna=la columna;il restauro=la restauración;l'edificio=el edificio","Estilos: romanico, gotico, rinascimentale, barocco, neoclassico, razionalista. Para describir: «caratterizzato da…», «risale al… secolo», «è stato progettato da…», «presenta…». «Risalire a» = remontarse a: la chiesa risale al Duecento.","La basilica risale al Duecento.=La basílica se remonta al siglo XIII.;Il barocco è caratterizzato da forme dinamiche.=El barroco se caracteriza por formas dinámicas.;L'edificio è stato oggetto di un restauro.=El edificio ha sido objeto de una restauración.;La piazza presenta una grande fontana.=La plaza presenta una gran fuente.","La basilica risale al Duecento ed è un esempio di architettura gotica. L'edificio è stato oggetto di un lungo restauro. In piazza, il barocco si riconosce nelle forme dinamiche della grande fontana. Nel Novecento, invece, il razionalismo scelse linee semplici e funzionali.","La basílica se remonta al siglo XIII y es un ejemplo de arquitectura gótica. El edificio ha sido objeto de una larga restauración. En la plaza, el barroco se reconoce en las formas dinámicas de la gran fuente. En el siglo XX, en cambio, el racionalismo eligió líneas simples y funcionales.","¿De qué siglo es la basílica?|Siglo XIII|Siglo XV|Siglo XX|0#¿Qué eligió el racionalismo?|Líneas simples|Formas dinámicas|Colores vivos|0","La basilica ___ al Duecento.|risale|sale|ritorna#Il barocco è ___ da forme dinamiche.|caratterizzato|caratterizzare|caratteri","El barroco=Il barocco#La restauración=Il restauro"],
["Cine italiano contemporáneo","il regista=el director;la sceneggiatura=el guion;il premio=el premio;il festival=el festival;la critica=la crítica;l'attore=el actor;il documentario=el documental;la distribuzione=la distribución","Para reseñar cine contemporáneo: «ha vinto il premio per…», «è stato presentato al festival di…», «ha ricevuto il plauso della critica». Para matizar: «un film tutt'altro che banale» (nada banal), «a dir poco sorprendente». Nominalización: «l'uscita nelle sale».","Il film ha vinto il premio per la migliore regia.=La película ha ganado el premio a la mejor dirección.;È stato presentato al festival di Venezia.=Fue presentada en el festival de Venecia.;Un film tutt'altro che banale.=Una película nada banal.;Ha ricevuto il plauso della critica.=Ha recibido el aplauso de la crítica.","Il film, presentato al festival di Venezia, ha vinto il premio per la migliore regia. Ha ricevuto il plauso della critica ed è tutt'altro che banale: la sceneggiatura, a dir poco sorprendente, intreccia storie private e temi sociali. L'uscita nelle sale è prevista a marzo.","La película, presentada en el festival de Venecia, ha ganado el premio a la mejor dirección. Ha recibido el aplauso de la crítica y es nada banal: el guion, por decir poco sorprendente, entrelaza historias privadas y temas sociales. El estreno en cines está previsto para marzo.","¿Qué premio ganó?|Mejor dirección|Mejor actor|Mejor música|0#¿Cuándo se estrena?|En marzo|En junio|En diciembre|0","Il film è stato ___ al festival.|presentato|presentare|presenta#Un film ___ che banale.|tutt'altro|tutto|altro","La crítica=La critica#El guion=La sceneggiatura"],
["Periodismo de investigación","l'inchiesta=la investigación;il giornalismo d'inchiesta=el periodismo de investigación;la fonte anonima=la fuente anónima;lo scoop=la exclusiva;la corruzione=la corrupción;la denuncia=la denuncia;il whistleblower=el denunciante;la trasparenza=la transparencia","El periodismo de investigación usa verbos de reporte y cautela: «È emerso che…», «Secondo fonti vicine a…», el condizionale periodístico (avrebbe pagato). Para atribuir: «come riferisce», «stando a». Evita afirmaciones categóricas sin pruebas: «presunto».","È emerso che l'azienda avrebbe evaso le tasse.=Ha surgido que la empresa habría evadido impuestos.;Stando alle fonti, il ministro era informato.=Según las fuentes, el ministro estaba informado.;Il presunto responsabile nega tutto.=El presunto responsable lo niega todo.;L'inchiesta ha portato alla luce la corruzione.=La investigación ha sacado a la luz la corrupción.","Un'inchiesta giornalistica ha portato alla luce un caso di corruzione. È emerso che l'azienda avrebbe pagato tangenti per ottenere gli appalti. Stando alle fonti anonime, il ministro era informato, ma il presunto responsabile nega tutto. Il whistleblower ha chiesto trasparenza e protezione.","Una investigación periodística ha sacado a la luz un caso de corrupción. Ha surgido que la empresa habría pagado sobornos para conseguir las licitaciones. Según las fuentes anónimas, el ministro estaba informado, pero el presunto responsable lo niega todo. El denunciante ha pedido transparencia y protección.","¿Qué reveló la investigación?|Un caso de corrupción|Un accidente|Un premio|0#¿Qué pidió el denunciante?|Transparencia y protección|Dinero|Silencio|0","È ___ che l'azienda avrebbe pagato.|emerso|emergere|emerge#Il ___ responsabile nega tutto.|presunto|presumere|presunzione","La corrupción=La corruzione#La fuente anónima=La fonte anonima"],
["Neologismos y anglicismos","il neologismo=el neologismo;l'anglicismo=el anglicismo;il prestito=el préstamo lingüístico;l'adattamento=la adaptación;il gergo=la jerga;l'Accademia della Crusca=la Accademia della Crusca;l'uso=el uso;l'evoluzione=la evolución","El italiano incorpora anglicismos (weekend, computer, mouse) y crea neologismos (googlare, whatsappare). La Crusca recomienda alternativas italianas cuando es posible. Para debatir: «Si tende a…», «Non è detto che…», «Meglio preferire…».","Googlare è un neologismo molto diffuso.=Googlear es un neologismo muy extendido.;Si tende a usare molti anglicismi.=Se tiende a usar muchos anglicismos.;La Crusca consiglia alternative italiane.=La Crusca recomienda alternativas italianas.;L'uso decide l'evoluzione della lingua.=El uso decide la evolución de la lengua.","Negli ultimi anni l'italiano ha accolto molti anglicismi e neologismi come «googlare». Si tende a usarli spesso, soprattutto nel gergo giovanile, ma l'Accademia della Crusca consiglia, dove possibile, alternative italiane. Alla fine è l'uso a decidere l'evoluzione di una lingua.","En los últimos años el italiano ha acogido muchos anglicismos y neologismos como «googlear». Se tiende a usarlos a menudo, sobre todo en la jerga juvenil, pero la Accademia della Crusca aconseja, cuando es posible, alternativas italianas. Al final es el uso el que decide la evolución de una lengua.","¿Qué neologismo se menciona?|Googlare|Cantare|Parlare|0#¿Quién decide la evolución?|El uso|La ley|Los profesores|0","Si ___ a usare molti anglicismi.|tende|tendere|tenda#L'___ decide l'evoluzione.|uso|usare|usato","El neologismo=Il neologismo#El préstamo=Il prestito"],
["Sociología del consumo","il consumismo=el consumismo;la società liquida=la sociedad líquida;l'identità=la identidad;l'apparenza=la apariencia;l'obsolescenza=la obsolescencia;il benessere=el bienestar;l'individualismo=el individualismo;il fenomeno=el fenómeno","Para analizar fenómenos sociales: «Si assiste a…» (se asiste a), «Emerge una tendenza a…», «Ne risulta che…», «Tale fenomeno è riconducibile a…» (es atribuible a). Tono impersonal y cuantificadores: «sempre più», «in misura crescente».","Si assiste a un aumento del consumismo.=Se asiste a un aumento del consumismo.;Emerge una tendenza all'individualismo.=Emerge una tendencia al individualismo.;Tale fenomeno è riconducibile all'obsolescenza programmata.=Tal fenómeno es atribuible a la obsolescencia programada.;Sempre più persone cercano un'identità nei consumi.=Cada vez más personas buscan una identidad en el consumo.","Si assiste oggi a un forte aumento del consumismo. Emerge una tendenza a cercare l'identità negli oggetti, un fenomeno riconducibile all'apparenza e all'obsolescenza programmata. Nella «società liquida» descritta da Bauman, i legami sono fragili e il benessere sembra misurarsi con ciò che si possiede.","Hoy se asiste a un fuerte aumento del consumismo. Emerge una tendencia a buscar la identidad en los objetos, un fenómeno atribuible a la apariencia y a la obsolescencia programada. En la «sociedad líquida» descrita por Bauman, los vínculos son frágiles y el bienestar parece medirse por lo que se posee.","¿Qué aumenta?|El consumismo|La lectura|El ahorro|0#¿Cómo son los vínculos?|Frágiles|Fuertes|Eternos|0","Si ___ a un aumento del consumismo.|assiste|assistere|assistito#Tale fenomeno è ___ all'obsolescenza.|riconducibile|ricondotto|ricondurre","La identidad=L'identità#La apariencia=L'apparenza"],
["Umberto Eco y la semiótica","il segno=el signo;il significato=el significado;il significante=el significante;la semiotica=la semiótica;l'interpretazione=la interpretación;il lettore modello=el lector modelo;l'opera aperta=la obra abierta;il codice=el código","Umberto Eco (1932-2016) estudió cómo se produce el sentido: el signo une significante y significado; la «opera aperta» admite múltiples interpretaciones; el «lettore modello» es el lector que el texto prevé. Para exponer teorías: «Secondo Eco…», «Si può sostenere che…», «Ciò implica che…».","Secondo Eco, il testo prevede un lettore modello.=Según Eco, el texto prevé un lector modelo.;L'opera aperta ammette più interpretazioni.=La obra abierta admite varias interpretaciones.;Si può sostenere che ogni segno ha un codice.=Se puede sostener que cada signo tiene un código.;Ciò implica una lettura attiva.=Eso implica una lectura activa.","Secondo Umberto Eco, ogni testo prevede un lettore modello, cioè un lettore capace di collaborare con l'autore. Si può sostenere che l'opera aperta ammetta più interpretazioni, senza però permettere qualsiasi lettura. Ciò implica un lavoro attivo di chi legge, che deve conoscere i codici.","Según Umberto Eco, todo texto prevé un lector modelo, es decir, un lector capaz de colaborar con el autor. Se puede sostener que la obra abierta admite varias interpretaciones, sin permitir sin embargo cualquier lectura. Eso implica un trabajo activo de quien lee, que debe conocer los códigos.","¿Qué prevé todo texto?|Un lector modelo|Un autor perfecto|Un editor|0#¿Qué implica?|Una lectura activa|Una lectura pasiva|Ninguna lectura|0","Secondo Eco, il testo ___ un lettore modello.|prevede|prevedere|previsto#Ciò ___ una lettura attiva.|implica|implicare|implicato","El signo=Il segno#La obra abierta=L'opera aperta"],
["Resistencia y Constitución","la Resistenza=la Resistencia;la liberazione=la liberación;l'Assemblea Costituente=la Asamblea Constituyente;la Costituzione=la Constitución;la dittatura=la dictadura;il fascismo=el fascismo;il referendum istituzionale=el referéndum institucional;la repubblica=la república","Para narrar historia reciente: passato prossimo o remoto según el tono, y construcciones como «all'indomani di», «a seguito di». Ejemplo: il 2 giugno 1946 gli italiani scelsero la Repubblica. Pasiva histórica: «fu approvata la Costituzione».","Il 2 giugno 1946 gli italiani scelsero la Repubblica.=El 2 de junio de 1946 los italianos eligieron la República.;La Costituzione entrò in vigore nel 1948.=La Constitución entró en vigor en 1948.;All'indomani della guerra, nacque la Costituente.=Al día siguiente de la guerra, nació la Constituyente.;La Resistenza contribuì alla liberazione.=La Resistencia contribuyó a la liberación.","All'indomani della Seconda guerra mondiale, dopo la dittatura fascista, l'Italia dovette scegliere il proprio futuro. Il 2 giugno 1946 gli italiani scelsero la Repubblica con un referendum istituzionale. L'Assemblea Costituente elaborò poi la Costituzione, che entrò in vigore nel 1948 e nacque anche dall'esperienza della Resistenza.","Al día siguiente de la Segunda Guerra Mundial, tras la dictadura fascista, Italia tuvo que elegir su futuro. El 2 de junio de 1946 los italianos eligieron la República con un referéndum institucional. La Asamblea Constituyente elaboró luego la Constitución, que entró en vigor en 1948 y nació también de la experiencia de la Resistencia.","¿Qué eligieron los italianos en 1946?|La República|La monarquía|Un rey|0#¿Cuándo entró en vigor la Constitución?|1948|1946|1950|0","Nel 1946 gli italiani ___ la Repubblica.|scelsero|scelgono|scelti#La Costituzione ___ in vigore nel 1948.|entrò|entra|entrato","La Resistencia=La Resistenza#La Constitución=La Costituzione"],
["Divulgación científica","la scoperta=el descubrimiento;l'ipotesi=la hipótesis;la sperimentazione=la experimentación;il campione=la muestra;la correlazione=la correlación;la causalità=la causalidad;la verifica=la verificación;il dato=el dato","En divulgación científica se distinguen hipótesis y hechos con matices: «Pare che…», «I dati suggeriscono che…», «Non è provato che…». Atención: correlación no es causalidad («Ciò non implica necessariamente che…»). Tras expresiones de duda se usa el congiuntivo.","I dati suggeriscono che il farmaco sia efficace.=Los datos sugieren que el fármaco es eficaz.;Non è provato che esista un legame causale.=No está probado que exista un vínculo causal.;Correlazione non significa causalità.=Correlación no significa causalidad.;Il campione era troppo piccolo.=La muestra era demasiado pequeña.","Uno studio recente suggerisce che un nuovo trattamento riduca i sintomi, ma non è provato che esista un legame causale. Il campione era troppo piccolo e la correlazione osservata potrebbe dipendere da altri fattori. Prima di trarre conclusioni, occorre una verifica con più dati.","Un estudio reciente sugiere que un nuevo tratamiento reduce los síntomas, pero no está probado que exista un vínculo causal. La muestra era demasiado pequeña y la correlación observada podría depender de otros factores. Antes de sacar conclusiones, hace falta una verificación con más datos.","¿Por qué no hay conclusiones firmes?|Muestra pequeña|Falta de dinero|Mala fe|0#¿Qué hace falta?|Más datos|Menos estudios|Más tiempo libre|0","Non è provato che ___ un legame causale.|esista|esiste|esisterà#Correlazione non significa ___.|causalità|causale|causare","La muestra=Il campione#La hipótesis=L'ipotesi"],
["Pirandello y el humorismo","la maschera=la máscara;l'identità=la identidad;la finzione=la ficción;l'umorismo=el humorismo;il sentimento del contrario=el sentimiento de lo contrario;il personaggio=el personaje;la crisi=la crisis;il teatro=el teatro","Pirandello (Nobel 1934) explora identidad y apariencia: «Uno, nessuno e centomila», «Sei personaggi in cerca d'autore». Distingue el «comico» (avvertimento del contrario) del «umorismo» (sentimento del contrario: compasión y reflexión). Para analizar: «L'opera mette in discussione…».","L'opera mette in discussione l'identità.=La obra cuestiona la identidad.;Il protagonista scopre di essere nessuno.=El protagonista descubre que no es nadie.;L'umorismo nasce dal sentimento del contrario.=El humorismo nace del sentimiento de lo contrario.;Ognuno porta una maschera.=Cada uno lleva una máscara.","In Uno, nessuno e centomila il protagonista scopre che ogni persona lo vede in modo diverso. L'opera mette in discussione l'idea di identità: ognuno porta una maschera diversa per ogni situazione. Pirandello chiama questo atteggiamento umorismo, perché dietro il riso si nasconde una riflessione dolorosa sulla condizione umana.","En Uno, nessuno e centomila el protagonista descubre que cada persona lo ve de manera diferente. La obra cuestiona la idea de identidad: cada uno lleva una máscara distinta para cada situación. Pirandello llama a esta actitud humorismo, porque tras la risa se esconde una reflexión dolorosa sobre la condición humana.","¿Qué descubre el protagonista?|Que cada persona lo ve distinto|Que es famoso|Que está enfermo|0#¿Qué se esconde tras la risa?|Una reflexión dolorosa|Una broma|Un secreto|0","L'opera mette in ___ l'identità.|discussione|discutere|discusso#Ognuno porta una ___.|maschera|maschere|mascherare","La máscara=La maschera#La identidad=L'identità"],
["El Risorgimento","il Risorgimento=el Resurgimiento;l'unificazione=la unificación;il patriota=el patriota;la spedizione dei Mille=la expedición de los Mil;lo Stato pontificio=los Estados Pontificios;il regno=el reino;l'esilio=el exilio;la monarchia=la monarquía","Para narrar historia con registro formal: passato remoto (fu proclamato), pasiva con venire / essere y fechas: «nel 1861 venne proclamato il Regno d'Italia». Conectores históricos: in seguito, nel frattempo, ciò determinò. Figuras clave: Garibaldi, Cavour, Mazzini, Vittorio Emanuele II.","Nel 1861 venne proclamato il Regno d'Italia.=En 1861 se proclamó el Reino de Italia.;Garibaldi guidò la spedizione dei Mille.=Garibaldi dirigió la expedición de los Mil.;Cavour fu il grande stratega politico.=Cavour fue el gran estratega político.;Roma divenne capitale nel 1871.=Roma se convirtió en capital en 1871.","Il Risorgimento fu il processo che portò all'unificazione dell'Italia. Mentre Cavour lavorava sul piano diplomatico, Garibaldi guidò nel 1860 la spedizione dei Mille nel Sud. Nel 1861 venne proclamato il Regno d'Italia, e solo nel 1871 Roma divenne capitale, dopo la fine dello Stato pontificio.","El Resurgimiento fue el proceso que condujo a la unificación de Italia. Mientras Cavour trabajaba en el plano diplomático, Garibaldi dirigió en 1860 la expedición de los Mil en el Sur. En 1861 se proclamó el Reino de Italia, y solo en 1871 Roma se convirtió en capital, tras el fin de los Estados Pontificios.","¿Quién dirigió la expedición de los Mil?|Garibaldi|Cavour|Mazzini|0#¿Cuándo se proclamó el Reino?|1861|1871|1848|0","Nel 1861 ___ proclamato il Regno d'Italia.|venne|viene|verrà#Garibaldi ___ la spedizione dei Mille.|guidò|guida|guiderà","La unificación=L'unificazione#El Reino de Italia=Il Regno d'Italia"],
["El boom económico y la sociedad","il boom economico=el boom económico;l'industrializzazione=la industrialización;l'urbanizzazione=la urbanización;l'emigrazione interna=la emigración interna;il benessere=el bienestar;gli elettrodomestici=los electrodomésticos;il consumismo=el consumismo;la televisione=la televisión","Para describir un cambio histórico: «Tra gli anni Cinquanta e Sessanta, l'Italia passò da… a…». Contrastes con «mentre» y «laddove». Causa y efecto: «ciò favorì», «ne derivò». Cifras: «il reddito aumentò del…», «un italiano su tre».","L'Italia passò da paese agricolo a potenza industriale.=Italia pasó de país agrícola a potencia industrial.;Milioni di persone emigrarono verso il Nord.=Millones de personas emigraron hacia el Norte.;La televisione cambiò le abitudini degli italiani.=La televisión cambió los hábitos de los italianos.;Il benessere si diffuse rapidamente.=El bienestar se extendió rápidamente.","Tra gli anni Cinquanta e Sessanta l'Italia passò da paese agricolo a potenza industriale. Milioni di persone emigrarono dal Sud verso le città del Nord, mentre elettrodomestici e televisione cambiarono le abitudini quotidiane. Il benessere si diffuse rapidamente, ma crebbero anche il consumismo e le disuguaglianze territoriali.","Entre los años cincuenta y sesenta Italia pasó de país agrícola a potencia industrial. Millones de personas emigraron del Sur hacia las ciudades del Norte, mientras que los electrodomésticos y la televisión cambiaron los hábitos cotidianos. El bienestar se extendió rápidamente, pero crecieron también el consumismo y las desigualdades territoriales.","¿De dónde a dónde emigraron?|Del Sur al Norte|Del Norte al Sur|A América|0#¿Qué cambió los hábitos?|Electrodomésticos y televisión|La guerra|Los trenes|0","L'Italia ___ da paese agricolo a potenza industriale.|passò|passa|passerà#Milioni di persone ___ verso il Nord.|emigrarono|emigrano|emigreranno","El boom económico=Il boom economico#La industrialización=L'industrializzazione"],
["Demografía y envejecimiento","l'invecchiamento=el envejecimiento;il calo demografico=el descenso demográfico;il tasso di natalità=la tasa de natalidad;la speranza di vita=la esperanza de vida;le pensioni=las pensiones;il ricambio generazionale=el relevo generacional;l'immigrazione=la inmigración;la popolazione attiva=la población activa","Para analizar datos: «Secondo l'ISTAT…», «il tasso è sceso al…», «il numero di anziani è destinato a crescere» (estar llamado a). Condicional de previsión: «Entro il 2050 la popolazione scenderebbe sotto…».","Il tasso di natalità è sceso ai minimi storici.=La tasa de natalidad ha bajado a mínimos históricos.;Il numero di anziani è destinato a crescere.=El número de mayores está llamado a crecer.;La speranza di vita è aumentata.=La esperanza de vida ha aumentado.;Servirebbe un ricambio generazionale.=Haría falta un relevo generacional.","Secondo i dati demografici, il tasso di natalità in Italia è sceso ai minimi storici, mentre la speranza di vita è aumentata. Il numero di anziani è destinato a crescere e la popolazione attiva a ridursi, con conseguenze sulle pensioni. Servirebbe un ricambio generazionale, anche grazie all'immigrazione e a politiche per le famiglie.","Según los datos demográficos, la tasa de natalidad en Italia ha bajado a mínimos históricos, mientras que la esperanza de vida ha aumentado. El número de mayores está llamado a crecer y la población activa a reducirse, con consecuencias sobre las pensiones. Haría falta un relevo generacional, también gracias a la inmigración y a políticas para las familias.","¿Qué ha bajado a mínimos?|La natalidad|La esperanza de vida|Las pensiones|0#¿Qué afecta a las pensiones?|La reducción de población activa|El clima|Los precios|0","Il tasso di natalità è ___ ai minimi storici.|sceso|scendere|scende#Il numero di anziani è ___ a crescere.|destinato|destinare|destino","El envejecimiento=L'invecchiamento#Las pensiones=Le pensioni"],
["Terremotos y gestión del riesgo","il terremoto=el terremoto;l'alluvione=la inundación;la frana=el desprendimiento;la prevenzione=la prevención;la protezione civile=la protección civil;la ricostruzione=la reconstrucción;il rischio idrogeologico=el riesgo hidrogeológico;gli sfollati=los desplazados","Para hablar de desastres: «Il sisma ha colpito…», «sono state evacuate…», «la ricostruzione procede a rilento». Verbos de gestión: prevenire, soccorrere, ricostruire. Pasiva: «le zone sono state dichiarate a rischio». «A rilento» = lentamente.","Il terremoto ha colpito il Centro Italia.=El terremoto ha golpeado el Centro de Italia.;Le famiglie sono state evacuate.=Las familias han sido evacuadas.;La ricostruzione procede a rilento.=La reconstrucción avanza lentamente.;La prevenzione costa meno dell'emergenza.=La prevención cuesta menos que la emergencia.","Un forte terremoto ha colpito il Centro Italia e molte famiglie sono state evacuate. La protezione civile ha soccorso gli sfollati, ma la ricostruzione procede a rilento. Gli esperti ricordano che la prevenzione costa meno dell'emergenza e che il rischio idrogeologico va monitorato con più attenzione.","Un fuerte terremoto ha golpeado el Centro de Italia y muchas familias han sido evacuadas. La protección civil ha socorrido a los desplazados, pero la reconstrucción avanza lentamente. Los expertos recuerdan que la prevención cuesta menos que la emergencia y que el riesgo hidrogeológico debe vigilarse con más atención.","¿Qué ha pasado?|Un terremoto|Una inundación|Un incendio|0#¿Qué avanza lentamente?|La reconstrucción|La evacuación|El rescate|0","Il terremoto ha ___ il Centro Italia.|colpito|colpire|colpisce#La ricostruzione procede a ___.|rilento|rilenti|rilentare","La prevención=La prevenzione#La protección civil=La protezione civile"],
["Ciberseguridad y datos","la crittografia=el cifrado;la violazione dei dati=la brecha de datos;il phishing=el phishing;l'autenticazione a due fattori=la autenticación de dos factores;la vulnerabilità=la vulnerabilidad;il consenso=el consentimiento;proteggere=proteger;l'identità digitale=la identidad digital","Para hablar de seguridad: «Occorre adottare misure di sicurezza adeguate», «si raccomanda di + infinitivo», «affinché i dati siano protetti». Impersonales formales: «si invitano gli utenti a…», «è fatto obbligo di…». «Pur adottando… non si può escludere…».","Si raccomanda di attivare l'autenticazione a due fattori.=Se recomienda activar la autenticación de dos factores.;Si è verificata una violazione dei dati.=Se ha producido una brecha de datos.;Si invitano gli utenti a cambiare la password.=Se invita a los usuarios a cambiar la contraseña.;Pur adottando misure adeguate, il rischio non è nullo.=Aun adoptando medidas adecuadas, el riesgo no es nulo.","L'azienda ha comunicato che si è verificata una violazione dei dati. Si invitano gli utenti a cambiare la password e si raccomanda di attivare l'autenticazione a due fattori. Pur adottando misure di sicurezza adeguate, non si può escludere del tutto il rischio di phishing e di furto di identità digitale.","La empresa ha comunicado que se ha producido una brecha de datos. Se invita a los usuarios a cambiar la contraseña y se recomienda activar la autenticación de dos factores. Aun adoptando medidas de seguridad adecuadas, no se puede excluir del todo el riesgo de phishing y de robo de identidad digital.","¿Qué ha ocurrido?|Una brecha de datos|Una caída de servidor|Una fusión|0#¿Qué se recomienda activar?|Autenticación de dos factores|Un antivirus|Un VPN|0","Si ___ di cambiare la password.|raccomanda|raccomando|raccomandare#Pur ___ misure adeguate, il rischio resta.|adottando|adottare|adottato","La contraseña=La password#La vulnerabilidad=La vulnerabilità"],
["Psicología social y redes","l'influencer=el influencer;la polarizzazione=la polarización;la bolla di filtraggio=la burbuja de filtros;la dipendenza=la dependencia;l'autostima=la autoestima;il confronto sociale=la comparación social;l'algoritmo=el algoritmo;la disinformazione=la desinformación","Para analizar fenómenos sociales: «Sembra che…», «Si assiste a…» (se asiste a), «Ciò porta a…», «tendono a + infinitivo». Matiz: «per lo più», «in larga misura». «Si assiste a una crescente polarizzazione».","Si assiste a una crescente polarizzazione.=Se asiste a una creciente polarización.;Gli utenti tendono a seguire chi la pensa come loro.=Los usuarios tienden a seguir a quien piensa como ellos.;Il confronto sociale può danneggiare l'autostima.=La comparación social puede dañar la autoestima.;L'algoritmo rafforza le bolle di filtraggio.=El algoritmo refuerza las burbujas de filtros.","Sui social si assiste a una crescente polarizzazione: gli utenti tendono a seguire chi la pensa come loro e l'algoritmo rafforza le bolle di filtraggio. Il confronto continuo con le vite altrui può danneggiare l'autostima, soprattutto tra i più giovani. In larga misura, la disinformazione si diffonde proprio grazie a questi meccanismi.","En las redes se asiste a una creciente polarización: los usuarios tienden a seguir a quien piensa como ellos y el algoritmo refuerza las burbujas de filtros. La comparación continua con las vidas ajenas puede dañar la autoestima, sobre todo entre los más jóvenes. En gran medida, la desinformación se difunde precisamente gracias a estos mecanismos.","¿Qué refuerza el algoritmo?|Las burbujas de filtros|La amistad|La educación|0#¿Qué puede dañar la comparación?|La autoestima|La salud|El dinero|0","Si ___ a una crescente polarizzazione.|assiste|assisto|assistono#Gli utenti ___ a seguire chi la pensa come loro.|tendono|tende|tendere","La desinformación=La disinformazione#La autoestima=L'autostima"],
["Gramsci y la hegemonía cultural","l'egemonia=la hegemonía;l'intellettuale=el intelectual;la società civile=la sociedad civil;i Quaderni del carcere=los Cuadernos de la cárcel;il senso comune=el sentido común;la cultura=la cultura;l'istruzione=la educación;il pensiero critico=el pensamiento crítico","Antonio Gramsci (1891-1937) desarrolló el concepto de egemonia culturale: el poder se mantiene no solo por la fuerza, sino por el consenso y el «senso comune». Para exponer teoría: «Secondo Gramsci…», «Il concetto di… indica…», «Ne deriva che…». «Cioè» y «ovvero» introducen aclaraciones.","Secondo Gramsci, il potere si fonda anche sul consenso.=Según Gramsci, el poder se fundamenta también en el consenso.;Il concetto di egemonia indica la direzione culturale.=El concepto de hegemonía indica la dirección cultural.;L'istruzione sviluppa il pensiero critico.=La educación desarrolla el pensamiento crítico.;Ne deriva che la cultura è un terreno politico.=De ello se deriva que la cultura es un terreno político.","Secondo Gramsci, il potere non si fonda soltanto sulla forza, ma anche sul consenso, ovvero sull'egemonia culturale. Nei Quaderni del carcere spiega che il senso comune può essere guidato dalle classi dominanti. Ne deriva che l'istruzione e il pensiero critico sono strumenti politici fondamentali per una società più libera.","Según Gramsci, el poder no se fundamenta solo en la fuerza, sino también en el consenso, es decir, en la hegemonía cultural. En los Cuadernos de la cárcel explica que el sentido común puede ser guiado por las clases dominantes. De ello se deriva que la educación y el pensamiento crítico son herramientas políticas fundamentales para una sociedad más libre.","¿En qué se funda el poder según Gramsci?|En fuerza y consenso|Solo en fuerza|Solo en dinero|0#¿Qué herramientas son fundamentales?|Educación y pensamiento crítico|El ejército|La televisión|0","Secondo Gramsci, il potere si ___ anche sul consenso.|fonda|fondi|fondare#Ne ___ che l'istruzione è fondamentale.|deriva|derivare|derivato","La hegemonía=L'egemonia#El sentido común=Il senso comune"],
["Traducción y lingüística","la traduzione=la traducción;il traduttore=el traductor;la lingua di partenza=la lengua de origen;la lingua d'arrivo=la lengua de destino;il falso amico=el falso amigo;l'equivalenza=la equivalencia;il calco=el calco;la sfumatura=el matiz","Un traductor debe cuidar los falsos amigos (en italiano «burro» = mantequilla, «salire» = subir, «rimanere» = quedarse). «Tradurre dall'italiano allo spagnolo». Se recomienda mantener el matiz, no la literalidad: «Tradurre è sempre un po' tradire».","Tradurre è sempre un po' tradire.=Traducir es siempre un poco traicionar.;Traduco dall'italiano allo spagnolo.=Traduzco del italiano al español.;Attenzione ai falsi amici!=¡Cuidado con los falsos amigos!;Il traduttore deve rispettare le sfumature.=El traductor debe respetar los matices.","Il traduttore lavora tra la lingua di partenza e la lingua d'arrivo e deve rispettare le sfumature. Un classico problema sono i falsi amici: in italiano burro significa mantequilla, non burro. Per questo si dice che tradurre è sempre un po' tradire: non esiste mai un'equivalenza perfetta, ma una scelta più o meno fedele.","El traductor trabaja entre la lengua de origen y la lengua de destino y debe respetar los matices. Un problema clásico son los falsos amigos: en italiano burro significa mantequilla, no burro. Por eso se dice que traducir es siempre un poco traicionar: nunca existe una equivalencia perfecta, sino una elección más o menos fiel.","¿Qué significa «burro» en italiano?|Mantequilla|Burro|Pan|0#¿Qué debe respetar el traductor?|Los matices|Solo la literalidad|La longitud|0","Traduco ___ italiano allo spagnolo.|dall'|dal|nell'#Attenzione ai falsi ___!|amici|amico|amicizia","La traducción=La traduzione#El falso amigo=Il falso amico"],
["La gastronomía como patrimonio","il patrimonio immateriale=el patrimonio inmaterial;la tradizione culinaria=la tradición culinaria;la dieta mediterranea=la dieta mediterránea;la denominazione di origine=la denominación de origen;il prodotto tipico=el producto típico;la tutela=la protección;il territorio=el territorio;la filiera=la cadena productiva","Para hablar de patrimonio: «È stato riconosciuto dall'UNESCO», «va tutelato», «strettamente legato al territorio». Participios con valor adjetival: prodotti riconosciuti, tradizioni tramandate. «Tramandare» = transmitir de generación en generación.","La dieta mediterranea è patrimonio dell'UNESCO.=La dieta mediterránea es patrimonio de la UNESCO.;Il prodotto è strettamente legato al territorio.=El producto está estrechamente ligado al territorio.;Le ricette sono tramandate da generazioni.=Las recetas se transmiten de generación en generación.;Questo formaggio va tutelato.=Este queso debe protegerse.","La dieta mediterranea è stata riconosciuta dall'UNESCO come patrimonio immateriale. Molti prodotti tipici sono strettamente legati al territorio e le ricette vengono tramandate da generazioni. La denominazione di origine serve a tutelare la qualità e a proteggere l'intera filiera, dal produttore al consumatore.","La dieta mediterránea ha sido reconocida por la UNESCO como patrimonio inmaterial. Muchos productos típicos están estrechamente ligados al territorio y las recetas se transmiten de generación en generación. La denominación de origen sirve para proteger la calidad y a toda la cadena, del productor al consumidor.","¿Quién la reconoció?|La UNESCO|La UE|La FAO|0#¿Para qué sirve la denominación de origen?|Proteger la calidad|Subir precios|Exportar|0","La dieta è stata ___ dall'UNESCO.|riconosciuta|riconoscere|riconosciuto#Questo formaggio va ___.|tutelato|tutelare|tutela","El producto típico=Il prodotto tipico#La denominación de origen=La denominazione di origine"],
["Patrimonio UNESCO y turismo cultural","il sito UNESCO=el sitio UNESCO;il patrimonio culturale=el patrimonio cultural;la salvaguardia=la salvaguarda;il restauro=la restauración;il flusso turistico=el flujo turístico;la capacità di carico=la capacidad de carga;la valorizzazione=la puesta en valor;il degrado=el deterioro","Para gestión del patrimonio: «Occorre bilanciare tutela e valorizzazione», «a rischio di degrado», «la capacità di carico dei siti». Gerundio causal: «Essendo un sito fragile, richiede…». Usa nominalizaciones: la salvaguardia, la fruizione, la valorizzazione.","Occorre bilanciare tutela e valorizzazione.=Hace falta equilibrar protección y puesta en valor.;Il sito è a rischio di degrado.=El sitio está en riesgo de deterioro.;Il restauro è stato completato lo scorso anno.=La restauración se completó el año pasado.;Va rispettata la capacità di carico.=Debe respetarse la capacidad de carga.","L'Italia ha più siti UNESCO di qualsiasi altro Paese, ma molti sono a rischio di degrado a causa dei flussi turistici. Occorre bilanciare tutela e valorizzazione, rispettando la capacità di carico di ogni luogo. Il restauro dei monumenti e la salvaguardia del paesaggio richiedono risorse stabili e una visione di lungo periodo.","Italia tiene más sitios UNESCO que ningún otro país, pero muchos están en riesgo de deterioro a causa de los flujos turísticos. Hace falta equilibrar protección y puesta en valor, respetando la capacidad de carga de cada lugar. La restauración de los monumentos y la salvaguarda del paisaje requieren recursos estables y una visión a largo plazo.","¿Qué país tiene más sitios UNESCO?|Italia|Francia|España|0#¿Qué hay que equilibrar?|Protección y puesta en valor|Precio y calidad|Tiempo y dinero|0","Occorre ___ tutela e valorizzazione.|bilanciare|bilancio|bilanciato#Il sito è a ___ di degrado.|rischio|rischi|rischiare","El patrimonio cultural=Il patrimonio culturale#La restauración=Il restauro"],
["Mediación y negociación","la mediazione=la mediación;il compromesso=el compromiso;la controparte=la contraparte;le concessioni=las concesiones;trovare un accordo=llegar a un acuerdo;lo stallo=el punto muerto;l'arbitrato=el arbitraje;vincolante=vinculante","Léxico de negociación: «venire incontro a» (ir al encuentro de), «fare un passo indietro», «trovare un punto d'incontro». Con cortesía y subjuntivo: «Qualora foste disposti a…», «Sarebbe auspicabile che…». Un acuerdo «vincolante» obliga legalmente.","Siamo disposti a venire incontro alla controparte.=Estamos dispuestos a ir al encuentro de la contraparte.;Cerchiamo un punto d'incontro.=Buscamos un punto de encuentro.;Lo stallo si è sbloccato.=El punto muerto se ha desbloqueado.;L'accordo è vincolante per entrambe le parti.=El acuerdo es vinculante para ambas partes.","Dopo settimane di stallo, le due parti hanno accettato la mediazione. Siamo venuti incontro alla controparte con alcune concessioni e abbiamo cercato un punto d'incontro sul budget. Alla fine l'accordo, vincolante per entrambe le parti, è stato firmato. Sarebbe stato impossibile senza la disponibilità di tutti.","Tras semanas de bloqueo, las dos partes aceptaron la mediación. Fuimos al encuentro de la contraparte con algunas concesiones y buscamos un punto de encuentro sobre el presupuesto. Al final el acuerdo, vinculante para ambas partes, fue firmado. Habría sido imposible sin la disposición de todos.","¿Qué aceptaron las partes?|La mediación|El arbitraje|La ruptura|0#¿Cómo es el acuerdo?|Vinculante|Provisional|Secreto|0","Cerchiamo un punto d'___.|incontro|accordo|stallo#L'accordo è ___ per entrambe le parti.|vincolante|vincolare|vincolo","El compromiso=Il compromesso#La contraparte=La controparte"],
["Sátira política","la satira=la sátira;il sarcasmo=el sarcasmo;la caricatura=la caricatura;il bersaglio=el blanco;la critica=la crítica;il paradosso=la paradoja;pungente=mordaz;il potere=el poder","La sátira política usa la paradoja, la exageración y la ironía: «Con tutto il rispetto…» (para criticar), «Guarda caso» (curiosamente), «Non c'è che dire» (hay que reconocerlo, con ironía). Verbos: prendere di mira (poner en el punto de mira), mettere alla berlina (poner en ridículo).","La vignetta prende di mira il governo.=La viñeta pone en el punto de mira al gobierno.;Guarda caso, la legge arriva dopo le elezioni.=Curiosamente, la ley llega tras las elecciones.;Non c'è che dire, un grande risultato!=¡Hay que reconocerlo, un gran resultado! (irónico);Il comico ha messo alla berlina il potere.=El cómico ha puesto en ridículo al poder.","La vignetta di oggi prende di mira il governo con una satira pungente. Guarda caso, la riforma promessa arriva proprio dopo le elezioni. «Non c'è che dire, un grande risultato!» scrive il vignettista. Il comico in tv ha messo alla berlina il potere, ma c'è chi lo accusa di sarcasmo gratuito.","La viñeta de hoy pone en el punto de mira al gobierno con una sátira mordaz. Curiosamente, la reforma prometida llega justo después de las elecciones. «¡Hay que reconocerlo, un gran resultado!», escribe el viñetista. El cómico en la tele ha puesto en ridículo al poder, pero hay quien lo acusa de sarcasmo gratuito.","¿A quién critica la viñeta?|Al gobierno|A la oposición|A un periodista|0#¿De qué lo acusan?|De sarcasmo gratuito|De mentir|De ignorar|0","La vignetta ___ di mira il governo.|prende|prendere|preso#___ caso, la legge arriva dopo.|Guarda|Guardare|Guardato","La sátira=La satira#Mordaz=Pungente"],
["Leopardi y el pesimismo","il pessimismo=el pesimismo;l'infinito=el infinito;la natura=la naturaleza;il dolore=el dolor;la ginestra=la retama;la speranza=la esperanza;il destino=el destino;il poeta=el poeta","Giacomo Leopardi (1798-1837): pesimismo histórico y cósmico; la naturaleza no es madre sino «matrigna» (madrastra). Obras: «L'infinito», «A Silvia», «La ginestra». Para el comentario: «Il poeta riflette su…», «Emerge il tema di…». «Emergere» lleva essere.","Il poeta riflette sul dolore umano.=El poeta reflexiona sobre el dolor humano.;Emerge il tema della speranza.=Emerge el tema de la esperanza.;La natura è vista come matrigna.=La naturaleza es vista como madrastra.;L'infinito nasce da uno sguardo limitato.=El infinito nace de una mirada limitada.","Leopardi è il poeta del pessimismo, ma anche della ricerca di senso. Nelle sue opere riflette sul dolore umano e vede la natura come matrigna. Eppure emerge, in particolare nella Ginestra, un invito alla solidarietà tra gli uomini. L'infinito nasce da una siepe: uno sguardo limitato apre all'immaginazione.","Leopardi es el poeta del pesimismo, pero también de la búsqueda de sentido. En sus obras reflexiona sobre el dolor humano y ve la naturaleza como madrastra. Y sin embargo emerge, en particular en La ginestra, una invitación a la solidaridad entre los hombres. El infinito nace de un seto: una mirada limitada abre a la imaginación.","¿Cómo ve la naturaleza Leopardi?|Como madrastra|Como madre|Como amiga|0#¿Qué invita a hacer en La ginestra?|A la solidaridad|Al viaje|Al silencio|0","Emerge il ___ della speranza.|tema|temi|temere#La natura è vista come ___.|matrigna|madre|nonna","El infinito=L'infinito#El dolor=Il dolore"],
["Italia y la Unión Europea","l'Unione Europea=la Unión Europea;l'euro=el euro;il Trattato di Roma=el Tratado de Roma;la sovranità=la soberanía;l'integrazione=la integración;i fondi europei=los fondos europeos;il mercato unico=el mercado único;il Parlamento europeo=el Parlamento Europeo","Italia fue miembro fundador de la CEE con el Trattato di Roma (1957). Léxico: «integrazione europea», «sovranità nazionale», «fondi strutturali». Para opinar con matiz: «Da un lato… dall'altro…», «Non si può prescindere da…». Pasiva: «sono stati stanziati» (se han asignado).","L'Italia è tra i paesi fondatori dell'UE.=Italia es uno de los países fundadores de la UE.;Sono stati stanziati molti fondi europei.=Se han asignado muchos fondos europeos.;Non si può prescindere dal mercato unico.=No se puede prescindir del mercado único.;La sovranità è un tema dibattuto.=La soberanía es un tema debatido.","L'Italia è stata tra i paesi fondatori della CEE con il Trattato di Roma del 1957. Oggi l'integrazione europea porta fondi e mercato unico, ma divide l'opinione pubblica: da un lato si apprezzano i vantaggi economici, dall'altro si teme una perdita di sovranità. Non si può prescindere, però, da un dialogo costante.","Italia fue uno de los países fundadores de la CEE con el Tratado de Roma de 1957. Hoy la integración europea trae fondos y mercado único, pero divide a la opinión pública: por un lado se aprecian las ventajas económicas, por otro se teme una pérdida de soberanía. No se puede prescindir, sin embargo, de un diálogo constante.","¿En qué año fue el Tratado de Roma?|1957|1992|2002|0#¿Qué se teme?|Pérdida de soberanía|Más impuestos|Menos comercio|0","Il Trattato di Roma è del ___.|1957|1861|2002#Non si può ___ da un dialogo.|prescindere|prescindo|prescindendo","El mercado único=Il mercato unico#La soberanía=La sovranità"],
["Sistema sanitario nacional","il Servizio Sanitario Nazionale=el Servicio Nacional de Salud;il ticket=el copago;il medico di base=el médico de cabecera;il pronto soccorso=urgencias;la lista d'attesa=la lista de espera;la copertura=la cobertura;la prevenzione=la prevención;il ricovero=el ingreso hospitalario","El SSN italiano (1978) es universal y se financia con impuestos. Léxico: «il medico di base», «la prescrizione», «il ticket». Para causas y consecuencias: «a causa di», «ne deriva che», «con la conseguenza che».","Prenoto una visita con il medico di base.=Pido cita con el médico de cabecera.;Le liste d'attesa si sono allungate.=Las listas de espera se han alargado.;Al pronto soccorso c'è molta attesa.=En urgencias hay mucha espera.;Il ticket varia da regione a regione.=El copago varía de una región a otra.","Il Servizio Sanitario Nazionale garantisce una copertura universale, ma le liste d'attesa si sono allungate a causa dei tagli ai finanziamenti. Ne deriva che molti cittadini ricorrono al privato, con la conseguenza che le disuguaglianze aumentano. Il pronto soccorso, intanto, è spesso sovraffollato, e la prevenzione resta fondamentale.","El Servicio Nacional de Salud garantiza una cobertura universal, pero las listas de espera se han alargado debido a los recortes en financiación. De ello se deriva que muchos ciudadanos recurren a la sanidad privada, con la consecuencia de que las desigualdades aumentan. Urgencias, mientras tanto, está a menudo saturado, y la prevención sigue siendo fundamental.","¿Qué garantiza el SSN?|Cobertura universal|Solo urgencias|Solo especialistas|0#¿Por qué se alargaron las listas?|Recortes de financiación|Más médicos|Menos pacientes|0","Le liste d'attesa si sono ___.|allungate|allungare|allunga#Ne ___ che molti ricorrono al privato.|deriva|derivano|derivare","La lista de espera=La lista d'attesa#El médico de cabecera=Il medico di base"],
["Neuroeducación y aprendizaje","l'apprendimento=el aprendizaje;la memoria=la memoria;la motivazione=la motivación;l'attenzione=la atención;la neuroplasticità=la neuroplasticidad;consolidare=consolidar;la ripetizione=la repetición;il metodo=el método","Léxico educativo-científico: «favorire l'apprendimento», «consolidare le conoscenze», «mantenere l'attenzione». Para explicar relaciones: «più… più…» (cuanto más… más), «tanto più… quanto più…».","Più si ripete, più la memoria si consolida.=Cuanto más se repite, más se consolida la memoria.;La motivazione favorisce l'apprendimento.=La motivación favorece el aprendizaje.;Mantenere l'attenzione è difficile.=Mantener la atención es difícil.;La neuroplasticità permette di imparare a ogni età.=La neuroplasticidad permite aprender a cualquier edad.","Le neuroscienze mostrano che la neuroplasticità permette di imparare a ogni età. Più si ripete un'informazione, più la memoria la consolida, ma la motivazione resta decisiva. Un metodo efficace alterna studio e pause per mantenere l'attenzione. Tanto più lo studente è coinvolto, quanto più l'apprendimento è duraturo.","Las neurociencias muestran que la neuroplasticidad permite aprender a cualquier edad. Cuanto más se repite una información, más la consolida la memoria, pero la motivación sigue siendo decisiva. Un método eficaz alterna estudio y pausas para mantener la atención. Cuanto más implicado está el estudiante, más duradero es el aprendizaje.","¿Qué permite aprender a cualquier edad?|La neuroplasticidad|La suerte|La edad|0#¿Qué alterna un método eficaz?|Estudio y pausas|Solo estudio|Solo juego|0","___ si ripete, più la memoria si consolida.|Più|Meno|Tanto#La ___ è decisiva.|motivazione|motivare|motivato","El aprendizaje=L'apprendimento#La atención=L'attenzione"],
["Movimientos sociales y feminismo","il movimento=el movimiento;la parità=la igualdad;i diritti civili=los derechos civiles;la manifestazione=la manifestación;il sindacato=el sindicato;lo sciopero=la huelga;la conquista=la conquista;l'emancipazione=la emancipación","Para historia social: «ha segnato una svolta» (marcó un punto de inflexión), «ha rivendicato» (reivindicó), «è stato conquistato» (se conquistó). En Italia el voto femenino llegó en 1946; el divorcio, en 1970. Usa el passato remoto o el prossimo según el estilo.","Il movimento ha rivendicato la parità.=El movimiento reivindicó la igualdad.;Il voto alle donne fu introdotto nel 1946.=El voto a las mujeres se introdujo en 1946.;Lo sciopero ha segnato una svolta.=La huelga marcó un punto de inflexión.;Molti diritti sono stati conquistati con le lotte.=Muchos derechos se han conquistado con las luchas.","In Italia il movimento femminista ha rivendicato la parità tra uomini e donne e ha segnato una svolta nella società. Il voto alle donne fu introdotto nel 1946 e molti diritti civili sono stati conquistati con manifestazioni e scioperi. Il percorso verso la piena emancipazione, tuttavia, non è ancora concluso.","En Italia el movimiento feminista ha reivindicado la igualdad entre hombres y mujeres y ha marcado un punto de inflexión en la sociedad. El voto a las mujeres se introdujo en 1946 y muchos derechos civiles se han conquistado con manifestaciones y huelgas. El camino hacia la plena emancipación, sin embargo, aún no ha terminado.","¿Cuándo votaron las mujeres por primera vez?|1946|1970|1861|0#¿Qué se usó para conquistar derechos?|Manifestaciones y huelgas|Solo leyes|Solo votos|0","Il movimento ha ___ la parità.|rivendicato|rivendicare|rivendica#Molti diritti sono stati ___.|conquistati|conquistato|conquistare","Los derechos civiles=I diritti civili#La huelga=Lo sciopero"],
["Música italiana","la canzone=la canción;il cantautore=el cantautor;il testo=la letra;la melodia=la melodía;l'opera lirica=la ópera;il festival=el festival;il genere=el género;il successo=el éxito","Para comentar música: «Il testo affronta il tema di…», «La melodia è orecchiabile» (pegadiza), «Il brano ha riscosso successo» (ha tenido éxito). Italia: canzone napoletana, cantautori (De André, Battisti), Festival di Sanremo, ópera (Verdi, Puccini).","Il testo affronta il tema dell'amore.=La letra aborda el tema del amor.;La melodia è molto orecchiabile.=La melodía es muy pegadiza.;Il brano ha riscosso grande successo.=La canción ha tenido gran éxito.;Il Festival di Sanremo è molto seguito.=El Festival de San Remo es muy seguido.","La canzone italiana ha una lunga tradizione, dalla canzone napoletana ai grandi cantautori come De André. Il testo affronta spesso temi sociali, mentre la melodia è orecchiabile e facile da ricordare. Il Festival di Sanremo, molto seguito, ha lanciato molti brani che hanno riscosso successo anche all'estero.","La canción italiana tiene una larga tradición, de la canción napolitana a los grandes cantautores como De André. La letra aborda a menudo temas sociales, mientras que la melodía es pegadiza y fácil de recordar. El Festival de San Remo, muy seguido, ha lanzado muchas canciones que han tenido éxito también en el extranjero.","¿De qué trata a menudo la letra?|Temas sociales|Deporte|Comida|0#¿Qué festival se menciona?|San Remo|Venecia|Cannes|0","Il testo ___ il tema dell'amore.|affronta|affrontare|affrontato#La melodia è ___.|orecchiabile|orecchio|orecchie","La canción=La canzone#La letra=Il testo"],
["Moda sostenible","la moda sostenibile=la moda sostenible;il tessuto=el tejido;la fast fashion=la moda rápida;il riciclo=el reciclaje;l'artigiano=el artesano;la filiera etica=la cadena ética;il marchio=la marca;il capo di abbigliamento=la prenda","Para criticar o defender prácticas de consumo: «Non basta + infinitivo» (no basta con), «Occorre ripensare…», «Chi compra… contribuisce a…». «Chi» = quien: chi compra capi di qualità spende meno nel lungo periodo.","Non basta riciclare, occorre consumare meno.=No basta reciclar, hay que consumir menos.;Chi compra capi di qualità spende meno nel tempo.=Quien compra prendas de calidad gasta menos con el tiempo.;L'artigiano lavora con tessuti naturali.=El artesano trabaja con tejidos naturales.;La fast fashion ha un grande impatto.=La moda rápida tiene un gran impacto.","La fast fashion produce capi a basso costo, ma ha un forte impatto ambientale. Non basta riciclare: occorre ripensare il modo di consumare. Chi compra capi di qualità, spesso fatti da artigiani con tessuti naturali, spende meno nel tempo e sostiene una filiera etica. Anche i marchi italiani stanno cambiando direzione.","La moda rápida produce prendas a bajo coste, pero tiene un fuerte impacto ambiental. No basta reciclar: hay que replantear la forma de consumir. Quien compra prendas de calidad, a menudo hechas por artesanos con tejidos naturales, gasta menos con el tiempo y apoya una cadena ética. También las marcas italianas están cambiando de rumbo.","¿Qué tiene la moda rápida?|Un fuerte impacto ambiental|Calidad alta|Precios altos|0#¿Quién gasta menos con el tiempo?|Quien compra calidad|Quien compra más|Quien compra online|0","Non ___ riciclare.|basta|bastare|bastano#___ compra capi di qualità spende meno.|Chi|Che|Cui","La moda sostenible=La moda sostenibile#El tejido=Il tessuto"],
["Tecnología y trabajo del futuro","l'automazione=la automatización;il lavoro da remoto=el trabajo remoto;le competenze digitali=las competencias digitales;la riqualificazione=la recualificación;l'occupazione=el empleo;sostituire=sustituir;l'innovazione=la innovación;il mercato del lavoro=el mercado laboral","Para predicciones: futuro y condicional periodístico («l'automazione potrebbe sostituire…»), «si prevede che + congiuntivo», «è probabile che + congiuntivo». Marcadores: nei prossimi anni, a lungo termine, sempre più (cada vez más).","L'automazione potrebbe sostituire alcuni lavori.=La automatización podría sustituir algunos trabajos.;Si prevede che il lavoro da remoto cresca.=Se prevé que el trabajo remoto crezca.;Servono sempre più competenze digitali.=Hacen falta cada vez más competencias digitales.;La riqualificazione è fondamentale.=La recualificación es fundamental.","Nei prossimi anni l'automazione potrebbe sostituire molti lavori ripetitivi, ma creerà anche nuove professioni. Si prevede che il lavoro da remoto continui a crescere e che servano sempre più competenze digitali. Per questo la riqualificazione dei lavoratori è fondamentale, se si vuole evitare un aumento della disoccupazione.","En los próximos años la automatización podría sustituir muchos trabajos repetitivos, pero también creará nuevas profesiones. Se prevé que el trabajo remoto siga creciendo y que hagan falta cada vez más competencias digitales. Por eso la recualificación de los trabajadores es fundamental, si se quiere evitar un aumento del desempleo.","¿Qué podría sustituir la automatización?|Trabajos repetitivos|Todos los empleos|Solo oficinas|0#¿Qué es fundamental?|La recualificación|El silencio|El dinero|0","Si prevede che il lavoro da remoto ___.|cresca|cresce|crescerà#Servono ___ più competenze digitali.|sempre|mai|poco","La automatización=L'automazione#Las competencias digitales=Le competenze digitali"],
