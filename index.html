["Legalidad y memoria civil","la legalità=la legalidad;la giustizia=la justicia;il magistrato=el magistrado;il coraggio=el valor;la memoria=la memoria;la società civile=la sociedad civil;denunciare=denunciar;la criminalità organizzata=la criminalidad organizada","Giovanni Falcone y Paolo Borsellino, magistrados asesinados en 1992, son símbolo de la lucha por la legalidad. Léxico: «contrastare» (combatir), «denunciare», «la società civile». Para homenajear: «Il loro esempio resta vivo», «Non dobbiamo dimenticare che…».","Falcone e Borsellino sono simboli di legalità.=Falcone y Borsellino son símbolos de legalidad.;Bisogna contrastare la criminalità organizzata.=Hay que combatir la criminalidad organizada.;Denunciare richiede coraggio.=Denunciar requiere valor.;Il loro esempio resta vivo.=Su ejemplo sigue vivo.","Falcone e Borsellino, magistrati uccisi nel 1992, sono simboli di legalità e di coraggio. Il loro esempio resta vivo: la società civile continua a contrastare la criminalità organizzata e a denunciare le ingiustizie. Non dobbiamo dimenticare che la memoria è una forma di giustizia e che il cambiamento richiede impegno quotidiano.","Falcone y Borsellino, magistrados asesinados en 1992, son símbolos de legalidad y de valor. Su ejemplo sigue vivo: la sociedad civil continúa combatiendo la criminalidad organizada y denunciando las injusticias. No debemos olvidar que la memoria es una forma de justicia y que el cambio requiere compromiso cotidiano.","¿Qué eran Falcone y Borsellino?|Magistrados|Políticos|Periodistas|0#¿Qué es una forma de justicia?|La memoria|El silencio|El olvido|0","Bisogna ___ la criminalità organizzata.|contrastare|contrasto|contrastato#Denunciare richiede ___.|coraggio|coraggi|coraggiosi","La legalidad=La legalità#La memoria=La memoria"],
["Ensayo avanzado: estructura","l'introduzione=la introducción;lo sviluppo=el desarrollo;la tesi=la tesis;l'antitesi=la antítesis;la sintesi=la síntesis;la coerenza=la coherencia;la coesione=la cohesión;il paragrafo=el párrafo","Un ensayo avanzado sigue tesis – antítesis – síntesis. Conectores: «Innanzitutto», «D'altro canto», «Ciononostante», «Dunque». Cada párrafo desarrolla una idea (coesione) y todo el texto mantiene un hilo (coerenza). Evita repeticiones con sinónimos y pronombres.","Innanzitutto, bisogna definire il problema.=En primer lugar, hay que definir el problema.;D'altro canto, esistono posizioni opposte.=Por otro lado, existen posiciones opuestas.;Ciononostante, la tesi regge.=Aun así, la tesis se sostiene.;Dunque, si può concludere che la tesi è valida.=Por tanto, se puede concluir que la tesis es válida.","Un buon saggio inizia con un'introduzione che presenta la tesi. Innanzitutto, si espongono gli argomenti a favore; d'altro canto, si discutono le posizioni opposte. Ciononostante, la tesi può reggere se è sostenuta da dati. Dunque, nella conclusione si propone una sintesi che superi il contrasto e lasci spazio a nuove domande.","Un buen ensayo comienza con una introducción que presenta la tesis. En primer lugar, se exponen los argumentos a favor; por otro lado, se discuten las posiciones opuestas. Aun así, la tesis puede sostenerse si está apoyada en datos. Por tanto, en la conclusión se propone una síntesis que supere el contraste y deje espacio a nuevas preguntas.","¿Con qué comienza un buen ensayo?|Con una introducción con la tesis|Con la conclusión|Con una cita|0#¿Qué propone la conclusión?|Una síntesis|Una pregunta|Un chiste|0","___, bisogna definire il problema.|Innanzitutto|Dunque|Ciononostante#___ la tesi può reggere.|Ciononostante|Innanzitutto|Infatti","La síntesis=La sintesi#El párrafo=Il paragrafo"],
["Repaso C1: matices lingüísticos","il registro=el registro;la sfumatura=el matiz;la precisione=la precisión;la concisione=la concisión;la ricchezza lessicale=la riqueza léxica;il lessico=el léxico;l'espressività=la expresividad;la padronanza=el dominio","Repaso C1: domina el registro, las subordinadas implícitas, la enclisis, el passato remoto, las fórmulas académicas y los conectores sofisticados. Un hablante C1 elige la palabra precisa y varía la estructura: «Si tratta di…», «Va da sé che…», «Tutt'altro che…» (todo lo contrario de).","Va da sé che il progetto richiede tempo.=Se sobreentiende que el proyecto requiere tiempo.;Non è affatto semplice, tutt'altro.=No es nada sencillo, todo lo contrario.;Si tratta di una questione di sfumature.=Se trata de una cuestión de matices.;La padronanza della lingua richiede anni.=El dominio de la lengua requiere años.","Raggiungere la padronanza di una lingua non è affatto semplice: tutt'altro. Va da sé che servano anni di studio e un lessico ricco. Si tratta di una questione di sfumature, di registro e di precisione. Chi sa scegliere la parola giusta e variare le strutture dimostra davvero una competenza avanzata.","Alcanzar el dominio de una lengua no es nada sencillo: todo lo contrario. Se sobreentiende que hacen falta años de estudio y un léxico rico. Se trata de una cuestión de matices, de registro y de precisión. Quien sabe elegir la palabra justa y variar las estructuras demuestra de verdad una competencia avanzada.","¿Qué requiere el dominio de una lengua?|Años de estudio y léxico rico|Solo suerte|Pocos días|0#¿Qué demuestra competencia avanzada?|Elegir la palabra justa|Hablar rápido|Callar|0","Va da ___ che servano anni.|sé|sei|se#___ di una questione di sfumature.|Si tratta|Tratta|Trattare","El dominio=La padronanza#El matiz=La sfumatura"],
["Repaso final C1: pensar y escribir con precisión","il pensiero critico=el pensamiento crítico;la sintesi=la síntesis;l'analisi=el análisis;il giudizio=el juicio;argomentare=argumentar;sostenere=sostener;confutare=refutar;il punto di vista=el punto de vista","Repaso final C1: combina argumentación académica, registro, matices y estructuras absolutas. Para cerrar: «In definitiva», «Alla luce di quanto esposto», «Resta da vedere se…» (queda por ver si). Un buen texto C1 equilibra análisis, ejemplos y una conclusión clara.","In definitiva, la tesi è convincente.=En definitiva, la tesis es convincente.;Alla luce di quanto esposto, è lecito concludere così.=A la luz de lo expuesto, es lícito concluir así.;Resta da vedere se la riforma funzionerà.=Queda por ver si la reforma funcionará.;Sostengo questa posizione con dati concreti.=Defiendo esta posición con datos concretos.","Alla luce di quanto esposto, è lecito concludere che il pensiero critico sia indispensabile. Un buon testo equilibra analisi, esempi e sintesi, e non teme di confutare le obiezioni. In definitiva, chi argomenta con precisione convince meglio. Resta da vedere se riusciremo a trasmettere questa abitudine alle nuove generazioni.","A la luz de lo expuesto, es lícito concluir que el pensamiento crítico es indispensable. Un buen texto equilibra análisis, ejemplos y síntesis, y no teme refutar las objeciones. En definitiva, quien argumenta con precisión convence mejor. Queda por ver si lograremos transmitir este hábito a las nuevas generaciones.","¿Qué es indispensable?|El pensamiento crítico|La memoria|El humor|0#¿Qué queda por ver?|Si se transmitirá a las nuevas generaciones|Si llueve|Si hay tiempo|0","___ di quanto esposto, è lecito concludere.|Alla luce|Alla luci|Al luce#In ___, la tesi è convincente.|definitiva|definitivo|definire","El pensamiento crítico=Il pensiero critico#En definitiva=In definitiva"]

["Valores finos de los modales","dovrebbe=debería / probablemente;potrebbe=podría / quizá;saprei=sabría;avrebbe dovuto=debería haber;sarebbe potuto=habría podido;non può non=no puede no;non è detto che=no necesariamente;a meno che non=a menos que","Los modales tienen valores epistémicos: «Dovrebbe essere già arrivato» (probablemente ya ha llegado), «Potrebbe essere vero» (quizá sea verdad), «Non può non sapere» (seguro que lo sabe). El condicional compuesto expresa reproche o posibilidad no realizada: «Avresti potuto avvertirmi».","Dovrebbe essere già arrivato.=Debería de haber llegado ya.;Non può non sapere la verità.=No puede no saber la verdad.;Avresti potuto avvertirmi.=Podrías haberme avisado.;Non è detto che sia colpa sua.=No necesariamente es culpa suya.","Marco non risponde: dovrebbe essere già arrivato, ma potrebbe aver perso il treno. Non può non sapere che lo aspettiamo, quindi avrebbe potuto avvertirci. Non è detto, però, che sia colpa sua: a meno che non ci sia un guasto, il treno non dovrebbe ritardare così tanto.","Marco no responde: debería de haber llegado ya, pero podría haber perdido el tren. No puede no saber que lo esperamos, así que podría habernos avisado. No necesariamente es culpa suya, sin embargo: a menos que haya una avería, el tren no debería retrasarse tanto.","¿Qué sospechan?|Que perdió el tren|Que está enfermo|Que no vendrá|0#¿Qué podría haber hecho?|Avisarlos|Llamar a la policía|Viajar en coche|0","___ essere già arrivato.|Dovrebbe|Doveva|Deve avere#___ potuto avvertirmi.|Avresti|Hai|Avevi","No puede no saberlo=Non può non saperlo#Podrías haberme avisado=Avresti potuto avvertirmi"],
["Léxico culto y sinónimos finos","effimero=efímero;perspicace=perspicaz;ineluttabile=ineludible;sagace=sagaz;obsoleto=obsoleto;alacre=diligente;vacuo=vacío de contenido;eloquente=elocuente","El léxico culto aporta precisión: effimero (pasajero), perspicace (agudo), ineluttabile (inevitable). Cuidado con el registro: en un texto literario o ensayístico quedan bien; en la conversación pueden sonar afectados. Sinónimos finos: vacuo ≠ vuoto: vacuo implica falta de sustancia.","Fu un successo effimero.=Fue un éxito efímero.;Il suo giudizio è sempre perspicace.=Su juicio es siempre perspicaz.;La fine sembrava ineluttabile.=El final parecía ineludible.;Il discorso era vacuo e retorico.=El discurso era vacío y retórico.","Il successo del romanzo fu effimero, ma la critica rimase perspicace: nel libro vide un'opera vacua e troppo retorica. Eppure l'autore, sagace, comprese che il declino era ineluttabile e cambiò stile. Il suo nuovo lavoro, meno appariscente, risultò più eloquente e profondo.","El éxito de la novela fue efímero, pero la crítica fue perspicaz: en el libro vio una obra vacía y demasiado retórica. Y sin embargo el autor, sagaz, comprendió que el declive era ineludible y cambió de estilo. Su nuevo trabajo, menos vistoso, resultó más elocuente y profundo.","¿Cómo fue el éxito?|Efímero|Duradero|Enorme|0#¿Qué hizo el autor?|Cambió de estilo|Dejó de escribir|Cambió de editor|0","Fu un successo ___.|effimero|effimera|effimeri#La fine sembrava ___.|ineluttabile|ineluttabili|ineluttabilmente","Efímero=Effimero#Perspicaz=Perspicace"],
["Montale y el hermetismo","l'ermetismo=el hermetismo;il correlativo oggettivo=el correlato objetivo;il male di vivere=el mal de vivir;la poesia=la poesía;il verso=el verso;l'immagine=la imagen;l'aridità=la aridez;evocare=evocar","Eugenio Montale (Nobel 1975) usa el «correlativo oggettivo»: expresa emociones mediante objetos concretos. En «Ossi di seppia» el «male di vivere» se simboliza con imágenes áridas. Para comentar: «Il poeta evoca…», «L'immagine allude a…», «Il verso suggerisce…».","Il poeta evoca il male di vivere.=El poeta evoca el mal de vivir.;L'immagine allude a un senso di aridità.=La imagen alude a un sentimiento de aridez.;Il verso suggerisce una sconfitta.=El verso sugiere una derrota.;Montale vinse il Nobel nel 1975.=Montale ganó el Nobel en 1975.","Montale, premio Nobel nel 1975, evoca il male di vivere attraverso immagini concrete, secondo il correlativo oggettivo. L'aridità del paesaggio ligure allude a un'aridità interiore, mentre il verso, essenziale, suggerisce una sconfitta senza retorica. L'ermetismo non è oscurità gratuita, ma ricerca di una parola capace di dire l'indicibile.","Montale, premio Nobel en 1975, evoca el mal de vivir mediante imágenes concretas, según el correlato objetivo. La aridez del paisaje ligur alude a una aridez interior, mientras que el verso, esencial, sugiere una derrota sin retórica. El hermetismo no es oscuridad gratuita, sino búsqueda de una palabra capaz de decir lo indecible.","¿Qué evoca Montale?|El mal de vivir|La alegría|La guerra|0#¿Qué no es el hermetismo?|Oscuridad gratuita|Búsqueda de una palabra|Poesía|0","Il poeta ___ il male di vivere.|evoca|evocare|evocato#L'immagine ___ a un senso di aridità.|allude|alludere|alluso","El verso=Il verso#La poesía=La poesia"],
["Croce y el idealismo","l'idealismo=el idealismo;l'estetica=la estética;lo storicismo=el historicismo;la libertà=la libertad;la filosofia=la filosofía;il pensiero=el pensamiento;l'intuizione=la intuición;lo spirito=el espíritu","Benedetto Croce (1866-1952) defiende un idealismo historicista: la historia es historia de la libertad. En estética identifica el arte con la «intuizione lirica». Para exponer: «Per Croce, l'arte è…», «Secondo il filosofo, la storia è…», «Ne deriva che…».","Per Croce, l'arte è intuizione lirica.=Para Croce, el arte es intuición lírica.;La storia è storia della libertà.=La historia es historia de la libertad.;Ne deriva una concezione storicista.=De ello se deriva una concepción historicista.;Lo spirito si manifesta nella storia.=El espíritu se manifiesta en la historia.","Per Croce, la filosofia è inseparabile dalla storia: la storia è storia della libertà e lo spirito si manifesta nel suo svolgersi. In estetica, l'arte coincide con l'intuizione lirica e non con la mera tecnica. Ne deriva una concezione storicista che influenzò profondamente la cultura italiana del Novecento.","Para Croce, la filosofía es inseparable de la historia: la historia es historia de la libertad y el espíritu se manifiesta en su desarrollo. En estética, el arte coincide con la intuición lírica y no con la mera técnica. De ello se deriva una concepción historicista que influyó profundamente en la cultura italiana del siglo XX.","¿Qué es la historia para Croce?|Historia de la libertad|Una lista de fechas|Un mito|0#¿Con qué coincide el arte?|Con la intuición lírica|Con la técnica|Con la moda|0","Per Croce, l'arte è ___ lirica.|intuizione|intuire|intuito#La storia è storia della ___.|libertà|libero|liberare","La libertad=La libertà#El espíritu=Lo spirito"],
["Cicerón y la oratoria clásica","l'oratoria=la oratoria;l'oratore=el orador;l'arringa=el alegato;l'eloquenza=la elocuencia;la persuasione=la persuasión;il Senato=el Senado;il console=el cónsul;la repubblica=la república","Cicerón (106-43 a. C.) fue el gran orador romano: sus «Catilinarie» denuncian la conspiración de Catilina. Estructura clásica del discurso: esordio, narrazione, argomentazione, perorazione. Fórmula célebre: «Quo usque tandem abutere, Catilina, patientia nostra?».","Cicerone fu un grande oratore romano.=Cicerón fue un gran orador romano.;L'arringa denuncia la congiura.=El alegato denuncia la conspiración.;L'eloquenza serve a persuadere.=La elocuencia sirve para persuadir.;Il console parlò davanti al Senato.=El cónsul habló ante el Senado.","Cicerone, console e oratore, pronunciò le Catilinarie davanti al Senato per denunciare la congiura di Catilina. La sua arringa seguiva lo schema classico: esordio, narrazione, argomentazione e perorazione. L'eloquenza ciceroniana, fondata sulla persuasione e sull'equilibrio, resta un modello per chi vuole parlare in pubblico.","Cicerón, cónsul y orador, pronunció las Catilinarias ante el Senado para denunciar la conspiración de Catilina. Su alegato seguía el esquema clásico: exordio, narración, argumentación y peroración. La elocuencia ciceroniana, basada en la persuasión y el equilibrio, sigue siendo un modelo para quien quiere hablar en público.","¿Ante quién habló?|El Senado|El pueblo|El rey|0#¿Qué denunció?|La conspiración de Catilina|Una guerra|Un impuesto|0","Cicerone fu un grande ___.|oratore|oratoria|orare#L'___ serve a persuadere.|eloquenza|eloquente|eloquentemente","La oratoria=L'oratoria#La persuasión=La persuasione"],
["Juegos de palabras y refranes","il gioco di parole=el juego de palabras;il proverbio=el refrán;il doppio senso=el doble sentido;l'assonanza=la asonancia;lo scioglilingua=el trabalenguas;la rima=la rima;la battuta=el chiste;il detto=el dicho","El italiano abunda en refranes y juegos de palabras: «Chi va piano va sano e va lontano», «Chi dorme non piglia pesci», «Tra il dire e il fare c'è di mezzo il mare». Las asonancias y el doble sentido dan ingenio. Trabalenguas famoso: «Trentatré trentini entrarono a Trento, tutti e trentatré trotterellando».","Tra il dire e il fare c'è di mezzo il mare.=Del dicho al hecho hay mucho trecho.;Chi dorme non piglia pesci.=Al que duerme no le caen peces.;Trentatré trentini entrarono a Trento.=Treinta y tres trentinos entraron en Trento.;Il doppio senso fa ridere.=El doble sentido hace reír.","Mio nonno ripeteva sempre un proverbio: «Tra il dire e il fare c'è di mezzo il mare.» Per i bambini inventava giochi di parole e scioglilingua, come quello dei trentatré trentini. Il doppio senso lo faceva ridere, e le rime facevano ricordare a tutti i suoi detti, ancora oggi.","Mi abuelo repetía siempre un refrán: «Del dicho al hecho hay mucho trecho.» Para los niños inventaba juegos de palabras y trabalenguas, como el de los treinta y tres trentinos. El doble sentido le hacía reír, y las rimas hacían que todos recordaran sus dichos, todavía hoy.","¿Qué repetía el abuelo?|Un refrán|Una canción|Un poema|0#¿Qué inventaba para los niños?|Juegos de palabras y trabalenguas|Cuentos|Dibujos|0","Tra il dire e il fare c'è di mezzo il ___.|mare|monte|fiume#Il doppio ___ fa ridere.|senso|sensi|sentire","El refrán=Il proverbio#El trabalenguas=Lo scioglilingua"],
["Boccaccio y el Decamerón", "la novella=la novela corta;la cornice=el marco narrativo;la peste=la peste;la brigata=la compañía;l'ingegno=el ingenio;la fortuna=la fortuna;la beffa=la burla;il Decameron=el Decamerón", "Giovanni Boccaccio (1313-1375) escribió el «Decameron»: cien novelle contadas por diez jóvenes que huyen de la peste de Florencia (1348). Estructura de «cornice» (marco). Temas: ingegno, fortuna, amor, burla. Comentario: «La novella illustra…», «L'ingegno trionfa sulla fortuna».", "Il Decameron raccoglie cento novelle.=El Decamerón reúne cien novelas cortas.;La cornice narrativa lega i racconti.=El marco narrativo une los relatos.;L'ingegno trionfa sulla fortuna.=El ingenio triunfa sobre la fortuna.;La beffa è un tema ricorrente.=La burla es un tema recurrente.", "Nel Decameron, dieci giovani fuggono dalla peste che colpisce Firenze nel 1348 e si rifugiano in campagna. Per dieci giorni raccontano a turno cento novelle, legate da una cornice narrativa. L'ingegno trionfa spesso sulla fortuna, e la beffa diventa strumento di un'arguzia che, oltre a divertire, rivela la complessità dell'animo umano.", "En el Decamerón, diez jóvenes huyen de la peste que golpea Florencia en 1348 y se refugian en el campo. Durante diez días cuentan por turnos cien novelas, unidas por un marco narrativo. El ingenio triunfa a menudo sobre la fortuna, y la burla se convierte en instrumento de una agudeza que, además de divertir, revela la complejidad del alma humana.", "¿Cuántas novelas contienen?|Cien|Diez|Mil|0#¿De qué huyen los jóvenes?|De la peste|De la guerra|Del hambre|0", "Il Decameron raccoglie cento ___.|novelle|novella|novelli#La ___ narrativa lega i racconti.|cornice|cornici|cornicione", "El ingenio=L'ingegno#La peste=La peste"],
["Petrarca y el soneto", "il sonetto=el soneto;il Canzoniere=el Cancionero;Laura=Laura;l'amore=el amor;il dissidio=el conflicto interior;l'endecasillabo=el endecasílabo;la rima=la rima;l'antitesi=la antítesis", "Francesco Petrarca (1304-1374): «Canzoniere», 366 poemas dedicados a Laura. El soneto (14 versos endecasílabos: dos cuartetos y dos tercetos) fija el modelo europeo. Característica: el «dissidio» entre amor terrenal y aspiración religiosa, expresado con antítesis. Para comentar: «Il poeta oppone…», «Emerge un contrasto tra…».", "Il Canzoniere contiene 366 componimenti.=El Cancionero contiene 366 composiciones.;Il sonetto ha quattordici versi.=El soneto tiene catorce versos.;Il poeta oppone amore e fede.=El poeta opone amor y fe.;Emerge un contrasto interiore.=Emerge un contraste interior.", "Petrarca raccolse nel Canzoniere 366 componimenti, in gran parte sonetti dedicati a Laura. Il sonetto, di quattordici endecasillabi, divenne modello per tutta l'Europa. Nei suoi versi il poeta oppone l'amore terreno e l'aspirazione religiosa: da questo dissidio nasce una tensione, resa spesso con l'antitesi, che avvicina il lettore moderno.", "Petrarca reunió en el Cancionero 366 composiciones, en gran parte sonetos dedicados a Laura. El soneto, de catorce endecasílabos, se convirtió en modelo para toda Europa. En sus versos el poeta opone el amor terrenal y la aspiración religiosa: de este conflicto nace una tensión, expresada a menudo con la antítesis, que acerca al lector moderno.", "¿A quién dedica los sonetos?|A Laura|A Beatriz|A Fiammetta|0#¿Cuántos versos tiene un soneto?|Catorce|Doce|Dieciséis|0", "Il sonetto ha ___ versi.|quattordici|quattro|dodici#Il poeta ___ amore e fede.|oppone|oppongono|opporre", "El soneto=Il sonetto#El amor=L'amore"],
["Manzoni y la novela histórica", "il romanzo storico=la novela histórica;la Provvidenza=la Providencia;gli umili=los humildes;i promessi sposi=los novios;la peste=la peste;la lingua=la lengua;il fiorentino=el florentino;l'ironia=la ironía", "Alessandro Manzoni (1785-1873): «I promessi sposi» (versión definitiva, 1840), novela histórica ambientada en la Lombardía del siglo XVII. Manzoni adaptó su lengua al florentino hablado, y así contribuyó a unificar el italiano literario. Temas: Provvidenza, justicia, los humildes. Narrador irónico.", "I promessi sposi è un romanzo storico.=Los novios es una novela histórica.;Manzoni scelse il fiorentino parlato.=Manzoni eligió el florentino hablado.;Il narratore usa spesso l'ironia.=El narrador usa a menudo la ironía.;La Provvidenza guida gli umili.=La Providencia guía a los humildes.", "I promessi sposi, ambientato nella Lombardia del Seicento, racconta le difficoltà di due giovani, Renzo e Lucia, ostacolati dal potere. Manzoni, con un narratore spesso ironico, dà voce agli umili e affida alla Provvidenza il senso della storia. Inoltre, scegliendo il fiorentino parlato, contribuì in modo decisivo all'unità linguistica del paese.", "Los novios, ambientada en la Lombardía del siglo XVII, cuenta las dificultades de dos jóvenes, Renzo y Lucia, obstaculizados por el poder. Manzoni, con un narrador a menudo irónico, da voz a los humildes y confía a la Providencia el sentido de la historia. Además, eligiendo el florentino hablado, contribuyó de forma decisiva a la unidad lingüística del país.", "¿Cómo se llaman los protagonistas?|Renzo y Lucia|Dante y Beatriz|Paolo y Francesca|0#¿Qué lengua eligió Manzoni?|El florentino hablado|El latín|El dialecto lombardo|0", "I promessi sposi è un romanzo ___.|storico|storia|storicamente#Il narratore usa spesso l'___.|ironia|ironico|ironicamente", "La novela histórica=Il romanzo storico#Los humildes=Gli umili"],
["Pasolini y la crítica social", "la società dei consumi=la sociedad de consumo;l'omologazione=la homogeneización;il sottoproletariato=el subproletariado;la denuncia=la denuncia;lo scandalo=el escándalo;il cinema=el cine;il corsaro=el corsario;l'intellettuale=el intelectual", "Pier Paolo Pasolini (1922-1975): poeta, cineasta y polemista. En «Scritti corsari» denunció la «omologazione» provocada por la sociedad de consumo. Su lenguaje combina rigor, provocación y compasión. Para comentarlo: «Pasolini denunciò…», «A suo avviso…», «Lo scandalo, in lui, era…».", "Pasolini denunciò l'omologazione culturale.=Pasolini denunció la homogeneización cultural.;A suo avviso, il consumismo cancellava le differenze.=A su juicio, el consumismo borraba las diferencias.;Fu poeta, regista e polemista.=Fue poeta, director y polemista.;Lo scandalo, in lui, era uno strumento critico.=El escándalo, en él, era un instrumento crítico.", "Pasolini fu poeta, regista e polemista. Nei suoi interventi denunciò l'omologazione prodotta dalla società dei consumi: a suo avviso, il consumismo cancellava le differenze culturali e impoveriva gli ultimi. Provocatorio ma compassionevole, usò lo scandalo come strumento critico e ci invita ancora a interrogare il progresso.", "Pasolini fue poeta, director y polemista. En sus intervenciones denunció la homogeneización producida por la sociedad de consumo: a su juicio, el consumismo borraba las diferencias culturales y empobrecía a los últimos. Provocador pero compasivo, usó el escándalo como instrumento crítico y todavía nos invita a interrogar el progreso.", "¿Qué denunció?|La homogeneización|La guerra|El turismo|0#¿Cómo usó el escándalo?|Como instrumento crítico|Para vender|Para callar|0", "Pasolini ___ l'omologazione.|denunciò|denunciare|denunciato#Fu poeta, ___ e polemista.|regista|registro|registrare", "La denuncia=La denuncia#El intelectual=L'intellettuale"],
["Novela italiana contemporánea", "il narratore=el narrador;l'autofiction=la autoficción;la saga familiare=la saga familiar;il bestseller=el superventas;il premio Strega=el premio Strega;l'esordio=el debut;la traduzione=la traducción;la critica=la crítica", "La narrativa italiana contemporánea combina memoria, identidad y crítica social: sagas familiares, autoficción, novela negra. Premios: Strega, Campiello. Para reseñar: «L'esordio ha conquistato la critica», «È stato tradotto in oltre trenta lingue», «Si distingue per…».", "Il romanzo ha vinto il premio Strega.=La novela ganó el premio Strega.;È stato tradotto in oltre trenta lingue.=Ha sido traducido a más de treinta lenguas.;Si distingue per la voce narrante.=Se distingue por la voz narrativa.;L'esordio ha conquistato la critica.=El debut ha conquistado a la crítica.", "L'esordio di quell'autrice ha conquistato la critica: la saga familiare, narrata in prima persona, mescola memoria e autofiction. Il romanzo ha vinto il premio Strega ed è stato tradotto in oltre trenta lingue. Si distingue per la voce narrante, intima e spietata, che trasforma una vicenda locale in un racconto universale.", "El debut de aquella autora ha conquistado a la crítica: la saga familiar, narrada en primera persona, mezcla memoria y autoficción. La novela ha ganado el premio Strega y ha sido traducida a más de treinta lenguas. Se distingue por la voz narradora, íntima e implacable, que transforma una historia local en un relato universal.", "¿Qué premio ganó?|El Strega|El Nobel|El Cervantes|0#¿A cuántas lenguas se tradujo?|Más de treinta|Diez|Tres|0", "Il romanzo ha vinto il premio ___.|Strega|Nobel|Oscar#È stato ___ in trenta lingue.|tradotto|tradurre|traduzione", "El debut=L'esordio#El superventas=Il bestseller"],
["Terminología científica y neologismos", "la terminologia=la terminología;il neologismo=el neologismo;il calco=el calco;il prestito=el préstamo;l'anglicismo=el anglicismo;il glossario=el glosario;la nomenclatura=la nomenclatura;il linguaggio settoriale=el lenguaje sectorial", "La lengua de la ciencia produce neologismos por derivación, préstamo y calco: «grattacielo» es un calco de skyscraper; «computer» es un préstamo (mantiene la forma extranjera). Debate: ¿un término italiano o un anglicismo? Para argumentar: «a scapito di», «in virtù di».", "Grattacielo è un calco di skyscraper.=Rascacielos es un calco de skyscraper.;Computer è un prestito dall'inglese.=Computer es un préstamo del inglés.;Il glossario chiarisce la terminologia.=El glosario aclara la terminología.;Il linguaggio settoriale richiede precisione.=El lenguaje sectorial requiere precisión.", "Il linguaggio scientifico crea nuove parole per derivazione, per prestito o per calco: grattacielo è un calco di skyscraper, mentre computer è un prestito. In virtù della precisione richiesta, i glossari chiariscono la terminologia. Resta aperto il dibattito: preferire il termine italiano, a scapito della diffusione, o accettare l'anglicismo?", "El lenguaje científico crea nuevas palabras por derivación, por préstamo o por calco: rascacielos es un calco de skyscraper, mientras que computer es un préstamo. En virtud de la precisión requerida, los glosarios aclaran la terminología. Sigue abierto el debate: ¿preferir el término italiano, en detrimento de la difusión, o aceptar el anglicismo?", "¿Qué es grattacielo?|Un calco|Un préstamo|Un nombre propio|0#¿Qué es computer?|Un préstamo|Un calco|Una derivación|0", "Grattacielo è un ___ di skyscraper.|calco|prestito|neologismo#Il ___ chiarisce la terminologia.|glossario|glossa|glossare", "El neologismo=Il neologismo#El glosario=Il glossario"],
["Retórica política contemporánea", "il comizio=el mitin;lo slogan=el eslogan;il populismo=el populismo;la propaganda=la propaganda;il consenso=el consenso;la demagogia=la demagogia;il discorso=el discurso;la retorica=la retórica", "Para analizar un discurso político: «Il leader ricorre a…», «Il discorso fa leva su…» (se apoya en), «mira a» (apunta a). Figuras: slogan, anafora, antitesi, appello emotivo. Distingue retórica legítima de demagogia: la segunda explota las emociones sin argumentos.", "Il leader ricorre a slogan semplici.=El líder recurre a eslóganes simples.;Il discorso fa leva sulla paura.=El discurso se apoya en el miedo.;La demagogia sostituisce gli argomenti con le emozioni.=La demagogia sustituye los argumentos por emociones.;L'anafora rafforza il messaggio.=La anáfora refuerza el mensaje.", "Nel comizio, il leader ricorre a slogan semplici e a ripetizioni insistenti. Il discorso fa leva sulla paura e mira a conquistare consenso più che a convincere con argomenti. Quando la retorica sostituisce i fatti con le emozioni si parla di demagogia: per questo è utile analizzare criticamente ciò che si ascolta.", "En el mitin, el líder recurre a eslóganes simples y a repeticiones insistentes. El discurso se apoya en el miedo y apunta a conquistar consenso más que a convencer con argumentos. Cuando la retórica sustituye los hechos por emociones se habla de demagogia: por eso es útil analizar críticamente lo que se escucha.", "¿En qué se apoya el discurso?|En el miedo|En datos|En humor|0#¿Qué es la demagogia?|Emociones en lugar de argumentos|Buen debate|Un eslogan|0", "Il discorso fa ___ sulla paura.|leva|levare|levato#La ___ sostituisce gli argomenti.|demagogia|demagogo|demagogico", "El mitin=Il comizio#El eslogan=Lo slogan"],
["Lítote, eufemismo e hipérbole", "la litote=la lítote;l'eufemismo=el eufemismo;l'iperbole=la hipérbole;l'understatement=el understatement;il sottinteso=lo sobreentendido;l'allusione=la alusión;il tono=el tono;la perifrasi=la perífrasis", "La lítote afirma negando: «non è male» (es bueno), «non è un genio» (es poco inteligente). El eufemismo suaviza («è venuto a mancare» = murió). La hipérbole exagera («Ti ho aspettato un secolo»). Reconocer el tono es clave: lo sobreentendido cambia el sentido literal.", "Non è male, come idea.=No está mal como idea (es buena).;È venuto a mancare ieri.=Falleció ayer.;Ti ho aspettato un secolo!=¡Te he esperado un siglo!;Non è proprio un genio.=No es precisamente un genio.", "Quando Anna dice «non è male, come idea», usa una litote per lodare con discrezione. Al funerale, qualcuno ha detto che il nonno «è venuto a mancare»: un eufemismo per addolcire la notizia. Marco, ritardatario, esclama «Ti ho aspettato un secolo!», un'iperbole che rivela insieme ironia e affetto.", "Cuando Anna dice «no está mal como idea», usa una lítote para elogiar con discreción. En el funeral, alguien dijo que el abuelo «había faltado»: un eufemismo para suavizar la noticia. Marco, impuntual, exclama «¡Te he esperado un siglo!», una hipérbole que revela a la vez ironía y cariño.", "¿Qué figura es «non è male»?|Lítote|Hipérbole|Eufemismo|0#¿Qué figura es «ti ho aspettato un secolo»?|Hipérbole|Lítote|Metáfora|0", "«Non è male» è una ___.|litote|iperbole|rima#«È venuto a mancare» è un ___.|eufemismo|eufemisti|eufemistico", "La hipérbole=L'iperbole#El eufemismo=L'eufemismo"],
["El lenguaje burocrático", "il burocratese=el lenguaje burocrático;il gergo=la jerga;la chiarezza=la claridad;la semplificazione=la simplificación;il linguaggio amministrativo=el lenguaje administrativo;la nominalizzazione=la nominalización;l'ambiguità=la ambigüedad;il destinatario=el destinatario", "El «burocratese» abusa de nominalizaciones, pasivas y fórmulas rebuscadas: «si provvede alla trasmissione» en vez de «trasmettiamo». Hay campañas por la semplificazione del lenguaje administrativo. Para criticarlo: «Il testo è ambiguo», «Non tiene conto del destinatario», «Andrebbe riformulato».", "Il testo è poco chiaro e ambiguo.=El texto es poco claro y ambiguo.;Andrebbe riformulato in modo più semplice.=Debería reformularse de forma más sencilla.;Il burocratese allontana i cittadini.=El lenguaje burocrático aleja a los ciudadanos.;Occorre tenere conto del destinatario.=Hay que tener en cuenta al destinatario.", "Una circolare diceva: «Si provvede alla trasmissione della documentazione di cui sopra». Il testo, ambiguo e rigido, non tiene conto del destinatario. Andrebbe riformulato in modo più chiaro: «Vi mandiamo i documenti». La semplificazione del linguaggio amministrativo avvicina i cittadini alle istituzioni e riduce i malintesi.", "Una circular decía: «Se procede a la transmisión de la documentación arriba indicada». El texto, ambiguo y rígido, no tiene en cuenta al destinatario. Debería reformularse de forma más clara: «Les mandamos los documentos». La simplificación del lenguaje administrativo acerca a los ciudadanos a las instituciones y reduce los malentendidos.", "¿Qué problema tiene el texto?|Es ambiguo y rígido|Es demasiado corto|Está en inglés|0#¿Qué reduce la simplificación?|Los malentendidos|Los impuestos|Los empleos|0", "Il testo ___ riformulato in modo più chiaro.|andrebbe|andrà|andava#La ___ avvicina i cittadini.|semplificazione|semplice|semplificare", "La claridad=La chiarezza#La ambigüedad=L'ambiguità"],
["La cuestión de la lengua", "la questione della lingua=la cuestión de la lengua;il toscano=el toscano;il volgare=la lengua vulgar;l'unificazione linguistica=la unificación lingüística;la norma=la norma;l'Accademia della Crusca=la Academia de la Crusca;il dialetto=el dialecto;il purismo=el purismo", "La «questione della lingua» es el debate secular sobre qué italiano adoptar. Bembo propuso el toscano trecentesco (Petrarca, Boccaccio) como modelo; la Crusca (1583) fijó la norma; Manzoni defendió el florentino vivo. Hoy el italiano estándar coexiste con dialectos y variedades regionales.", "Bembo propose il toscano come modello.=Bembo propuso el toscano como modelo.;La Crusca fissò la norma.=La Crusca fijó la norma.;Si contrapponevano due posizioni.=Se contraponían dos posturas.;I dialetti sopravvivono accanto all'italiano.=Los dialectos sobreviven junto al italiano.", "Per secoli la questione della lingua divise gli intellettuali italiani. Bembo propose come modello il toscano di Petrarca e Boccaccio, la Crusca fissò la norma e Manzoni sostenne il fiorentino vivo. Si contrapponevano dunque il purismo e l'uso. Oggi l'italiano standard convive con i dialetti, che sopravvivono accanto alla lingua nazionale.", "Durante siglos la cuestión de la lengua dividió a los intelectuales italianos. Bembo propuso como modelo el toscano de Petrarca y Boccaccio, la Crusca fijó la norma y Manzoni defendió el florentino vivo. Se contraponían, pues, el purismo y el uso. Hoy el italiano estándar convive con los dialectos, que sobreviven junto a la lengua nacional.", "¿Qué propuso Bembo?|El toscano de Petrarca y Boccaccio|El latín|El napolitano|0#¿Qué defendió Manzoni?|El florentino vivo|El latín|El dialecto|0", "Bembo ___ il toscano come modello.|propose|proporre|proposto#La Crusca ___ la norma.|fissò|fissare|fissato", "La norma=La norma#El dialecto=Il dialetto"],
["Traducción literaria", "la traduzione letteraria=la traducción literaria;il traduttore=el traductor;la fedeltà=la fidelidad;l'intraducibile=lo intraducible;l'equivalenza=la equivalencia;il calco=el calco;il testo di partenza=el texto de origen;il testo di arrivo=el texto de llegada", "Para traducir literatura hay que decidir entre fidelidad y naturalidad: «traduttore, traditore» (juego de palabras). Estrategias: equivalencia, adaptación, nota del traductor. Un buen traductor «restituisce il tono, non solo il senso». Fórmulas: «Si perde inevitabilmente…», «Resta fedele a…».", "Traduttore, traditore.=Traductor, traidor.;Il testo di arrivo deve suonare naturale.=El texto de llegada debe sonar natural.;Si perde inevitabilmente qualche sfumatura.=Se pierde inevitablemente algún matiz.;Resta fedele al tono originale.=Permanece fiel al tono original.", "Tradurre un romanzo significa scegliere tra fedeltà e naturalezza: «traduttore, traditore», dice il proverbio. Il testo di arrivo deve suonare naturale, ma resta fedele al tono originale. Si perde inevitabilmente qualche sfumatura, soprattutto nei giochi di parole, eppure un buon traduttore restituisce il tono, non solo il senso.", "Traducir una novela significa elegir entre fidelidad y naturalidad: «traductor, traidor», dice el refrán. El texto de llegada debe sonar natural, pero permanece fiel al tono original. Se pierde inevitablemente algún matiz, sobre todo en los juegos de palabras, y sin embargo un buen traductor restituye el tono, no solo el sentido.", "¿Entre qué se elige?|Fidelidad y naturalidad|Rapidez y precio|Imagen y sonido|0#¿Qué restituye un buen traductor?|El tono y el sentido|Solo el sentido|Solo las palabras|0", "Traduttore, ___.|traditore|tradito|tradire#Si perde inevitabilmente qualche ___.|sfumatura|sfumato|sfumare", "La fidelidad=La fedeltà#El traductor=Il traduttore"],
["Métrica y endecasílabo", "l'endecasillabo=el endecasílabo;la sillaba=la sílaba;l'accento=el acento;la sinalefe=la sinalefa;l'ottava=la octava;la terzina=el terceto;la rima baciata=la rima pareada;l'enjambement=el encabalgamiento", "El endecasillabo es el verso fundamental de la poesía italiana: once sílabas con acento fijo en la décima. La sinalefa une la vocal final con la inicial: «Nel mezzo del cammin di nostra vita». Estrofas: terzina (Dante), ottava (Ariosto), sonetto. El encabalgamiento rompe la pausa del verso.", "L'endecasillabo ha undici sillabe.=El endecasílabo tiene once sílabas.;La sinalefe unisce due vocali.=La sinalefa une dos vocales.;Dante usò la terzina incatenata.=Dante usó el terceto encadenado.;L'enjambement spezza il verso.=El encabalgamiento rompe el verso.", "Nella poesia italiana il verso fondamentale è l'endecasillabo, che ha undici sillabe con accento sulla decima. La sinalefe unisce vocali contigue e rende la lettura più fluida. Dante scelse la terzina incatenata per la Commedia, Ariosto l'ottava per il Furioso. L'enjambement, infine, spezza il ritmo e crea un effetto di sospensione.", "En la poesía italiana el verso fundamental es el endecasílabo, que tiene once sílabas con acento en la décima. La sinalefa une vocales contiguas y hace la lectura más fluida. Dante eligió el terceto encadenado para la Comedia, Ariosto la octava para el Furioso. El encabalgamiento, por último, rompe el ritmo y crea un efecto de suspensión.", "¿Cuántas sílabas tiene el endecasílabo?|Once|Diez|Doce|0#¿Qué estrofa usó Dante?|El terceto encadenado|La octava|El soneto|0", "L'endecasillabo ha ___ sillabe.|undici|dieci|dodici#Dante scelse la ___ incatenata.|terzina|ottava|quartina", "El endecasílabo=L'endecasillabo#La sinalefa=La sinalefe"],
["Ariosto y el poema caballeresco","il poema cavalleresco=el poema caballeresco;il paladino=el paladín;l'ironia=la ironía;la follia=la locura;la digressione=la digresión;l'ottava=la octava;il cavaliere=el caballero;la magia=la magia","Ludovico Ariosto (1474-1533) escribió «Orlando furioso», poema en octavas que continúa el «Orlando innamorato» de Boiardo. Mezcla épica, amor, magia e ironía; el héroe Orlando enloquece de amor por Angelica. Para comentar: «Il poeta narra con ironia…», «La digressione serve a…».","L'Orlando furioso è scritto in ottave.=El Orlando furioso está escrito en octavas.;Orlando impazzisce per amore.=Orlando enloquece de amor.;Il poeta narra con ironia.=El poeta narra con ironía.;La digressione crea un effetto di varietà.=La digresión crea un efecto de variedad.","Ariosto scrisse l'Orlando furioso in ottave e lo arricchì di magia, amore e ironia. Il paladino Orlando impazzisce per amore di Angelica, e il poeta, con sottile distacco, ne sorride. Le continue digressioni interrompono la trama e creano un effetto di varietà: il lettore passa da un duello a un incantesimo.","Ariosto escribió el Orlando furioso en octavas y lo enriqueció con magia, amor e ironía. El paladín Orlando enloquece de amor por Angelica y el poeta, con sutil distanciamiento, sonríe. Las continuas digresiones interrumpen la trama y crean un efecto de variedad: el lector pasa de un duelo a un encantamiento.","¿Cómo está escrito el poema?|En octavas|En prosa|En tercetos|0#¿Por quién enloquece Orlando?|Angelica|Beatrice|Laura|0","Orlando ___ per amore.|impazzisce|impazzire|impazzito#Il poeta narra con ___.|ironia|ironico|ironizzare","La locura=La follia#El caballero=Il cavaliere"],
["Vico y la filosofía de la historia","la filosofia della storia=la filosofía de la historia;i corsi e ricorsi=los ciclos históricos;la provvidenza=la providencia;la scienza nuova=la ciencia nueva;la civiltà=la civilización;il mito=el mito;la fantasia=la fantasía;la ragione=la razón","Giambattista Vico (1668-1744), en «La scienza nuova», sostiene que solo conocemos de verdad lo que hemos hecho nosotros (verum ipsum factum): la historia. Propone los «corsi e ricorsi»: las civilizaciones atraviesan fases (divina, eroica, umana). Para exponer: «Vico sostiene che…», «Ne deriva che…».","Vico sostiene che conosciamo ciò che facciamo.=Vico sostiene que conocemos lo que hacemos.;Le civiltà attraversano fasi ricorrenti.=Las civilizaciones atraviesan fases recurrentes.;Il mito è una forma di conoscenza.=El mito es una forma de conocimiento.;La Scienza nuova fonda una nuova disciplina.=La Ciencia nueva funda una nueva disciplina.","Per Vico possiamo conoscere davvero soltanto ciò che abbiamo fatto noi: la storia, appunto. Nella Scienza nuova le civiltà attraversano fasi ricorrenti, i corsi e ricorsi, dall'età divina a quella umana. Il mito non è un errore primitivo, ma una forma di conoscenza e di fantasia che precede la ragione.","Para Vico solo podemos conocer de verdad lo que hemos hecho nosotros: la historia, precisamente. En la Ciencia nueva las civilizaciones atraviesan fases recurrentes, los corsi e ricorsi, de la edad divina a la humana. El mito no es un error primitivo, sino una forma de conocimiento y de fantasía que precede a la razón.","¿Qué podemos conocer según Vico?|Lo que hemos hecho|Todo|Nada|0#¿Qué es el mito?|Una forma de conocimiento|Un error|Un chiste|0","Vico ___ che conosciamo ciò che facciamo.|sostiene|sostenere|sostenuto#Le civiltà attraversano fasi ___.|ricorrenti|ricorrente|ricorrere","La civilización=La civiltà#La ciencia nueva=La scienza nuova"],
["Galileo y el método científico","il metodo scientifico=el método científico;l'osservazione=la observación;l'esperimento=el experimento;il telescopio=el telescopio;l'ipotesi=la hipótesis;la prova=la prueba;il Dialogo=el Diálogo;l'eliocentrismo=el heliocentrismo","Galileo Galilei (1564-1642) fundó el método científico moderno: observación, hipótesis, experimento y verificación. Con el telescopio observó las lunas de Júpiter. Fue procesado por el Santo Oficio por defender el heliocentrismo. Para el estilo científico: «Si osserva che…», «Ne risulta che…».","Galileo osservò le lune di Giove.=Galileo observó las lunas de Júpiter.;Si osserva che i corpi cadono alla stessa velocità.=Se observa que los cuerpos caen a la misma velocidad.;L'ipotesi va verificata con un esperimento.=La hipótesis debe verificarse con un experimento.;Fu processato per l'eliocentrismo.=Fue procesado por el heliocentrismo.","Galileo costruì un telescopio e osservò le lune di Giove, una scoperta che metteva in dubbio il vecchio modello del cosmo. Il suo metodo si fondava sull'osservazione, sull'ipotesi e sull'esperimento. Poiché difendeva l'eliocentrismo, fu processato dal Sant'Uffizio e costretto ad abiurare, ma l'importanza della sua opera restò enorme.","Galileo construyó un telescopio y observó las lunas de Júpiter, un descubrimiento que ponía en duda el viejo modelo del cosmos. Su método se basaba en la observación, la hipótesis y el experimento. Como defendía el heliocentrismo, fue procesado por el Santo Oficio y obligado a abjurar, pero la importancia de su obra siguió siendo enorme.","¿Qué observó con el telescopio?|Las lunas de Júpiter|El Sol|Marte|0#¿Por qué fue procesado?|Por defender el heliocentrismo|Por robar|Por escribir poesía|0","Galileo ___ le lune di Giove.|osservò|osservare|osservato#L'ipotesi va ___ con un esperimento.|verificata|verificare|verifico","El experimento=L'esperimento#La prueba=La prova"],
["Ópera: Verdi y Puccini","il libretto=el libreto;l'aria=el aria;il tenore=el tenor;il soprano=la soprano;il palcoscenico=el escenario;il melodramma=el melodrama;il coro=el coro;la romanza=la romanza","La ópera italiana nació en el siglo XVII. Verdi (Rigoletto, La traviata, Aida) y Puccini (La Bohème, Tosca, Turandot) son dos cumbres. Léxico: «il libretto» (texto), «l'aria» (pieza solista), «il palcoscenico». Para reseñar: «L'interpretazione è stata magistrale», «La regia ha puntato su…».","Verdi compose La traviata nel 1853.=Verdi compuso La traviata en 1853.;L'aria del tenore ha commosso il pubblico.=El aria del tenor conmovió al público.;L'interpretazione è stata magistrale.=La interpretación fue magistral.;Il coro ha chiuso lo spettacolo.=El coro cerró el espectáculo.","Ieri sera ho visto La traviata di Verdi al teatro. Il soprano ha interpretato Violetta con una voce potente e delicata, e l'aria del tenore ha commosso il pubblico. La regia ha puntato su un palcoscenico essenziale, ma il coro finale ha chiuso lo spettacolo con grande intensità.","Anoche vi La traviata de Verdi en el teatro. La soprano interpretó a Violetta con una voz potente y delicada, y el aria del tenor conmovió al público. La dirección apostó por un escenario esencial, pero el coro final cerró el espectáculo con gran intensidad.","¿Qué ópera vio?|La traviata|Aida|Tosca|0#¿Qué cerró el espectáculo?|El coro final|El aria|El silencio|0","Verdi ___ La traviata nel 1853.|compose|comporre|composto#L'___ del tenore ha commosso.|aria|arie|ari","El libreto=Il libretto#El escenario=Il palcoscenico"],
["Arquitectura del Renacimiento","la cupola=la cúpula;la prospettiva=la perspectiva;la proporzione=la proporción;la villa=la villa;la colonna=la columna;la simmetria=la simetría;l'architetto=el arquitecto;il rinascimento=el Renacimiento","Brunelleschi (1377-1446) construyó la cúpula de Santa Maria del Fiore y formuló la perspectiva lineal; Palladio (1508-1580) proyectó villas basadas en la proporción y la simetría clásicas. Para describir: «La cupola si erge su…», «L'edificio è caratterizzato da…», «Si ispira al modello classico».","La cupola si erge sul duomo di Firenze.=La cúpula se alza sobre la catedral de Florencia.;L'edificio è caratterizzato da simmetria.=El edificio se caracteriza por la simetría.;Palladio si ispira al modello classico.=Palladio se inspira en el modelo clásico.;Brunelleschi formulò la prospettiva lineare.=Brunelleschi formuló la perspectiva lineal.","Brunelleschi costruì la grande cupola di Santa Maria del Fiore e formulò le regole della prospettiva lineare. Un secolo dopo Palladio progettò ville in Veneto caratterizzate da simmetria e proporzione, ispirandosi al modello classico. Le sue colonne e i suoi frontoni influenzarono l'architettura europea per secoli.","Brunelleschi construyó la gran cúpula de Santa Maria del Fiore y formuló las reglas de la perspectiva lineal. Un siglo después Palladio proyectó villas en el Véneto caracterizadas por la simetría y la proporción, inspirándose en el modelo clásico. Sus columnas y frontones influyeron en la arquitectura europea durante siglos.","¿Qué construyó Brunelleschi?|La cúpula de Santa Maria del Fiore|La Torre de Pisa|El Coliseo|0#¿Qué caracteriza las villas de Palladio?|Simetría y proporción|Colores vivos|Muros altos|0","La cupola si ___ sul duomo.|erge|ergere|eretto#Palladio si ___ al modello classico.|ispira|ispirare|ispirato","La cúpula=La cupola#La simetría=La simmetria"],
["Derecho romano y su herencia","il diritto romano=el derecho romano;il contratto=el contrato;la proprietà=la propiedad;il cittadino=el ciudadano;il giurista=el jurista;il codice=el código;la sentenza=la sentencia;il principio=el principio","El derecho romano sentó bases del derecho europeo: «pacta sunt servanda» (los pactos deben cumplirse), «in dubio pro reo» (en caso de duda, a favor del acusado). Léxico: «giurista», «codice» (Justiniano), «proprietà». Para citar: «Come recita il principio…».","Pacta sunt servanda: i patti vanno rispettati.=Pacta sunt servanda: los pactos deben respetarse.;In dubio pro reo.=En caso de duda, a favor del acusado.;Giustiniano promosse un codice di leggi.=Justiniano promovió un código de leyes.;Il diritto di proprietà è antico.=El derecho de propiedad es antiguo.","Il diritto romano ha influenzato quasi tutti i sistemi giuridici europei. Principi come pacta sunt servanda stabiliscono che i contratti vanno rispettati, mentre in dubio pro reo protegge l'accusato. Il codice di Giustiniano raccolse il lavoro dei giuristi e ordinò secoli di norme: ancora oggi ne vediamo l'eredità nelle nostre leggi.","El derecho romano ha influido en casi todos los sistemas jurídicos europeos. Principios como pacta sunt servanda establecen que los contratos deben respetarse, mientras que in dubio pro reo protege al acusado. El código de Justiniano recogió el trabajo de los juristas y ordenó siglos de normas: todavía hoy vemos su herencia en nuestras leyes.","¿Qué establece pacta sunt servanda?|Que los contratos se respeten|Que se castigue|Que se perdone|0#¿Qué recogió el código de Justiniano?|El trabajo de los juristas|Cartas|Poemas|0","I contratti ___ rispettati.|vanno|va|vado#In dubio ___ reo.|pro|per|con","El jurista=Il giurista#La propiedad=La proprietà"],
["Futurismo y vanguardias","il futurismo=el futurismo;l'avanguardia=la vanguardia;il manifesto=el manifiesto;la velocità=la velocidad;la macchina=la máquina;la rottura=la ruptura;Marinetti=Marinetti;il movimento=el movimiento","El futurismo, fundado por Marinetti en 1909 con su «Manifesto», exalta la velocidad, la máquina y la ruptura con el pasado. Influyó en pintura (Boccioni), arquitectura y poesía. Para la crítica: «Il movimento esalta…», «Si pone in rottura con…», «Tuttavia, la sua ideologia fu controversa».","Marinetti pubblicò il Manifesto nel 1909.=Marinetti publicó el Manifiesto en 1909.;Il movimento esalta la velocità.=El movimiento exalta la velocidad.;Si pone in rottura con il passato.=Se sitúa en ruptura con el pasado.;L'ideologia fu controversa.=La ideología fue controvertida.","Nel 1909 Marinetti pubblicò il Manifesto del futurismo, che esaltava la velocità, la macchina e la rottura con il passato. Pittori come Boccioni tradussero queste idee in dinamismo visivo. Tuttavia, l'ideologia del movimento fu controversa, perché la sua esaltazione della violenza si avvicinò al fascismo.","En 1909 Marinetti publicó el Manifiesto del futurismo, que exaltaba la velocidad, la máquina y la ruptura con el pasado. Pintores como Boccioni tradujeron estas ideas en dinamismo visual. Sin embargo, la ideología del movimiento fue controvertida, porque su exaltación de la violencia se acercó al fascismo.","¿Qué exaltaba el futurismo?|La velocidad y la máquina|La tradición|La calma|0#¿Por qué fue controvertido?|Exaltaba la violencia|Era caro|Era aburrido|0","Marinetti ___ il Manifesto nel 1909.|pubblicò|pubblicare|pubblicato#Il movimento ___ la velocità.|esalta|esaltare|esaltato","La velocidad=La velocità#El manifiesto=Il manifesto"],
["La commedia dell'arte","la maschera=la máscara;Arlecchino=Arlequín;Pantalone=Pantalone;il canovaccio=el guion base;l'improvvisazione=la improvisación;il lazzo=el gag;la compagnia=la compañía;il teatro=el teatro","La commedia dell'arte (siglo XVI) se basa en máscaras fijas (Arlecchino, Pantalone, Colombina) y en un «canovaccio» (guion esquemático) sobre el que los actores improvisan. Los «lazzi» son gags. Para describir: «Si basa sull'improvvisazione», «Le maschere rappresentano tipi sociali».","Arlecchino è il servo furbo e affamato.=Arlequín es el criado astuto y hambriento.;La commedia dell'arte si basa sull'improvvisazione.=La commedia dell'arte se basa en la improvisación.;Il canovaccio dava solo lo schema.=El canovaccio daba solo el esquema.;Le maschere rappresentano tipi sociali.=Las máscaras representan tipos sociales.","La commedia dell'arte nacque nel Cinquecento e si basava sull'improvvisazione degli attori. Il canovaccio dava solo lo schema, mentre le maschere rappresentavano tipi sociali: Arlecchino era il servo furbo, Pantalone il vecchio avaro. I lazzi, cioè le gag, facevano ridere il pubblico nelle piazze e nei teatri.","La commedia dell'arte nació en el siglo XVI y se basaba en la improvisación de los actores. El canovaccio daba solo el esquema, mientras que las máscaras representaban tipos sociales: Arlequín era el criado astuto, Pantalone el viejo avaro. Los lazzi, es decir los gags, hacían reír al público en las plazas y en los teatros.","¿Cómo es Arlecchino?|Un criado astuto|Un rey|Un soldado|0#¿En qué se basaba?|En la improvisación|En textos fijos|En canciones|0","La commedia si basa ___ improvvisazione.|sull'|nella|dalla#Le maschere rappresentano ___ sociali.|tipi|tipo|tipa","La máscara=La maschera#La improvisación=L'improvvisazione"],
["El italiano neoestándar","l'italiano neostandard=el italiano neoestándar;la varietà=la variedad;il parlato=lo hablado;lo scritto=lo escrito;il che polivalente=el che polivalente;la dislocazione=la dislocación;il registro=el registro;la norma=la norma","El italiano neoestándar incorpora rasgos del hablado: «che» polivalente (il giorno che sono arrivato), dislocaciones (Il libro, l'ho letto), «gli» por «a lei» o «a loro», «lui» como sujeto, «ci» actualizante (c'ho fame). Se acepta en el habla, pero no siempre en la escritura formal.","Il giorno che sono arrivato pioveva.=El día que llegué llovía.;Il libro, l'ho letto ieri.=El libro, lo leí ayer.;Gli ho detto di venire.=Le dije que viniera.;C'ho fame!=¡Tengo hambre!","Nel parlato di tutti i giorni usiamo costruzioni diverse dallo standard. Diciamo «il giorno che sono arrivato» e «il libro, l'ho letto ieri». Alcuni dicono «c'ho fame», altri «gli ho detto» riferito a una donna. Sono tratti dell'italiano neostandard, accettati nella conversazione ma meno adatti agli scritti formali.","En el habla de todos los días usamos construcciones distintas del estándar. Decimos «il giorno che sono arrivato» y «il libro, l'ho letto ieri». Algunos dicen «c'ho fame», otros «gli ho detto» refiriéndose a una mujer. Son rasgos del italiano neoestándar, aceptados en la conversación pero menos adecuados en los escritos formales.","¿Dónde se aceptan estos rasgos?|En la conversación|En leyes|En exámenes|0#¿Cómo se dice el libro lo leí ayer?|Il libro, l'ho letto ieri|Il libro letto|Ieri libro|0","Il giorno ___ sono arrivato pioveva.|che|cui|quale#Il libro, ___ ho letto ieri.|l'|gli|ne","Lo hablado=Il parlato#La variedad=La varietà"],
["Ética pública y transparencia","la trasparenza=la transparencia;la corruzione=la corrupción;l'integrità=la integridad;il conflitto di interessi=el conflicto de intereses;la responsabilità=la responsabilidad;il denunciante=el denunciante;l'autorità garante=la autoridad garante;rendere conto=rendir cuentas","Ética pública: «rendere conto» (rendir cuentas), «prevenire la corruzione», «tutelare chi denuncia». Condicionales y subjuntivo en propuestas: «Sarebbe opportuno che gli atti fossero pubblici». Léxico clave: trasparenza, integrità, conflitto di interessi.","Gli amministratori devono rendere conto ai cittadini.=Los administradores deben rendir cuentas a los ciudadanos.;Occorre prevenire la corruzione.=Hace falta prevenir la corrupción.;Sarebbe opportuno che gli atti fossero pubblici.=Sería oportuno que los actos fueran públicos.;Chi denuncia va tutelato.=Quien denuncia debe ser protegido.","La trasparenza è la base della fiducia nelle istituzioni. Per prevenire la corruzione occorre che gli amministratori rendano conto del loro operato e che i conflitti di interessi siano dichiarati. Sarebbe opportuno che gli atti fossero pubblici e che chi denuncia irregolarità fosse tutelato da un'autorità indipendente.","La transparencia es la base de la confianza en las instituciones. Para prevenir la corrupción hace falta que los administradores rindan cuentas de su gestión y que los conflictos de intereses se declaren. Sería oportuno que los actos fueran públicos y que quien denuncia irregularidades estuviera protegido por una autoridad independiente.","¿Qué es la base de la confianza?|La transparencia|El secreto|El dinero|0#¿A quién habría que proteger?|A quien denuncia|A quien oculta|A quien vota|0","Occorre ___ la corruzione.|prevenire|previene|prevenuto#Gli amministratori devono ___ conto.|rendere|rende|reso","La transparencia=La trasparenza#La integridad=L'integrità"],
["Economía civil y cooperativismo","l'economia civile=la economía civil;la cooperativa=la cooperativa;il bene comune=el bien común;la reciprocità=la reciprocidad;il terzo settore=el tercer sector;l'impresa sociale=la empresa social;la mutualità=el mutualismo;il profitto=el beneficio","La «economia civile» (Genovesi, siglo XVIII) defiende que el mercado debe basarse en la reciprocidad y el bien común. Las «cooperative» y el «terzo settore» son ejemplos. Para argumentar: «Non solo… ma anche…», «A differenza di…», «Il profitto non è l'unico fine».","L'economia civile punta al bene comune.=La economía civil apunta al bien común.;Le cooperative si fondano sulla mutualità.=Las cooperativas se fundan en el mutualismo.;A differenza di altre imprese, non cerca solo il profitto.=A diferencia de otras empresas, no busca solo el beneficio.;Il terzo settore è in crescita.=El tercer sector está en crecimiento.","L'economia civile, nata con Genovesi nel Settecento, sostiene che il mercato debba fondarsi sulla reciprocità e sul bene comune. Le cooperative, a differenza di molte imprese tradizionali, non cercano soltanto il profitto: puntano sulla mutualità e sull'inclusione. Il terzo settore, oggi in crescita, ne è una conferma.","La economía civil, nacida con Genovesi en el siglo XVIII, sostiene que el mercado debe fundarse en la reciprocidad y en el bien común. Las cooperativas, a diferencia de muchas empresas tradicionales, no buscan solo el beneficio: apuestan por el mutualismo y la inclusión. El tercer sector, hoy en crecimiento, es una confirmación.","¿En qué debe fundarse el mercado?|Reciprocidad y bien común|Solo beneficio|Competencia|0#¿Qué está creciendo?|El tercer sector|La deuda|El desempleo|0","L'economia civile punta al ___ comune.|bene|buono|bello#Le cooperative non cercano solo il ___.|profitto|profitti|profittare","El bien común=Il bene comune#La cooperativa=La cooperativa"],
["Svevo y la conciencia de Zeno","la coscienza=la conciencia;l'inetto=el inepto;la psicoanalisi=el psicoanálisis;l'ironia=la ironía;il fumo=el tabaco;l'autoinganno=el autoengaño;la memoria=la memoria;l'analisi=el análisis","Italo Svevo (1861-1928) escribió «La coscienza di Zeno» (1923), novela narrada por Zeno Cosini como supuesto diario para su psicoanalista. Tema: la inetitudine (ineptitud) y el autoengaño, con ironía. El tiempo narrativo es subjetivo y mezcla recuerdos. Para comentar: «Il narratore è inattendibile», «L'ironia smaschera…».","Svevo scrisse La coscienza di Zeno.=Svevo escribió La conciencia de Zeno.;Il narratore è inattendibile.=El narrador no es fiable.;L'ironia smaschera l'autoinganno.=La ironía desenmascara el autoengaño.;Zeno promette di smettere di fumare.=Zeno promete dejar de fumar.","La coscienza di Zeno è un romanzo narrato da Zeno Cosini, che scrive le sue memorie per il suo psicoanalista. Il narratore è inattendibile: promette sempre di smettere di fumare, ma non ci riesce mai. L'ironia di Svevo smaschera l'autoinganno e mostra l'inettitudine come condizione moderna, più umana che patetica.","La conciencia de Zeno es una novela narrada por Zeno Cosini, que escribe sus memorias para su psicoanalista. El narrador no es fiable: promete siempre dejar de fumar, pero nunca lo logra. La ironía de Svevo desenmascara el autoengaño y muestra la ineptitud como condición moderna, más humana que patética.","¿Para quién escribe Zeno?|Su psicoanalista|Su familia|Su jefe|0#¿Qué promete siempre?|Dejar de fumar|Viajar|Casarse|0","Il narratore è ___.|inattendibile|inattendibili|attendibile#L'ironia ___ l'autoinganno.|smaschera|smascherare|smascherato","La conciencia=La coscienza#El autoengaño=L'autoinganno"],
["Leonardo y el pensamiento interdisciplinar","il polimata=el polímata;il taccuino=el cuaderno;l'anatomia=la anatomía;l'ingegneria=la ingeniería;la sperimentazione=la experimentación;il capolavoro=la obra maestra;l'osservazione=la observación;l'invenzione=el invento","Leonardo da Vinci (1452-1519) fue pintor, ingeniero, anatomista e inventor: un «polimata». Dejó miles de páginas de cuadernos, como el Codice Atlantico, y obras como la Gioconda y l'Ultima Cena. Para comentar: «Univa arte e scienza», «Si dedicò a…», «Il suo metodo si basava sull'osservazione».","Leonardo univa arte e scienza.=Leonardo unía arte y ciencia.;Si dedicò all'anatomia e all'ingegneria.=Se dedicó a la anatomía y a la ingeniería.;I taccuini contengono migliaia di disegni.=Los cuadernos contienen miles de dibujos.;Il suo metodo si basava sull'osservazione.=Su método se basaba en la observación.","Leonardo da Vinci fu un vero polimata: pittore, ingegnere, anatomista e inventore. Nei suoi taccuini, come il Codice Atlantico, disegnò macchine, corpi umani e paesaggi con la stessa curiosità. Il suo metodo si basava sull'osservazione e sulla sperimentazione, e univa arte e scienza in modo mai visto prima.","Leonardo da Vinci fue un verdadero polímata: pintor, ingeniero, anatomista e inventor. En sus cuadernos, como el Codice Atlantico, dibujó máquinas, cuerpos humanos y paisajes con la misma curiosidad. Su método se basaba en la observación y en la experimentación, y unía arte y ciencia de una manera nunca vista.","¿Qué fue Leonardo?|Un polímata|Un rey|Un soldado|0#¿En qué se basaba su método?|En la observación|En el azar|En la tradición|0","Leonardo ___ arte e scienza.|univa|unire|unito#Si ___ all'anatomia.|dedicò|dedicare|dedicato","El cuaderno=Il taccuino#La obra maestra=Il capolavoro"],
["Caravaggio y el claroscuro","il chiaroscuro=el claroscuro;il realismo=el realismo;la luce=la luz;l'ombra=la sombra;la tela=el lienzo;il committente=el comitente;il modello=el modelo;la pala d'altare=el retablo","Caravaggio (1571-1610) revolucionó la pintura con un claroscuro dramático y un realismo sin idealizar: usaba modelos populares. Obras: «La vocazione di san Matteo», «La canestra di frutta». Para describir: «La luce taglia l'oscurità», «Colpisce il contrasto tra…», «Il pittore rinuncia all'idealizzazione».","La luce taglia l'oscurità.=La luz corta la oscuridad.;Colpisce il contrasto tra luce e ombra.=Impacta el contraste entre luz y sombra.;Il pittore rinuncia all'idealizzazione.=El pintor renuncia a la idealización.;Usava modelli presi dalla strada.=Usaba modelos tomados de la calle.","Caravaggio dipinse tele in cui la luce taglia l'oscurità come un raggio improvviso. Colpisce il contrasto tra luce e ombra, ma anche il realismo: il pittore rinuncia all'idealizzazione e usa modelli presi dalla strada. Molti committenti rifiutarono le sue pale d'altare, giudicandole troppo crude, ma la sua influenza fu enorme.","Caravaggio pintó lienzos en los que la luz corta la oscuridad como un rayo repentino. Impacta el contraste entre luz y sombra, pero también el realismo: el pintor renuncia a la idealización y usa modelos tomados de la calle. Muchos comitentes rechazaron sus retablos, juzgándolos demasiado crudos, pero su influencia fue enorme.","¿Qué corta la oscuridad?|La luz|El color|El agua|0#¿De dónde sacaba los modelos?|De la calle|De palacios|De libros|0","La luce ___ l'oscurità.|taglia|tagliare|tagliato#Colpisce il ___ tra luce e ombra.|contrasto|contrasti|contrastare","El claroscuro=Il chiaroscuro#El lienzo=La tela"],
["Verga y el verismo","il verismo=el verismo;l'impersonalità=la impersonalidad;i vinti=los vencidos;il progresso=el progreso;la miseria=la miseria;la Sicilia=Sicilia;il narratore=el narrador;il pescatore=el pescador","Giovanni Verga (1840-1922) fue el máximo representante del verismo italiano. En «I Malavoglia» (1881) retrata a una familia de pescadores sicilianos derrotada por el progreso: el «ciclo dei vinti». Su técnica: la impersonalidad y la «regressione» del narrador al nivel del pueblo. Para comentar: «Il narratore scompare dietro…», «Emerge il tema dei vinti».","Verga fu il maggiore esponente del verismo.=Verga fue el máximo exponente del verismo.;Il narratore scompare dietro i personaggi.=El narrador desaparece detrás de los personajes.;Emerge il tema dei vinti.=Emerge el tema de los vencidos.;I Malavoglia sono una famiglia di pescatori.=Los Malavoglia son una familia de pescadores.","Verga, maggiore esponente del verismo, racconta nei Malavoglia la storia di una famiglia di pescatori siciliani sconfitta dal progresso. Grazie all'impersonalità, il narratore scompare dietro i personaggi e adotta la mentalità del popolo. Emerge così il tema dei vinti, destinati a soccombere senza che l'autore li giudichi.","Verga, máximo exponente del verismo, cuenta en I Malavoglia la historia de una familia de pescadores sicilianos derrotada por el progreso. Gracias a la impersonalidad, el narrador desaparece detrás de los personajes y adopta la mentalidad del pueblo. Emerge así el tema de los vencidos, destinados a sucumbir sin que el autor los juzgue.","¿Quiénes son los Malavoglia?|Una familia de pescadores|Nobles|Soldados|0#¿Qué técnica usa Verga?|La impersonalidad|La rima|La épica|0","Il narratore ___ dietro i personaggi.|scompare|scomparire|scomparso#Emerge il tema dei ___.|vinti|vinto|vincere","El verismo=Il verismo#Los vencidos=I vinti"],
["Ungaretti y la poesía esencial","l'essenzialità=la esencialidad;il verso libero=el verso libre;la parola=la palabra;il silenzio=el silencio;la guerra=la guerra;la trincea=la trinchera;l'ermetismo=el hermetismo;la sintesi=la síntesis","Giuseppe Ungaretti (1888-1970) reduce la poesía a su esencia: versos breves, palabras desnudas y silencios. En «L'allegria» recoge su experiencia en las trincheras de la Primera Guerra Mundial. Es uno de los maestros del hermetismo. Para comentar: «La parola è scarna», «Il silenzio pesa», «Il verso si riduce all'essenziale».","La parola è scarna ed essenziale.=La palabra es escueta y esencial.;Il silenzio pesa quanto il verso.=El silencio pesa tanto como el verso.;Il poeta racconta la trincea.=El poeta cuenta la trinchera.;Il verso si riduce all'essenziale.=El verso se reduce a lo esencial.","Ungaretti ridusse la poesia all'essenziale: versi brevissimi, parole scarne e silenzi che pesano quanto le parole. Nell'Allegria racconta l'esperienza della trincea e della guerra, con un linguaggio privo di retorica. Il suo stile influenzò l'ermetismo e mostrò che pochi segni possono dire molto, se scelti con precisione.","Ungaretti redujo la poesía a lo esencial: versos brevísimos, palabras escuetas y silencios que pesan tanto como las palabras. En L'allegria cuenta la experiencia de la trinchera y de la guerra, con un lenguaje sin retórica. Su estilo influyó en el hermetismo y mostró que pocos signos pueden decir mucho, si se eligen con precisión.","¿Cómo son sus versos?|Brevísimos|Larguísimos|Rimados|0#¿Qué cuenta en L'allegria?|La experiencia de la trinchera|Un viaje|Una boda|0","La parola è ___ ed essenziale.|scarna|scarno|scarni#Il verso si ___ all'essenziale.|riduce|ridurre|ridotto","El verso libre=Il verso libero#El silencio=Il silenzio"],
["Calvino y las lecciones americanas","la leggerezza=la ligereza;la rapidità=la rapidez;l'esattezza=la exactitud;la visibilità=la visibilidad;la molteplicità=la multiplicidad;il millennio=el milenio;la proposta=la propuesta;la letteratura=la literatura","Italo Calvino preparó para el nuevo milenio seis «proposte» o lezioni americane: leggerezza, rapidità, esattezza, visibilità, molteplicità (la sexta, coerenza, quedó sin escribir). La «leggerezza» no es superficialidad, sino precisión que quita peso. Para comentar: «Calvino sostiene che…», «Ne risulta una letteratura…».","Calvino sostiene che la leggerezza non è superficialità.=Calvino sostiene que la ligereza no es superficialidad.;L'esattezza richiede un linguaggio preciso.=La exactitud requiere un lenguaje preciso.;La rapidità è un valore narrativo.=La rapidez es un valor narrativo.;La molteplicità apre molte prospettive.=La multiplicidad abre muchas perspectivas.","Nelle Lezioni americane Calvino sostiene che la leggerezza non è superficialità, ma precisione che toglie peso alle cose. L'esattezza richiede un linguaggio preciso, la rapidità è un valore narrativo e la molteplicità apre molte prospettive. Ne risulta una letteratura agile e ricca, pensata per il nuovo millennio.","En las Lezioni americane Calvino sostiene que la ligereza no es superficialidad, sino precisión que quita peso a las cosas. La exactitud requiere un lenguaje preciso, la rapidez es un valor narrativo y la multiplicidad abre muchas perspectivas. Resulta una literatura ágil y rica, pensada para el nuevo milenio.","¿Qué no es la ligereza?|Superficialidad|Precisión|Arte|0#¿Qué abre la multiplicidad?|Muchas perspectivas|Una sola|Silencio|0","La leggerezza non è ___.|superficialità|superficiale|superficialmente#L'esattezza richiede un linguaggio ___.|preciso|precisione|precisare","La ligereza=La leggerezza#La exactitud=L'esattezza"],
["Natalia Ginzburg y la prosa cotidiana","il lessico famigliare=el léxico familiar;la famiglia=la familia;la prosa=la prosa;la semplicità=la sencillez;la memoria=la memoria;la frase=la frase;l'ironia=la ironía;il dialogo=el diálogo","Natalia Ginzburg (1916-1991) escribió «Lessico famigliare» (1963), memoria de su familia a través de las frases y apodos que se repetían en casa. Su prosa, sencilla y sin adornos, esconde ironía y ternura. Para comentar: «La frase è asciutta», «Emerge un ritratto corale», «La memoria passa attraverso le parole».","La frase è asciutta e precisa.=La frase es seca y precisa.;Emerge un ritratto corale della famiglia.=Emerge un retrato coral de la familia.;La memoria passa attraverso le parole.=La memoria pasa a través de las palabras.;L'ironia nasce dalla semplicità.=La ironía nace de la sencillez.","In Lessico famigliare Natalia Ginzburg ricostruisce la propria famiglia attraverso le frasi e i modi di dire che si ripetevano in casa. La prosa è asciutta e priva di orpelli, ma nasconde ironia e tenerezza. Emerge un ritratto corale: la memoria non passa per grandi eventi, bensì attraverso le parole di ogni giorno.","En Lessico famigliare Natalia Ginzburg reconstruye su propia familia a través de las frases y los dichos que se repetían en casa. La prosa es seca y sin adornos, pero esconde ironía y ternura. Emerge un retrato coral: la memoria no pasa por grandes acontecimientos, sino a través de las palabras de cada día.","¿Cómo reconstruye la familia?|A través de frases y dichos|Con fotos|Con cartas|0#¿Cómo es su prosa?|Seca y sin adornos|Barroca|Poética|0","La prosa è ___ e priva di orpelli.|asciutta|asciutto|asciutti#La memoria passa ___ le parole.|attraverso|dentro|sotto","El léxico familiar=Il lessico famigliare#La sencillez=La semplicità"],
["Semiótica y teoría de los signos","il segno=el signo;il significante=el significante;il significato=el significado;il codice=el código;l'interpretazione=la interpretación;l'opera aperta=la obra abierta;il lettore modello=el lector modelo;la semiotica=la semiótica","La semiótica estudia los signos y cómo producen sentido. Un signo une significante (forma) y significado (concepto). Umberto Eco, en «Opera aperta» y «Trattato di semiotica generale», sostiene que un texto admite varias lecturas y propone la idea de «lettore modello». Para exponer: «Un segno rimanda a…», «L'interpretazione dipende da…».","Un segno rimanda a un significato.=Un signo remite a un significado.;L'interpretazione dipende dal codice.=La interpretación depende del código.;Eco parla di opera aperta.=Eco habla de obra abierta.;Il testo prevede un lettore modello.=El texto prevé un lector modelo.","La semiotica studia i segni e il modo in cui producono senso. Un segno unisce un significante e un significato, e la sua interpretazione dipende dal codice condiviso. Eco, parlando di opera aperta, sostiene che un testo ammette più letture e prevede un lettore modello, capace di collaborare con l'autore nel costruire il significato.","La semiótica estudia los signos y el modo en que producen sentido. Un signo une un significante y un significado, y su interpretación depende del código compartido. Eco, hablando de obra abierta, sostiene que un texto admite varias lecturas y prevé un lector modelo, capaz de colaborar con el autor en la construcción del significado.","¿Qué estudia la semiótica?|Los signos|Los números|Las plantas|0#¿Qué admite un texto abierto?|Varias lecturas|Una sola lectura|Ninguna|0","Un segno ___ a un significato.|rimanda|rimandare|rimandato#L'interpretazione ___ dal codice.|dipende|dipendere|dipeso","El signo=Il segno#El significado=Il significato"],
["Fellini y el cine onírico","il regista=el director;il sogno=el sueño;il circo=el circo;la fantasia=la fantasía;il ricordo=el recuerdo;il grottesco=lo grotesco;la sceneggiatura=el guion;l'immaginario=el imaginario","Federico Fellini (1920-1993) mezcla realidad, recuerdo y sueño: «La dolce vita» (1960), «8½» (1963), «Amarcord» (1973). Su estilo es grotesco, visionario y circense. Para reseñar: «Il film oscilla tra…», «La regia costruisce un mondo onirico», «Il ricordo si trasforma in fantasia».","Il film oscilla tra realtà e sogno.=La película oscila entre realidad y sueño.;La regia costruisce un mondo onirico.=La dirección construye un mundo onírico.;Il ricordo si trasforma in fantasia.=El recuerdo se transforma en fantasía.;Amarcord è del 1973.=Amarcord es de 1973.","Fellini mescola realtà, ricordo e sogno: in 8½ il film oscilla tra la vita del regista e le sue visioni, mentre in Amarcord il ricordo di un paese di provincia si trasforma in fantasia. La regia costruisce un mondo onirico, tra il grottesco e il circo, dove ogni scena sembra uscire da una memoria deformata.","Fellini mezcla realidad, recuerdo y sueño: en 8½ la película oscila entre la vida del director y sus visiones, mientras que en Amarcord el recuerdo de un pueblo de provincia se transforma en fantasía. La dirección construye un mundo onírico, entre lo grotesco y el circo, donde cada escena parece salir de una memoria deformada.","¿Qué mezcla Fellini?|Realidad, recuerdo y sueño|Solo realidad|Solo ciencia|0#¿Qué evoca su mundo onírico?|El circo y lo grotesco|La oficina|La guerra|0","Il film ___ tra realtà e sogno.|oscilla|oscillare|oscillato#La regia ___ un mondo onirico.|costruisce|costruire|costruito","El sueño=Il sogno#El recuerdo=Il ricordo"],
["Giordano Bruno y el libre pensamiento","il libero pensiero=el libre pensamiento;l'infinito=el infinito;i mondi=los mundos;l'eresia=la herejía;l'Inquisizione=la Inquisición;il rogo=la hoguera;il filosofo=el filósofo;la coerenza=la coherencia","Giordano Bruno (1548-1600) defendió la existencia de infinitos mundos en «De l'infinito, universo e mondi» y se negó a retractarse ante la Inquisición: fue quemado en la hoguera en Roma en 1600. Es símbolo del libre pensamiento. Para exponer: «Si rifiutò di abiurare», «Fu condannato per eresia», «Divenne un simbolo di…».","Bruno sostenne l'esistenza di infiniti mondi.=Bruno sostuvo la existencia de infinitos mundos.;Si rifiutò di abiurare.=Se negó a abjurar.;Fu condannato per eresia.=Fue condenado por herejía.;Divenne un simbolo del libero pensiero.=Se convirtió en un símbolo del libre pensamiento.","Giordano Bruno sostenne l'esistenza di infiniti mondi nel De l'infinito, universo e mondi e, davanti all'Inquisizione, si rifiutò di abiurare. Fu condannato per eresia e arso sul rogo a Roma nel 1600. Per la sua coerenza, divenne un simbolo del libero pensiero e della libertà di ricerca.","Giordano Bruno sostuvo la existencia de infinitos mundos en De l'infinito, universo e mondi y, ante la Inquisición, se negó a abjurar. Fue condenado por herejía y quemado en la hoguera en Roma en 1600. Por su coherencia, se convirtió en un símbolo del libre pensamiento y de la libertad de investigación.","¿Qué sostuvo Bruno?|Infinitos mundos|Un solo mundo|Un universo pequeño|0#¿Por qué es símbolo?|Por su coherencia|Por su riqueza|Por su poder|0","Si ___ di abiurare.|rifiutò|rifiutare|rifiutato#Fu condannato ___ eresia.|per|da|di","La herejía=L'eresia#La hoguera=Il rogo"],
["Beccaria y el derecho penal humanitario","il diritto penale=el derecho penal;la tortura=la tortura;la pena di morte=la pena de muerte;la proporzionalità=la proporcionalidad;l'illuminismo=la Ilustración;il reato=el delito;la certezza=la certeza;la prevenzione=la prevención","Cesare Beccaria (1738-1794) publicó «Dei delitti e delle pene» (1764): defiende que las penas deben ser proporcionadas, ciertas y rápidas, y se opone a la tortura y a la pena de muerte. Influyó en Europa y América. Para exponer: «Beccaria sostiene che…», «La pena deve essere proporzionata al reato».","Beccaria si oppone alla tortura.=Beccaria se opone a la tortura.;La pena deve essere proporzionata al reato.=La pena debe ser proporcionada al delito.;La certezza della pena previene i reati.=La certeza de la pena previene los delitos.;L'opera influenzò l'Illuminismo europeo.=La obra influyó en la Ilustración europea.","Nel 1764 Beccaria pubblicò Dei delitti e delle pene, in cui sostiene che la pena deve essere proporzionata al reato, certa e rapida. Si oppone alla tortura e alla pena di morte, convinto che la prevenzione sia più efficace della crudeltà. L'opera influenzò profondamente l'Illuminismo europeo e le riforme penali del Settecento.","En 1764 Beccaria publicó Dei delitti e delle pene, en el que sostiene que la pena debe ser proporcionada al delito, cierta y rápida. Se opone a la tortura y a la pena de muerte, convencido de que la prevención es más eficaz que la crueldad. La obra influyó profundamente en la Ilustración europea y en las reformas penales del siglo XVIII.","¿A qué se opone Beccaria?|A la tortura|A la prevención|A la proporcionalidad|0#¿Cómo debe ser la pena?|Proporcionada y cierta|Cruel|Secreta|0","La pena deve essere ___ al reato.|proporzionata|proporzione|proporzionare#Beccaria si ___ alla tortura.|oppone|opporre|opposto","La tortura=La tortura#El delito=Il reato"],
