["Nominalización y estilo formal","la realizzazione=la realización;lo svolgimento=el desarrollo;l'adozione=la adopción;la valutazione=la evaluación;il miglioramento=la mejora;l'esecuzione=la ejecución;l'attuazione=la puesta en marcha;la presentazione=la presentación","En estilo formal los verbos se sustituyen por nombres: «Abbiamo deciso di migliorare» → «Abbiamo deciso il miglioramento»; «quando finiremo» → «al termine di». Otras fórmulas: «in seguito a», «a seguito di», «in relazione a», «ai fini di».","Il miglioramento del servizio è prioritario.=La mejora del servicio es prioritaria.;In seguito alla riunione, abbiamo deciso.=Tras la reunión, hemos decidido.;La valutazione sarà svolta entro giugno.=La evaluación se realizará antes de junio.;Ai fini della selezione, serve il curriculum.=A efectos de la selección, hace falta el currículum.","A seguito della riunione, la direzione ha approvato l'adozione di un nuovo sistema. La realizzazione del progetto avverrà in tre fasi e la valutazione dei risultati sarà svolta entro giugno. Il miglioramento del servizio è la priorità assoluta dell'azienda.","Tras la reunión, la dirección ha aprobado la adopción de un nuevo sistema. La realización del proyecto se hará en tres fases y la evaluación de los resultados se llevará a cabo antes de junio. La mejora del servicio es la prioridad absoluta de la empresa.","¿Cuántas fases tendrá el proyecto?|Tres|Dos|Cinco|0#¿Cuál es la prioridad?|La mejora del servicio|El precio|La rapidez|0","___ della riunione, abbiamo deciso.|A seguito|Dentro|Grazie#Il ___ del servizio è prioritario.|miglioramento|migliorare|migliore","La evaluación=La valutazione#Tras la reunión=In seguito alla riunione"],
["Relativos indefinidos","chi=quien;quanto=lo que;ciò che=lo que;colui che=aquel que;chiunque=cualquiera que;ovunque=dondequiera;comunque=como sea;qualunque=cualquier","«Chi» = el que / quien (sin antecedente): chi studia impara. «Ciò che / quello che» = lo que. «Chiunque», «ovunque» y «qualunque» llevan congiuntivo: chiunque arrivi, sarà benvenuto. «Colui che» es formal.","Chi studia, impara.=Quien estudia, aprende.;Ciò che dici è importante.=Lo que dices es importante.;Chiunque arrivi sarà benvenuto.=Quien llegue será bienvenido.;Ovunque vada, mi sento a casa.=Dondequiera que vaya, me siento como en casa.","Ho un motto: chi non rischia, non vince. Ciò che conta è provare, qualunque sia il risultato. Chiunque mi conosca sa che non mi arrendo mai. Ovunque io vada, porto con me questa regola.","Tengo un lema: quien no arriesga, no gana. Lo que cuenta es intentarlo, sea cual sea el resultado. Cualquiera que me conozca sabe que nunca me rindo. Dondequiera que vaya, llevo conmigo esta regla.","¿Cuál es su lema?|Quien no arriesga no gana|Más vale tarde que nunca|Es mejor esperar|0#¿Qué lleva siempre consigo?|Esta regla|Un libro|Un mapa|0","___ non rischia, non vince.|Chi|Che|Cui#___ arrivi sarà benvenuto.|Chiunque|Qualcuno|Ciascuno","Lo que cuenta=Ciò che conta#Dondequiera que vaya=Ovunque io vada"],
["Probabilidad y suposición","forse=quizá;probabilmente=probablemente;dovrebbe=debería;potrebbe=podría;sarà=será;deve essere=debe de ser;sembra che=parece que;a quanto pare=al parecer","Para suposiciones: futuro (sarà stanco = debe de estar cansado), dovere (deve essere tardi), condizionale (potrebbe essere vero) y «forse / probabilmente». «Sembra che + congiuntivo»: sembra che sia partito.","Sarà stanco.=Debe de estar cansado.;Deve essere tardi.=Debe de ser tarde.;Potrebbe essere vero.=Podría ser verdad.;Sembra che abbia perso il treno.=Parece que ha perdido el tren.","Marco non risponde al telefono. Sarà in riunione, o forse ha dimenticato il cellulare. Sembra che oggi abbia molto da fare. Potrebbe essere anche in viaggio. A quanto pare, dovremo aspettare fino a stasera per avere notizie.","Marco no contesta al teléfono. Estará en una reunión, o quizá ha olvidado el móvil. Parece que hoy tiene mucho que hacer. También podría estar de viaje. Al parecer, tendremos que esperar hasta esta noche para tener noticias.","¿Qué hace Marco?|No contesta|Contesta rápido|Llega pronto|0#¿Cuándo tendrán noticias?|Esta noche|Mañana|Nunca|0","___ in riunione.|Sarà|Era|Fosse#Sembra che ___ perso il treno.|abbia|ha|aveva","Debe de ser tarde=Deve essere tardi#Parece que ha llegado=Sembra che sia arrivato"],
["Mercado laboral y economía","il mercato del lavoro=el mercado laboral;l'assunzione=la contratación;il licenziamento=el despido;la retribuzione=la retribución;il lavoro autonomo=el trabajo autónomo;la competenza=la competencia;la formazione=la formación;il contratto a tempo indeterminato=el contrato indefinido","Para hablar de economía y trabajo: «È in aumento / in calo» (aumenta / baja), «registrare una crescita», «secondo i dati». Contraste con «mentre» y «a differenza di». Cifras: il tasso di disoccupazione è sceso al 7%.","Il tasso di disoccupazione è in calo.=La tasa de desempleo está bajando.;Cresce il lavoro autonomo.=Crece el trabajo autónomo.;Secondo i dati, le assunzioni aumentano.=Según los datos, las contrataciones aumentan.;Molti cercano un contratto a tempo indeterminato.=Muchos buscan un contrato indefinido.","Secondo gli ultimi dati, il tasso di disoccupazione è in calo, mentre cresce il lavoro autonomo. Molti giovani cercano un contratto a tempo indeterminato, ma le aziende investono soprattutto nella formazione. Le competenze digitali sono sempre più richieste dal mercato del lavoro.","Según los últimos datos, la tasa de desempleo está bajando, mientras crece el trabajo autónomo. Muchos jóvenes buscan un contrato indefinido, pero las empresas invierten sobre todo en formación. Las competencias digitales son cada vez más demandadas por el mercado laboral.","¿Qué crece?|El trabajo autónomo|El desempleo|Los despidos|0#¿Qué competencias se piden más?|Las digitales|Las manuales|Las artísticas|0","Il tasso di disoccupazione è in ___.|calo|calare|calato#Cresce il lavoro ___.|autonomo|autonoma|autonomi","El mercado laboral=Il mercato del lavoro#Está bajando=È in calo"],
["Tecnología y privacidad","la privacy=la privacidad;i dati personali=los datos personales;la sorveglianza=la vigilancia;la sicurezza=la seguridad;l'algoritmo=el algoritmo;il consenso=el consentimiento;proteggere=proteger;il rischio=el riesgo","Para argumentar: «Da un lato… dall'altro…», «Il rischio è che + congiuntivo», «È fondamentale che + congiuntivo». Frases: «Bisogna tutelare i dati personali». «Tutelare» = proteger legalmente.","È fondamentale che i dati siano protetti.=Es fundamental que los datos estén protegidos.;Il rischio è che nessuno legga le condizioni.=El riesgo es que nadie lea las condiciones.;Bisogna tutelare la privacy.=Hay que proteger la privacidad.;Do il consenso solo se necessario.=Doy el consentimiento solo si es necesario.","Da un lato la tecnologia ci semplifica la vita, dall'altro l'uso degli algoritmi mette a rischio la nostra privacy. Il rischio è che nessuno legga le condizioni prima di dare il consenso. È fondamentale che le aziende proteggano i dati personali e che gli utenti siano più consapevoli.","Por un lado la tecnología nos simplifica la vida, por otro el uso de algoritmos pone en riesgo nuestra privacidad. El riesgo es que nadie lea las condiciones antes de dar el consentimiento. Es fundamental que las empresas protejan los datos personales y que los usuarios sean más conscientes.","¿Qué pone en riesgo la privacidad?|Los algoritmos|Los libros|Los coches|0#¿Qué es fundamental?|Proteger los datos|Usar más redes|Cambiar de móvil|0","È fondamentale che i dati ___ protetti.|siano|sono|saranno#Il ___ è che nessuno legga.|rischio|rischiare|rischioso","Los datos personales=I dati personali#La privacidad=La privacy"],
["Ciencia y salud pública","la ricerca=la investigación;lo studio=el estudio;il vaccino=la vacuna;la scoperta=el descubrimiento;gli scienziati=los científicos;l'epidemia=la epidemia;la salute pubblica=la salud pública;sperimentale=experimental","Para informar sobre estudios: «Secondo uno studio…», «I ricercatori hanno scoperto che…», «Risulta che…». El condizionale giornalistico expresa lo no confirmado: «Il farmaco sarebbe efficace» (parece que sería eficaz, sin confirmar).","Secondo uno studio, il farmaco è efficace.=Según un estudio, el fármaco es eficaz.;I ricercatori hanno scoperto un nuovo metodo.=Los investigadores han descubierto un nuevo método.;Il vaccino sarebbe già disponibile.=La vacuna estaría ya disponible (sin confirmar).;La prevenzione tutela la salute pubblica.=La prevención protege la salud pública.","Secondo uno studio pubblicato ieri, un nuovo metodo di diagnosi sarebbe più veloce e meno costoso. I ricercatori hanno scoperto che potrebbe ridurre i tempi di attesa negli ospedali. Gli scienziati però avvertono che servono altri test prima di usarlo in modo generale.","Según un estudio publicado ayer, un nuevo método de diagnóstico sería más rápido y menos costoso. Los investigadores han descubierto que podría reducir los tiempos de espera en los hospitales. Los científicos, sin embargo, advierten de que hacen falta más pruebas antes de usarlo de forma general.","¿Qué ventaja tendría el método?|Reducir tiempos de espera|Curar todo|Ser gratis|0#¿Qué advierten los científicos?|Hacen falta más pruebas|Ya es seguro|Es peligroso|0","___ uno studio, il farmaco è efficace.|Secondo|Dopo|Durante#I ricercatori hanno ___ un metodo.|scoperto|scopri|scoprire","La investigación=La ricerca#Según un estudio=Secondo uno studio"],
["Literatura y lectura","il romanzo=la novela;l'autore=el autor;il protagonista=el protagonista;la trama=la trama;il genere=el género;la recensione=la reseña;pubblicare=publicar;il capitolo=el capítulo","Para reseñar un libro: «Il romanzo racconta…» (presente para la trama), «L'autore descrive…», «Mi ha colpito il modo in cui…». Usa el passato prossimo para tu experiencia de lectura. «Il modo in cui» = la manera en que.","Il romanzo racconta la storia di una famiglia.=La novela cuenta la historia de una familia.;L'autore descrive molto bene i personaggi.=El autor describe muy bien a los personajes.;Mi ha colpito il modo in cui scrive.=Me ha impactado la manera en que escribe.;Ho letto il libro in due giorni.=He leído el libro en dos días.","Ho appena finito un romanzo che racconta la storia di una famiglia siciliana. L'autore descrive molto bene i personaggi e mi ha colpito il modo in cui scrive i dialoghi. Il protagonista cresce capitolo dopo capitolo. L'ho letto in due giorni e lo consiglio a tutti.","Acabo de terminar una novela que cuenta la historia de una familia siciliana. El autor describe muy bien a los personajes y me ha impactado la manera en que escribe los diálogos. El protagonista crece capítulo a capítulo. Lo he leído en dos días y se lo recomiendo a todos.","¿De quién habla la novela?|De una familia siciliana|De un detective|De un viaje|0#¿Cuánto tardó en leerlo?|Dos días|Una semana|Un mes|0","Il romanzo ___ la storia di una famiglia.|racconta|racconto|raccontare#Mi ha colpito il ___ in cui scrive.|modo|motivo|mondo","La trama=La trama#El protagonista=Il protagonista"],
["Instituciones y ciudadanía","le istituzioni=las instituciones;il Parlamento=el Parlamento;il governo=el gobierno;il cittadino=el ciudadano;il diritto=el derecho;il dovere=el deber;votare=votar;la Costituzione=la Constitución","Para hablar de instituciones: «Secondo la Costituzione…», «Ogni cittadino ha il diritto di…», «Il Parlamento approva le leggi». Contraste: «diritti e doveri». Pasiva con «venire»: la legge viene approvata dal Parlamento.","Ogni cittadino ha diritto di votare.=Cada ciudadano tiene derecho a votar.;Il Parlamento approva le leggi.=El Parlamento aprueba las leyes.;La Costituzione tutela i diritti fondamentali.=La Constitución protege los derechos fundamentales.;Ai diritti corrispondono dei doveri.=A los derechos corresponden deberes.","In Italia la Costituzione è la legge fondamentale dello Stato. Il Parlamento approva le leggi e il governo le applica. Ogni cittadino maggiorenne ha il diritto di votare, ma ha anche dei doveri verso la comunità. Conoscere le istituzioni è il primo passo per partecipare.","En Italia la Constitución es la ley fundamental del Estado. El Parlamento aprueba las leyes y el gobierno las aplica. Cada ciudadano mayor de edad tiene derecho a votar, pero también tiene deberes hacia la comunidad. Conocer las instituciones es el primer paso para participar.","¿Quién aprueba las leyes?|El Parlamento|El gobierno|Los jueces|0#¿Cuál es la ley fundamental?|La Constitución|El código civil|La ley electoral|0","Il Parlamento ___ le leggi.|approva|approvano|approvare#Ogni cittadino ha il ___ di votare.|diritto|dovere|governo","La Constitución=La Costituzione#Los derechos y los deberes=I diritti e i doveri"],
["Condiciones en registro formal","qualora=en caso de que;a condizione che=a condición de que;nel caso in cui=en el caso de que;purché=siempre que;salvo che=salvo que;fatto salvo=sin perjuicio de;in assenza di=a falta de;laddove=allí donde","En registro formal las condiciones se expresan con qualora, nel caso in cui, a condizione che, purché y salvo che + congiuntivo: qualora fosse necessario, vi contatteremo. «Laddove» = allí donde / si, en textos oficiales.","Qualora fosse necessario, vi contatteremo.=En caso de que fuera necesario, nos pondremos en contacto con ustedes.;Nel caso in cui piova, l'evento sarà rinviato.=En caso de que llueva, el evento se aplazará.;Firmo a condizione che i termini siano chiari.=Firmo a condición de que los términos sean claros.;Il pagamento è dovuto, salvo che sia diversamente indicato.=El pago es debido, salvo que se indique lo contrario.","Gentili clienti, qualora il servizio fosse interrotto, vi invitiamo a contattarci al numero indicato. Nel caso in cui il problema persista, provvederemo a un rimborso, a condizione che la richiesta venga inviata entro trenta giorni. Salvo che sia diversamente indicato, il contratto si rinnova automaticamente.","Estimados clientes, en caso de que el servicio se interrumpiera, les invitamos a contactarnos en el número indicado. En el caso de que el problema persista, procederemos a un reembolso, a condición de que la solicitud se envíe dentro de treinta días. Salvo que se indique lo contrario, el contrato se renueva automáticamente.","¿En cuánto tiempo se debe pedir el reembolso?|Treinta días|Diez días|Un año|0#¿Qué pasa con el contrato?|Se renueva automáticamente|Se cancela|Se suspende|0","___ il servizio fosse interrotto, vi contatteremo.|Qualora|Nonostante|Perché#Firmo a condizione che i termini ___ chiari.|siano|sono|saranno","En caso de que sea necesario=Qualora fosse necessario#A condición de que=A condizione che"],
["Discurso indirecto formal","ha dichiarato che=declaró que;ha sostenuto che=sostuvo que;ha ammesso che=admitió que;ha negato che=negó que;ha suggerito di=sugirió que;ha raccomandato che=recomendó que;ha precisato che=precisó que;secondo quanto riferito=según lo informado","En el discurso indirecto formal los verbos declarativos pueden pedir congiuntivo (ha negato che fosse vero) o indicativo (ha dichiarato che sarebbe partito). Los tiempos retroceden y los deícticos cambian: oggi → quel giorno, domani → il giorno dopo.","Ha dichiarato che sarebbe partito il giorno dopo.=Declaró que se marcharía al día siguiente.;Ha negato che fosse vero.=Negó que fuera verdad.;Ha suggerito di rimandare la riunione.=Sugirió aplazar la reunión.;Ha ammesso di aver sbagliato.=Admitió haberse equivocado.","Durante la conferenza stampa il ministro ha dichiarato che il progetto sarebbe partito il mese successivo. Ha negato che ci fossero ritardi e ha ammesso di aver sottovalutato alcuni costi. Ha precisato che i fondi erano già stati approvati e ha suggerito di attendere i risultati.","Durante la rueda de prensa el ministro declaró que el proyecto comenzaría el mes siguiente. Negó que hubiera retrasos y admitió haber subestimado algunos costes. Precisó que los fondos ya habían sido aprobados y sugirió esperar a los resultados.","¿Cuándo comenzaría el proyecto?|El mes siguiente|Esta semana|El año próximo|0#¿Qué admitió el ministro?|Haber subestimado costes|Un retraso|Un error legal|0","Ha negato che ___ vero.|fosse|era|sarà#Ha ammesso ___ aver sbagliato.|di|che|a","Declaró que=Ha dichiarato che#Sugirió aplazar=Ha suggerito di rimandare"],
["Matices y cautela","a quanto pare=al parecer;sembrerebbe che=parecería que;pare che=parece que;a mio avviso=a mi juicio;per lo più=en su mayoría;in genere=en general;tutto sommato=en definitiva;di fatto=de hecho","Para matizar o expresar cautela: «sembrerebbe che + congiuntivo», «pare che + congiuntivo», «a quanto pare» (al parecer). El condizionale periodístico señala duda: il ministro sarebbe partito (se dice que habría partido).","Sembrerebbe che il prezzo sia salito.=Parecería que el precio ha subido.;A quanto pare, il treno è in ritardo.=Al parecer, el tren va con retraso.;Il ministro sarebbe partito ieri.=El ministro habría partido ayer (según fuentes).;Tutto sommato, è stata una buona scelta.=En definitiva, ha sido una buena elección.","Sembrerebbe che l'azienda stia per chiudere uno stabilimento. A quanto pare, centinaia di lavoratori sarebbero a rischio, ma il direttore smentisce. In genere queste voci arrivano prima dell'annuncio ufficiale, perciò tutto sommato conviene restare cauti e aspettare conferme.","Parecería que la empresa va a cerrar una fábrica. Al parecer, cientos de trabajadores estarían en riesgo, pero el director lo desmiente. En general estos rumores llegan antes del anuncio oficial, así que en definitiva conviene ser cautos y esperar confirmaciones.","¿Qué parece que hará la empresa?|Cerrar una fábrica|Abrir una sede|Subir sueldos|0#¿Qué conviene hacer?|Ser cautos|Protestar|Ignorarlo|0","___ che il prezzo sia salito.|Sembrerebbe|Sicuramente|Sempre#___ pare, il treno è in ritardo.|A quanto|Di quanto|In quanto","Al parecer=A quanto pare#En definitiva=Tutto sommato"],
["Prefijos y sufijos","il prefisso=el prefijo;il suffisso=el sufijo;ri-=re- (otra vez);dis-=des-;in- / im-=in- / im-;-mente=-mente;-zione=-ción;-tore=-dor","Los prefijos y sufijos amplían el vocabulario: ri- (rifare), dis- (disfare), in- (impossibile); -zione crea sustantivos (organizzare → organizzazione), -tore agentes (scrivere → scrittore), -mente adverbios (rapido → rapidamente).","Devo rifare il lavoro.=Tengo que rehacer el trabajo.;È impossibile arrivare in tempo.=Es imposible llegar a tiempo.;L'organizzazione è stata perfetta.=La organización ha sido perfecta.;Parla molto rapidamente.=Habla muy rápidamente.","L'organizzazione dell'evento è stata quasi perfetta. Gli organizzatori hanno lavorato rapidamente, ma alcuni ospiti hanno trovato impossibile entrare in tempo. Il direttore ha deciso di rifare l'intera procedura di ingresso e ha ringraziato gli scrittori e i musicisti invitati.","La organización del evento ha sido casi perfecta. Los organizadores trabajaron rápidamente, pero algunos invitados encontraron imposible entrar a tiempo. El director decidió rehacer todo el procedimiento de entrada y agradeció a los escritores y músicos invitados.","¿Qué decidió el director?|Rehacer el procedimiento|Cancelar el evento|Cobrar entrada|0#¿Cómo trabajaron los organizadores?|Rápidamente|Lentamente|Mal|0","Devo ___ il lavoro.|rifare|fare|disfare#In questa situazione è ___ arrivare in tempo: c'è troppo traffico.|impossibile|possibile|probabile","Organización=Organizzazione#Rápidamente=Rapidamente"],
["Crítica de arte contemporáneo","la corrente=la corriente;l'avanguardia=la vanguardia;l'installazione=la instalación;la prospettiva=la perspectiva;il linguaggio=el lenguaje;provocatorio=provocador;il simbolismo=el simbolismo;esporre=exponer","Para analizar una obra: «L'opera si inserisce nella corrente…», «L'artista utilizza un linguaggio…», «Ciò che colpisce è…», «Il messaggio sembra essere…». Usa conectores: tuttavia, in particolare, nel complesso.","L'opera si inserisce nell'avanguardia del Novecento.=La obra se inscribe en la vanguardia del siglo XX.;Ciò che colpisce è l'uso del colore.=Lo que impacta es el uso del color.;Il linguaggio dell'artista è provocatorio.=El lenguaje del artista es provocador.;Nel complesso, la mostra è convincente.=En conjunto, la exposición es convincente.","La mostra espone installazioni di artisti contemporanei. Ciò che colpisce è il linguaggio provocatorio, che usa il simbolismo per criticare il consumismo. In particolare, un'opera con specchi invita il pubblico a riflettere sulla propria immagine. Nel complesso, la mostra è convincente anche se a tratti ripetitiva.","La exposición muestra instalaciones de artistas contemporáneos. Lo que impacta es el lenguaje provocador, que usa el simbolismo para criticar el consumismo. En particular, una obra con espejos invita al público a reflexionar sobre su propia imagen. En conjunto, la exposición es convincente aunque por momentos repetitiva.","¿Qué critican las obras?|El consumismo|La guerra|La política|0#¿Cómo es la exposición en conjunto?|Convincente aunque repetitiva|Aburrida|Perfecta|0","Ciò che ___ è l'uso del colore.|colpisce|colpire|colpito#Nel ___, la mostra è convincente.|complesso|complessi|complessa","La vanguardia=L'avanguardia#Lo que impacta=Ciò che colpisce"],
["Política climática","il riscaldamento globale=el calentamiento global;le emissioni=las emisiones;la transizione=la transición;le rinnovabili=las renovables;l'accordo=el acuerdo;la tassa=el impuesto;ridurre=reducir;l'impegno=el compromiso","Para argumentar: «È indispensabile che + congiuntivo», «Occorre + infinitivo», «Se non si interviene, le conseguenze saranno…». Cifras: il venti per cento, il doppio, la metà. «Per quanto + congiuntivo» = por más que.","Occorre ridurre le emissioni.=Hace falta reducir las emisiones.;È indispensabile che i governi rispettino gli accordi.=Es indispensable que los gobiernos respeten los acuerdos.;Le rinnovabili coprono il trenta per cento.=Las renovables cubren el treinta por ciento.;Per quanto si cerchi, non è facile.=Por más que se intente, no es fácil.","Per ridurre il riscaldamento globale occorre una vera transizione energetica. È indispensabile che i governi rispettino gli accordi e che le emissioni diminuiscano entro il 2030. Le rinnovabili coprono già il trenta per cento dell'energia, ma, per quanto si faccia, serve un impegno molto più forte.","Para reducir el calentamiento global hace falta una auténtica transición energética. Es indispensable que los gobiernos respeten los acuerdos y que las emisiones disminuyan antes de 2030. Las renovables cubren ya el treinta por ciento de la energía, pero, por más que se haga, hace falta un compromiso mucho más fuerte.","¿Cuánta energía cubren las renovables?|El treinta por ciento|La mitad|El diez por ciento|0#¿Hasta cuándo deben bajar las emisiones?|Hasta 2030|Hasta 2050|Hasta 2025|0","È indispensabile che i governi ___ gli accordi.|rispettino|rispettano|rispetteranno#___ ridurre le emissioni.|Occorre|Occorrono|Occorso","Las emisiones=Le emissioni#La transición=La transizione"],
["Migración y sociedad","l'immigrazione=la inmigración;l'accoglienza=la acogida;l'integrazione=la integración;la cittadinanza=la ciudadanía;la diversità=la diversidad;il pregiudizio=el prejuicio;la convivenza=la convivencia;il dibattito=el debate","Para debatir temas sociales con equilibrio: «Da un lato… dall'altro…», «Non si può negare che + congiuntivo», «È innegabile che…». Evita generalizaciones con «alcuni», «molti», «una parte di». Verbos: favorire, ostacolare, promuovere.","Non si può negare che la diversità arricchisca.=No se puede negar que la diversidad enriquece.;L'integrazione richiede tempo e impegno.=La integración requiere tiempo y esfuerzo.;Bisogna combattere i pregiudizi.=Hay que combatir los prejuicios.;Una parte della popolazione è preoccupata.=Una parte de la población está preocupada.","L'immigrazione è un tema complesso. Da un lato la diversità arricchisce la società, dall'altro una parte della popolazione teme i cambiamenti. Non si può negare che l'integrazione richieda tempo e impegno, ma bisogna combattere i pregiudizi e promuovere una convivenza basata sul rispetto.","La inmigración es un tema complejo. Por un lado la diversidad enriquece la sociedad, por otro una parte de la población teme los cambios. No se puede negar que la integración requiere tiempo y esfuerzo, pero hay que combatir los prejuicios y promover una convivencia basada en el respeto.","¿Qué hay que combatir?|Los prejuicios|La diversidad|La cultura|0#¿En qué debe basarse la convivencia?|En el respeto|En el miedo|En el dinero|0","Non si può negare che l'integrazione ___ tempo.|richieda|richiede|richiederà#Bisogna combattere i ___.|pregiudizi|pregiudizio|giudicare","La convivencia=La convivenza#Los prejuicios=I pregiudizi"],
["Universidad y reformas","la riforma=la reforma;la formazione=la formación;il corso di laurea=el grado;la ricerca=la investigación;la borsa di studio=la beca;l'abbandono scolastico=el abandono escolar;l'accesso=el acceso;il finanziamento=la financiación","Para analizar un sistema educativo: «Il sistema dovrebbe + infinitivo», «Sarebbe opportuno che + congiuntivo imperfetto», «Si tratta di + sustantivo» (se trata de). Proporciones: «uno studente su tre» (uno de cada tres).","Il sistema dovrebbe investire di più nella ricerca.=El sistema debería invertir más en investigación.;Sarebbe opportuno che le borse di studio aumentassero.=Sería oportuno que las becas aumentaran.;Si tratta di un problema serio.=Se trata de un problema serio.;Uno studente su tre abbandona gli studi.=Uno de cada tres estudiantes abandona los estudios.","L'abbandono scolastico è un problema serio: uno studente su tre lascia gli studi prima della laurea. A mio avviso, sarebbe opportuno che lo Stato aumentasse le borse di studio e che migliorasse l'accesso alla formazione. Il sistema dovrebbe investire di più nella ricerca e nei servizi agli studenti.","El abandono escolar es un problema serio: uno de cada tres estudiantes deja los estudios antes de graduarse. A mi juicio, sería oportuno que el Estado aumentara las becas y mejorara el acceso a la formación. El sistema debería invertir más en investigación y en servicios a los estudiantes.","¿Cuántos estudiantes abandonan?|Uno de cada tres|Uno de cada diez|La mitad|0#¿Qué propone aumentar?|Las becas|Las tasas|Los exámenes|0","Sarebbe opportuno che lo Stato ___ le borse.|aumentasse|aumenta|aumenterà#Uno studente ___ tre abbandona.|su|di|per","El abandono escolar=L'abbandono scolastico#La investigación=La ricerca"],
["Inflación y economía doméstica","l'inflazione=la inflación;il potere d'acquisto=el poder adquisitivo;il rincaro=el encarecimiento;il bilancio familiare=el presupuesto familiar;i tassi di interesse=los tipos de interés;tagliare=recortar;i risparmi=los ahorros;il carovita=el coste de la vida","Para explicar tendencias: «è aumentato / diminuito del…», «rispetto all'anno scorso», «il doppio / la metà», «sempre più / sempre meno». Verbos de variación: crescere, calare, salire, scendere.","I prezzi sono aumentati del dieci per cento.=Los precios han subido un diez por ciento.;Il potere d'acquisto è calato.=El poder adquisitivo ha bajado.;Molte famiglie hanno dovuto tagliare le spese.=Muchas familias han tenido que recortar gastos.;Il carovita preoccupa sempre più persone.=El coste de la vida preocupa a cada vez más personas.","A causa dell'inflazione i prezzi sono aumentati del dieci per cento rispetto all'anno scorso e il potere d'acquisto è calato. Molte famiglie hanno dovuto tagliare le spese e usare i risparmi. Il carovita preoccupa sempre più persone, mentre i tassi di interesse continuano a salire.","A causa de la inflación los precios han subido un diez por ciento respecto al año pasado y el poder adquisitivo ha bajado. Muchas familias han tenido que recortar gastos y usar sus ahorros. El coste de la vida preocupa a cada vez más personas, mientras los tipos de interés siguen subiendo.","¿Cuánto subieron los precios?|Un diez por ciento|Un cinco por ciento|Un veinte por ciento|0#¿Qué han tenido que hacer las familias?|Recortar gastos|Viajar|Comprar más|0","I prezzi sono aumentati ___ dieci per cento.|del|al|nel#Molte famiglie hanno dovuto ___ le spese.|tagliare|tagliato|taglio","El poder adquisitivo=Il potere d'acquisto#Los ahorros=I risparmi"],
["Ética e inteligencia artificial","l'intelligenza artificiale=la inteligencia artificial;l'algoritmo=el algoritmo;la trasparenza=la transparencia;la responsabilità=la responsabilidad;il pregiudizio=el sesgo;la regolamentazione=la regulación;sostituire=sustituir;il rischio=el riesgo","Para valorar riesgos y beneficios: «Pur offrendo vantaggi, comporta rischi» (gerundio concesivo), «Benché + congiuntivo», «A meno che non + congiuntivo». «Pur + gerundio» = aunque + verbo.","Pur offrendo vantaggi, comporta dei rischi.=Aun ofreciendo ventajas, conlleva riesgos.;Occorre garantire la trasparenza degli algoritmi.=Hace falta garantizar la transparencia de los algoritmos.;Benché sia utile, può avere dei pregiudizi.=Aunque sea útil, puede tener sesgos.;La regolamentazione è necessaria.=La regulación es necesaria.","L'intelligenza artificiale, pur offrendo grandi vantaggi, comporta dei rischi. Benché sia utile in molti settori, gli algoritmi possono avere dei pregiudizi. Occorre garantire la trasparenza e definire chi ha la responsabilità delle decisioni. La regolamentazione è necessaria, a meno che non si voglia ignorare il problema.","La inteligencia artificial, aun ofreciendo grandes ventajas, conlleva riesgos. Aunque sea útil en muchos sectores, los algoritmos pueden tener sesgos. Hace falta garantizar la transparencia y definir quién tiene la responsabilidad de las decisiones. La regulación es necesaria, a menos que se quiera ignorar el problema.","¿Qué pueden tener los algoritmos?|Sesgos|Emociones|Cuerpo|0#¿Qué hace falta garantizar?|La transparencia|El secreto|La velocidad|0","___ offrendo vantaggi, comporta rischi.|Pur|Benché|Siccome#Occorre garantire la ___.|trasparenza|trasparente|trasparire","La transparencia=La trasparenza#La regulación=La regolamentazione"],
["Discurso persuasivo","persuadere=persuadir;l'argomentazione=la argumentación;la tesi=la tesis;l'esempio=el ejemplo;la retorica=la retórica;convincere=convencer;l'appello=el llamamiento;la conclusione=la conclusión","En un discurso persuasivo se usan preguntas retóricas («Non è forse giusto?»), triplas («più sicuro, più giusto, più umano»), imperativos inclusivos («Costruiamo insieme…») y conectores de cierre («Per tutte queste ragioni…»).","Non è forse giusto cambiare?=¿No es acaso justo cambiar?;Costruiamo insieme un futuro migliore.=Construyamos juntos un futuro mejor.;Per tutte queste ragioni, vi invito a votare sì.=Por todas estas razones, les invito a votar sí.;Più sicuro, più giusto, più umano.=Más seguro, más justo, más humano.","Care cittadine e cari cittadini, non è forse giusto pretendere scuole migliori? La mia tesi è semplice: investire nell'istruzione significa investire nel futuro. Prendiamo un esempio: dove le scuole funzionano, la società è più sicura, più giusta e più umana. Per tutte queste ragioni, vi invito a sostenere la riforma.","Queridas ciudadanas y queridos ciudadanos, ¿no es acaso justo exigir mejores escuelas? Mi tesis es simple: invertir en educación significa invertir en el futuro. Pongamos un ejemplo: donde las escuelas funcionan, la sociedad es más segura, más justa y más humana. Por todas estas razones, les invito a apoyar la reforma.","¿Cuál es la tesis?|Invertir en educación es invertir en el futuro|Cerrar escuelas|Bajar impuestos|0#¿A qué invita al final?|A apoyar la reforma|A protestar|A votar no|0","Non è ___ giusto cambiare?|forse|mai|già#Per tutte queste ___, vi invito.|ragioni|ragione|ragionare","La tesis=La tesi#Un llamamiento=Un appello"],
["Humor e ironía","l'ironia=la ironía;lo scherzo=la broma;sarcastico=sarcástico;il doppio senso=el doble sentido;la battuta=el chiste;prendere in giro=tomar el pelo;fare dell'umorismo=hacer humor;ridere=reír","La ironía italiana usa el tono, la litotes («non è male» = es bastante bueno) y la exageración. Expresiones: «Scherzi!» (¡bromeas!), «Mi stai prendendo in giro?», «Che ironia della sorte!». Cuidado con el sarcasmo en contextos formales.","Mi stai prendendo in giro?=¿Me estás tomando el pelo?;Non è male, il tuo piano.=No está mal tu plan (es bastante bueno).;Che ironia della sorte!=¡Qué ironía del destino!;Era solo uno scherzo.=Era solo una broma.","Ieri Marco ha fatto una battuta sul mio nuovo taglio di capelli: «Non è male, sembri quasi un astronauta!» All'inizio ho pensato che mi stesse prendendo in giro, ma poi ho capito che era solo uno scherzo e abbiamo riso insieme. Che ironia della sorte: ora lo uso come soprannome!","Ayer Marco hizo un chiste sobre mi nuevo corte de pelo: «¡No está mal, pareces casi un astronauta!» Al principio pensé que me estaba tomando el pelo, pero luego entendí que era solo una broma y nos reímos juntos. ¡Qué ironía del destino: ahora lo uso como apodo!","¿Sobre qué hizo Marco el chiste?|Su corte de pelo|Su coche|Su trabajo|0#¿Qué entendió después?|Que era una broma|Que era una ofensa|Que era mentira|0","Mi stai ___ in giro?|prendendo|prendere|preso#Era solo uno ___.|scherzo|scherzare|scherzi","Es una broma=È uno scherzo#¡Qué ironía!=Che ironia!"],
["Artículo de opinión","l'editoriale=el editorial;il commento=el comentario;la tesi=la tesis;sostenere=defender;l'argomento=el argumento;la replica=la réplica;smentire=desmentir;a favore di=a favor de","En un artículo de opinión: planteas una tesis (Sostengo che…), la apoyas con argumentos (Un primo argomento è…), anticipas objeciones (Si potrebbe obiettare che…) y respondes (Tuttavia…). Usa la primera persona del plural inclusiva: dobbiamo riflettere.","Sostengo che la riforma sia necessaria.=Defiendo que la reforma es necesaria.;Si potrebbe obiettare che costi troppo.=Se podría objetar que cuesta demasiado.;Tuttavia, i vantaggi superano gli svantaggi.=Sin embargo, las ventajas superan a las desventajas.;Dobbiamo riflettere sulle conseguenze.=Debemos reflexionar sobre las consecuencias.","Sostengo che il trasporto pubblico gratuito sarebbe un vantaggio per tutti. Un primo argomento è la riduzione del traffico. Si potrebbe obiettare che costi troppo, tuttavia i benefici ambientali superano i costi. Dobbiamo quindi riflettere con coraggio e a favore di una scelta che guardi al futuro.","Defiendo que el transporte público gratuito sería una ventaja para todos. Un primer argumento es la reducción del tráfico. Se podría objetar que cuesta demasiado, sin embargo los beneficios ambientales superan los costes. Debemos por tanto reflexionar con valentía y a favor de una opción que mire al futuro.","¿Qué defiende el autor?|Transporte público gratuito|Más coches|Menos impuestos|0#¿Qué objeción reconoce?|Que cuesta demasiado|Que es lento|Que es peligroso|0","___ che la riforma sia necessaria.|Sostengo|Sosterrei|Sostenere#Si potrebbe ___ che costi troppo.|obiettare|obietto|obiettato","A favor de=A favore di#Un primer argumento=Un primo argomento"],
["Gerundio y participio absolutos","avendo finito=habiendo terminado;essendo arrivato=habiendo llegado;finita la riunione=terminada la reunión;stando così le cose=siendo así las cosas;visto che=visto que;dato che=dado que;una volta finito=una vez terminado;pur essendo=aun siendo","Construcciones absolutas: gerundio compuesto (avendo finito il lavoro, sono uscito), participio absoluto (finita la riunione, siamo usciti) y «una volta + participio». Dan un estilo formal y conciso, y expresan tiempo, causa o concesión.","Avendo finito il lavoro, sono uscito.=Habiendo terminado el trabajo, salí.;Finita la riunione, siamo andati a cena.=Terminada la reunión, fuimos a cenar.;Stando così le cose, non possiamo accettare.=Siendo así las cosas, no podemos aceptar.;Pur essendo stanca, ha continuato.=Aun estando cansada, continuó.","Avendo ricevuto la notizia in ritardo, abbiamo dovuto cambiare programma. Finita la riunione, il direttore ha spiegato le nuove regole. Stando così le cose, nessuno poteva più rimandare la decisione. Pur essendo stanchi, abbiamo lavorato fino a sera.","Habiendo recibido la noticia con retraso, tuvimos que cambiar el programa. Terminada la reunión, el director explicó las nuevas reglas. Siendo así las cosas, nadie podía aplazar ya la decisión. Aun estando cansados, trabajamos hasta la noche.","¿Por qué cambiaron el programa?|Recibieron la noticia tarde|Faltó gente|Hubo lluvia|0#¿Hasta cuándo trabajaron?|Hasta la noche|Hasta mediodía|Hasta mañana|0","___ finito il lavoro, sono uscito.|Avendo|Essendo|Facendo#___ la riunione, siamo usciti.|Finita|Finito|Finendo","Terminada la reunión=Finita la riunione#Siendo así las cosas=Stando così le cose"],
["Perífrasis verbales","stare per=estar a punto de;essere sul punto di=estar a punto de;mettersi a=ponerse a;continuare a=seguir;smettere di=dejar de;finire per=acabar por;tornare a=volver a;riuscire a=lograr","Perífrasis: stare per + infinitivo (inminencia), mettersi a (inicio brusco), continuare a / smettere di, finire per (resultado final: finì per accettare), riuscire a (logro). Ej.: sto per uscire; si è messo a piovere.","Sto per uscire.=Estoy a punto de salir.;Si è messo a piovere.=Se ha puesto a llover.;Ho smesso di fumare.=He dejado de fumar.;Alla fine è riuscito a laurearsi.=Al final consiguió graduarse.","Stavo per rinunciare quando il direttore mi ha chiamato. Si è messo a spiegare il progetto con entusiasmo e ho ricominciato a crederci. Ho continuato a lavorare di notte, ma alla fine sono riuscita a consegnare tutto e ho finito per ricevere un premio.","Estaba a punto de renunciar cuando me llamó el director. Se puso a explicar el proyecto con entusiasmo y volví a creer en él. Seguí trabajando de noche, pero al final logré entregarlo todo y acabé recibiendo un premio.","¿Quién la llamó?|El director|Un amigo|Su madre|0#¿Qué recibió al final?|Un premio|Un despido|Una multa|0","Sto ___ uscire.|per|a|di#Alla fine è ___ a laurearsi.|riuscito|riuscire|riesce","Estoy a punto de salir=Sto per uscire#He dejado de fumar=Ho smesso di fumare"],
["Liderazgo y trabajo en equipo","il team=el equipo;il leader=el líder;delegare=delegar;la fiducia=la confianza;la motivazione=la motivación;la collaborazione=la colaboración;il feedback=el feedback;raggiungere un obiettivo=alcanzar un objetivo","Para hablar de gestión: «Un buon leader sa ascoltare», «Occorre delegare con fiducia», «Il successo dipende dalla collaborazione». Fíjate en «saper + infinitivo» (saber hacer algo) y en «dipendere da». Con «affinché» y «sebbene» se usa el congiuntivo.","Un buon leader sa ascoltare.=Un buen líder sabe escuchar.;Occorre delegare con fiducia.=Hace falta delegar con confianza.;Il successo dipende dalla collaborazione.=El éxito depende de la colaboración.;Il feedback aiuta a migliorare.=El feedback ayuda a mejorar.","Un buon leader sa ascoltare e sa delegare con fiducia. Affinché il team raggiunga gli obiettivi, occorre motivare le persone e dare un feedback costruttivo. Il successo dipende dalla collaborazione: sebbene ognuno abbia il proprio ruolo, nessuno vince da solo.","Un buen líder sabe escuchar y sabe delegar con confianza. Para que el equipo alcance los objetivos, hace falta motivar a las personas y dar un feedback constructivo. El éxito depende de la colaboración: aunque cada uno tenga su papel, nadie gana solo.","¿Qué debe saber hacer un buen líder?|Escuchar y delegar|Mandar|Callar|0#¿De qué depende el éxito?|De la colaboración|De la suerte|Del dinero|0","Un buon leader ___ ascoltare.|sa|può|vuole#___ il team raggiunga gli obiettivi.|Affinché|Perché|Siccome","La confianza=La fiducia#El equipo=Il team"],
["Derecho y justicia","la legge=la ley;il diritto=el derecho;il tribunale=el tribunal;il giudice=el juez;l'avvocato=el abogado;il contratto=el contrato;la sentenza=la sentencia;rispettare=respetar","Vocabulario jurídico básico: «fare causa a» (demandar), «vincere / perdere una causa», «firmare un contratto», «violare la legge». Impersonales: «è vietato + infinitivo», «è obbligatorio + infinitivo», «si è tenuti a» (se está obligado a).","È vietato fumare qui.=Está prohibido fumar aquí.;Il giudice ha emesso la sentenza.=El juez ha dictado la sentencia.;Si è tenuti a rispettare il contratto.=Se está obligado a respetar el contrato.;Ha fatto causa all'azienda.=Ha demandado a la empresa.","Un lavoratore ha fatto causa all'azienda perché il contratto non era stato rispettato. Il suo avvocato ha presentato le prove e, dopo mesi, il giudice ha emesso la sentenza a suo favore. Si è ricordato così che tutti sono tenuti a rispettare la legge e che i diritti vanno difesi.","Un trabajador ha demandado a la empresa porque no se había respetado el contrato. Su abogado presentó las pruebas y, tras meses, el juez dictó sentencia a su favor. Se recordó así que todos están obligados a respetar la ley y que los derechos deben defenderse.","¿Por qué demandó a la empresa?|Por incumplir el contrato|Por despido injusto|Por acoso|0#¿A favor de quién fue la sentencia?|Del trabajador|De la empresa|De nadie|0","È ___ fumare qui.|vietato|vietare|vietando#Il giudice ha ___ la sentenza.|emesso|emettere|emettendo","El tribunal=Il tribunale#Respetar la ley=Rispettare la legge"],
["Periodismo y opinión pública","la libertà di stampa=la libertad de prensa;l'inchiesta=la investigación periodística;la fonte=la fuente;la manipolazione=la manipulación;l'opinione pubblica=la opinión pública;il sondaggio=la encuesta;smentire=desmentir;attendibile=fiable","Para analizar la prensa: «Secondo quanto riportato dal quotidiano…», «L'inchiesta ha rivelato che…», «Non è stato possibile verificare…». Verbos de reporte: «viene riferito che», «risulta che». El condicional marca duda: l'azienda avrebbe nascosto dei dati.","Secondo quanto riportato dal quotidiano, il ministro si è dimesso.=Según lo informado por el diario, el ministro ha dimitido.;L'inchiesta ha rivelato nuovi dettagli.=La investigación ha revelado nuevos detalles.;La fonte non è attendibile.=La fuente no es fiable.;Il sondaggio mostra un calo di fiducia.=La encuesta muestra una caída de confianza.","Secondo quanto riportato dal quotidiano, un'inchiesta ha rivelato che l'azienda avrebbe nascosto alcuni dati. Il portavoce ha smentito, ma la fonte sembra attendibile. Un sondaggio mostra un calo di fiducia dell'opinione pubblica. La libertà di stampa resta fondamentale per verificare i fatti.","Según lo informado por el diario, una investigación ha revelado que la empresa habría ocultado algunos datos. El portavoz lo ha desmentido, pero la fuente parece fiable. Una encuesta muestra una caída de confianza de la opinión pública. La libertad de prensa sigue siendo fundamental para verificar los hechos.","¿Qué habría hecho la empresa?|Ocultar datos|Cerrar|Cambiar de nombre|0#¿Qué muestra la encuesta?|Caída de confianza|Aumento de ventas|Apoyo total|0","La fonte non è ___.|attendibile|attendere|attesa#Il portavoce ha ___.|smentito|smentire|smentisce","La libertad de prensa=La libertà di stampa#La opinión pública=L'opinione pubblica"],
["Turismo sostenible","il turismo di massa=el turismo de masas;sostenibile=sostenible;l'impatto=el impacto;la tutela=la protección;il patrimonio=el patrimonio;l'ecoturismo=el ecoturismo;il flusso=el flujo;preservare=preservar","Para argumentar sobre turismo: «Il turismo di massa ha un impatto…», «Occorre tutelare il patrimonio», «Sarebbe auspicabile che + congiuntivo imperfetto», «a scapito di» (en detrimento de): a scapito dei residenti.","Il turismo di massa ha un forte impatto.=El turismo de masas tiene un fuerte impacto.;Occorre tutelare il patrimonio culturale.=Hace falta proteger el patrimonio cultural.;Sarebbe auspicabile che i flussi fossero limitati.=Sería deseable que los flujos estuvieran limitados.;Ciò avviene a scapito dei residenti.=Eso ocurre en detrimento de los residentes.","Città come Venezia soffrono per il turismo di massa, che ha un forte impatto sull'ambiente e avviene spesso a scapito dei residenti. Sarebbe auspicabile che i flussi fossero limitati e che si promuovesse l'ecoturismo. Occorre tutelare il patrimonio culturale per preservarlo alle generazioni future.","Ciudades como Venecia sufren por el turismo de masas, que tiene un fuerte impacto en el medio ambiente y ocurre a menudo en detrimento de los residentes. Sería deseable que los flujos estuvieran limitados y que se promoviera el ecoturismo. Hace falta proteger el patrimonio cultural para preservarlo para las generaciones futuras.","¿Qué ciudad se menciona?|Venecia|Roma|Florencia|0#¿Qué sería deseable?|Limitar los flujos|Abrir más hoteles|Subir precios|0","Occorre ___ il patrimonio.|tutelare|tutela|tutelato#Ciò avviene a ___ dei residenti.|scapito|scapiti|scapitare","El turismo sostenible=Il turismo sostenibile#El patrimonio=Il patrimonio"],
["Psicología y bienestar emocional","il benessere=el bienestar;l'ansia=la ansiedad;la fiducia in sé=la autoconfianza;l'equilibrio=el equilibrio;lo stress=el estrés;affrontare=afrontar;la resilienza=la resiliencia;chiedere aiuto=pedir ayuda","Para hablar de bienestar con matices: «Mi sento sopraffatto», «Faccio fatica a…», «Mi sono reso conto di…» (me di cuenta de). Verbos de proceso: sentirsi, rendersi conto di, accorgersi di.","Faccio fatica a rilassarmi.=Me cuesta relajarme.;Mi sono reso conto di avere bisogno di una pausa.=Me di cuenta de que necesitaba un descanso.;Chiedere aiuto non è un segno di debolezza.=Pedir ayuda no es una señal de debilidad.;La resilienza si può allenare.=La resiliencia se puede entrenar.","Per mesi ho fatto fatica a rilassarmi e mi sentivo sopraffatto dallo stress. A un certo punto mi sono reso conto di avere bisogno di una pausa e ho chiesto aiuto a un amico. Affrontare le difficoltà non significa farcela da soli: la resilienza si può allenare, e l'equilibrio si costruisce giorno dopo giorno.","Durante meses me costó relajarme y me sentía desbordado por el estrés. En un momento dado me di cuenta de que necesitaba un descanso y pedí ayuda a un amigo. Afrontar las dificultades no significa conseguirlo solo: la resiliencia se puede entrenar y el equilibrio se construye día a día.","¿Qué hizo al darse cuenta?|Pedir ayuda a un amigo|Ignorarlo|Dejar el trabajo|0#¿Qué se puede entrenar?|La resiliencia|La fuerza|La memoria|0","Faccio ___ a rilassarmi.|fatica|facile|fatto#Mi sono reso ___ di avere bisogno di una pausa.|conto|contare|contato","El bienestar=Il benessere#Pedir ayuda=Chiedere aiuto"],
["Arquitectura y urbanismo","l'urbanistica=el urbanismo;il quartiere=el barrio;la periferia=la periferia;il centro storico=el casco histórico;la riqualificazione=la rehabilitación;il verde pubblico=las zonas verdes;la viabilità=la movilidad;la facciata=la fachada","Para describir y criticar el espacio urbano: «La riqualificazione ha reso il quartiere più vivibile», «Mancano spazi verdi» (faltan zonas verdes: «mancare» concuerda con lo que falta). «Rendere + objeto + adjetivo» = hacer algo más…","La riqualificazione ha reso il quartiere più vivibile.=La rehabilitación ha hecho el barrio más habitable.;Mancano spazi verdi in periferia.=Faltan zonas verdes en la periferia.;La facciata è stata restaurata.=La fachada ha sido restaurada.;Il centro storico è molto frequentato.=El casco histórico está muy concurrido.","La periferia della mia città è cambiata: la riqualificazione ha reso il quartiere più vivibile, con nuove piste ciclabili e una piazza. Mancano però ancora spazi verdi e servizi. Il centro storico è molto frequentato, quindi sarebbe utile migliorare la viabilità anche fuori dalle mura.","La periferia de mi ciudad ha cambiado: la rehabilitación ha hecho el barrio más habitable, con nuevos carriles bici y una plaza. Faltan todavía zonas verdes y servicios. El casco histórico está muy concurrido, así que sería útil mejorar la movilidad también fuera de las murallas.","¿Qué ha hecho la rehabilitación?|Hacer el barrio más habitable|Cerrar el barrio|Subir alquileres|0#¿Qué falta aún?|Zonas verdes y servicios|Plazas|Bares|0","Mancano ___ verdi.|spazi|spazio|spaziare#La riqualificazione ha ___ il quartiere vivibile.|reso|fatto|dato","El urbanismo=L'urbanistica#La periferia=La periferia"],
["Alimentación y consumo responsable","il chilometro zero=el kilómetro cero;a chilometro zero=de proximidad;lo spreco alimentare=el desperdicio alimentario;stagionale=de temporada;biologico=ecológico;la filiera=la cadena de producción;consapevole=consciente;lo slow food=el slow food","Para hablar de consumo responsable: «Scegliere prodotti stagionali e a chilometro zero», «Ridurre lo spreco», «È fondamentale essere consapevoli di ciò che mangiamo». «Ciò che» = lo que.","Scelgo prodotti stagionali e a chilometro zero.=Elijo productos de temporada y de proximidad.;Dobbiamo ridurre lo spreco alimentare.=Debemos reducir el desperdicio de alimentos.;È importante essere consapevoli di ciò che mangiamo.=Es importante ser conscientes de lo que comemos.;La filiera corta aiuta i piccoli produttori.=La cadena corta ayuda a los pequeños productores.","Da qualche anno scelgo prodotti stagionali e a chilometro zero. È fondamentale essere consapevoli di ciò che mangiamo e di come viene prodotto. Ho ridotto lo spreco alimentare pianificando la spesa e sostengo la filiera corta, che aiuta i piccoli produttori locali.","Desde hace algunos años elijo productos de temporada y de proximidad. Es fundamental ser conscientes de lo que comemos y de cómo se produce. He reducido el desperdicio de alimentos planificando la compra y apoyo la cadena corta, que ayuda a los pequeños productores locales.","¿Qué productos elige?|De temporada y proximidad|Congelados|Importados|0#¿Cómo redujo el desperdicio?|Planificando la compra|Comprando más|Cocinando menos|0","Scelgo prodotti ___.|stagionali|stagione|stagionando#Dobbiamo ridurre lo ___.|spreco|sprecare|sprecato","De proximidad=A chilometro zero#El desperdicio=Lo spreco"],
["Deporte y ética","il doping=el dopaje;la correttezza=la deportividad;il tifo=la afición;la squadra=el equipo;il campione=el campeón;la competizione=la competición;lo spirito sportivo=el espíritu deportivo;squalificare=descalificar","Para opinar sobre ética deportiva: «Non è accettabile che + congiuntivo», «Il fine non giustifica i mezzi», «A prescindere da» (independientemente de). Pasiva: è stato squalificato per doping.","È stato squalificato per doping.=Ha sido descalificado por dopaje.;A prescindere dal risultato, conta la correttezza.=Independientemente del resultado, cuenta la deportividad.;Non è accettabile che il tifo diventi violento.=No es aceptable que la afición se vuelva violenta.;Il fine non giustifica i mezzi.=El fin no justifica los medios.","Il campione è stato squalificato per doping dopo anni di successi. Non è accettabile che qualcuno vinca barando: il fine non giustifica i mezzi. A prescindere dal risultato, nello sport contano la correttezza e lo spirito sportivo, e il tifo non deve mai diventare violento.","El campeón ha sido descalificado por dopaje tras años de éxitos. No es aceptable que alguien gane haciendo trampa: el fin no justifica los medios. Independientemente del resultado, en el deporte cuentan la deportividad y el espíritu deportivo, y la afición no debe volverse nunca violenta.","¿Por qué fue descalificado?|Por dopaje|Por violencia|Por una lesión|0#¿Qué cuenta más que el resultado?|La deportividad|El dinero|La fama|0","È stato ___ per doping.|squalificato|squalificare|squalifica#A ___ dal risultato, conta la correttezza.|prescindere|prescindo|prescindendo","El dopaje=Il doping#El espíritu deportivo=Lo spirito sportivo"],
["La globalización","la globalizzazione=la globalización;il commercio=el comercio;la delocalizzazione=la deslocalización;la concorrenza=la competencia;la disuguaglianza=la desigualdad;l'interdipendenza=la interdependencia;i vantaggi=las ventajas;gli svantaggi=las desventajas","Para equilibrar pros y contras: «Da un lato… dall'altro…», «Non solo… ma anche…», «Se da una parte… dall'altra…». «Non solo A ma anche B» enfatiza una suma: non solo crea lavoro ma anche scambi culturali.","Non solo crea lavoro, ma anche scambi culturali.=No solo crea trabajo, sino también intercambios culturales.;Da un lato aumenta il commercio, dall'altro cresce la disuguaglianza.=Por un lado aumenta el comercio, por otro crece la desigualdad.;La concorrenza è molto forte.=La competencia es muy fuerte.;L'interdipendenza ha vantaggi e svantaggi.=La interdependencia tiene ventajas y desventajas.","La globalizzazione ha vantaggi e svantaggi. Non solo ha aumentato il commercio, ma ha anche favorito gli scambi culturali. Dall'altro lato, la delocalizzazione ha tolto lavoro ad alcune comunità e la disuguaglianza è cresciuta. Il vero tema è come governare l'interdipendenza in modo più giusto.","La globalización tiene ventajas y desventajas. No solo ha aumentado el comercio, sino que también ha favorecido los intercambios culturales. Por otro lado, la deslocalización ha quitado trabajo a algunas comunidades y la desigualdad ha crecido. El verdadero tema es cómo gobernar la interdependencia de manera más justa.","¿Qué favoreció además del comercio?|Intercambios culturales|Guerras|Impuestos|0#¿Qué creció?|La desigualdad|La producción local|El pleno empleo|0","Non solo crea lavoro, ___ scambi culturali.|ma anche|oppure|quindi#Da un lato aumenta il commercio, ___ cresce la disuguaglianza.|dall'altro|inoltre|infatti","La globalización=La globalizzazione#Las ventajas=I vantaggi"],
["Correlaciones y proporciones","più… più…=cuanto más… más…;meno… meno…=cuanto menos… menos…;tanto… quanto=tanto… como;sia… sia=tanto… como;né… né=ni… ni;o… o=o… o;non solo… ma anche=no solo… sino también;tale… quale=tal… cual","Correlaciones: «Più studi, più impari» (cuanto más estudias, más aprendes), «tanto… quanto», «sia… sia», «né… né». Con «né… né» después del verbo, este va en negativo: non ho né tempo né voglia.","Più studi, più impari.=Cuanto más estudias, más aprendes.;Sia tu sia io dobbiamo partecipare.=Tanto tú como yo debemos participar.;Non ho né tempo né voglia.=No tengo ni tiempo ni ganas.;È tanto bravo quanto simpatico.=Es tan bueno como simpático.","Più lavoro in questo progetto, più mi appassiono. Sia i colleghi sia il direttore sono molto disponibili, e non ho né dubbi né rimpianti. Il mio lavoro è tanto impegnativo quanto stimolante, e non solo mi dà soddisfazione ma anche nuove competenze.","Cuanto más trabajo en este proyecto, más me apasiono. Tanto los compañeros como el director son muy atentos, y no tengo ni dudas ni arrepentimientos. Mi trabajo es tan exigente como estimulante, y no solo me da satisfacción sino también nuevas competencias.","¿Cómo son los compañeros?|Atentos|Distantes|Ocupados|0#¿Qué le da el trabajo además de satisfacción?|Nuevas competencias|Dinero|Fama|0","___ studi, più impari.|Più|Meno|Tanto#Non ho ___ tempo né voglia.|né|sia|o","Cuanto más estudias, más aprendes=Più studi, più impari#Ni dudas ni arrepentimientos=Né dubbi né rimpianti"],
["Cine neorrealista","il neorealismo=el neorrealismo;il regista=el director;gli attori non professionisti=los actores no profesionales;il dopoguerra=la posguerra;la miseria=la miseria;la denuncia sociale=la denuncia social;le riprese=el rodaje;il capolavoro=la obra maestra","Para reseñar cine histórico se usa el passato remoto en textos escritos (nacque, girò) y el presente histórico. Frases clave: «si caratterizza per», «ha segnato una svolta», «mette in scena». Ej.: il film mette in scena la miseria del dopoguerra.","Il neorealismo nacque nel dopoguerra.=El neorrealismo nació en la posguerra.;Il film si caratterizza per attori non professionisti.=La película se caracteriza por actores no profesionales.;Le riprese avvennero nelle strade vere.=El rodaje se hizo en calles reales.;Questa opera ha segnato una svolta.=Esta obra marcó un punto de inflexión.","Il neorealismo nacque nel dopoguerra e si caratterizza per storie semplici e attori non professionisti. Le riprese avvenivano nelle strade vere, senza scenografie. Film come Ladri di biciclette mettono in scena la miseria e la dignità delle persone comuni e hanno segnato una svolta nella storia del cinema.","El neorrealismo nació en la posguerra y se caracteriza por historias sencillas y actores no profesionales. El rodaje se hacía en calles reales, sin decorados. Películas como Ladri di biciclette muestran la miseria y la dignidad de las personas comunes y marcaron un punto de inflexión en la historia del cine.","¿Cuándo nació el neorrealismo?|En la posguerra|En 1990|En el siglo XVIII|0#¿Dónde se rodaba?|En calles reales|En estudios|En el campo|0","Il neorealismo ___ nel dopoguerra.|nacque|nasce|nascerà#Il film mette in ___ la miseria.|scena|scene|scenare","La posguerra=Il dopoguerra#La obra maestra=Il capolavoro"],
["Dante y la Divina Comedia","la Divina Commedia=la Divina Comedia;l'Inferno=el Infierno;il Purgatorio=el Purgatorio;il Paradiso=el Paraíso;il canto=el canto;il poeta=el poeta;il viaggio=el viaje;il volgare=la lengua vulgar","Para hablar de literatura clásica: «L'opera è divisa in tre cantiche», «Il poeta narra il viaggio…», «Dante scrisse in volgare». En la historia literaria se usa el passato remoto: scrisse, visse, nacque.","Dante nacque a Firenze nel 1265.=Dante nació en Florencia en 1265.;L'opera è divisa in tre cantiche.=La obra está dividida en tres cánticos.;Il poeta narra un viaggio nell'aldilà.=El poeta narra un viaje al más allá.;Dante scrisse in volgare.=Dante escribió en lengua vulgar.","Dante nacque a Firenze nel 1265 e scrisse la Divina Commedia in volgare, la lingua del popolo. L'opera è divisa in tre cantiche: Inferno, Purgatorio e Paradiso. Il poeta narra il suo viaggio nell'aldilà, guidato prima da Virgilio e poi da Beatrice, e per questo è considerato il padre della lingua italiana.","Dante nació en Florencia en 1265 y escribió la Divina Comedia en lengua vulgar, la lengua del pueblo. La obra está dividida en tres cánticos: Infierno, Purgatorio y Paraíso. El poeta narra su viaje al más allá, guiado primero por Virgilio y luego por Beatriz, y por eso se le considera el padre de la lengua italiana.","¿En qué lengua escribió?|En vulgar|En latín|En francés|0#¿Quién lo guía al final?|Beatriz|Virgilio|Nadie|0","Dante ___ a Firenze.|nacque|nasceva|è nascendo#L'opera è divisa in tre ___.|cantiche|cantica|cantare","El poeta=Il poeta#El viaje=Il viaggio"],
["Música y ópera","l'opera lirica=la ópera;il soprano=la soprano;il tenore=el tenor;il libretto=el libreto;il teatro=el teatro;la partitura=la partitura;l'aria=el aria;il compositore=el compositor","Para hablar de música: «Ho assistito a un'opera», «L'aria più famosa è…», «Il compositore ha scritto…». «Assistere a» = presenciar. Para comparar: «tanto… quanto»: Verdi è tanto popolare quanto Puccini.","Ho assistito a un'opera di Verdi.=He asistido a una ópera de Verdi.;L'aria più famosa è molto commovente.=El aria más famosa es muy conmovedora.;Il compositore ha scritto molte opere.=El compositor escribió muchas óperas.;Il soprano ha ricevuto un lungo applauso.=La soprano recibió un largo aplauso.","Sabato scorso ho assistito a un'opera di Verdi alla Scala di Milano. Il soprano ha cantato un'aria molto commovente e il pubblico le ha dedicato un lungo applauso. Verdi è tanto popolare quanto Puccini, e il libretto, pur essendo semplice, racconta passioni universali.","El sábado pasado asistí a una ópera de Verdi en La Scala de Milán. La soprano cantó un aria muy conmovedora y el público le dedicó un largo aplauso. Verdi es tan popular como Puccini, y el libreto, aun siendo sencillo, cuenta pasiones universales.","¿Dónde asistió a la ópera?|En La Scala|En Roma|En Venecia|0#¿Qué recibió la soprano?|Un largo aplauso|Flores|Críticas|0","Ho ___ a un'opera di Verdi.|assistito|assistere|assisto#Il soprano ha cantato un'___.|aria|arie|ario","La ópera=L'opera lirica#El compositor=Il compositore"],
["Vino y denominaciones de origen","la denominazione di origine=la denominación de origen;la vendemmia=la vendimia;il vigneto=el viñedo;l'annata=la cosecha;il sommelier=el sumiller;l'abbinamento=el maridaje;corposo=con cuerpo;il bouquet=el aroma","Para describir un vino: «Ha un bouquet intenso», «È corposo e persistente», «Si abbina bene con…». Pasiva con «venire»: il vino viene prodotto sulle colline. «DOC» y «DOCG» garantizan origen y calidad.","Questo vino ha un bouquet intenso.=Este vino tiene un aroma intenso.;Si abbina bene con la carne rossa.=Maridaja bien con carne roja.;La vendemmia inizia a settembre.=La vendimia empieza en septiembre.;Il vino viene prodotto sulle colline.=El vino se produce en las colinas.","La vendemmia inizia a settembre e il vino viene prodotto sulle colline toscane. Questa annata è corposa, con un bouquet intenso, e si abbina bene con la carne rossa. Il sommelier ci ha spiegato che la denominazione di origine garantisce qualità e territorio.","La vendimia empieza en septiembre y el vino se produce en las colinas toscanas. Esta cosecha tiene cuerpo, con un aroma intenso, y maridaja bien con carne roja. El sumiller nos explicó que la denominación de origen garantiza calidad y territorio.","¿Cuándo empieza la vendimia?|En septiembre|En mayo|En diciembre|0#¿Con qué maridaja?|Carne roja|Pescado|Postre|0","Il vino ___ prodotto sulle colline.|viene|è venuto|vengono#Si ___ bene con la carne.|abbina|abbinano|abbinato","La vendimia=La vendemmia#El viñedo=Il vigneto"],
["Moda y diseño italiano","la moda=la moda;lo stilista=el diseñador;la sfilata=el desfile;il tessuto=el tejido;su misura=a medida;il marchio=la marca;artigianale=artesanal;il design=el diseño","Para hablar de moda y diseño: «Made in Italy», «su misura», «di alta qualità». Superlativos: «il più elegante», «elegantissimo». Estructura «non è solo… è anche…»: non è solo un vestito, è anche artigianato.","Questo abito è fatto su misura.=Este traje está hecho a medida.;La sfilata è stata elegantissima.=El desfile ha sido elegantísimo.;Il Made in Italy è sinonimo di qualità.=El Made in Italy es sinónimo de calidad.;Non è solo moda, è anche cultura.=No es solo moda, es también cultura.","Milano è la capitale della moda: ogni anno le sfilate attirano stilisti e giornalisti da tutto il mondo. Il Made in Italy è sinonimo di qualità e di lavoro artigianale, con tessuti pregiati e abiti fatti su misura. Per molti non è solo moda, ma anche cultura e identità.","Milán es la capital de la moda: cada año los desfiles atraen a diseñadores y periodistas de todo el mundo. El Made in Italy es sinónimo de calidad y de trabajo artesanal, con tejidos de calidad y trajes hechos a medida. Para muchos no es solo moda, sino también cultura e identidad.","¿Cuál es la capital de la moda?|Milán|Roma|Florencia|0#¿De qué es sinónimo el Made in Italy?|Calidad|Precio bajo|Rapidez|0","Questo abito è fatto su ___.|misura|misure|misurare#La sfilata è stata ___.|elegantissima|elegantissimo|eleganti","El diseñador=Lo stilista#A medida=Su misura"],
["El milagro económico italiano","il boom economico=el boom económico;l'industrializzazione=la industrialización;l'emigrazione interna=la emigración interna;il benessere=el bienestar;la Vespa=la Vespa;l'elettrodomestico=el electrodoméstico;la televisione=la televisión;il miracolo economico=el milagro económico","Para narrar el pasado histórico: imperfetto para describir (la gente emigrava), passato remoto o prossimo para hechos (l'economia crebbe) y trapassato para lo anterior. Fechas: negli anni Cinquanta e Sessanta. «Grazie a» introduce la causa.","Negli anni Sessanta l'economia crebbe rapidamente.=En los años sesenta la economía creció rápidamente.;Molte persone emigravano dal Sud al Nord.=Mucha gente emigraba del Sur al Norte.;Grazie all'industrializzazione, il benessere aumentò.=Gracias a la industrialización, el bienestar aumentó.;La televisione entrò in molte case.=La televisión entró en muchas casas.","Negli anni Cinquanta e Sessanta l'Italia visse il miracolo economico. Grazie all'industrializzazione il benessere aumentò e molte famiglie comprarono per la prima volta la televisione e gli elettrodomestici. Intanto milioni di persone emigravano dal Sud verso le fabbriche del Nord, cambiando per sempre il paese.","En los años cincuenta y sesenta Italia vivió el milagro económico. Gracias a la industrialización el bienestar aumentó y muchas familias compraron por primera vez la televisión y los electrodomésticos. Mientras tanto millones de personas emigraban del Sur hacia las fábricas del Norte, cambiando para siempre el país.","¿Qué compraron muchas familias?|Televisión y electrodomésticos|Coches de lujo|Casas|0#¿Hacia dónde emigraban?|Hacia el Norte|Hacia el Sur|Al extranjero|0","Negli anni Sessanta l'economia ___ rapidamente.|crebbe|cresceva|crescerà#___ all'industrializzazione, il benessere aumentò.|Grazie|Causa|Dato","El milagro económico=Il miracolo economico#La industrialización=L'industrializzazione"],
["Dialectos y variedades del italiano","il dialetto=el dialecto;la lingua standard=la lengua estándar;l'accento=el acento;la variante regionale=la variante regional;il lessico=el léxico;la parlata=el habla;il bilinguismo=el bilingüismo;la diffusione=la difusión","Para hablar de lengua: «Si parla…», «La differenza sta in…», «A seconda di» (según). Impersonal con «si»: in Italia si parlano molti dialetti. Variedades regionales: il napoletano, il siciliano, il veneto.","In Italia si parlano molti dialetti.=En Italia se hablan muchos dialectos.;La differenza sta nell'accento.=La diferencia está en el acento.;A seconda della regione, il lessico cambia.=Según la región, el léxico cambia.;Ci si capisce anche senza parlare lo stesso dialetto.=Nos entendemos aunque no hablemos el mismo dialecto.","In Italia si parlano molti dialetti, e a seconda della regione cambiano il lessico e l'accento. Il dialetto napoletano è molto diverso da quello veneto, ma tutti ci si capisce grazie alla lingua standard. Oggi molte persone sono bilingui: parlano italiano e anche il dialetto della famiglia.","En Italia se hablan muchos dialectos y, según la región, cambian el léxico y el acento. El dialecto napolitano es muy distinto del véneto, pero todos nos entendemos gracias a la lengua estándar. Hoy muchas personas son bilingües: hablan italiano y también el dialecto de la familia.","¿Qué cambia según la región?|Léxico y acento|Solo el acento|Nada|0#¿Qué permite entenderse?|La lengua estándar|Los gestos|La escritura|0","In Italia si ___ molti dialetti.|parlano|parla|parlando#A ___ della regione, il lessico cambia.|seconda|secondo|secondi","El dialecto=Il dialetto#El acento=L'accento"],
["Negociación y compromiso","negoziare=negociar;la trattativa=la negociación;il compromesso=el compromiso;la controproposta=la contrapropuesta;l'accordo=el acuerdo;cedere=ceder;la concessione=la concesión;vantaggioso=ventajoso","En una negociación: «Sarei disposto a…» (condicional), «A patto che…», «Propongo un compromesso», «Siamo venuti incontro alle vostre richieste». «Venire incontro a» = ceder ante / ir al encuentro de.","Sarei disposto a ridurre il prezzo.=Estaría dispuesto a reducir el precio.;Propongo un compromesso.=Propongo un compromiso.;A patto che il pagamento sia immediato.=A condición de que el pago sea inmediato.;Siamo venuti incontro alle vostre richieste.=Hemos cedido a sus peticiones.","Durante la trattativa, il fornitore ha chiesto un prezzo più alto. Io ho risposto: «Sarei disposto a ridurre la quantità, a patto che il pagamento sia immediato.» Abbiamo cercato un compromesso e alla fine siamo venuti incontro alle richieste dell'altra parte. L'accordo è stato vantaggioso per entrambi.","Durante la negociación, el proveedor pidió un precio más alto. Yo respondí: «Estaría dispuesto a reducir la cantidad, a condición de que el pago sea inmediato.» Buscamos un compromiso y al final cedimos a las peticiones de la otra parte. El acuerdo fue ventajoso para ambos.","¿Qué pidió el proveedor?|Un precio más alto|Menos plazo|Más cantidad|0#¿Cómo fue el acuerdo?|Ventajoso para ambos|Malo|Cancelado|0","Sarei ___ a ridurre la quantità.|disposto|disporre|disponendo#A ___ che il pagamento sia immediato.|patto|patti|patta","La negociación=La trattativa#Un compromiso=Un compromesso"],
["Emprendimiento y startups","l'imprenditore=el emprendedor;la startup=la startup;il finanziamento=la financiación;il business plan=el plan de negocio;il rischio=el riesgo;il mercato=el mercado;lanciare=lanzar;l'investitore=el inversor","Para presentar un proyecto: «Il nostro obiettivo è…», «Abbiamo intenzione di…», «Il rischio è ridotto grazie a…». Futuro para planes: lanceremo il prodotto a marzo. Condicional para hipótesis: se trovassimo un investitore, potremmo crescere.","Abbiamo intenzione di lanciare un nuovo prodotto.=Tenemos intención de lanzar un nuevo producto.;Il nostro obiettivo è conquistare il mercato.=Nuestro objetivo es conquistar el mercado.;Se trovassimo un investitore, potremmo crescere.=Si encontráramos un inversor, podríamos crecer.;Il rischio è ridotto grazie al business plan.=El riesgo se reduce gracias al plan de negocio.","Io e due amici abbiamo fondato una startup e abbiamo intenzione di lanciare la nostra app a marzo. Il nostro obiettivo è conquistare il mercato italiano. Se trovassimo un investitore, potremmo crescere più in fretta. Il rischio è ridotto grazie a un business plan molto dettagliato.","Mis dos amigos y yo hemos fundado una startup y tenemos intención de lanzar nuestra aplicación en marzo. Nuestro objetivo es conquistar el mercado italiano. Si encontráramos un inversor, podríamos crecer más rápido. El riesgo se reduce gracias a un plan de negocio muy detallado.","¿Cuándo lanzarán la aplicación?|En marzo|En junio|En enero|0#¿Qué reduce el riesgo?|Un plan de negocio detallado|El dinero|La suerte|0","Abbiamo ___ di lanciare l'app.|intenzione|intento|intendere#Se trovassimo un investitore, ___ crescere.|potremmo|possiamo|potremo","La financiación=Il finanziamento#El plan de negocio=Il business plan"],
["Energía y transporte del futuro","la mobilità elettrica=la movilidad eléctrica;la ricarica=la recarga;il treno ad alta velocità=el tren de alta velocidad;l'idrogeno=el hidrógeno;l'energia solare=la energía solar;l'autonomia=la autonomía;la rete=la red;a basse emissioni=de bajas emisiones","Para hablar del futuro: futuro simple (aumenterà) y futuro anteriore. «Entro» + fecha = como máximo, antes de. Para predecir con cautela: «È probabile che + congiuntivo», o el condicional periodístico: l'idrogeno potrebbe sostituire il petrolio.","Entro il 2035 la mobilità elettrica sarà molto diffusa.=Antes de 2035 la movilidad eléctrica estará muy extendida.;È probabile che l'autonomia aumenti.=Es probable que la autonomía aumente.;La rete di ricarica dovrà crescere.=La red de recarga tendrá que crecer.;L'idrogeno potrebbe sostituire il petrolio.=El hidrógeno podría sustituir al petróleo.","Entro il 2035 la mobilità elettrica sarà molto più diffusa. È probabile che l'autonomia delle batterie aumenti e che la rete di ricarica cresca. Intanto il treno ad alta velocità offre un'alternativa a basse emissioni, e l'idrogeno potrebbe sostituire in parte il petrolio.","Antes de 2035 la movilidad eléctrica estará mucho más extendida. Es probable que la autonomía de las baterías aumente y que la red de recarga crezca. Mientras tanto el tren de alta velocidad ofrece una alternativa de bajas emisiones, y el hidrógeno podría sustituir en parte al petróleo.","¿Qué ocurrirá antes de 2035?|La movilidad eléctrica será más extendida|Se prohibirá el tren|Subirá el petróleo|0#¿Qué ofrece el tren de alta velocidad?|Bajas emisiones|Más ruido|Más coste|0","___ il 2035 la mobilità sarà diffusa.|Entro|Dentro|Fino#È probabile che l'autonomia ___.|aumenti|aumenta|aumenterà","La energía solar=L'energia solare#El hidrógeno=L'idrogeno"],
["Repaso B2: argumentar con matices","a mio parere=a mi parecer;non è detto che=no necesariamente;tuttavia=sin embargo;in sintesi=en síntesis;si tratta di=se trata de;a questo proposito=a este respecto;ammesso che=suponiendo que;resta il fatto che=queda el hecho de que","Repaso B2: combina congiuntivo (non è detto che sia), concesivas (sebbene, pur + gerundio), condiciones formales (qualora), matices (sembrerebbe) y conectores (a questo proposito, in sintesi). «Non è detto che + congiuntivo» = no necesariamente.","Non è detto che sia la scelta migliore.=No necesariamente es la mejor elección.;Ammesso che sia vero, resta il fatto che costa troppo.=Suponiendo que sea verdad, queda el hecho de que cuesta demasiado.;A questo proposito, vorrei aggiungere un dato.=A este respecto, quisiera añadir un dato.;In sintesi, sono favorevole con alcune riserve.=En síntesis, estoy a favor con algunas reservas.","A mio parere, la proposta ha aspetti positivi, ma non è detto che sia la scelta migliore. Ammesso che i costi siano sostenibili, resta il fatto che mancano garanzie sui tempi. A questo proposito, qualora emergessero ritardi, occorrerebbe rivedere il progetto. In sintesi, sono favorevole, pur con alcune riserve.","A mi parecer, la propuesta tiene aspectos positivos, pero no necesariamente es la mejor elección. Suponiendo que los costes sean sostenibles, queda el hecho de que faltan garantías sobre los plazos. A este respecto, en caso de que surgieran retrasos, habría que revisar el proyecto. En síntesis, estoy a favor, aunque con algunas reservas.","¿Qué falta según el texto?|Garantías sobre los plazos|Dinero|Personal|0#¿Cuál es la conclusión?|A favor con reservas|En contra|Indiferente|0","Non è ___ che sia la scelta migliore.|detto|detta|dire#___ che i costi siano sostenibili, mancano garanzie.|Ammesso|Perché|Siccome","En síntesis=In sintesi#A mi parecer=A mio parere"],
["Texto académico: resumen y citas","il riassunto=el resumen;la citazione=la cita;la bibliografia=la bibliografía;il riferimento=la referencia;sintetizzare=sintetizar;parafrasare=parafrasear;l'abstract=el resumen del artículo;la tesi di laurea=el trabajo de fin de grado","En un texto académico: «Secondo + autor», «Come sostiene + autor», «Si veda…». Para resumir: «In sintesi», «In breve». Parafrasea sin copiar y cita siempre la fuente. Evita el «yo»: «si ritiene che» (se considera que).","Secondo Rossi, il fenomeno è in crescita.=Según Rossi, el fenómeno está en aumento.;Come sostiene l'autore, la tesi è convincente.=Como sostiene el autor, la tesis es convincente.;In sintesi, i risultati sono positivi.=En síntesis, los resultados son positivos.;Si ritiene che sia necessario approfondire.=Se considera que es necesario profundizar.","Nella mia tesi di laurea analizzo l'uso dei social media tra i giovani. Secondo Rossi, il fenomeno è in forte crescita, e come sostiene l'autore, ciò richiede nuove ricerche. Ho parafrasato le fonti e ho inserito la bibliografia. In sintesi, si ritiene che sia necessario approfondire l'impatto sul benessere.","En mi trabajo de fin de grado analizo el uso de las redes sociales entre los jóvenes. Según Rossi, el fenómeno está en fuerte crecimiento y, como sostiene el autor, esto requiere nuevas investigaciones. He parafraseado las fuentes y he incluido la bibliografía. En síntesis, se considera que es necesario profundizar en el impacto sobre el bienestar.","¿Qué analiza la tesis?|Redes sociales entre jóvenes|Cine|Economía|0#¿Qué ha incluido?|La bibliografía|Un glosario|Fotos|0","___ Rossi, il fenomeno cresce.|Secondo|Sopra|Verso#Ho ___ le fonti.|parafrasato|parafrasare|parafrasi","El resumen=Il riassunto#La bibliografía=La bibliografia"],
["Repaso final B2: debate y matices","il dibattito=el debate;la posizione=la posición;il punto di vista=el punto de vista;confutare=refutar;ribadire=reiterar;concedere=conceder;sfumare=matizar;la conclusione=la conclusión","Repaso B2: combina congiuntivo en todos sus tiempos, hipótesis mixtas, nominalización, conectores concesivos y estructuras absolutas. Para debatir: «Ribadisco che…», «Concedo che…, tuttavia…», «Non si può non riconoscere che…».","Ribadisco che la tesi è sostenibile.=Reitero que la tesis es sostenible.;Concedo che ci siano dei rischi, tuttavia i benefici prevalgono.=Concedo que haya riesgos, sin embargo los beneficios prevalecen.;Non si può non riconoscere che sia un progresso.=No se puede no reconocer que sea un progreso.;Avendo valutato tutto, sono favorevole.=Habiendo valorado todo, estoy a favor.","Nel dibattito di ieri ho ribadito che la tesi è sostenibile. Concedo che ci siano dei rischi, tuttavia non si può non riconoscere che i benefici prevalgano. Se avessimo ignorato i dati, avremmo sbagliato strategia. Avendo valutato tutto con attenzione, sono favorevole, benché serva ancora prudenza.","En el debate de ayer reiteré que la tesis es sostenible. Concedo que haya riesgos, sin embargo no se puede no reconocer que los beneficios prevalecen. Si hubiéramos ignorado los datos, nos habríamos equivocado de estrategia. Habiendo valorado todo con atención, estoy a favor, aunque todavía hace falta prudencia.","¿Qué reiteró?|Que la tesis es sostenible|Que hay que cancelar|Que no hay riesgos|0#¿Con qué posición termina?|A favor con prudencia|En contra|Neutral|0","Concedo che ___ dei rischi.|ci siano|ci sono|ci saranno#Avendo ___ tutto, sono favorevole.|valutato|valutare|valuto","Reitero que=Ribadisco che#Habiendo valorado=Avendo valutato"]

["Registro y estilo","il registro=el registro;formale=formal;colloquiale=coloquial;burocratico=burocrático;la sfumatura=el matiz;appropriato=adecuado;la formula di cortesia=la fórmula de cortesía;l'espressione=la expresión","Elegir el registro es clave: coloquial (Che ne dici?), neutro (Che ne pensi?), formal (Che ne pensa Lei?). En el registro burocrático predominan nominalizaciones y pasivas: «si provvederà all'invio» en vez de «manderemo». Fórmulas formales: Gentile, Spettabile, Le porgo i miei saluti.","Che ne dici?=¿Qué te parece?;Che ne pensa Lei?=¿Qué opina usted?;Si provvederà all'invio della documentazione.=Se procederá al envío de la documentación.;Le porgo i miei più cordiali saluti.=Le envío mis más cordiales saludos.","In una e-mail al direttore ho scritto: «Gentile dottor Neri, Le scrivo per richiedere un chiarimento. Si provvederà all'invio dei documenti entro venerdì.» Con un collega, invece, avrei scritto: «Ciao Marco, ti mando tutto venerdì, ok?» Il contenuto è identico, ma il registro cambia completamente.","En un correo al director escribí: «Estimado doctor Neri, le escribo para solicitar una aclaración. Se procederá al envío de los documentos antes del viernes.» Con un compañero, en cambio, habría escrito: «Hola Marco, te mando todo el viernes, ¿vale?» El contenido es idéntico, pero el registro cambia por completo.","¿Con quién usó el registro formal?|Con el director|Con un amigo|Con un familiar|0#¿Qué cambia entre los dos mensajes?|El registro|El contenido|La fecha|0","Che ne ___ Lei?|pensa|pensi|pensate#Si ___ all'invio dei documenti.|provvederà|provvedo|provvedere","El registro formal=Il registro formale#Una fórmula de cortesía=Una formula di cortesia"],
