<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0c1a14"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><title>LinguaPro 2.0</title>
<style>
:root{--bg:#0c1a14;--card:#14271e;--ink:#f3ecd9;--mut:#9fb0a4;--gold:#c9a54c;--ok:#5fbf7f;--bad:#e0675a;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,sans-serif;padding:env(safe-area-inset-top) 0 calc(72px + env(safe-area-inset-bottom))}
h1,h2,h3{font-family:Georgia,serif;font-weight:600;margin:.2em 0}main{max-width:720px;margin:auto;padding:16px}
.card{background:var(--card);border:1px solid #24402f;border-radius:14px;padding:14px;margin:12px 0}
button,select,input,textarea{font:inherit;color:inherit}
button{background:var(--gold);color:#1a1405;border:0;border-radius:10px;padding:10px 14px;margin:3px 3px 3px 0;min-height:44px;cursor:pointer}
button.g{background:transparent;color:var(--ink);border:1px solid #3a5a48}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--gold)}
input,select,textarea{width:100%;background:#0f2017;border:1px solid #2f4d3b;border-radius:10px;padding:10px;margin:4px 0;font-size:16px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#0a140f;border-top:1px solid #24402f;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;color:var(--mut);border-radius:0;margin:0;font-size:12px;padding:10px 2px}nav button.on{color:var(--gold)}
.m{color:var(--mut);font-size:14px}.ok{color:var(--ok)}.bad{color:var(--bad)}.o{display:block;width:100%;text-align:left}
.b{padding:10px;border-radius:12px;margin:6px 0;white-space:pre-wrap}.u{background:#1f3a2b;margin-left:15%}.a{background:#262614;border:1px solid #4a4020;margin-right:10%}
.bar{height:8px;background:#0f2017;border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--gold)}
</style></head><body>
<main id="v"></main>
<nav><button data-t="inicio">Inicio</button><button data-t="acad">Academia</button><button data-t="hablar">Hablar</button><button data-t="vocab">Vocabulario</button><button data-t="prog">Progreso</button><button data-t="perfil">Perfil</button></nav>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
const $=s=>document.querySelector(s),V=$('#v'),LV=['A1','A2','B1','B2','C1','C2'];
const sh=a=>[...a].sort(()=>Math.random()-.5),esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const nz=s=>s.toLowerCase().replace(/[’‘]/g,"'").normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9' ]/g,' ').replace(/\s+/g,' ').trim();
// Datos: T=temas [nombre,"it=es;it=es"], g=gramática, F=huecos [frase,respuesta,opciones], C=lectura [texto,pregunta,opciones,índice correcto]
const D={
A1:{T:[["Saludos","Ciao=Hola;Buongiorno=Buenos días;Buonasera=Buenas tardes;Arrivederci=Adiós;Grazie=Gracias;Prego=De nada;Per favore=Por favor;Scusi=Disculpe"],["Números","uno=uno;due=dos;tre=tres;quattro=cuatro;cinque=cinco;sei=seis;sette=siete;otto=ocho;nove=nueve;dieci=diez"],["Familia","la madre=la madre;il padre=el padre;il fratello=el hermano;la sorella=la hermana;il figlio=el hijo;il nonno=el abuelo"]],g:["El verbo essere","Io sono, tu sei, lui/lei è, noi siamo, voi siete, loro sono. Ej.: Io sono spagnolo."],F:[["Io ___ spagnolo.","sono",["sono","sei","è"]],["Tu ___ stanco.","sei",["sono","sei","siamo"]]],C:["Mi chiamo Marco. Ho venti anni e abito a Roma. Ho una sorella.","¿Dónde vive Marco?",["Milán","Roma","Nápoles"],1]},
A2:{T:[["Comida","il pane=el pan;l'acqua=el agua;la mela=la manzana;il formaggio=el queso;il caffè=el café;il conto=la cuenta"],["Rutina","svegliarsi=despertarse;lavorare=trabajar;la colazione=el desayuno;la sera=la tarde-noche;di solito=normalmente;tornare=volver"]],g:["Passato prossimo","Auxiliar avere/essere + participio. Ej.: Ho mangiato una pizza. Sono andato al cinema."],F:[["Ieri ho ___ la pizza.","mangiato",["mangiato","mangio","mangerò"]],["Ieri io ___ al cinema.","sono andato",["ho andato","sono andato","vado"]]],C:["Ieri ho comprato il pane e il formaggio al mercato. Poi sono tornato a casa e ho preparato il pranzo.","¿Qué compró ayer?",["Pan y queso","Café y leche","Fruta"],0]},
B1:{T:[["Viajes","il biglietto=el billete;la stazione=la estación;il ritardo=el retraso;la prenotazione=la reserva;partire=partir;il bagaglio=el equipaje"]],g:["Imperfetto","Describe hábitos y situaciones pasadas. Ej.: Da bambino giocavo a calcio."],F:[["Da piccolo ___ spesso al mare.","andavo",["andavo","vado","andrò"]]],C:["Quando ero bambina, passavo le estati dai nonni. Ogni mattina andavamo al mercato insieme.","¿Con quién pasaba los veranos?",["Con sus amigos","Con sus abuelos","Sola"],1]},
B2:{T:[["Trabajo","il colloquio=la entrevista;lo stipendio=el sueldo;l'azienda=la empresa;il contratto=el contrato;la riunione=la reunión;il traguardo=la meta"]],g:["Congiuntivo","Se usa tras creencias y dudas. Ej.: Penso che tu abbia ragione."],F:[["Penso che lui ___ ragione.","abbia",["ha","abbia","avrà"]]],C:["Credo che l'azienda debba investire di più nella formazione, altrimenti perderà i dipendenti migliori.","¿Qué propone el autor?",["Reducir sueldos","Invertir en formación","Cerrar la empresa"],1]},
C1:{T:[["Conectores y abstracciones","nonostante=a pesar de;pertanto=por lo tanto;tuttavia=sin embargo;auspicare=desear;il consenso=el consenso;affrontare=afrontar"]],g:["Periodo ipotetico (irrealidad)","Se + congiuntivo trapassato, condizionale passato. Ej.: Se avessi saputo, sarei venuto."],F:[["Se ___ saputo, sarei venuto.","avessi",["ho","avessi","avrei"]]],C:["Nonostante le difficoltà, il progetto è stato completato; tuttavia, resta da valutarne l'impatto a lungo termine.","¿Se completó el proyecto?",["Sí","No","Se canceló"],0]},
C2:{T:[["Modismos","in bocca al lupo=¡mucha suerte!;costare un occhio della testa=costar un ojo de la cara;prendere due piccioni con una fava=matar dos pájaros de un tiro;non vedo l'ora=estoy deseando;meno male=menos mal;darsi da fare=ponerse manos a la obra"]],g:["Registro y modismos","Los modismos no se traducen literalmente: aprende su sentido y úsalos en contexto."],F:[["Non ___ l'ora di vederti.","vedo",["vedo","guardo","sento"]]],C:["Ho fatto il possibile, ma l'esame è stato difficile. In bocca al lupo a chi lo farà dopo di me!","¿Qué le desea a los siguientes?",["Suerte","Silencio","Descanso"],0]}};
// Estado y progreso
let S=JSON.parse(localStorage.lp||'{"xp":0,"w":{},"d":{},"e":{},"days":[]}'),U=null,sb=null,lv='A1',cur='inicio',Q=null,LW=[],CD=[],ci=0,ch=[],sub='t';
const dk=t=>new Date(t).toISOString().slice(0,10);
function streak(){let n=0,t=Date.now();if(!S.days.includes(dk(t)))t-=864e5;while(S.days.includes(dk(t))){n++;t-=864e5}return n}
async function save(){const k=dk(Date.now());if(!S.days.includes(k))S.days.push(k);S.t=Date.now();localStorage.lp=JSON.stringify(S);if(sb&&U)try{await sb.from('progress').upsert({user_id:U.id,data:S,updated_at:new Date().toISOString()})}catch(e){}}
async function sync(){if(!sb||!U)return;try{const{data}=await sb.from('progress').select('data').eq('user_id',U.id).maybeSingle();if(data&&data.data&&(data.data.t||0)>(S.t||0)){S={xp:0,w:{},d:{},e:{},days:[],...data.data};localStorage.lp=JSON.stringify(S)}else await save()}catch(e){}}
// Audio
const say=t=>{if(!window.speechSynthesis)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='it-IT';u.rate=.85;speechSynthesis.speak(u)};
// Datos derivados
const W1=(l,i)=>D[l].T[i][1].split(';').map(p=>{const[a,b]=p.split('=');return{it:a,es:b,k:l+a}});
const W=l=>D[l].T.flatMap((_,i)=>W1(l,i));
const vq=ws=>ws.map(w=>({q:`¿Qué significa «${w.it}»?`,a:w.es,say:w.it,o:sh([w.es,...sh(LV.flatMap(W).filter(x=>x.es!=w.es)).slice(0,2).map(x=>x.es)])}));
const wq=ws=>ws.map(w=>({q:`Escribe en italiano: <b>${w.es}</b>`,a:w.it}));
const lq=ws=>ws.map(w=>({q:'Escucha y elige lo que oyes',say:w.it,a:w.it,o:sh([w.it,...sh(W(lv).filter(x=>x.it!=w.it)).slice(0,2).map(x=>x.it)])}));
const gq=()=>D[lv].F.map(f=>({q:esc(f[0]),a:f[1],o:sh(f[2])}));
const cq=()=>{const c=D[lv].C;return[{q:`<i>${c[0]}</i><br>${c[1]}`,say:c[0],a:c[2][c[3]],o:sh(c[2])}]};
// Ejercicios
function run(items,id,back){Q={items,i:0,s:0,id,back,a:0};ask()}
function ask(){const q=Q.items[Q.i];if(!q)return end();V.innerHTML=`<div class=card><p class=m>${Q.i+1}/${Q.items.length}</p><h3>${q.q}</h3>${q.say?'<button class=g onclick="say(Q.items[Q.i].say)">🔊 Escuchar</button>':''}${q.o?q.o.map((o,j)=>`<button class="g o" onclick="ans(${j})">${esc(o)}</button>`).join(''):'<input id=ti autocapitalize=off autocomplete=off autocorrect=off><button onclick="ans()">Comprobar</button>'}<div id=fb></div></div>`;if(q.say)say(q.say)}
function ans(j){if(Q.a)return;Q.a=1;const q=Q.items[Q.i],v=q.o?q.o[j]:$('#ti').value,ok=q.o?v==q.a:nz(v)==nz(q.a);if(ok)Q.s++;$('#fb').innerHTML=`<p class="${ok?'ok':'bad'}">${ok?'¡Correcto!':'Respuesta: '+esc(q.a)}</p><button onclick="Q.i++;Q.a=0;ask()">Siguiente</button>`}
function end(){const p=Math.round(100*Q.s/Q.items.length);S.d[Q.id]=Math.max(S.d[Q.id]||0,p);S.xp+=Q.s*10;let x='';if(Q.id.startsWith('ex:')){const l=Q.id.slice(3);S.e[l]=Math.max(S.e[l]||0,p);x=p>=70?'<p class=ok>¡Examen aprobado!</p>':'<p class=bad>Necesitas 70% para aprobar. ¡Repasa e inténtalo otra vez!</p>'}save();V.innerHTML=`<div class=card><h2>${p}%</h2><p>${Q.s} de ${Q.items.length} correctas</p>${x}<button onclick="TB[Q.back]()">Continuar</button></div>`}
function exam(){run([...vq(sh(W(lv)).slice(0,5)),...gq(),...cq(),...wq(sh(W(lv)).slice(0,3))],'ex:'+lv,'acad')}
// Vistas
const TB={
inicio(){V.innerHTML=`<h1>LinguaPro</h1><p class=m><i>Il tuo italiano, senza limiti</i></p><div class=card><b>${S.xp} XP</b> · Racha de ${streak()} días<br><span class=m>${U?'Progreso sincronizado en tu cuenta.':'Sin cuenta: el progreso se guarda solo en este dispositivo.'}</span></div><div class=card><h3>Empieza a practicar</h3><button onclick="go('acad')">Academia</button><button class=g onclick="go('vocab')">Repasar palabras</button><button class=g onclick="go('hablar')">Hablar con el tutor</button></div><div class=card><p class=m>Ejemplo: <b>Come stai?</b> — ¿Cómo estás? <button class=g onclick="say('Come stai?')">🔊</button></p></div>`},
acad(){const d=D[lv];V.innerHTML=`<h2>Academia</h2>${LV.map(l=>`<button class="${l==lv?'':'g'}" onclick="lv='${l}';TB.acad()">${l}</button>`).join('')}${d.T.map((t,i)=>`<div class=card><h3>${t[0]}</h3><p class=m>${t[1].split(';').length} palabras${S.d[lv+':'+i]!=null?' · mejor nota '+S.d[lv+':'+i]+'%':''}</p><button onclick="les(${i})">Estudiar</button></div>`).join('')}<div class=card><h3>${d.g[0]}</h3><p>${d.g[1]}</p><button onclick="run(gq(),'${lv}:g','acad')">Gramática</button><button class=g onclick="run(cq(),'${lv}:c','acad')">Comprensión</button></div><div class=card><h3>Examen ${lv}</h3><p class=m>Mejor nota: ${S.e[lv]!=null?S.e[lv]+'%':'–'}. Se aprueba con 70%.</p><button onclick="exam()">Hacer examen</button></div>`},
hablar(){V.innerHTML=`<h2>Hablar</h2><button class="${sub=='t'?'':'g'}" onclick="sub='t';TB.hablar()">Tutor IA</button><button class="${sub=='l'?'':'g'}" onclick="sub='l';TB.hablar()">Leer en voz alta</button><div id=hb></div>`;sub=='t'?tutor():lector()},
vocab(){CD=sh(LV.flatMap(W).filter(w=>!S.w[w.k]||S.w[w.k].d<=Date.now())).slice(0,15);ci=0;card()},
prog(){const dn=l=>D[l].T.filter((_,i)=>S.d[l+':'+i]!=null).length;V.innerHTML=`<h2>Progreso</h2><div class=card><b>${S.xp} XP</b> · Racha ${streak()} días · Palabras dominadas: ${Object.values(S.w).filter(x=>x.b>=3).length}</div>${LV.map(l=>{const n=D[l].T.length;return`<div class=card><b>${l}</b> <span class=m>${dn(l)}/${n} lecciones · examen: ${S.e[l]!=null?S.e[l]+'%':'–'}</span><div class=bar><i style="width:${Math.round(100*dn(l)/n)}%"></i></div></div>`}).join('')}`},
perfil(){if(!sb)return V.innerHTML='<div class=card><h3>Cuentas no configuradas</h3><p>Rellena config.js con la URL y la clave anon de Supabase (ver README).</p></div>';V.innerHTML=U?`<h2>Perfil</h2><div class=card><p>${esc(U.email)}</p><p class=m>Tu progreso se sincroniza entre dispositivos.</p><button onclick="sync().then(()=>TB.perfil())">Sincronizar ahora</button><button class=g onclick="sb.auth.signOut()">Cerrar sesión</button></div>`:`<h2>Perfil</h2><div class=card><input id=em type=email placeholder="Correo" autocomplete=email><input id=pw type=password placeholder="Contraseña (mínimo 6)" autocomplete=current-password><button onclick="auth('in')">Entrar</button><button class=g onclick="auth('up')">Crear cuenta</button><button class=g onclick="auth('rs')">Recuperar contraseña</button><p id=am class=m></p></div>`}};
function go(t){cur=t;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==t));TB[t]();scrollTo(0,0)}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.t));
function les(i){LW=W1(lv,i);V.innerHTML=`<h2>${D[lv].T[i][0]}</h2><button class=g onclick="TB.acad()">← Volver</button>${LW.map((w,j)=>`<div class=card><b>${esc(w.it)}</b> — ${esc(w.es)} <button class=g onclick="say(LW[${j}].it)">🔊</button></div>`).join('')}<button onclick="run(vq(LW),'${lv}:${i}','acad')">Test de significado</button><button class=g onclick="run(wq(LW),'${lv}:${i}w','acad')">Escritura</button><button class=g onclick="run(lq(LW),'${lv}:${i}l','acad')">Escucha</button>`}
function card(){const w=CD[ci];if(!w)return V.innerHTML='<h2>Repaso</h2><div class=card><p>No quedan tarjetas por ahora. ¡Vuelve más tarde!</p></div>';V.innerHTML=`<h2>Repaso</h2><p class=m>${ci+1}/${CD.length}</p><div class=card style="text-align:center"><h2>${esc(w.it)}</h2><button class=g onclick="say(CD[ci].it)">🔊</button><p id=r class=m>&nbsp;</p><button onclick="$('#r').textContent=CD[ci].es">Ver traducción</button><br><button onclick="rate(1)">La sabía</button><button class=g onclick="rate(0)">Repasar</button></div>`}
function rate(ok){const k=CD[ci].k,b=(S.w[k]||{}).b||0,nb=ok?Math.min(b+1,4):0;S.w[k]={b:nb,d:Date.now()+[0,1,3,7,14][nb]*864e5};S.xp+=ok?5:1;save();ci++;card()}
// Tutor IA
function tutor(){$('#hb').innerHTML=U?`<div class=card><select id=md><option value=conv>Conversar en italiano</option><option value=corr>Corregir mi texto</option><option value=ej>Proponer ejercicios</option><option value=dud>Preguntar en español</option></select><select id=tl>${LV.map(l=>`<option ${l==lv?'selected':''}>${l}</option>`).join('')}</select><div id=chat>${ch.map(m=>`<div class="b ${m.role=='user'?'u':'a'}">${esc(m.content)}</div>`).join('')}</div><textarea id=tx rows=2 placeholder="Scrivi qui… / Escribe aquí…"></textarea><button onclick="send()">Enviar</button><button class=g onclick="ch=[];tutor()">Nueva charla</button></div>`:'<div class=card>Inicia sesión en Perfil para usar el tutor.</div>'}
function add(r,t){const d=document.createElement('div');d.className='b '+(r=='user'?'u':'a');d.textContent=t;$('#chat').appendChild(d);d.scrollIntoView({block:'end'})}
async function send(){const t=$('#tx').value.trim();if(!t)return;$('#tx').value='';ch.push({role:'user',content:t});add('user',t);try{const{data}=await sb.auth.getSession(),r=await fetch('/.netlify/functions/ai-tutor',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+data.session.access_token},body:JSON.stringify({messages:ch.slice(-12),level:$('#tl').value,mode:$('#md').value})}),j=await r.json();if(!r.ok)throw Error(j.error||r.status);ch.push({role:'assistant',content:j.reply});add('assistant',j.reply);S.xp+=3;save()}catch(e){ch.pop();add('assistant','Error: '+e.message)}}
// Lectura y reconocimiento de voz
function lector(){$('#hb').innerHTML=`<div class=card><textarea id=lt rows=4>${esc(D[lv].C[0])}</textarea><button onclick="say($('#lt').value)">🔊 Escuchar</button><button class=g onclick="rec()">🎙 Grabar mi lectura</button><div id=rs></div><p class=m><b>Límites:</b> el reconocimiento de voz del navegador transcribe lo que entiende; no puntúa tu pronunciación real. Puede fallar por ruido, acento o micrófono, no mide entonación ni sonidos concretos y varía según el navegador (mejor en Safari o Chrome). Úsalo solo como guía y compara siempre con el audio modelo.</p></div>`}
function rec(){const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R)return $('#rs').innerHTML='<p class=bad>Tu navegador no admite reconocimiento de voz.</p>';const r=new R();r.lang='it-IT';r.onresult=e=>{const h=e.results[0][0].transcript,pool=nz(h).split(' '),tg=nz($('#lt').value).split(' ').filter(Boolean),miss=tg.filter(w=>{const i=pool.indexOf(w);if(i<0)return true;pool.splice(i,1);return false}),p=Math.round(100*(tg.length-miss.length)/tg.length);S.xp+=2;save();$('#rs').innerHTML=`<p>Coincidencia: <b>${p}%</b></p><p class=m>Se entendió: ${esc(h)}</p>${miss.length?`<p class=bad>No reconocidas: ${esc(miss.join(', '))}</p>`:'<p class=ok>Todas las palabras reconocidas.</p>'}`};r.onerror=e=>$('#rs').innerHTML='<p class=bad>Error: '+esc(e.error)+'</p>';$('#rs').textContent='Escuchando… lee el texto en voz alta.';r.start()}
// Cuentas
async function auth(m){const e=$('#em').value.trim(),p=$('#pw').value,msg=t=>$('#am').textContent=t;let r;if(m=='rs'){r=await sb.auth.resetPasswordForEmail(e,{redirectTo:location.origin});return msg(r.error?r.error.message:'Te hemos enviado un enlace para restablecer la contraseña.')}if(m=='in')r=await sb.auth.signInWithPassword({email:e,password:p});else{r=await sb.auth.signUp({email:e,password:p});if(!r.error&&!r.data.session)return msg('Revisa tu correo para confirmar la cuenta.')}if(r.error)msg(r.error.message)}
function recov(){V.innerHTML='<div class=card><h3>Nueva contraseña</h3><input id=np type=password placeholder="Nueva contraseña" autocomplete=new-password><button onclick="newpw()">Guardar</button><p id=am class=m></p></div>'}
async function newpw(){const r=await sb.auth.updateUser({password:$('#np').value});if(r.error)$('#am').textContent=r.error.message;else go('perfil')}
const C=window.LP_CONFIG||{};
if(C.SUPABASE_URL&&C.SUPABASE_ANON_KEY&&!C.SUPABASE_URL.includes('TU-PROYECTO')&&window.supabase){sb=supabase.createClient(C.SUPABASE_URL,C.SUPABASE_ANON_KEY);sb.auth.onAuthStateChange((ev,s)=>{U=s?s.user:null;if(ev=='PASSWORD_RECOVERY')return recov();setTimeout(async()=>{if(U)await sync();if(cur=='perfil'||cur=='inicio')TB[cur]()},0)})}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
go('inicio');
</script></body></html>
