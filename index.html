A1:{T:[["Colores y adjetivos","rosso=rojo;blu=azul;verde=verde;giallo=amarillo;nero=negro;bianco=blanco;grande=grande;piccolo=pequeño"],["Días de la semana","lunedì=lunes;martedì=martes;mercoledì=miércoles;giovedì=jueves;venerdì=viernes;sabato=sábado;domenica=domingo;oggi=hoy"],["Verbos básicos","avere=tener;fare=hacer;andare=ir;mangiare=comer;bere=beber;parlare=hablar;vivere=vivir;volere=querer"],["Presentarse","Mi chiamo…=Me llamo…;Come ti chiami?=¿Cómo te llamas?;Piacere=Encantado;Di dove sei?=¿De dónde eres?;Come stai?=¿Cómo estás?;Sto bene=Estoy bien;Non capisco=No entiendo;Parli inglese?=¿Hablas inglés?"]],F:[["Noi ___ amici.","siamo",["siamo","siete","sono"]],["Lei ___ italiana.","è",["è","sei","sono"]]],X:[["Oggi è lunedì. Vado a scuola con mia sorella. Mangio una mela.","¿Con quién va al colegio?",["Con su hermana","Con su madre","Solo"],0]]},
A2:{T:[["La ciudad","la strada=la calle;la piazza=la plaza;il negozio=la tienda;la farmacia=la farmacia;a destra=a la derecha;a sinistra=a la izquierda;dritto=recto;vicino=cerca"],["El tiempo","il tempo=el tiempo;piove=llueve;fa caldo=hace calor;fa freddo=hace frío;il sole=el sol;la neve=la nieve;l'estate=el verano;l'inverno=el invierno"],["La casa","la cucina=la cocina;la camera=el dormitorio;il bagno=el baño;il tavolo=la mesa;la finestra=la ventana;la porta=la puerta;il divano=el sofá;il giardino=el jardín"],["De compras","Quanto costa?=¿Cuánto cuesta?;il prezzo=el precio;lo sconto=el descuento;pagare=pagar;la taglia=la talla;i soldi=el dinero;economico=barato;caro=caro"]],F:[["Questa mattina io ___ presto.","mi sono svegliato",["mi sono svegliato","mi sveglio","svegliato"]]],X:[["Per andare alla stazione vai sempre dritto e poi gira a destra. È vicino alla piazza.","¿Hacia dónde gira?",["A la derecha","A la izquierda","No gira"],0]]},
B1:{T:[["Salud","il medico=el médico;la febbre=la fiebre;il mal di testa=el dolor de cabeza;la ricetta=la receta;la medicina=la medicina;stare male=encontrarse mal;guarire=curarse;l'ospedale=el hospital"],["Tecnología","il cellulare=el móvil;la password=la contraseña;scaricare=descargar;il computer=el ordenador;la rete=la red;collegarsi=conectarse;il messaggio=el mensaje;lo schermo=la pantalla"],["Opiniones","secondo me=en mi opinión;sono d'accordo=estoy de acuerdo;per esempio=por ejemplo;in realtà=en realidad;inoltre=además;comunque=de todos modos;secondo te?=¿tú qué piensas?;perché=porque / por qué"],["Futuro","domani=mañana;la settimana prossima=la semana que viene;sarò=seré;andrò=iré;spero di=espero…;il progetto=el proyecto;fra poco=dentro de poco;presto=pronto"]],F:[["Domani ___ a Roma.","andrò",["andrò","andavo","sono andato"]],["Mentre ___ la tv, è squillato il telefono.","guardavo",["guardavo","guardo","guarderò"]]],X:[["Ho il mal di testa e un po' di febbre, quindi domani mattina andrò dal medico.","¿Cuándo irá al médico?",["Mañana por la mañana","Ayer","Esta noche"],0]]},
B2:{T:[["Medio ambiente","l'ambiente=el medio ambiente;l'inquinamento=la contaminación;il riscaldamento globale=el calentamiento global;riciclare=reciclar;i rifiuti=los residuos;sostenibile=sostenible;l'energia=la energía;risparmiare=ahorrar"],["Sociedad","la società=la sociedad;il diritto=el derecho;il governo=el gobierno;la cittadinanza=la ciudadanía;la disuguaglianza=la desigualdad;il lavoro=el trabajo;l'istruzione=la educación;la sfida=el desafío"],["Emociones","deluso=decepcionado;orgoglioso=orgulloso;preoccupato=preocupado;sollevato=aliviado;imbarazzato=avergonzado;entusiasta=entusiasta;geloso=celoso;nostalgico=nostálgico"]],F:[["Spero che tu ___ presto.","guarisca",["guarisca","guarisci","guarirai"]],["È importante che lei ___ la verità.","dica",["dica","dice","dirà"]]],X:[["Riciclare i rifiuti è importante, ma servono anche politiche più sostenibili da parte del governo.","¿Qué hace falta además de reciclar?",["Políticas sostenibles","Más coches","Menos escuelas"],0]]},

C2:{T:[["Registro formal","Gentile Signore=Estimado señor;in allegato=adjunto;La ringrazio=le agradezco;distinti saluti=atentamente;con la presente=por la presente;in merito a=en relación con;La prego di=le ruego que;porgere=ofrecer"],["Matices literarios","sfumatura=matiz;aleggiare=flotar en el aire;vieppiù=cada vez más;financo=incluso;ineluttabile=ineludible;tergiversare=andarse por las ramas;esimersi=eximirse;aver sentore=tener indicios"],["Proverbios","meglio tardi che mai=más vale tarde que nunca;chi dorme non piglia pesci=al que duerme no le caen peces;tutto è bene quel che finisce bene=bien está lo que bien acaba;sbagliando s'impara=se aprende equivocándose;l'abito non fa il monaco=el hábito no hace al monje;ride bene chi ride ultimo=ríe mejor quien ríe el último;paese che vai usanza che trovi=donde fueres haz lo que vieres;squadra che vince non si cambia=no cambies lo que funciona"]],F:[["Meglio tardi ___ mai.","che",["che","di","da"]],["La ringrazio ___ la cortese attenzione.","per",["per","di","con"]]],X:[["Gentile Dottoressa, in merito alla Sua richiesta, Le invio in allegato la documentazione. Distinti saluti.","¿Qué adjunta?",["La documentación","Una factura","Una foto"],0]]}};
for(const l in EX){D[l].T.push(...EX[l].T);D[l].F.push(...EX[l].F);D[l].X=EX[l].X}
// Estado y progreso
let ri=0,PA=null,S=JSON.parse(localStorage.lp||'{"xp":0,"w":{},"d":{},"e":{},"days":[]}'),U=null,sb=null,lv='A1',cur='inicio',Q=null,LW=[],CD=[],ci=0,ch=[],sub='t';
const dk=t=>new Date(t).toISOString().slice(0,10);
function streak(){let n=0,t=Date.now();if(!S.days.includes(dk(t)))t-=864e5;while(S.days.includes(dk(t))){n++;t-=864e5}return n}
const E0=()=>({xp:0,w:{},d:{},e:{},days:[]});
function mg(a,b){const r=E0();r.xp=Math.max(a.xp||0,b.xp||0);['d','e'].forEach(k=>{const o={...(a[k]||{})};for(const x in(b[k]||{}))o[x]=Math.max(o[x]||0,b[k][x]);r[k]=o});const w={...(a.w||{})};for(const x in(b.w||{})){const p=w[x],q=b.w[x];w[x]=!p||(q.b||0)>(p.b||0)||((q.b||0)==(p.b||0)&&(q.d||0)>(p.d||0))?q:p}r.w=w;r.days=[...new Set([...(a.days||[]),...(b.days||[])])].sort();r.t=Date.now();return r}
async function save(){const k=dk(Date.now());if(!S.days.includes(k))S.days.push(k);S.t=Date.now();localStorage.lp=JSON.stringify(S);if(sb&&U)try{const{error}=await sb.from('progress').upsert({user_id:U.id,data:S,updated_at:new Date().toISOString()});if(error)console.warn('No se pudo sincronizar:',error.message)}catch(e){console.warn('Sin conexión para sincronizar')}}
async function sync(){if(!sb||!U)return;try{const{data,error}=await sb.from('progress').select('data').eq('user_id',U.id).maybeSingle();if(error)throw error;if(localStorage.lpuid&&localStorage.lpuid!=U.id)S=E0();if(data&&data.data)S=mg(S,{...E0(),...data.data});localStorage.lpuid=U.id;await save()}catch(e){console.warn('Sync:',e.message||e)}}
// Audio
const say=t=>{if(!window.speechSynthesis)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='it-IT';u.rate=.85;speechSynthesis.speak(u)};
// Datos derivados
const W1=(l,i)=>D[l].T[i][1].split(';').map(p=>{const[a,b]=p.split('=');return{it:a,es:b,k:l+a}});
const W=l=>D[l].T.flatMap((_,i)=>W1(l,i));
const vq=ws=>ws.map(w=>({q:`¿Qué significa «${w.it}»?`,a:w.es,say:w.it,o:sh([w.es,...sh(LV.flatMap(W).filter(x=>x.es!=w.es)).slice(0,2).map(x=>x.es)])}));

const lq=ws=>ws.map(w=>({q:'Escucha y elige lo que oyes',say:w.it,a:w.it,o:sh([w.it,...sh(W(lv).filter(x=>x.it!=w.it)).slice(0,2).map(x=>x.it)])}));
const gq=()=>D[lv].F.map(f=>({q:esc(f[0]),a:f[1],o:sh(f[2])}));
const RD=l=>[D[l].C,...(D[l].X||[])];
const cq=()=>RD(lv).map(c=>({q:`<i>${c[0]}</i><br>${c[1]}`,say:c[0],a:c[2][c[3]],o:sh(c[2])}));
// Ejercicios
function run(items,id,back){Q={items,i:0,s:0,id,back,a:0};ask()}
function ask(){const q=Q.items[Q.i];if(!q)return end();V.innerHTML=`<div class=card><p class=m>${Q.i+1}/${Q.items.length}</p><h3>${q.q}</h3>${q.say?'<button class=g onclick="say(Q.items[Q.i].say)">🔊 Escuchar</button>':''}${q.o?q.o.map((o,j)=>`<button class="g o" onclick="ans(${j})">${esc(o)}</button>`).join(''):'<input id=ti autocapitalize=off autocomplete=off autocorrect=off><button onclick="ans()">Comprobar</button>'}<div id=fb></div></div>`;if(q.say)say(q.say)}
function ans(j){if(Q.a)return;Q.a=1;const q=Q.items[Q.i],v=q.o?q.o[j]:$('#ti').value,ok=q.o?v==q.a:nz(v)==nz(q.a);if(ok)Q.s++;$('#fb').innerHTML=`<p class="${ok?'ok':'bad'}">${ok?'¡Correcto!':'Respuesta: '+esc(q.a)}</p><button onclick="Q.i++;Q.a=0;ask()">Siguiente</button>`}
function end(){const p=Math.round(100*Q.s/Q.items.length);S.d[Q.id]=Math.max(S.d[Q.id]||0,p);S.xp+=Q.s*10;let x='';if(Q.id.startsWith('ex:')){const l=Q.id.slice(3);S.e[l]=Math.max(S.e[l]||0,p);x=p>=70?'<p class=ok>¡Examen aprobado!</p>':'<p class=bad>Necesitas 70% para aprobar. ¡Repasa e inténtalo otra vez!</p>'}save();V.innerHTML=`<div class=card><h2>${p}%</h2><p>${Q.s} de ${Q.items.length} correctas</p>${x}<button onclick="TB[Q.back]()">Continuar</button></div>`}
function exam(){run([...vq(sh(W(lv)).slice(0,5)),...gq(),...cq(),...wq(sh(W(lv)).slice(0,3))],'ex:'+lv,'acad')}
// Vistas
const TB={
inicio(){V.innerHTML=`<h1>LinguaPro</h1><p class=m><i>Il tuo italiano, senza limiti</i></p><div class=card><b>${S.xp} XP</b> · Racha de ${streak()} días<br><span class=m>${U?'Progreso sincronizado en tu cuenta.':'Sin cuenta: el progreso se guarda solo en este dispositivo.'}</span></div><div class=card><h3>Empieza a practicar</h3><button onclick="go('acad')">Academia</button><button class=g onclick="go('vocab')">Repasar palabras</button><button class=g onclick="go('hablar')">Hablar con el tutor</button></div><div class=card><p class=m>Ejemplo: <b>Come stai?</b> — ¿Cómo estás? <button class=g onclick="say('Come stai?')">🔊</button></p></div>`},
acad(){const d=D[lv];V.innerHTML=`<h2>Academia</h2>${LV.map(l=>`<button class="${l==lv?'':'g'}" onclick="lv='${l}';TB.acad()">${l}</button>`).join('')}<div class=card><h3>Lecciones guiadas ${lv}</h3><p class=m>${(L[lv]||[]).length} de 50 lecciones completas</p><button onclick="TB.lecs()">Ver lecciones</button></div>${d.T.map((t,i)=>`<div class=card><h3>${t[0]}</h3><p class=m>${t[1].split(';').length} palabras${S.d[lv+':'+i]!=null?' · mejor nota '+S.d[lv+':'+i]+'%':''}</p><button onclick="les(${i})">Estudiar</button></div>`).join('')}<div class=card><h3>${d.g[0]}</h3><p>${d.g[1]}</p><button onclick="run(gq(),'${lv}:g','acad')">Gramática</button><button class=g onclick="run(cq(),'${lv}:c','acad')">Comprensión</button></div><div class=card><h3>Examen ${lv}</h3><p class=m>Mejor nota: ${S.e[lv]!=null?S.e[lv]+'%':'–'}. Se aprueba con 70%.</p><button onclick="exam()">Hacer examen</button></div>`},
hablar(){V.innerHTML=`<h2>Hablar</h2><button class="${sub=='t'?'':'g'}" onclick="sub='t';TB.hablar()">Tutor IA</button><button class="${sub=='l'?'':'g'}" onclick="sub='l';TB.hablar()">Leer en voz alta</button><div id=hb></div>`;sub=='t'?tutor():lector()},

["Saludos y despedidas","Ciao=Hola / Adiós;Buongiorno=Buenos días;Buonasera=Buenas tardes;Buonanotte=Buenas noches;Arrivederci=Adiós;Grazie=Gracias;Prego=De nada;Per favore=Por favor","«Buongiorno» se usa por la mañana y hasta la tarde; «Buonasera» al caer el día. «Ciao» es informal y sirve para saludar y despedirse.","Buongiorno, signora!=¡Buenos días, señora!;Ciao, Luca!=¡Hola, Luca!;Grazie mille!=¡Muchas gracias!;Prego, di niente.=De nada, no hay de qué.","Marco entra in un bar. Dice: «Buongiorno!» Il barista risponde: «Buongiorno! Cosa desidera?» Marco chiede un caffè: «Un caffè, per favore.» Poi dice «Grazie» e «Arrivederci».","Marco entra en un bar. Dice: «¡Buenos días!» El camarero responde: «¡Buenos días! ¿Qué desea?» Marco pide un café: «Un café, por favor.» Luego dice «Gracias» y «Adiós».","¿Qué pide Marco?|Un té|Un café|Un zumo|1#¿Con qué palabra se despide?|Ciao|Buonasera|Arrivederci|2","___, signora!|Buongiorno|Arrivederci|Grazie#Un caffè, per ___.|favore|prego|ciao","Gracias=Grazie#Buenos días=Buongiorno#Por favor=Per favore"],
["Presentarse","Mi chiamo…=Me llamo…;Come ti chiami?=¿Cómo te llamas?;Piacere=Encantado/a;Sono spagnolo=Soy español;Sono di Madrid=Soy de Madrid;Ho trent'anni=Tengo treinta años;Come stai?=¿Cómo estás?;Sto bene=Estoy bien","Nombre: «Mi chiamo» + nombre. Origen: «Sono di» + ciudad. Nacionalidad: «Sono» + adjetivo (spagnolo/spagnola). La edad se dice con «avere»: Ho vent'anni.","Mi chiamo Anna.=Me llamo Anna.;Sono di Roma.=Soy de Roma.;Ho venticinque anni.=Tengo veinticinco años.;Piacere di conoscerti!=¡Encantado de conocerte!","Ciao! Mi chiamo Elena. Sono spagnola e sono di Valencia. Ho ventotto anni. E tu? Come ti chiami? Piacere di conoscerti!","¡Hola! Me llamo Elena. Soy española y soy de Valencia. Tengo veintiocho años. ¿Y tú? ¿Cómo te llamas? ¡Encantada de conocerte!","¿De dónde es Elena?|De Roma|De Valencia|De Milán|1#¿Cuántos años tiene Elena?|Veintiocho|Veinticinco|Treinta|0","___ chiamo Marco.|Mi|Ti|Si#Ho venti ___.|anni|anno|età#Sono ___ Madrid.|di|da|in","Me llamo Marco=Mi chiamo Marco#Soy de Madrid=Sono di Madrid#Tengo veinte años=Ho venti anni"],
["Números del 11 al 20","undici=once;dodici=doce;tredici=trece;quattordici=catorce;quindici=quince;sedici=dieciséis;diciassette=diecisiete;diciotto=dieciocho;diciannove=diecinueve;venti=veinte","Del 11 al 16 los números terminan en «-dici». Del 17 al 19 se forman con «dici-» + la unidad: diciassette, diciotto, diciannove.","Ho quindici euro.=Tengo quince euros.;Ci sono venti studenti.=Hay veinte estudiantes.;Il numero è il dodici.=El número es el doce.;Ho sedici anni.=Tengo dieciséis años.","Oggi in classe ci sono venti studenti. Dodici sono ragazze e otto sono ragazzi. L'insegnante ha quindici libri sul tavolo.","Hoy en clase hay veinte estudiantes. Doce son chicas y ocho son chicos. La profesora tiene quince libros sobre la mesa.","¿Cuántos estudiantes hay?|Doce|Quince|Veinte|2#¿Cuántas chicas hay?|Doce|Ocho|Veinte|0","Ci sono ___ studenti. (20)|venti|dodici|quindici#Ho ___ euro. (15)|quindici|cinque|sedici","Quince=Quindici#Doce=Dodici#Diecinueve=Diciannove"],
["El verbo essere (ser/estar)","io sono=yo soy;tu sei=tú eres;lui è=él es;lei è=ella es;noi siamo=nosotros somos;voi siete=vosotros sois;loro sono=ellos son;stanco=cansado","«Essere» es irregular: io sono, tu sei, lui/lei è, noi siamo, voi siete, loro sono. Sirve para identidad, origen y estados. El pronombre sujeto suele omitirse.","Sono felice.=Estoy feliz.;Sei di Roma?=¿Eres de Roma?;Siamo amici.=Somos amigos.;Loro sono in ritardo.=Ellos están retrasados.","Siamo Luca e Sara. Siamo amici da dieci anni. Luca è italiano e Sara è spagnola. Oggi sono stanchi ma sono felici.","Somos Luca y Sara. Somos amigos desde hace diez años. Luca es italiano y Sara es española. Hoy están cansados pero están felices.","¿Desde hace cuánto son amigos?|Un año|Diez años|Veinte años|1#¿Qué nacionalidad tiene Sara?|Italiana|Española|Francesa|1","Noi ___ amici.|siamo|siete|sono#Tu ___ stanco.|sei|è|sono#Lei ___ spagnola.|è|sei|siamo","Yo soy feliz=Io sono felice#Nosotros somos amigos=Noi siamo amici#Tú estás cansado=Tu sei stanco"],
["Los artículos","il libro=el libro;la casa=la casa;lo studente=el estudiante;l'amico=el amigo;un caffè=un café;una pizza=una pizza;i libri=los libros;le case=las casas","Determinado: il (masc.), lo (antes de s+consonante o z), l' (antes de vocal), la (fem.). Plural: i, gli, le. Indeterminado: un, uno, una, un'. Ej.: il libro → i libri.","Il libro è sul tavolo.=El libro está sobre la mesa.;Voglio una pizza.=Quiero una pizza.;Lo studente parla italiano.=El estudiante habla italiano.;Le case sono grandi.=Las casas son grandes.","Ho un amico italiano. Si chiama Paolo. Paolo ha una casa piccola e un gatto. Il gatto dorme sul divano.","Tengo un amigo italiano. Se llama Paolo. Paolo tiene una casa pequeña y un gato. El gato duerme en el sofá.","¿Qué tiene Paolo?|Una casa grande|Una casa pequeña y un gato|Un perro|1#¿Dónde duerme el gato?|En el sofá|En la cama|En el jardín|0","___ studente parla.|Lo|Il|La#Voglio ___ pizza.|una|un|lo#___ case sono grandi.|Le|I|Gli","El libro=Il libro#Una pizza=Una pizza#Las casas=Le case"],
["La familia","la famiglia=la familia;la madre=la madre;il padre=el padre;il fratello=el hermano;la sorella=la hermana;il nonno=el abuelo;la nonna=la abuela;i genitori=los padres","Los posesivos suelen llevar artículo (il mio libro), pero con un familiar en singular no: mia madre, mio fratello. En plural sí: i miei nonni.","Mia madre è medico.=Mi madre es médica.;Ho due fratelli.=Tengo dos hermanos.;I miei nonni abitano a Napoli.=Mis abuelos viven en Nápoles.;Mio padre lavora molto.=Mi padre trabaja mucho.","Nella mia famiglia siamo in cinque. Ci sono i miei genitori, mia sorella, mio fratello e io. I miei nonni abitano a Napoli e li visitiamo ogni estate.","En mi familia somos cinco. Están mis padres, mi hermana, mi hermano y yo. Mis abuelos viven en Nápoles y los visitamos cada verano.","¿Cuántos son en la familia?|Tres|Cinco|Siete|1#¿Dónde viven los abuelos?|En Roma|En Nápoles|En Milán|1","___ sorella è simpatica.|Mia|La mia|Mio#Ho due ___.|fratelli|fratello|fratelle#I miei ___ abitano a Napoli.|nonni|nonno|nonne","Mi madre=Mia madre#Tengo dos hermanos=Ho due fratelli#Mis abuelos=I miei nonni"],
["Verbos en -are","parlare=hablar;mangiare=comer;lavorare=trabajar;abitare=vivir;studiare=estudiar;ascoltare=escuchar;comprare=comprar;cantare=cantar","Se quita -are y se añade: -o, -i, -a, -iamo, -ate, -ano. Parlare: parlo, parli, parla, parliamo, parlate, parlano.","Parlo italiano.=Hablo italiano.;Lavori a Milano?=¿Trabajas en Milán?;Studiamo ogni giorno.=Estudiamos cada día.;Loro abitano a Roma.=Ellos viven en Roma.","Mi chiamo Giulia e abito a Torino. Lavoro in una scuola e studio inglese la sera. Mio marito cucina e io ascolto la musica. Il sabato mangiamo insieme.","Me llamo Giulia y vivo en Turín. Trabajo en una escuela y estudio inglés por la tarde. Mi marido cocina y yo escucho música. Los sábados comemos juntos.","¿Dónde trabaja Giulia?|En una escuela|En un banco|En una tienda|0#¿Qué estudia por la tarde?|Francés|Inglés|Alemán|1","Io ___ italiano. (parlare)|parlo|parli|parla#Noi ___ insieme. (mangiare)|mangiamo|mangiate|mangiano#Tu ___ a Milano. (lavorare)|lavori|lavoro|lavora","Hablo italiano=Parlo italiano#Ellos viven en Roma=Loro abitano a Roma#Estudiamos cada día=Studiamo ogni giorno"],
["En el bar y el restaurante","il caffè=el café;il cornetto=el cruasán;l'acqua=el agua;il vino=el vino;il conto=la cuenta;il menù=la carta;vorrei=quisiera;un tavolo per due=una mesa para dos","Para pedir con cortesía se usa «vorrei» (quisiera) en lugar de «voglio». Para pagar: «Il conto, per favore».","Vorrei un cappuccino.=Quisiera un capuchino.;Un tavolo per due, per favore.=Una mesa para dos, por favor.;Il conto, per favore.=La cuenta, por favor.;Vorrei dell'acqua.=Quisiera agua.","Anna e Paolo entrano in un ristorante. «Un tavolo per due, per favore.» Il cameriere porta il menù. «Vorrei una pizza e dell'acqua», dice Anna. Paolo prende un vino rosso. Alla fine chiedono il conto.","Anna y Paolo entran en un restaurante. «Una mesa para dos, por favor.» El camarero trae la carta. «Quisiera una pizza y agua», dice Anna. Paolo toma un vino tinto. Al final piden la cuenta.","¿Qué pide Anna?|Pasta y vino|Pizza y agua|Café y cruasán|1#¿Qué piden al final?|El postre|La cuenta|La carta|1","___ un caffè, per favore.|Vorrei|Voglio|Vado#Il ___, per favore.|conto|vino|tavolo#Un tavolo per ___.|due|dodici|caffè","La cuenta, por favor=Il conto, per favore#Quisiera un café=Vorrei un caffè#Una mesa para dos=Un tavolo per due"],
["Los días de la semana","lunedì=lunes;martedì=martes;mercoledì=miércoles;giovedì=jueves;venerdì=viernes;sabato=sábado;domenica=domingo;la settimana=la semana","Los días van en minúscula y son masculinos (salvo domenica). «Il sabato» = todos los sábados; «sabato» sin artículo = este sábado.","Lunedì lavoro.=El lunes trabajo.;Il sabato vado al mercato.=Los sábados voy al mercado.;Domenica mangio dai nonni.=El domingo como en casa de los abuelos.;Quanti giorni ha la settimana?=¿Cuántos días tiene la semana?","Durante la settimana lavoro dal lunedì al venerdì. Il sabato vado al mercato con mia madre. La domenica pranzo dai nonni e la sera guardo un film.","Durante la semana trabajo de lunes a viernes. Los sábados voy al mercado con mi madre. Los domingos como en casa de mis abuelos y por la noche veo una película.","¿Cuándo va al mercado?|El sábado|El lunes|El domingo|0#¿Qué hace el domingo por la noche?|Trabaja|Ve una película|Estudia|1","Lavoro dal ___ al venerdì.|lunedì|sabato|domenica#Il ___ vado al mercato.|sabato|venerdì|giovedì#La ___ pranzo dai nonni.|domenica|settimana|martedì","El lunes=Lunedì#Los sábados voy al mercado=Il sabato vado al mercato#Una semana=Una settimana"],
["Preguntas básicas","dove=dónde;come=cómo;quando=cuándo;perché=por qué / porque;chi=quién;che cosa=qué;quanto=cuánto;quale=cuál","Las palabras interrogativas van al inicio: Dove abiti? Come stai? Quando arrivi? «Perché» sirve para preguntar (¿por qué?) y para responder (porque). La voz sube al final.","Dove abiti?=¿Dónde vives?;Che cosa mangi?=¿Qué comes?;Quando arrivi?=¿Cuándo llegas?;Perché studi italiano?=¿Por qué estudias italiano?","Sara incontra un nuovo collega. «Come ti chiami? Dove abiti? Perché studi italiano?» Il collega risponde: «Mi chiamo Tom, abito a Bologna e studio italiano perché amo la cultura italiana.»","Sara conoce a un nuevo compañero. «¿Cómo te llamas? ¿Dónde vives? ¿Por qué estudias italiano?» El compañero responde: «Me llamo Tom, vivo en Bolonia y estudio italiano porque amo la cultura italiana.»","¿Dónde vive el compañero?|En Roma|En Bolonia|En Turín|1#¿Por qué estudia italiano?|Por trabajo|Porque ama la cultura italiana|Por un examen|1","___ abiti?|Dove|Come|Quando#___ ti chiami?|Come|Dove|Chi#___ studi italiano?|Perché|Quanto|Quale","¿Dónde vives?=Dove abiti?#¿Cómo te llamas?=Come ti chiami?#¿Por qué estudias italiano?=Perché studi italiano?"],
["Colores y adjetivos","rosso=rojo;blu=azul;verde=verde;giallo=amarillo;nero=negro;bianco=blanco;grande=grande;piccolo=pequeño","Los adjetivos en -o cambian (rosso, rossa, rossi, rosse); los terminados en -e solo cambian en plural (verde → verdi). Van normalmente detrás del nombre.","La mia borsa è nera.=Mi bolso es negro.;Ho una macchina rossa.=Tengo un coche rojo.;Le mele verdi sono buone.=Las manzanas verdes están buenas.;Il cielo è blu.=El cielo es azul.","Nel mio giardino c'è una casa piccola. Il tetto è rosso e le porte sono bianche. Davanti alla casa ci sono due alberi verdi grandi.","En mi jardín hay una casa pequeña. El tejado es rojo y las puertas son blancas. Delante de la casa hay dos árboles verdes y grandes.","¿De qué color es el tejado?|Rojo|Azul|Negro|0#¿Cuántos árboles hay?|Uno|Dos|Tres|1","Ho una macchina ___.|rossa|rosso|rossi#Le porte sono ___.|bianche|bianco|bianca","Una casa pequeña=Una casa piccola#El coche es rojo=La macchina è rossa"],
["La casa","la cucina=la cocina;la camera=el dormitorio;il bagno=el baño;il salotto=el salón;il tavolo=la mesa;la sedia=la silla;il letto=la cama;la finestra=la ventana","Para decir «hay»: c'è (singular) y ci sono (plural). Preposiciones de lugar: in, su, sotto, accanto a.","C'è un tavolo in cucina.=Hay una mesa en la cocina.;Ci sono due sedie.=Hay dos sillas.;Il libro è sul tavolo.=El libro está sobre la mesa.;Il gatto è sotto il letto.=El gato está debajo de la cama.","La mia casa ha quattro stanze. In cucina c'è un tavolo con quattro sedie. Il salotto ha una finestra grande. La camera è piccola, ma il letto è comodo.","Mi casa tiene cuatro habitaciones. En la cocina hay una mesa con cuatro sillas. El salón tiene una ventana grande. El dormitorio es pequeño, pero la cama es cómoda.","¿Cuántas habitaciones tiene la casa?|Dos|Cuatro|Seis|1#¿Cómo es el dormitorio?|Grande|Pequeño|Oscuro|1","___ un tavolo in cucina.|C'è|Ci sono|Sono#___ due sedie.|Ci sono|C'è|È","Hay una cama=C'è un letto#La cocina=La cucina"],
["La ciudad y las direcciones","la strada=la calle;la piazza=la plaza;il ponte=el puente;la stazione=la estación;a destra=a la derecha;a sinistra=a la izquierda;sempre dritto=todo recto;vicino=cerca","Para preguntar: «Scusi, dov'è…?». Para indicar se usa el imperativo informal: vai (ve), gira (gira), prendi (toma).","Scusi, dov'è la stazione?=Disculpe, ¿dónde está la estación?;Vai sempre dritto.=Ve todo recto.;Gira a destra.=Gira a la derecha.;La piazza è vicino.=La plaza está cerca.","Un turista chiede: «Scusi, dov'è la stazione?» Una signora risponde: «Vai sempre dritto, poi gira a sinistra. La stazione è vicino al ponte.»","Un turista pregunta: «Disculpe, ¿dónde está la estación?» Una señora responde: «Ve todo recto y luego gira a la izquierda. La estación está cerca del puente.»","¿Qué busca el turista?|La plaza|La estación|El puente|1#¿Hacia dónde gira?|Derecha|Izquierda|No gira|1","Vai sempre ___.|dritto|destra|vicino#Gira a ___.|sinistra|stazione|ponte","A la derecha=A destra#¿Dónde está la plaza?=Dov'è la piazza?"],
["La hora","l'ora=la hora;il minuto=el minuto;mezzogiorno=mediodía;mezzanotte=medianoche;presto=temprano;tardi=tarde;in punto=en punto;e mezza=y media","Se pregunta «Che ore sono?». Se responde «È l'una» para la una y «Sono le due, le tre…» para el resto. Y media = «e mezza»; y cuarto = «e un quarto».","Che ore sono?=¿Qué hora es?;Sono le tre e mezza.=Son las tres y media.;È l'una in punto.=Es la una en punto.;Arrivo tardi.=Llego tarde.","Il lunedì mi sveglio alle sette. Alle otto e un quarto prendo il treno. Arrivo al lavoro alle nove in punto. A mezzogiorno pranzo con i colleghi.","Los lunes me despierto a las siete. A las ocho y cuarto cojo el tren. Llego al trabajo a las nueve en punto. A mediodía como con los compañeros.","¿A qué hora llega al trabajo?|A las ocho|A las nueve|A las diez|1#¿Qué hace a mediodía?|Duerme|Come con los compañeros|Coge el tren|1","Che ___ sono?|ore|ora|ho#Sono le tre e ___.|mezza|punto|meno","Es la una=È l'una#Son las dos=Sono le due"],
["Verbos en -ere","leggere=leer;scrivere=escribir;vedere=ver;prendere=tomar;vivere=vivir;chiudere=cerrar;mettere=poner;correre=correr","Terminaciones de -ere: -o, -i, -e, -iamo, -ete, -ono. Leggere: leggo, leggi, legge, leggiamo, leggete, leggono.","Leggo un libro.=Leo un libro.;Scrivi un messaggio?=¿Escribes un mensaje?;Vediamo un film.=Vemos una película.;Prendono il treno.=Cogen el tren.","Ogni sera leggo un libro sul divano. Mia sorella scrive messaggi agli amici. Noi vediamo un film insieme e prendiamo un tè.","Cada noche leo un libro en el sofá. Mi hermana escribe mensajes a los amigos. Nosotros vemos una película juntos y tomamos un té.","¿Qué hace cada noche quien habla?|Lee un libro|Corre|Cocina|0#¿Qué hacen juntos?|Ven una película|Estudian|Cantan|0","Io ___ un libro. (leggere)|leggo|leggi|legge#Noi ___ un film. (vedere)|vediamo|vedete|vedono","Leo un libro=Leggo un libro#Ellos escriben=Loro scrivono"],
["Verbos en -ire","dormire=dormir;partire=salir;aprire=abrir;sentire=oír;capire=entender;finire=terminar;preferire=preferir;pulire=limpiar","Hay dos grupos: dormire (dormo, dormi, dorme, dormiamo, dormite, dormono) y los que añaden -isc-: capire (capisco, capisci, capisce, capiamo, capite, capiscono).","Capisco l'italiano.=Entiendo el italiano.;Finisci alle sei?=¿Terminas a las seis?;Dormiamo otto ore.=Dormimos ocho horas.;Il treno parte alle nove.=El tren sale a las nueve.","Il treno parte alle nove e io finisco di lavorare alle sei. Preferisco dormire tanto il sabato. Capisco quasi tutto in italiano!","El tren sale a las nueve y yo termino de trabajar a las seis. Prefiero dormir mucho los sábados. ¡Entiendo casi todo en italiano!","¿Cuándo termina de trabajar?|A las seis|A las nueve|A las cinco|0#¿Qué prefiere hacer los sábados?|Correr|Dormir mucho|Viajar|1","Io ___ l'italiano. (capire)|capisco|capisci|capiamo#Il treno ___ alle nove.|parte|parti|partono","Entiendo=Capisco#Dormimos ocho horas=Dormiamo otto ore"],
["El verbo avere","io ho=yo tengo;tu hai=tú tienes;lui ha=él tiene;noi abbiamo=nosotros tenemos;voi avete=vosotros tenéis;loro hanno=ellos tienen;fame=hambre;sete=sed","«Avere»: ho, hai, ha, abbiamo, avete, hanno (la «h» no se pronuncia). Se usa también en expresiones: avere fame, sete, sonno, caldo, freddo, y para la edad.","Ho fame.=Tengo hambre.;Hai una sorella?=¿Tienes una hermana?;Abbiamo sete.=Tenemos sed.;Loro hanno due figli.=Ellos tienen dos hijos.","Oggi abbiamo molta fame. Io ho un panino e mia sorella ha una mela. I nostri amici hanno sete e comprano dell'acqua.","Hoy tenemos mucha hambre. Yo tengo un bocadillo y mi hermana tiene una manzana. Nuestros amigos tienen sed y compran agua.","¿Qué tiene la hermana?|Un bocadillo|Una manzana|Agua|1#¿Qué compran los amigos?|Pan|Agua|Fruta|1","Io ___ fame.|ho|ha|hai#Loro ___ due figli.|hanno|ha|abbiamo","Tengo hambre=Ho fame#Tenemos sed=Abbiamo sete"],
["La comida y el mercado","il pane=el pan;il formaggio=el queso;la mela=la manzana;la carne=la carne;il pesce=el pescado;la verdura=la verdura;il latte=la leche;l'uovo=el huevo","Cantidades: «un chilo di», «un litro di», «un po' di» + nombre. Plural irregular: l'uovo → le uova.","Vorrei un chilo di mele.=Quisiera un kilo de manzanas.;Quanto costa il formaggio?=¿Cuánto cuesta el queso?;Un litro di latte, per favore.=Un litro de leche, por favor.;Compro sei uova.=Compro seis huevos.","Al mercato compro il pane, un chilo di mele e un po' di formaggio. Il pesce è fresco oggi. Pago dieci euro e dico: «Grazie, buona giornata!»","En el mercado compro pan, un kilo de manzanas y un poco de queso. El pescado está fresco hoy. Pago diez euros y digo: «¡Gracias, buen día!»","¿Qué compra por kilos?|Manzanas|Queso|Pan|0#¿Cuánto paga?|Cinco euros|Diez euros|Veinte euros|1","Un ___ di mele.|chilo|litro|pane#Un litro di ___.|latte|mele|pane","Un kilo de manzanas=Un chilo di mele#¿Cuánto cuesta?=Quanto costa?"],
["El tiempo y las estaciones","il tempo=el tiempo;il sole=el sol;la pioggia=la lluvia;la neve=la nieve;la primavera=la primavera;l'estate=el verano;l'autunno=el otoño;l'inverno=el invierno","Para el clima: «fare» (fa caldo, fa freddo) y los verbos piovere (piove) y nevicare (nevica). Pregunta: «Che tempo fa?»","Che tempo fa oggi?=¿Qué tiempo hace hoy?;Fa caldo.=Hace calor.;Piove molto in autunno.=Llueve mucho en otoño.;In inverno nevica.=En invierno nieva.","In estate c'è il sole e fa molto caldo. In autunno piove spesso. In inverno nevica in montagna. La primavera è la mia stagione preferita.","En verano hay sol y hace mucho calor. En otoño llueve a menudo. En invierno nieva en la montaña. La primavera es mi estación preferida.","¿Cuándo llueve a menudo?|En verano|En otoño|En primavera|1#¿Cuál es su estación preferida?|Primavera|Invierno|Verano|0","Che tempo ___ oggi?|fa|è|ha#In estate fa molto ___.|caldo|neve|inverno","Hace frío=Fa freddo#Llueve mucho=Piove molto"],
["La ropa","i pantaloni=los pantalones;la camicia=la camisa;la gonna=la falda;le scarpe=los zapatos;il cappotto=el abrigo;il vestito=el vestido;la giacca=la chaqueta;la taglia=la talla","Verbos útiles: portare (llevar puesto), provare (probarse), stare bene (quedar bien). Demostrativos: questo/questa/questi/queste = este/esta/estos/estas.","Porto una giacca nera.=Llevo una chaqueta negra.;Posso provare questa camicia?=¿Puedo probarme esta camisa?;Che taglia porti?=¿Qué talla usas?;Questi pantaloni ti stanno bene.=Estos pantalones te quedan bien.","In negozio provo una camicia bianca e dei pantaloni neri. La taglia è giusta. Il commesso dice: «Ti stanno molto bene!» Compro tutto e pago alla cassa.","En la tienda me pruebo una camisa blanca y unos pantalones negros. La talla es la adecuada. El dependiente dice: «¡Te quedan muy bien!» Lo compro todo y pago en caja.","¿Qué se prueba?|Una falda|Camisa y pantalones|Un abrigo|1#¿Dónde paga?|En caja|En casa|Por internet|0","Posso provare ___ camicia?|questa|questo|questi#___ pantaloni ti stanno bene.|Questi|Questa|Questo","Una camisa blanca=Una camicia bianca#Los zapatos=Le scarpe"],
["Mi día: verbos reflexivos","svegliarsi=despertarse;alzarsi=levantarse;lavarsi=lavarse;vestirsi=vestirse;pettinarsi=peinarse;riposarsi=descansar;addormentarsi=dormirse;la mattina=la mañana","Los reflexivos llevan pronombre delante del verbo: mi, ti, si, ci, vi, si. Ej.: mi sveglio, ti svegli, si sveglia.","Mi sveglio alle sette.=Me despierto a las siete.;Ti alzi presto?=¿Te levantas temprano?;Si veste in fretta.=Se viste deprisa.;Ci riposiamo la domenica.=Descansamos los domingos.","La mattina mi sveglio alle sette e mi alzo subito. Mi lavo, mi vesto e faccio colazione. La sera mi riposo e mi addormento verso le undici.","Por la mañana me despierto a las siete y me levanto enseguida. Me lavo, me visto y desayuno. Por la noche descanso y me duermo hacia las once.","¿A qué hora se despierta?|A las seis|A las siete|A las ocho|1#¿Cuándo se duerme?|Hacia las once|Hacia las diez|A medianoche|0","Io ___ alle sette.|mi sveglio|ti svegli|si sveglia#Lei ___ in fretta.|si veste|mi vesto|ti vesti","Me despierto=Mi sveglio#Se levanta=Si alza"],
["Los meses y las fechas","gennaio=enero;febbraio=febrero;marzo=marzo;aprile=abril;maggio=mayo;giugno=junio;luglio=julio;agosto=agosto","Los meses van en minúscula. Fecha: «il» + número + mes (il cinque maggio); el día uno es «il primo». Se dice «a marzo» o «in agosto» para «en».","Il mio compleanno è a marzo.=Mi cumpleaños es en marzo.;Oggi è il cinque maggio.=Hoy es cinco de mayo.;In agosto vado al mare.=En agosto voy al mar.;Il primo gennaio è festa.=El uno de enero es fiesta.","Il mio compleanno è il dieci aprile. A giugno finisce la scuola e a luglio vado al mare con la famiglia. In agosto torniamo a casa.","Mi cumpleaños es el diez de abril. En junio termina la escuela y en julio voy al mar con la familia. En agosto volvemos a casa.","¿Cuándo es su cumpleaños?|El diez de abril|El diez de mayo|El uno de enero|0#¿Cuándo va al mar?|En junio|En julio|En agosto|1","Il mio compleanno è il dieci ___.|aprile|lunedì|mela#In ___ vado al mare.|luglio|domenica|sabato","En marzo=A marzo#El uno de enero=Il primo gennaio"],
["Los posesivos","mio=mío;tuo=tuyo;suo=suyo;nostro=nuestro;vostro=vuestro;loro=suyo (de ellos);il mio amico=mi amigo;la tua casa=tu casa","Los posesivos concuerdan con lo poseído, no con el poseedor: il mio libro, la mia casa, i miei libri, le mie case. «Suo» = de él, de ella o de usted. «Loro» no cambia.","Questo è il mio telefono.=Este es mi teléfono.;La tua casa è bella.=Tu casa es bonita.;I nostri amici arrivano domani.=Nuestros amigos llegan mañana.;Il suo gatto è nero.=Su gato es negro.","Questa è la mia famiglia. Il mio cane si chiama Leo. La mia casa è piccola, ma i miei vicini sono molto gentili. E la tua casa com'è?","Esta es mi familia. Mi perro se llama Leo. Mi casa es pequeña, pero mis vecinos son muy amables. ¿Y tu casa, cómo es?","¿Cómo se llama el perro?|Leo|Max|Luca|0#¿Cómo son los vecinos?|Antipáticos|Amables|Ruidosos|1","___ casa è piccola.|La mia|Il mio|I miei#I ___ amici arrivano.|nostri|nostro|nostra","Mi libro=Il mio libro#Tus amigos=I tuoi amici"],
["Preposiciones simples","a=a / en;di=de;da=desde / en casa de;in=en;con=con;su=sobre;per=para / por;tra=entre","«A» con ciudades (a Roma) e «in» con países (in Italia). «Di» indica posesión (il libro di Anna). «Da» indica origen (vengo da Madrid) o casa de alguien (vado da Marco).","Vivo a Roma.=Vivo en Roma.;Vado in Italia.=Voy a Italia.;Il libro di Anna è qui.=El libro de Anna está aquí.;Vado da Marco.=Voy a casa de Marco.","Marco vive a Milano, ma viene da Napoli. Oggi va in Spagna con un amico. Il biglietto è per lui e il passaporto è di suo fratello.","Marco vive en Milán, pero viene de Nápoles. Hoy va a España con un amigo. El billete es para él y el pasaporte es de su hermano.","¿Dónde vive Marco?|En Nápoles|En Milán|En Madrid|1#¿A dónde va hoy?|A España|A Italia|A Francia|0","Vivo ___ Roma.|a|in|da#Vado ___ Italia.|in|a|di","Voy a Italia=Vado in Italia#El libro de Anna=Il libro di Anna"],
["Preposiciones articuladas","nel=en el;nella=en la;sul=sobre el;dal=desde el;al=al;del=del;dello=del (lo);alla=a la","La preposición y el artículo se funden: in+il = nel, su+il = sul, di+il = del, a+il = al, da+il = dal. Con «la»: nella, sulla, della, alla, dalla.","Il libro è nel cassetto.=El libro está en el cajón.;Vado al mercato.=Voy al mercado.;Il gatto è sul divano.=El gato está sobre el sofá.;Esco dalla stanza.=Salgo de la habitación.","Il lunedì vado al lavoro. Il pranzo è nella borsa e le chiavi sono sul tavolo. Torno dal mercato con il pane della panetteria.","Los lunes voy al trabajo. La comida está en el bolso y las llaves están sobre la mesa. Vuelvo del mercado con el pan de la panadería.","¿Dónde están las llaves?|Sobre la mesa|En el bolso|En el coche|0#¿De dónde vuelve?|Del trabajo|Del mercado|De casa|1","Vado ___ mercato.|al|nel|dal#Il gatto è ___ divano.|sul|nel|dal","Voy al mercado=Vado al mercato#En el bolso=Nella borsa"],
["El verbo fare","io faccio=yo hago;tu fai=tú haces;lui fa=él hace;noi facciamo=nosotros hacemos;voi fate=vosotros hacéis;loro fanno=ellos hacen;fare colazione=desayunar;fare una passeggiata=dar un paseo","«Fare» es irregular: faccio, fai, fa, facciamo, fate, fanno. Se usa en muchas expresiones: fare colazione, fare la spesa, fare sport, fare una passeggiata.","Faccio colazione alle otto.=Desayuno a las ocho.;Cosa fai stasera?=¿Qué haces esta noche?;Facciamo la spesa.=Hacemos la compra.;Loro fanno sport.=Ellos hacen deporte.","Che cosa fai il sabato? Io faccio la spesa la mattina e il pomeriggio faccio una passeggiata. La sera mia sorella fa sport con gli amici.","¿Qué haces los sábados? Yo hago la compra por la mañana y por la tarde doy un paseo. Por la noche mi hermana hace deporte con los amigos.","¿Qué hace por la mañana?|La compra|Deporte|Un paseo|0#¿Con quién hace deporte la hermana?|Con su madre|Con amigos|Sola|1","Io ___ colazione.|faccio|fai|fa#Loro ___ sport.|fanno|fa|facciamo","Hago deporte=Faccio sport#¿Qué haces?=Che cosa fai?"],
["Andare y venire","io vado=yo voy;tu vai=tú vas;lui va=él va;noi andiamo=nosotros vamos;voi andate=vosotros vais;loro vanno=ellos van;venire=venir;uscire=salir","«Andare»: vado, vai, va, andiamo, andate, vanno. «Venire»: vengo, vieni, viene, veniamo, venite, vengono. Con transporte: andare in treno, in macchina, a piedi.","Vado a scuola a piedi.=Voy al colegio a pie.;Vieni con noi?=¿Vienes con nosotros?;Andiamo in treno.=Vamos en tren.;Loro vengono domani.=Ellos vienen mañana.","Domani andiamo al mare. Io vado in macchina e Luca viene in treno. Vieni anche tu? Partiamo alle otto.","Mañana vamos al mar. Yo voy en coche y Luca viene en tren. ¿Vienes tú también? Salimos a las ocho.","¿Cómo va quien habla?|En tren|En coche|A pie|1#¿A qué hora salen?|A las siete|A las ocho|A las nueve|1","Io ___ al mare.|vado|vai|va#___ anche tu?|Vieni|Vengo|Viene","Voy a pie=Vado a piedi#¿Vienes con nosotros?=Vieni con noi?"],
["Gustos y aficiones","mi piace=me gusta;mi piacciono=me gustan;il calcio=el fútbol;la musica=la música;il cinema=el cine;viaggiare=viajar;nuotare=nadar;cucinare=cocinar","«Piacere» concuerda con lo que gusta: mi piace il caffè (singular), mi piacciono i film (plural). Con verbos: mi piace nuotare. Negativo: non mi piace.","Mi piace la musica.=Me gusta la música.;Ti piacciono i film?=¿Te gustan las películas?;Non mi piace il calcio.=No me gusta el fútbol.;Ci piace viaggiare.=Nos gusta viajar.","Mi piace cucinare e ascoltare la musica. A mia sorella piacciono il cinema e il calcio. A tutti e due piace viaggiare in estate.","Me gusta cocinar y escuchar música. A mi hermana le gustan el cine y el fútbol. A los dos nos gusta viajar en verano.","¿Qué le gusta a quien habla?|Cocinar y escuchar música|Nadar|El fútbol|0#¿Cuándo les gusta viajar?|En invierno|En verano|En otoño|1","Mi ___ la musica.|piace|piacciono|piaci#Ti ___ i film?|piacciono|piace|piaci","Me gusta viajar=Mi piace viaggiare#No me gusta el fútbol=Non mi piace il calcio"],
["Profesiones","il medico=el médico;l'insegnante=el profesor / la profesora;l'ingegnere=el ingeniero;il cameriere=el camarero;l'avvocato=el abogado;l'infermiera=la enfermera;il cuoco=el cocinero;lo studente=el estudiante","Para decir la profesión: «Sono» + profesión, sin artículo (Sono medico). Para preguntar: «Che lavoro fai?». Muchas cambian -o/-a: il cuoco / la cuoca.","Che lavoro fai?=¿A qué te dedicas?;Sono ingegnere.=Soy ingeniero.;Lei è insegnante.=Ella es profesora.;Mio padre è cuoco.=Mi padre es cocinero.","Mi chiamo Chiara e sono infermiera in un ospedale. Mio marito è cuoco in un ristorante. Mia figlia è studentessa e vuole fare l'avvocato.","Me llamo Chiara y soy enfermera en un hospital. Mi marido es cocinero en un restaurante. Mi hija es estudiante y quiere ser abogada.","¿Qué profesión tiene Chiara?|Médica|Enfermera|Profesora|1#¿Qué quiere ser su hija?|Abogada|Cocinera|Ingeniera|0","Che ___ fai?|lavoro|lavori|lavorare#Io ___ infermiera.|sono|ho|faccio","Soy médico=Sono medico#¿A qué te dedicas?=Che lavoro fai?"],
["Medios de transporte","il treno=el tren;l'autobus=el autobús;la metropolitana=el metro;la bicicletta=la bicicleta;l'aereo=el avión;il taxi=el taxi;il biglietto=el billete;la fermata=la parada","Con transportes se usa «in» (in treno, in autobus, in macchina) y «a piedi» para ir andando. Para el precio: «Quanto costa il biglietto?».","Prendo l'autobus.=Cojo el autobús.;Vado in bicicletta.=Voy en bicicleta.;Dov'è la fermata?=¿Dónde está la parada?;Un biglietto per Roma, per favore.=Un billete para Roma, por favor.","Per andare al lavoro prendo la metropolitana. La fermata è vicino a casa. Il biglietto costa due euro. Quando fa bel tempo vado in bicicletta.","Para ir al trabajo cojo el metro. La parada está cerca de casa. El billete cuesta dos euros. Cuando hace buen tiempo voy en bicicleta.","¿Qué transporte coge para el trabajo?|El metro|El autobús|El taxi|0#¿Cuánto cuesta el billete?|Un euro|Dos euros|Tres euros|1","Vado ___ bicicletta.|in|a|con#Prendo ___ autobus.|l'|il|lo","Cojo el tren=Prendo il treno#Un billete=Un biglietto"],
["El cuerpo humano","la testa=la cabeza;il braccio=el brazo;la mano=la mano;la gamba=la pierna;il piede=el pie;gli occhi=los ojos;la bocca=la boca;il cuore=el corazón","«Mi fa male…» expresa dolor: mi fa male la testa (singular), mi fanno male i piedi (plural). Con partes del cuerpo se usa el artículo, no el posesivo.","Mi fa male la testa.=Me duele la cabeza.;Mi fanno male i piedi.=Me duelen los pies.;Ha gli occhi azzurri.=Tiene los ojos azules.;Alza la mano!=¡Levanta la mano!","Dopo la partita mi fanno male le gambe e i piedi. Ho anche mal di testa. Il medico dice: «Riposa e bevi molta acqua.»","Después del partido me duelen las piernas y los pies. También me duele la cabeza. El médico dice: «Descansa y bebe mucha agua.»","¿Qué le duele?|Piernas y pies|Brazos|Ojos|0#¿Qué le aconseja el médico?|Correr|Descansar y beber agua|Dormir poco|1","Mi fa male la ___.|testa|piedi|gambe#Mi ___ male i piedi.|fanno|fa|fai","Me duele la cabeza=Mi fa male la testa#La mano=La mano"],
["Negación y frecuencia","non=no;mai=nunca;sempre=siempre;spesso=a menudo;qualche volta=algunas veces;raramente=raramente;anche=también;neanche=ni siquiera","La negación va delante del verbo: non parlo. Con «mai» hay doble negación: non mangio mai carne. Frecuencia: sempre, spesso, qualche volta, raramente, mai.","Non parlo francese.=No hablo francés.;Non mangio mai carne.=Nunca como carne.;Vado spesso al cinema.=Voy a menudo al cine.;Anche io studio italiano.=Yo también estudio italiano.","Sono vegetariano: non mangio mai carne, ma mangio spesso pesce. Bevo sempre un caffè la mattina. Non bevo mai alcol. E tu cosa mangi?","Soy vegetariano: nunca como carne, pero como pescado a menudo. Siempre bebo un café por la mañana. Nunca bebo alcohol. ¿Y tú qué comes?","¿Qué no come nunca?|Pescado|Carne|Pan|1#¿Qué bebe siempre por la mañana?|Té|Café|Leche|1","Non mangio ___ carne.|mai|sempre|spesso#Bevo ___ un caffè.|sempre|mai|neanche","Nunca bebo alcohol=Non bevo mai alcol#Voy a menudo al cine=Vado spesso al cinema"],
["Números del 20 al 100","venti=veinte;trenta=treinta;quaranta=cuarenta;cinquanta=cincuenta;sessanta=sesenta;settanta=setenta;ottanta=ochenta;cento=cien","Las decenas terminan en -anta (excepto venti y trenta). Se unen a la unidad sin espacio (ventidue, trentatré) y pierden la vocal final ante uno y otto: ventuno, ventotto.","Ho trent'anni.=Tengo treinta años.;Costa cinquanta euro.=Cuesta cincuenta euros.;Ci sono ventuno studenti.=Hay veintiún estudiantes.;Il libro ha cento pagine.=El libro tiene cien páginas.","Il mio nonno ha settant'anni e vive in una casa con cento anni di storia. Al mercato compra venti uova e trenta mele. Paga quaranta euro.","Mi abuelo tiene setenta años y vive en una casa con cien años de historia. En el mercado compra veinte huevos y treinta manzanas. Paga cuarenta euros.","¿Cuántos años tiene el abuelo?|Sesenta|Setenta|Ochenta|1#¿Cuánto paga?|Treinta euros|Cuarenta euros|Cincuenta euros|1","Ho ___ anni. (30)|trenta|venti|quaranta#Costa ___ euro. (50)|cinquanta|quaranta|sessanta","Cuarenta=Quaranta#Cien euros=Cento euro"],
["En el hotel y de viaje","l'albergo=el hotel;la camera=la habitación;la prenotazione=la reserva;il passaporto=el pasaporte;la valigia=la maleta;la chiave=la llave;la colazione=el desayuno;il check-in=el registro de entrada","Para reservar y pedir: «Ho una prenotazione a nome di…», «Vorrei una camera singola / doppia». Para preguntar: «La colazione è inclusa?».","Ho una prenotazione.=Tengo una reserva.;Vorrei una camera doppia.=Quisiera una habitación doble.;La colazione è inclusa?=¿El desayuno está incluido?;Ecco la chiave.=Aquí tiene la llave.","Arrivo all'albergo alle quattro. Dico: «Ho una prenotazione a nome di Rossi.» La camera è al secondo piano. La colazione è inclusa e inizia alle sette.","Llego al hotel a las cuatro. Digo: «Tengo una reserva a nombre de Rossi.» La habitación está en el segundo piso. El desayuno está incluido y empieza a las siete.","¿A qué hora llega al hotel?|A las tres|A las cuatro|A las siete|1#¿Qué está incluido?|La cena|El desayuno|El taxi|1","Ho una ___.|prenotazione|chiave|valigia#Vorrei una camera ___.|doppia|chiave|colazione","Una reserva=Una prenotazione#La llave=La chiave"],
["Verbos modales","potere=poder;volere=querer;dovere=deber / tener que;posso=puedo;voglio=quiero;devo=debo;sapere=saber;vorrei=quisiera","Los modales van seguidos de infinitivo: posso uscire, voglio mangiare, devo studiare. Potere: posso, puoi, può, possiamo, potete, possono. Volere: voglio, vuoi, vuole. Dovere: devo, devi, deve.","Posso entrare?=¿Puedo entrar?;Voglio imparare l'italiano.=Quiero aprender italiano.;Devo lavorare oggi.=Tengo que trabajar hoy.;Non possiamo uscire.=No podemos salir.","Oggi voglio uscire con gli amici, ma devo studiare. Posso uscire solo dopo le sei. Mia madre dice: «Prima i compiti, poi puoi giocare!»","Hoy quiero salir con los amigos, pero tengo que estudiar. Solo puedo salir después de las seis. Mi madre dice: «¡Primero los deberes y luego puedes jugar!»","¿Qué debe hacer primero?|Estudiar|Jugar|Cocinar|0#¿Cuándo puede salir?|Antes de las seis|Después de las seis|Mañana|1","Io ___ studiare.|devo|devi|deve#Tu ___ entrare.|puoi|posso|può","Quiero comer=Voglio mangiare#No puedo salir=Non posso uscire"],
["Pasado con avere","ho mangiato=he comido;ho parlato=he hablado;ho visto=he visto;ho letto=he leído;ho scritto=he escrito;ho fatto=he hecho;ho comprato=he comprado;ho preso=he tomado","Passato prossimo = avere + participio. -are → -ato (parlato), -ere → -uto (venduto), -ire → -ito (dormito). Irregulares: fatto, letto, scritto, visto, preso.","Ho mangiato la pizza.=He comido la pizza.;Hai letto il libro?=¿Has leído el libro?;Abbiamo visto un film.=Hemos visto una película.;Hanno comprato una casa.=Han comprado una casa.","Ieri ho fatto molte cose. Ho preso il caffè al bar, ho letto un libro e ho scritto una lettera a mia nonna. La sera ho visto un film con mia sorella.","Ayer hice muchas cosas. Tomé un café en el bar, leí un libro y escribí una carta a mi abuela. Por la noche vi una película con mi hermana.","¿A quién escribió una carta?|A su abuela|A su madre|A un amigo|0#¿Con quién vio la película?|Con su hermana|Solo|Con su padre|0","Ieri ho ___ un libro. (leggere)|letto|leggo|leggiuto#Abbiamo ___ un film. (vedere)|visto|veduto|vediamo","He comido=Ho mangiato#Hemos visto una película=Abbiamo visto un film"],
["Pasado con essere","sono andato=he ido;sono venuto=he venido;sono arrivato=he llegado;sono partito=he salido;sono uscito=he salido de casa;sono tornato=he vuelto;sono stato=he estado;sono nato=he nacido","Con verbos de movimiento y estado se usa «essere», y el participio concuerda con el sujeto: sono andato / sono andata, siamo andati / andate. Ej.: Maria è arrivata.","Sono andato al cinema.=He ido al cine.;Maria è arrivata tardi.=Maria ha llegado tarde.;Siamo tornati a casa.=Hemos vuelto a casa.;Sei stata a Roma?=¿Has estado en Roma?","Il fine settimana sono andata a Firenze con mia sorella. Siamo partite il sabato mattina e siamo arrivate a mezzogiorno. Domenica sera siamo tornate a casa.","El fin de semana fui a Florencia con mi hermana. Salimos el sábado por la mañana y llegamos a mediodía. El domingo por la noche volvimos a casa.","¿A dónde fue?|A Roma|A Florencia|A Milán|1#¿Cuándo volvieron?|El sábado|El domingo por la noche|El lunes|1","Maria ___ arrivata.|è|ha|sono#Noi ___ tornati a casa.|siamo|abbiamo|sono","He ido a Roma=Sono andato a Roma#Hemos llegado=Siamo arrivati"],
["Los comparativos","più=más;meno=menos;come=como;migliore=mejor;peggiore=peor;alto=alto;basso=bajo;veloce=rápido","Superioridad: più + adjetivo + di (più alto di me). Inferioridad: meno + adjetivo + di. Igualdad: come (veloce come un gatto). Irregulares: buono → migliore, cattivo → peggiore.","Luca è più alto di Marco.=Luca es más alto que Marco.;Questa casa è meno cara.=Esta casa es menos cara.;Sei veloce come un gatto.=Eres rápido como un gato.;Il treno è più veloce dell'autobus.=El tren es más rápido que el autobús.","Mio fratello è più alto di me, ma io sono più veloce. La nostra casa è meno grande della casa dei nonni, però è più comoda. Siamo felici così.","Mi hermano es más alto que yo, pero yo soy más rápido. Nuestra casa es menos grande que la casa de los abuelos, pero es más cómoda. Somos felices así.","¿Quién es más rápido?|El hermano|Quien habla|Los abuelos|1#¿Cómo es su casa?|Más grande|Más cómoda|Más cara|1","Luca è ___ alto di Marco.|più|meno|come#Sei veloce ___ un gatto.|come|di|più","Más alto que yo=Più alto di me#Tan rápido como tú=Veloce come te"],
["El imperativo","parla=habla;mangia=come;ascolta=escucha;scrivi=escribe;apri=abre;aspetta=espera;vieni=ven;vai=ve","Imperativo informal (tu): -are → -a (parla), -ere/-ire → -i (scrivi, apri). Para vosotros: -ate, -ete, -ite. Negativo (tu): non + infinitivo (non parlare). Irregulares: vai, fai, di', sii.","Ascolta bene!=¡Escucha bien!;Apri la finestra, per favore.=Abre la ventana, por favor.;Non parlare ora.=No hables ahora.;Vieni qui!=¡Ven aquí!","Il professore dice: «Aprite i libri! Ascoltate e ripetete. Non parlate in spagnolo!» Poi dice a Marta: «Marta, vieni qui e scrivi la frase alla lavagna.»","El profesor dice: «¡Abrid los libros! Escuchad y repetid. ¡No habléis en español!» Luego dice a Marta: «Marta, ven aquí y escribe la frase en la pizarra.»","¿Qué no deben hacer los alumnos?|Hablar en español|Escuchar|Escribir|0#¿Qué debe hacer Marta?|Escribir la frase|Abrir la ventana|Repetir|0","___ bene!|Ascolta|Ascoltare|Ascoltiamo#Non ___ ora.|parlare|parla|parli","Abre la ventana=Apri la finestra#Ven aquí=Vieni qui"],
["Invitar y quedar","invitare=invitar;accettare=aceptar;rifiutare=rechazar;la festa=la fiesta;insieme=juntos;volentieri=con gusto;purtroppo=por desgracia;stasera=esta noche","Para invitar: «Vuoi venire…?», «Ti va di…?». Para aceptar: «Volentieri!», «Perfetto!». Para rechazar con cortesía: «Purtroppo non posso, ho un impegno».","Vuoi venire alla festa?=¿Quieres venir a la fiesta?;Volentieri!=¡Con mucho gusto!;Ti va di cenare insieme?=¿Te apetece cenar juntos?;Purtroppo non posso stasera.=Por desgracia no puedo esta noche.","Anna invita Luca: «Stasera c'è una festa da Marco. Ti va di venire?» Luca risponde: «Purtroppo non posso, devo lavorare. Ma sabato vengo volentieri!»","Anna invita a Luca: «Esta noche hay una fiesta en casa de Marco. ¿Te apetece venir?» Luca responde: «Por desgracia no puedo, tengo que trabajar. ¡Pero el sábado voy con gusto!»","¿Puede ir Luca esta noche?|Sí|No|Quizá|1#¿Cuándo irá con gusto?|El sábado|El lunes|Mañana|0","Ti ___ di venire?|va|vai|vado#___ non posso.|Purtroppo|Volentieri|Insieme","¿Quieres venir?=Vuoi venire?#Con gusto=Volentieri"],
["En la farmacia","la farmacia=la farmacia;la medicina=la medicina;la febbre=la fiebre;la tosse=la tos;il raffreddore=el resfriado;la pastiglia=la pastilla;la ricetta=la receta;stare male=encontrarse mal","Síntomas: «Ho la febbre / la tosse / il raffreddore». Para pedir ayuda: «Ho bisogno di una medicina». Dolor: «Mi fa male…».","Ho la febbre da due giorni.=Tengo fiebre desde hace dos días.;Ho bisogno di una medicina.=Necesito una medicina.;Una pastiglia ogni otto ore.=Una pastilla cada ocho horas.;Sto male.=Me encuentro mal.","Marta ha la tosse e il raffreddore. Va in farmacia e dice: «Ho bisogno di una medicina per la tosse.» Il farmacista dà una pastiglia: «Una ogni otto ore e beva molta acqua.»","Marta tiene tos y resfriado. Va a la farmacia y dice: «Necesito una medicina para la tos.» El farmacéutico le da una pastilla: «Una cada ocho horas y beba mucha agua.»","¿Qué síntomas tiene Marta?|Tos y resfriado|Fiebre|Dolor de pies|0#¿Cada cuánto debe tomarla?|Cada seis horas|Cada ocho horas|Una vez al día|1","Ho la ___ da due giorni.|febbre|farmacia|ricetta#Ho bisogno ___ una medicina.|di|a|da","Tengo tos=Ho la tosse#Necesito una medicina=Ho bisogno di una medicina"],
["Hablar por teléfono","il telefono=el teléfono;chiamare=llamar;rispondere=responder;il messaggio=el mensaje;il numero=el número;pronto=¿diga?;un momento=un momento;richiamare=volver a llamar","Al contestar se dice «Pronto!». Para pedir con quién hablar: «Posso parlare con…?». Para volver a llamar: «Ti richiamo dopo».","Pronto, chi parla?=¿Diga? ¿Quién habla?;Posso parlare con Marco?=¿Puedo hablar con Marco?;Ti richiamo dopo.=Te llamo luego.;Mandami un messaggio.=Mándame un mensaje.","Squilla il telefono. Sara risponde: «Pronto?» «Ciao Sara, sono Luca. Posso parlare con Marco?» «Un momento, te lo passo.» Marco prende il telefono e dice: «Ciao Luca, ti richiamo dopo!»","Suena el teléfono. Sara contesta: «¿Diga?» «Hola Sara, soy Luca. ¿Puedo hablar con Marco?» «Un momento, te lo paso.» Marco coge el teléfono y dice: «Hola Luca, ¡te llamo luego!»","¿Con quién quiere hablar Luca?|Con Sara|Con Marco|Con Anna|1#¿Qué dice Marco al final?|Que lo llamará luego|Que no puede|Que viene|0","___, chi parla?|Pronto|Prego|Piacere#Ti ___ dopo.|richiamo|chiamano|rispondi","Un momento=Un momento#Te llamo luego=Ti richiamo dopo"],
["Banco y correos","la banca=el banco;la posta=correos;il bancomat=el cajero;i soldi=el dinero;la carta=la tarjeta;la lettera=la carta;il francobollo=el sello;il pacco=el paquete","Para pedir servicios: «Vorrei spedire un pacco / una lettera» (enviar), «Vorrei prelevare» (sacar dinero). Con «per»: un francobollo per la Spagna.","Vorrei spedire un pacco.=Quisiera enviar un paquete.;Dov'è il bancomat?=¿Dónde está el cajero?;Un francobollo per la Spagna.=Un sello para España.;Posso pagare con la carta?=¿Puedo pagar con tarjeta?","Vado alla posta per spedire un pacco in Spagna. Compro anche due francobolli. Poi passo alla banca e uso il bancomat per prendere i soldi.","Voy a correos para enviar un paquete a España. También compro dos sellos. Luego paso por el banco y uso el cajero para sacar dinero.","¿A dónde envía el paquete?|A Italia|A España|A Francia|1#¿Para qué usa el cajero?|Para sacar dinero|Para enviar cartas|Para comprar sellos|0","Vorrei ___ un pacco.|spedire|spedito|spedisce#Posso pagare con la ___?|carta|lettera|posta","Un sello=Un francobollo#El cajero=Il bancomat"],
["Describir personas","alto=alto;basso=bajo;biondo=rubio;moro=moreno;simpatico=simpático;gentile=amable;giovane=joven;anziano=mayor","Para describir: «È alto», «Ha i capelli neri», «Ha gli occhi verdi». El adjetivo concuerda: un ragazzo alto, una ragazza alta. Pelo y ojos se dicen con «avere».","Mio fratello è alto e moro.=Mi hermano es alto y moreno.;Lei ha i capelli biondi.=Ella tiene el pelo rubio.;Ha gli occhi verdi.=Tiene los ojos verdes.;Il mio vicino è molto gentile.=Mi vecino es muy amable.","La mia amica Sofia è alta e ha i capelli biondi e gli occhi verdi. È molto simpatica e gentile. Suo padre è anziano, ma è ancora molto attivo.","Mi amiga Sofía es alta y tiene el pelo rubio y los ojos verdes. Es muy simpática y amable. Su padre es mayor, pero todavía es muy activo.","¿Cómo tiene el pelo Sofía?|Rubio|Negro|Rojo|0#¿Cómo es su padre?|Joven|Mayor pero activo|Bajo|1","Lei ha i capelli ___.|biondi|biondo|bionda#Mio fratello è alto e ___.|moro|mora|more","Es simpática=È simpatica#Tiene los ojos verdes=Ha gli occhi verdi"],
["Pronombres lo, la, li, le","lo=lo;la=la;li=los;le=las;mi=me;ti=te;ci=nos;vi=os","Los pronombres de objeto directo van delante del verbo: lo vedo (lo veo), la chiamo (la llamo), li compro (los compro), le mangio (las como). Con un modal pueden ir al final: voglio vederlo.","Vedo Marco: lo vedo.=Veo a Marco: lo veo.;Compri le mele? Sì, le compro.=¿Compras las manzanas? Sí, las compro.;Ti chiamo domani.=Te llamo mañana.;Voglio vederlo.=Quiero verlo.","Cerco le chiavi ma non le trovo. Chiamo mia madre: «Mamma, le hai viste tu?» «Sì, le vedo qui sul tavolo!» Le prendo e ti chiamo dopo.","Busco las llaves pero no las encuentro. Llamo a mi madre: «Mamá, ¿las has visto tú?» «¡Sí, las veo aquí sobre la mesa!» Las cojo y te llamo luego.","¿Qué busca?|El móvil|Las llaves|El pasaporte|1#¿Dónde están?|Sobre la mesa|En el bolso|En el coche|0","Compro le mele: ___ compro.|le|li|la#Vedo Marco: ___ vedo.|lo|la|li","Las compro=Le compro#Lo veo=Lo vedo"],
["Hablar del pasado","ieri=ayer;l'altro ieri=anteayer;la settimana scorsa=la semana pasada;l'anno scorso=el año pasado;un mese fa=hace un mes;poi=luego;prima=antes;dopo=después","Marcadores del pasado: ieri, scorso/scorsa (la settimana scorsa), fa (due giorni fa = hace dos días). Se combinan con el passato prossimo: ieri ho mangiato, l'anno scorso sono andato.","Ieri ho lavorato molto.=Ayer trabajé mucho.;La settimana scorsa sono andato al mare.=La semana pasada fui al mar.;Due giorni fa ho visto Marco.=Hace dos días vi a Marco.;Prima ho mangiato, poi ho dormito.=Primero comí, luego dormí.","L'anno scorso sono andata in Italia. Ho visitato Roma e Firenze. Due mesi fa sono tornata a casa e ho iniziato a studiare italiano. Ieri ho parlato con un amico italiano!","El año pasado fui a Italia. Visité Roma y Florencia. Hace dos meses volví a casa y empecé a estudiar italiano. ¡Ayer hablé con un amigo italiano!","¿Qué ciudades visitó?|Roma y Florencia|Milán y Turín|Nápoles|0#¿Con quién habló ayer?|Con su madre|Con un amigo italiano|Con un profesor|1","Ieri ___ lavorato molto.|ho|sono|ha#Due giorni ___ ho visto Marco.|fa|scorso|prima","Ayer comí=Ieri ho mangiato#La semana pasada=La settimana scorsa"],
["El futuro simple","domani=mañana;la prossima settimana=la semana próxima;parlerò=hablaré;mangerò=comeré;andrò=iré;sarò=seré;avrò=tendré;farò=haré","Futuro simple: raíz + -erò, -erai, -erà, -eremo, -erete, -eranno (parlerò, mangerò). Irregulares frecuentes: essere → sarò, avere → avrò, andare → andrò, fare → farò.","Domani andrò a Roma.=Mañana iré a Roma.;Parlerò con il professore.=Hablaré con el profesor.;Sarò a casa alle otto.=Estaré en casa a las ocho.;Cosa farai domani?=¿Qué harás mañana?","La prossima settimana andrò a Venezia con Luca. Partiremo la mattina presto e arriveremo a mezzogiorno. Mangeremo il pesce e faremo molte foto. Sarà un viaggio bellissimo!","La semana próxima iré a Venecia con Luca. Saldremos por la mañana temprano y llegaremos a mediodía. Comeremos pescado y haremos muchas fotos. ¡Será un viaje precioso!","¿A dónde irá?|A Venecia|A Roma|A Milán|0#¿Cuándo llegarán?|A mediodía|Por la noche|Por la mañana temprano|0","Domani ___ a Roma.|andrò|vado|sono andato#Noi ___ a mezzogiorno.|arriveremo|arrivo|arrivate","Mañana iré=Domani andrò#Seré feliz=Sarò felice"],
["Pedir ayuda y aclarar","Non capisco=No entiendo;Può ripetere?=¿Puede repetir?;Più piano, per favore=Más despacio, por favor;Come si dice…?=¿Cómo se dice…?;Che cosa significa?=¿Qué significa?;Parla inglese?=¿Habla inglés?;Mi può aiutare?=¿Me puede ayudar?;Scusi=Perdone","Con desconocidos se usa la forma de cortesía «Lei»: Può ripetere? Parla inglese? Mi può aiutare? Para aprender: «Come si dice … in italiano?» y «Che cosa significa …?».","Scusi, può ripetere?=Perdone, ¿puede repetir?;Più piano, per favore.=Más despacio, por favor.;Come si dice «mesa» in italiano?=¿Cómo se dice «mesa» en italiano?;Mi può aiutare?=¿Me puede ayudar?","Sono a Roma e non capisco bene l'italiano veloce. Dico alla signora: «Scusi, più piano, per favore. Può ripetere?» Lei sorride e spiega di nuovo. Alla fine dico: «Grazie mille, è stata molto gentile!»","Estoy en Roma y no entiendo bien el italiano rápido. Le digo a la señora: «Perdone, más despacio, por favor. ¿Puede repetir?» Ella sonríe y explica de nuevo. Al final digo: «¡Muchas gracias, ha sido muy amable!»","¿Qué le pide a la señora?|Que hable más despacio|Que cante|Que se vaya|0#¿Cómo termina la conversación?|Con un enfado|Con un agradecimiento|Con un silencio|1","Scusi, può ___?|ripetere|ripete|ripeto#Più ___, per favore.|piano|veloce|tardi","No entiendo=Non capisco#¿Me puede ayudar?=Mi può aiutare?"],
["Mi semana típica","la routine=la rutina;di solito=normalmente;ogni giorno=cada día;il fine settimana=el fin de semana;il tempo libero=el tiempo libre;la sera=la noche;il pomeriggio=la tarde;la mattina=la mañana","Repaso del presente (regulares, reflexivos e irregulares) con marcadores de tiempo: di solito, ogni giorno, la mattina, il pomeriggio, la sera. Las horas llevan «alle»: alle sette.","Di solito mi alzo alle sette.=Normalmente me levanto a las siete.;Ogni giorno studio un'ora.=Cada día estudio una hora.;Nel tempo libero leggo.=En mi tiempo libre leo.;Il fine settimana esco con gli amici.=El fin de semana salgo con los amigos.","Di solito mi alzo alle sette e vado al lavoro in autobus. Il pomeriggio studio italiano per un'ora. La sera cucino e guardo un film. Il fine settimana faccio una passeggiata con la mia famiglia.","Normalmente me levanto a las siete y voy al trabajo en autobús. Por la tarde estudio italiano durante una hora. Por la noche cocino y veo una película. El fin de semana doy un paseo con mi familia.","¿Cómo va al trabajo?|En autobús|En coche|A pie|0#¿Cuánto estudia italiano?|Una hora|Dos horas|Media hora|0","___ mi alzo alle sette.|Di solito|Ieri|Domani#Il fine ___ esco con gli amici.|settimana|giorno|ora","Cada día estudio=Ogni giorno studio#En mi tiempo libre=Nel tempo libero"],
["Repaso final A1: un viaje a Italia","il viaggio=el viaje;il turista=el turista;la città=la ciudad;il museo=el museo;il gelato=el helado;la foto=la foto;bellissimo=precioso;ricordare=recordar","Repaso A1: presente, passato prossimo, futuro y verbos modales. Superlativo con -issimo: bello → bellissimo (muy bonito). Ya puedes presentarte, pedir, orientarte y contar lo que haces.","La città è bellissima.=La ciudad es preciosa.;Ho visitato il museo.=He visitado el museo.;Domani mangerò un gelato.=Mañana comeré un helado.;Voglio ricordare questo viaggio.=Quiero recordar este viaje.","Mi chiamo Pablo e sono un turista a Firenze. Ieri ho visitato il museo e ho fatto molte foto. Oggi mangio un gelato in piazza. Domani partirò per Roma. Questo viaggio è stato bellissimo!","Me llamo Pablo y soy un turista en Florencia. Ayer visité el museo e hice muchas fotos. Hoy como un helado en la plaza. Mañana partiré hacia Roma. ¡Este viaje ha sido precioso!","¿Qué hizo ayer?|Visitó el museo|Cogió un tren|Fue a Roma|0#¿A dónde irá mañana?|A Roma|A Milán|A Venecia|0","Ieri ho ___ il museo.|visitato|visito|visiterò#Domani ___ per Roma.|partirò|parto|partito","Este viaje es precioso=Questo viaggio è bellissimo#Mañana comeré un helado=Domani mangerò un gelato"]
