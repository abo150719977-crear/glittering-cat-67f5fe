["Hablar de ti y de tu vida","la vita=la vida;il carattere=el carácter;il sogno=el sueño;il lavoro=el trabajo;la città=la ciudad;gli amici=los amigos;il passatempo=el pasatiempo;imparare=aprender","Para hablar de ti combina presente y expresiones de tiempo: «Abito qui da due anni» (vivo aquí desde hace dos años). «Sto + gerundio» (sto imparando) expresa una acción en curso.","Abito a Madrid da cinque anni.=Vivo en Madrid desde hace cinco años.;Lavoro come ingegnere.=Trabajo como ingeniero.;Il mio sogno è viaggiare.=Mi sueño es viajar.;Sto imparando l'italiano.=Estoy aprendiendo italiano.","Mi chiamo Javier e abito a Madrid da cinque anni. Lavoro come ingegnere in una grande azienda. Nel tempo libero suono la chitarra e sto imparando l'italiano. Il mio sogno è vivere un anno in Italia.","Me llamo Javier y vivo en Madrid desde hace cinco años. Trabajo como ingeniero en una gran empresa. En mi tiempo libre toco la guitarra y estoy aprendiendo italiano. Mi sueño es vivir un año en Italia.","¿Desde cuándo vive en Madrid?|Dos años|Cinco años|Diez años|1#¿Cuál es su sueño?|Vivir un año en Italia|Tocar la guitarra|Cambiar de trabajo|0","Abito qui ___ due anni.|da|per|fa#Lavoro ___ ingegnere.|come|di|da","Vivo aquí desde hace tres años=Abito qui da tre anni#Estoy aprendiendo italiano=Sto imparando l'italiano"],
["Participios irregulares","aprire → aperto=abrir → abierto;chiudere → chiuso=cerrar → cerrado;dire → detto=decir → dicho;mettere → messo=poner → puesto;scegliere → scelto=elegir → elegido;rispondere → risposto=responder → respondido;chiedere → chiesto=pedir → pedido;vivere → vissuto=vivir → vivido","Muchos verbos en -ere e -ire tienen participio irregular: aperto, chiuso, detto, messo, scelto, risposto, chiesto, vissuto. Se usan con avere (ho aperto, ho detto) y hay que memorizarlos.","Ho aperto la finestra.=He abierto la ventana.;Cosa hai detto?=¿Qué has dicho?;Ho scelto il vestito rosso.=He elegido el vestido rojo.;Non ha risposto al messaggio.=No ha respondido al mensaje.","Stamattina ho aperto il negozio alle nove. Un cliente ha chiesto un consiglio e io ho risposto con piacere. Ha scelto una giacca blu e ha detto: «Perfetta!» Alle sette ho chiuso e sono tornato a casa.","Esta mañana abrí la tienda a las nueve. Un cliente pidió un consejo y yo respondí con gusto. Eligió una chaqueta azul y dijo: «¡Perfecta!» A las siete cerré y volví a casa.","¿Qué eligió el cliente?|Una chaqueta azul|Un vestido|Unos zapatos|0#¿A qué hora abrió la tienda?|A las ocho|A las nueve|A las diez|1","Ho ___ la finestra. (aprire)|aperto|aprito|aprato#Cosa hai ___? (dire)|detto|dito|dicuto","He abierto la puerta=Ho aperto la porta#He elegido=Ho scelto"],
["El imperfecto","da bambino=de niño;una volta=antes;abitavo=vivía;giocavo=jugaba;eravamo=éramos;avevo=tenía;ogni estate=cada verano;i nonni=los abuelos","Imperfetto: -are → -avo, -avi, -ava, -avamo, -avate, -avano; -ere → -evo…; -ire → -ivo…. Describe hábitos y situaciones pasadas. Irregular: essere → ero, eri, era, eravamo, eravate, erano.","Da bambino giocavo a calcio.=De niño jugaba al fútbol.;Eravamo molto felici.=Éramos muy felices.;Abitavo in campagna.=Vivía en el campo.;Ogni estate andavamo al mare.=Cada verano íbamos al mar.","Da bambino abitavo in un piccolo paese. Ogni estate andavamo dai nonni e giocavamo nel giardino. Mia nonna cucinava dolci buonissimi e noi mangiavamo tutto. Eravamo davvero felici.","De niño vivía en un pueblo pequeño. Cada verano íbamos a casa de los abuelos y jugábamos en el jardín. Mi abuela cocinaba dulces buenísimos y nosotros nos lo comíamos todo. Éramos realmente felices.","¿Dónde vivía de niño?|En una ciudad|En un pueblo pequeño|En el extranjero|1#¿Qué cocinaba la abuela?|Dulces|Pasta|Pescado|0","Da bambino ___ a calcio.|giocavo|giocavano|gioco#Noi ___ molto felici.|eravamo|erano|ero","Vivía en el campo=Abitavo in campagna#Éramos felices=Eravamo felici"],
["Imperfecto o passato prossimo","mentre=mientras;quando=cuando;all'improvviso=de repente;di solito=normalmente;ieri=ayer;ogni giorno=cada día;una sera=una noche;spesso=a menudo","Imperfetto: acciones habituales o de fondo (Mentre camminavo…). Passato prossimo: acciones puntuales ya terminadas (…ho visto Marco). Ej.: Mentre guardavo la tv, è squillato il telefono.","Mentre cucinavo, è arrivato Luca.=Mientras cocinaba, llegó Luca.;Di solito mangiavo a casa, ma ieri ho mangiato fuori.=Normalmente comía en casa, pero ayer comí fuera.;Pioveva quando sono uscito.=Llovía cuando salí.;All'improvviso ho sentito un rumore.=De repente oí un ruido.","Ieri pioveva e io tornavo a casa a piedi. All'improvviso ho visto un gatto sotto una macchina. Era piccolo e aveva freddo. L'ho preso, l'ho portato a casa e gli ho dato del latte.","Ayer llovía y yo volvía a casa andando. De repente vi un gato debajo de un coche. Era pequeño y tenía frío. Lo cogí, lo llevé a casa y le di leche.","¿Qué tiempo hacía?|Hacía sol|Llovía|Nevaba|1#¿Qué le dio al gato?|Leche|Pescado|Agua|0","Mentre ___ la tv, è squillato il telefono.|guardavo|ho guardato|guardo#All'improvviso ___ un rumore.|ho sentito|sentivo|sento","Llovía cuando salí=Pioveva quando sono uscito#De repente vi un gato=All'improvviso ho visto un gatto"],
["Pronombres indirectos","mi=me / a mí;ti=te / a ti;gli=le (a él);le=le (a ella);ci=nos;vi=os;loro=les;dare=dar","Responden a «¿a quién?»: mi, ti, gli (a él), le (a ella), ci, vi, gli/loro (a ellos). Van delante del verbo: gli do un libro. Se usan con telefonare, scrivere, dire, regalare, dare.","Ti scrivo domani.=Te escribo mañana.;Gli ho regalato un libro.=Le he regalado un libro.;Le telefono stasera.=La llamo esta noche.;Ci dici la verità?=¿Nos dices la verdad?","Domani è il compleanno di mia sorella. Le ho comprato un libro e le scrivo un biglietto. Ai miei genitori telefono stasera e gli racconto tutto. Mi dicono sempre: «Grazie!»","Mañana es el cumpleaños de mi hermana. Le he comprado un libro y le escribo una tarjeta. A mis padres los llamo esta noche y les cuento todo. Siempre me dicen: «¡Gracias!»","¿Qué le compró a su hermana?|Un libro|Un vestido|Flores|0#¿A quién llama esta noche?|A sus amigos|A sus padres|A su abuela|1","A mia sorella ___ scrivo.|le|gli|mi#Ai miei amici ___ telefono.|gli|le|mi","Te escribo=Ti scrivo#Le he regalado un libro=Le ho regalato un libro"],
["El futuro y los planes de vacaciones","le vacanze=las vacaciones;prenotare=reservar;il volo=el vuelo;la spiaggia=la playa;la montagna=la montaña;visitare=visitar;il programma=el plan;risparmiare=ahorrar","Futuro para planes y suposiciones: «Quest'estate andrò al mare». Con «se» + futuro: «Se avrò tempo, visiterò Roma». Los verbos en -care/-gare añaden h: cercherò, pagherò.","Prenoterò il volo domani.=Reservaré el vuelo mañana.;Visiteremo Roma e Napoli.=Visitaremos Roma y Nápoles.;Se farà bel tempo, andremo in spiaggia.=Si hace buen tiempo, iremos a la playa.;Risparmierò per le vacanze.=Ahorraré para las vacaciones.","Quest'estate andrò in vacanza con i miei amici. Prenoteremo un appartamento vicino alla spiaggia. Visiteremo anche un piccolo paese in montagna. Se risparmierò abbastanza, resteremo due settimane.","Este verano me iré de vacaciones con mis amigos. Reservaremos un apartamento cerca de la playa. También visitaremos un pueblecito de montaña. Si ahorro lo suficiente, nos quedaremos dos semanas.","¿Dónde reservarán el apartamento?|Cerca de la playa|En la montaña|En la ciudad|0#¿Cuánto tiempo se quedarán si ahorran?|Una semana|Dos semanas|Un mes|1","Quest'estate ___ in vacanza.|andrò|vado|sono andato#Se avrò tempo, ___ Roma.|visiterò|visito|visitato","Reservaremos un apartamento=Prenoteremo un appartamento#Si ahorro, iré=Se risparmierò, andrò"],
["El condicional de cortesía","vorrei=quisiera;potrei=podría;avrei=tendría;sarebbe=sería;mi piacerebbe=me gustaría;dovrei=debería;potresti=podrías;gentilmente=amablemente","El condicional (vorrei, potrei, mi piacerebbe) suaviza peticiones, deseos y consejos. Terminaciones: -ei, -esti, -ebbe, -emmo, -este, -ebbero. Irregulares: vorrei, potrei, dovrei, sarei, avrei.","Potrei avere un bicchiere d'acqua?=¿Podría tomar un vaso de agua?;Mi piacerebbe visitare Venezia.=Me gustaría visitar Venecia.;Dovresti riposare di più.=Deberías descansar más.;Potresti aiutarmi, per favore?=¿Podrías ayudarme, por favor?","Al ristorante dico al cameriere: «Vorrei un tavolo vicino alla finestra, per favore. Potrei avere anche il menù?» Poi penso: mi piacerebbe provare la specialità della casa. Il cameriere sorride: «Sarebbe una scelta perfetta!»","En el restaurante le digo al camarero: «Quisiera una mesa junto a la ventana, por favor. ¿Podría tener también la carta?» Luego pienso: me gustaría probar la especialidad de la casa. El camarero sonríe: «¡Sería una elección perfecta!»","¿Qué mesa pide?|Junto a la ventana|En la terraza|En el centro|0#¿Qué le gustaría probar?|El postre|La especialidad de la casa|El vino|1","___ avere il menù?|Potrei|Posso|Potevo#Mi ___ visitare Venezia.|piacerebbe|piace|piaceva","Quisiera un café=Vorrei un caffè#Deberías descansar=Dovresti riposare"],
["Buscar piso","l'appartamento=el piso;l'affitto=el alquiler;il contratto=el contrato;il proprietario=el propietario;la camera da letto=el dormitorio;ammobiliato=amueblado;le spese=los gastos;il deposito=la fianza","Para preguntar por un piso: «Quanto costa l'affitto?», «Le spese sono incluse?». «C'è» y «ci sono» describen lo que hay: c'è un balcone, ci sono due camere.","Cerco un appartamento in centro.=Busco un piso en el centro.;Quanto costa l'affitto?=¿Cuánto cuesta el alquiler?;Le spese sono incluse?=¿Los gastos están incluidos?;L'appartamento è ammobiliato.=El piso está amueblado.","Cerco un appartamento in centro con due camere da letto. Quello che ho visto oggi costa seicento euro al mese e le spese sono incluse. È ammobiliato e c'è un piccolo balcone. Domani parlo con il proprietario.","Busco un piso en el centro con dos dormitorios. El que he visto hoy cuesta seiscientos euros al mes y los gastos están incluidos. Está amueblado y hay un pequeño balcón. Mañana hablo con el propietario.","¿Cuánto cuesta al mes?|Quinientos euros|Seiscientos euros|Setecientos euros|1#¿Qué hay en el piso?|Un jardín|Un pequeño balcón|Una piscina|1","Quanto costa l'___?|affitto|contratto|deposito#C'è un ___ balcone.|piccolo|piccoli|piccole","Busco un piso=Cerco un appartamento#¿Cuánto cuesta el alquiler?=Quanto costa l'affitto?"],
["En el médico","il dottore=el doctor;la visita=la consulta;il sintomo=el síntoma;il dolore=el dolor;la gola=la garganta;la pressione=la tensión;la cura=el tratamiento;riposare=descansar","En la consulta: «Da quanto tempo ha…?» (¿desde cuándo tiene…?). Respuesta con «da»: ho mal di gola da tre giorni. El médico usa el imperativo formal: prenda, beva, riposi.","Ho mal di gola da tre giorni.=Tengo dolor de garganta desde hace tres días.;Da quanto tempo ha la febbre?=¿Desde cuándo tiene fiebre?;Prenda una pastiglia dopo i pasti.=Tome una pastilla después de las comidas.;Deve riposare e bere molto.=Debe descansar y beber mucho.","Dal dottore: «Cosa Le fa male?» «Ho mal di gola e un po' di febbre da tre giorni.» Il dottore guarda la gola e dice: «Non è grave. Prenda queste pastiglie, riposi due giorni e beva molta acqua.»","En el médico: «¿Qué le duele?» «Tengo dolor de garganta y un poco de fiebre desde hace tres días.» El doctor mira la garganta y dice: «No es grave. Tome estas pastillas, descanse dos días y beba mucha agua.»","¿Desde cuándo tiene los síntomas?|Un día|Tres días|Una semana|1#¿Qué le recomienda el doctor?|Operarse|Descansar y beber agua|Hacer deporte|1","Ho mal di gola ___ tre giorni.|da|per|fa#___ queste pastiglie.|Prenda|Prende|Prendere","Tengo fiebre desde ayer=Ho la febbre da ieri#Descanse=Riposi"],
["Trabajo y estudios","il colloquio=la entrevista;il curriculum=el currículum;lo stipendio=el sueldo;il collega=el compañero;la laurea=la carrera;lo stage=las prácticas;il turno=el turno;il capo=el jefe","Para hablar de tu trayectoria: «Ho lavorato come… per due anni» (passato prossimo) y «Lavoro… da…» (presente). «Laurearsi» = graduarse. Para preguntar: «Che cosa ha studiato?»","Ho un colloquio domani.=Tengo una entrevista mañana.;Ho lavorato come cameriere per due anni.=Trabajé como camarero durante dos años.;Mi sono laureato in economia.=Me gradué en economía.;Il mio capo è molto disponibile.=Mi jefe es muy atento.","Domani ho un colloquio in un'azienda di Milano. Ho preparato il curriculum e ho ripassato le domande. Ho lavorato come cameriere per due anni e mi sono laureato in economia. Spero di avere un buon stipendio e dei colleghi simpatici.","Mañana tengo una entrevista en una empresa de Milán. He preparado el currículum y he repasado las preguntas. Trabajé como camarero durante dos años y me gradué en economía. Espero tener un buen sueldo y compañeros simpáticos.","¿Dónde es la entrevista?|En Roma|En Milán|En Turín|1#¿En qué se graduó?|Economía|Derecho|Medicina|0","Domani ho un ___.|colloquio|stipendio|turno#Ho lavorato ___ cameriere.|come|da|di","Tengo una entrevista=Ho un colloquio#Trabajé durante dos años=Ho lavorato per due anni"],
["Pedir y quejarse en el restaurante","l'antipasto=el entrante;il primo=el primer plato;il secondo=el segundo plato;il dolce=el postre;il contorno=la guarnición;la mancia=la propina;freddo=frío;sbagliato=equivocado","El menú italiano: antipasto, primo, secondo con contorno, dolce. Para quejarse con cortesía: «Scusi, questo piatto è freddo» o «Credo che ci sia un errore». Para pagar: «Possiamo avere il conto?».","Come primo prendo la pasta.=De primero tomo la pasta.;Scusi, questo piatto è freddo.=Perdone, este plato está frío.;Credo che ci sia un errore.=Creo que hay un error.;Possiamo avere il conto?=¿Podemos tener la cuenta?","Al ristorante prendo come antipasto la bruschetta e come primo la pasta al pomodoro. Il cameriere porta un piatto sbagliato. Dico gentilmente: «Scusi, ho ordinato la pasta.» Lui chiede scusa e porta subito il piatto giusto.","En el restaurante tomo de entrante bruschetta y de primero pasta con tomate. El camarero trae un plato equivocado. Digo amablemente: «Perdone, pedí la pasta.» Él se disculpa y trae enseguida el plato correcto.","¿Qué tomó de entrante?|Bruschetta|Ensalada|Sopa|0#¿Cuál fue el problema?|La cuenta|Un plato equivocado|Un plato frío|1","Come ___ prendo la pasta.|primo|dolce|conto#Possiamo avere il ___?|conto|primo|errore","Un plato frío=Un piatto freddo#La cuenta, por favor=Il conto, per favore"],
["Deporte y ocio","lo sport=el deporte;la palestra=el gimnasio;allenarsi=entrenarse;la squadra=el equipo;la partita=el partido;vincere=ganar;perdere=perder;la corsa=la carrera","«Giocare a» + deporte de equipo (giocare a calcio); «fare» + deporte individual (fare nuoto, fare yoga). Participios irregulares: vinto, perso. Ej.: abbiamo vinto la partita.","Gioco a calcio con gli amici.=Juego al fútbol con los amigos.;Faccio nuoto due volte a settimana.=Hago natación dos veces por semana.;Abbiamo vinto la partita.=Hemos ganado el partido.;Mi alleno in palestra.=Me entreno en el gimnasio.","Il sabato gioco a calcio con la mia squadra. Ieri abbiamo giocato una partita importante e abbiamo vinto due a uno. Durante la settimana mi alleno in palestra e faccio nuoto. Lo sport mi fa sentire bene.","Los sábados juego al fútbol con mi equipo. Ayer jugamos un partido importante y ganamos dos a uno. Durante la semana me entreno en el gimnasio y hago natación. El deporte me hace sentir bien.","¿Cómo terminó el partido?|Perdieron|Ganaron 2-1|Empataron|1#¿Qué hace durante la semana?|Entrena y hace natación|Descansa|Estudia|0","Gioco ___ calcio.|a|in|di#Abbiamo ___ la partita.|vinto|vinciuto|vincito","Hago natación=Faccio nuoto#Hemos ganado=Abbiamo vinto"],
["Pasado y pronombres directos","l'ho visto=lo he visto;l'ho comprata=la he comprado;li ho presi=los he cogido;le ho lette=las he leído;il biglietto=el billete;le chiavi=las llaves;la lettera=la carta;perdere=perder","Con el passato prossimo, lo, la, li, le van delante de «avere» y el participio concuerda con ellos: l'ho visto (a él), l'ho vista (a ella), li ho visti, le ho viste. Lo y la se apostrofan: l'ho.","Hai visto Marco? Sì, l'ho visto.=¿Has visto a Marco? Sí, lo he visto.;Dove hai comprato la borsa? L'ho comprata online.=¿Dónde has comprado el bolso? Lo he comprado online.;Le chiavi? Le ho perse.=¿Las llaves? Las he perdido.;I biglietti? Li ho presi ieri.=¿Los billetes? Los cogí ayer.","Ho perso le chiavi di casa! Le ho cercate dappertutto, ma non le ho trovate. Ho chiamato mia sorella: «Le hai viste tu?» «Sì, le ho prese io per sbaglio. Te le porto subito!»","¡He perdido las llaves de casa! Las he buscado por todas partes, pero no las he encontrado. He llamado a mi hermana: «¿Las has visto tú?» «Sí, las cogí yo por error. ¡Te las llevo enseguida!»","¿Qué ha perdido?|Las llaves de casa|El móvil|La cartera|0#¿Quién las tiene?|Su madre|Su hermana|Un vecino|1","Le chiavi? ___ ho perse.|Le|Li|La#Marco? ___ ho visto.|L'|Le|Li","Las he buscado=Le ho cercate#Lo he visto=L'ho visto"],
["Stare + gerundio","sto mangiando=estoy comiendo;stai leggendo=estás leyendo;sta dormendo=está durmiendo;stiamo parlando=estamos hablando;stanno giocando=están jugando;in questo momento=en este momento;adesso=ahora;proprio ora=ahora mismo","«Stare + gerundio» expresa una acción en curso: sto mangiando. Gerundio: -are → -ando (parlando); -ere/-ire → -endo (leggendo, dormendo). Irregulares: fare → facendo, dire → dicendo.","Sto leggendo un libro.=Estoy leyendo un libro.;Che cosa stai facendo?=¿Qué estás haciendo?;Stanno giocando in giardino.=Están jugando en el jardín.;Non posso parlare, sto guidando.=No puedo hablar, estoy conduciendo.","Sono le otto di sera. In questo momento sto cucinando e mia sorella sta guardando la tv. I nostri genitori stanno parlando al telefono con i nonni. Fuori sta piovendo.","Son las ocho de la tarde. En este momento estoy cocinando y mi hermana está viendo la tele. Nuestros padres están hablando por teléfono con los abuelos. Fuera está lloviendo.","¿Qué hace la hermana?|Cocina|Ve la tele|Estudia|1#¿Qué tiempo hace?|Llueve|Hace sol|Nieva|0","Io ___ cucinando.|sto|sono|ho#Loro stanno ___.|parlando|parlare|parlato","Estoy leyendo=Sto leggendo#¿Qué estás haciendo?=Che cosa stai facendo?"],
["Los pronombres ci y ne","ci=allí / ahí;ci vado=voy allí;ne=de ello / de eso;ne ho=tengo de eso;ne voglio due=quiero dos de eso;c'è=hay;ci sono=hay (plural);ne parlo=hablo de ello","«Ci» sustituye a un lugar: Vai a Roma? Sì, ci vado. «Ne» sustituye a «di + algo» o a una cantidad: Quante mele vuoi? Ne voglio due. Van delante del verbo conjugado.","Sei mai stato a Roma? Sì, ci sono stato.=¿Has estado en Roma? Sí, he estado allí.;Vuoi del caffè? Sì, ne voglio un po'.=¿Quieres café? Sí, quiero un poco.;Quanti fratelli hai? Ne ho due.=¿Cuántos hermanos tienes? Tengo dos.;Parliamo del viaggio? Sì, ne parliamo dopo.=¿Hablamos del viaje? Sí, hablamos de eso luego.","Vado spesso in biblioteca e ci resto per ore. Quando prendo libri in prestito, ne prendo sempre tre. Poi a casa ne leggo uno e parlo con mia sorella di quello che ho letto.","Voy a menudo a la biblioteca y me quedo allí durante horas. Cuando cojo libros prestados, siempre cojo tres. Luego en casa leo uno y hablo con mi hermana de lo que he leído.","¿Cuántos libros coge?|Dos|Tres|Cinco|1#¿Con quién habla de lo leído?|Con su hermana|Con su madre|Con un amigo|0","Sei stato a Roma? Sì, ___ sono stato.|ci|ne|lo#Quanti libri vuoi? ___ voglio tre.|Ne|Ci|Lo","Voy allí=Ci vado#Tengo dos=Ne ho due"],
["Los superlativos","il più=el más;il meno=el menos;bellissimo=bellísimo;buonissimo=buenísimo;il migliore=el mejor;il peggiore=el peor;molto=muy;moltissimo=muchísimo","Superlativo relativo: il/la più + adjetivo + di (la più bella città d'Italia). Absoluto: -issimo (bellissimo, buonissimo) o molto + adjetivo. Irregulares: il migliore, il peggiore.","Roma è la città più bella.=Roma es la ciudad más bonita.;Questo gelato è buonissimo!=¡Este helado está buenísimo!;Marco è il più alto della classe.=Marco es el más alto de la clase.;Era il peggiore film dell'anno.=Era la peor película del año.","Firenze è una delle città più belle d'Italia. Il museo degli Uffizi è bellissimo e i gelati sono buonissimi. Per me è il posto migliore per una vacanza. Tutti sono gentilissimi.","Florencia es una de las ciudades más bonitas de Italia. El museo de los Uffizi es precioso y los helados están buenísimos. Para mí es el mejor lugar para unas vacaciones. Todos son amabilísimos.","¿Qué ciudad describe?|Florencia|Roma|Milán|0#¿Cómo están los helados?|Buenísimos|Fríos|Caros|0","Roma è la città ___ bella.|più|molto|meno#Questo gelato è ___!|buonissimo|più buono|migliore","El más alto=Il più alto#Está buenísimo=È buonissimo"],
["Reflexivos en pasado","mi sono svegliato=me desperté;mi sono alzato=me levanté;mi sono lavato=me lavé;mi sono vestito=me vestí;mi sono divertito=me divertí;mi sono addormentato=me dormí;mi sono riposato=descansé;mi sono sentito=me sentí","Los reflexivos usan siempre «essere» en el passato prossimo y el participio concuerda: mi sono alzato / alzata, ci siamo divertiti. Ej.: ieri mi sono svegliato tardi.","Mi sono svegliata alle otto.=Me desperté a las ocho.;Ti sei divertito alla festa?=¿Te divertiste en la fiesta?;Si sono addormentati subito.=Se durmieron enseguida.;Ci siamo riposati tutto il giorno.=Descansamos todo el día.","Domenica mi sono svegliata tardi e mi sono alzata alle dieci. Mi sono vestita e sono uscita con le amiche. Ci siamo divertite molto al mercato. La sera mi sono addormentata presto.","El domingo me desperté tarde y me levanté a las diez. Me vestí y salí con las amigas. Nos divertimos mucho en el mercado. Por la noche me dormí pronto.","¿A qué hora se levantó?|A las ocho|A las diez|A las doce|1#¿Dónde se divirtieron?|En el mercado|En el cine|En casa|0","Ieri ___ svegliato tardi.|mi sono|ho|mi ho#Ci ___ divertiti molto.|siamo|abbiamo|sono","Me desperté tarde=Mi sono svegliato tardi#Nos divertimos=Ci siamo divertiti"],
["Opiniones y acuerdo","secondo me=en mi opinión;penso che=pienso que;credo che=creo que;sono d'accordo=estoy de acuerdo;non sono d'accordo=no estoy de acuerdo;hai ragione=tienes razón;sbagli=te equivocas;forse=quizá","«Secondo me» + indicativo es lo más sencillo para opinar. Con «penso che / credo che» se usa subjuntivo (lo verás en B1): penso che sia giusto. Para acordar o discrepar: «Hai ragione», «Non sono d'accordo».","Secondo me è una buona idea.=En mi opinión es una buena idea.;Sono d'accordo con te.=Estoy de acuerdo contigo.;Non sono d'accordo.=No estoy de acuerdo.;Hai ragione!=¡Tienes razón!","Marco: «Secondo me il film era noioso.» Giulia: «Non sono d'accordo! La storia era bellissima.» Marco: «Forse hai ragione, ma il finale non mi è piaciuto.» Alla fine ridono e vanno a prendere un gelato.","Marco: «En mi opinión la película era aburrida.» Giulia: «¡No estoy de acuerdo! La historia era preciosa.» Marco: «Quizá tienes razón, pero el final no me gustó.» Al final se ríen y van a tomar un helado.","¿Qué opina Marco de la película?|Aburrida|Preciosa|Divertida|0#¿Cómo terminan?|Discutiendo|Tomando un helado|Yéndose a casa|1","___ me è una buona idea.|Secondo|Per|Da#Hai ___!|ragione|ragioni|ragionato","Estoy de acuerdo=Sono d'accordo#Tienes razón=Hai ragione"],
["Tecnología cotidiana","il computer=el ordenador;lo smartphone=el móvil;la connessione=la conexión;il sito web=la página web;scaricare=descargar;l'applicazione=la aplicación;la batteria=la batería;la password=la contraseña","Verbos de uso: cliccare, scaricare, inviare (enviar), salvare (guardar). Muchos anglicismos no cambian: il computer, il mouse. Para problemas: «Non funziona», «La connessione è lenta».","Il mio telefono non funziona.=Mi móvil no funciona.;Ho scaricato una nuova applicazione.=He descargado una nueva aplicación.;La connessione è molto lenta.=La conexión es muy lenta.;Ho dimenticato la password.=He olvidado la contraseña.","Ieri il mio computer non funzionava e la connessione era lenta. Ho scaricato una nuova applicazione dallo smartphone, ma la batteria era quasi scarica. Poi ho dimenticato la password e ho dovuto cambiarla.","Ayer mi ordenador no funcionaba y la conexión era lenta. Descargué una nueva aplicación desde el móvil, pero la batería estaba casi descargada. Luego olvidé la contraseña y tuve que cambiarla.","¿Cómo era la conexión?|Rápida|Lenta|Inexistente|1#¿Qué olvidó?|La contraseña|El cargador|El móvil|0","Il telefono non ___.|funziona|funzioni|funzionano#Ho ___ una nuova applicazione.|scaricato|scaricata|scarico","No funciona=Non funziona#La contraseña=La password"],
["Estación y aeropuerto","il binario=el andén;il treno=el tren;il volo=el vuelo;l'imbarco=el embarque;il ritardo=el retraso;la coincidenza=el transbordo;il bagaglio=el equipaje;l'orario=el horario","Preguntas útiles: «A che ora parte il treno?», «Da quale binario?». «Il treno è in ritardo» = va con retraso. Billete: andata (ida), andata e ritorno (ida y vuelta).","Un biglietto di andata e ritorno, per favore.=Un billete de ida y vuelta, por favor.;Da quale binario parte il treno?=¿De qué andén sale el tren?;Il volo è in ritardo.=El vuelo lleva retraso.;Dov'è l'uscita d'imbarco?=¿Dónde está la puerta de embarque?","Alla stazione chiedo: «A che ora parte il treno per Bologna?» L'impiegato risponde: «Alle dieci, dal binario cinque, ma ha venti minuti di ritardo.» Compro un biglietto di andata e ritorno e aspetto sulla panchina.","En la estación pregunto: «¿A qué hora sale el tren a Bolonia?» El empleado responde: «A las diez, del andén cinco, pero lleva veinte minutos de retraso.» Compro un billete de ida y vuelta y espero en el banco.","¿De qué andén sale?|Tres|Cinco|Siete|1#¿Qué billete compra?|Solo ida|Ida y vuelta|Abono|1","Un biglietto di ___ e ritorno.|andata|partenza|arrivo#Il treno è in ___.|ritardo|binario|orario","¿A qué hora sale el tren?=A che ora parte il treno?#Un billete de ida y vuelta=Un biglietto di andata e ritorno"],
["Recetas de cocina","l'ingrediente=el ingrediente;la ricetta=la receta;tagliare=cortar;mescolare=mezclar;bollire=hervir;cuocere=cocer;il sale=la sal;l'olio=el aceite","En las recetas se usa el imperativo (taglia, metti, aggiungi) o el infinitivo: «Tagliare la cipolla». Cantidades: un pizzico di sale, due cucchiai di olio, q.b. (quanto basta = a gusto).","Taglia la cipolla.=Corta la cebolla.;Metti l'acqua a bollire.=Pon el agua a hervir.;Aggiungi un pizzico di sale.=Añade una pizca de sal.;Cuoci la pasta per dieci minuti.=Cuece la pasta durante diez minutos.","Per fare la pasta al pomodoro, metti l'acqua a bollire e aggiungi un po' di sale. Cuoci la pasta per dieci minuti. Intanto taglia la cipolla e scalda due cucchiai di olio con il pomodoro. Mescola tutto e buon appetito!","Para hacer pasta con tomate, pon el agua a hervir y añade un poco de sal. Cuece la pasta durante diez minutos. Mientras tanto corta la cebolla y calienta dos cucharadas de aceite con el tomate. Mezcla todo y ¡buen provecho!","¿Cuánto cuece la pasta?|Cinco minutos|Diez minutos|Veinte minutos|1#¿Qué calienta con el tomate?|Aceite|Mantequilla|Agua|0","Metti l'acqua a ___.|bollire|bollito|bolli#Aggiungi un ___ di sale.|pizzico|pezzo|litro","Corta la cebolla=Taglia la cipolla#Cuece la pasta=Cuoci la pasta"],
["Fiestas italianas","il Natale=la Navidad;la Pasqua=la Pascua;il Capodanno=Nochevieja / Año Nuevo;Ferragosto=el 15 de agosto;la tradizione=la tradición;il panettone=el panettone;gli auguri=las felicitaciones;festeggiare=celebrar","Felicitaciones: «Buon Natale!», «Buona Pasqua!», «Buon anno!», «Auguri!». Con «tanti auguri» se felicita un cumpleaños. Festeggiare = celebrar.","Buon Natale a tutti!=¡Feliz Navidad a todos!;A Capodanno festeggiamo con gli amici.=En Nochevieja celebramos con los amigos.;Mangiamo il panettone a Natale.=Comemos panettone en Navidad.;Tanti auguri di buon compleanno!=¡Muchas felicidades en tu cumpleaños!","In Italia il Natale è una festa molto importante. La famiglia si riunisce per un grande pranzo e si mangia il panettone. A Capodanno molti festeggiano con gli amici e a Ferragosto vanno al mare. Tutti si scambiano gli auguri.","En Italia la Navidad es una fiesta muy importante. La familia se reúne para una gran comida y se come panettone. En Nochevieja muchos celebran con los amigos y en Ferragosto van al mar. Todos se intercambian felicitaciones.","¿Qué se come en Navidad?|Panettone|Helado|Pizza|0#¿Qué hacen en Ferragosto?|Van al mar|Trabajan|Esquían|0","___ Natale a tutti!|Buon|Buona|Bene#Mangiamo il ___ a Natale.|panettone|gelato|caffè","Feliz Navidad=Buon Natale#Muchas felicidades=Tanti auguri"],
["Cine y música","il film=la película;il regista=el director;l'attore=el actor;il concerto=el concierto;la canzone=la canción;il cantante=el cantante;il biglietto=la entrada;la trama=la trama","En pasado, «piacere» usa essere y concuerda: il film mi è piaciuto, la canzone mi è piaciuta, i concerti mi sono piaciuti, le canzoni mi sono piaciute.","Il film mi è piaciuto molto.=La película me gustó mucho.;La canzone non mi è piaciuta.=La canción no me gustó.;Ho comprato due biglietti per il concerto.=He comprado dos entradas para el concierto.;Chi è il regista?=¿Quién es el director?","Sabato sono andato al cinema con Luca. Il film aveva una trama bellissima e gli attori erano bravi. Mi è piaciuto molto. Poi siamo andati a un concerto e le canzoni mi sono piaciute tantissimo.","El sábado fui al cine con Luca. La película tenía una trama preciosa y los actores eran buenos. Me gustó mucho. Luego fuimos a un concierto y las canciones me gustaron muchísimo.","¿Con quién fue al cine?|Con Luca|Con su hermana|Solo|0#¿Qué le gustó del concierto?|Las canciones|El precio|El lugar|0","Il film mi ___ piaciuto.|è|ha|sono#Le canzoni mi sono ___.|piaciute|piaciuto|piaciuti","La película me gustó=Il film mi è piaciuto#Dos entradas=Due biglietti"],
["La ciudad y el barrio","il quartiere=el barrio;il centro=el centro;il supermercato=el supermercado;il parco=el parque;il semaforo=el semáforo;l'angolo=la esquina;attraversare=cruzar;davanti a=delante de","Preposiciones de lugar: davanti a, dietro, accanto a, di fronte a, tra, vicino a. Para indicar: «attraversa la strada», «al semaforo gira a destra», «è all'angolo».","Il supermercato è davanti al parco.=El supermercado está delante del parque.;Attraversa la strada e gira a sinistra.=Cruza la calle y gira a la izquierda.;La farmacia è all'angolo.=La farmacia está en la esquina.;Abito in un quartiere tranquillo.=Vivo en un barrio tranquilo.","Abito in un quartiere tranquillo vicino al centro. Davanti a casa mia c'è un parco e accanto c'è un supermercato. Per arrivare in stazione attraversa la strada e al semaforo gira a destra. Il quartiere mi piace molto.","Vivo en un barrio tranquilo cerca del centro. Delante de mi casa hay un parque y al lado hay un supermercado. Para llegar a la estación cruza la calle y en el semáforo gira a la derecha. El barrio me gusta mucho.","¿Qué hay delante de su casa?|Un parque|Un banco|Una escuela|0#¿Dónde gira para ir a la estación?|A la izquierda|A la derecha|No gira|1","Il supermercato è ___ al parco.|davanti|dietro|tra#Al semaforo ___ a destra.|gira|girare|girato","Cruza la calle=Attraversa la strada#La farmacia está en la esquina=La farmacia è all'angolo"],
["Cuantificadores","molto=mucho;poco=poco;troppo=demasiado;abbastanza=bastante;tanto=tanto;tutto=todo;niente=nada;qualcosa=algo","Ante un nombre concuerdan: molta acqua, molti amici, poche persone, troppi libri. Como adverbios no cambian: lavoro molto, dormo poco. «Qualcosa» y «niente» van con di + adjetivo: qualcosa di buono.","Ho molti amici.=Tengo muchos amigos.;Mangio troppo.=Como demasiado.;Non c'è niente da fare.=No hay nada que hacer.;Vorrei qualcosa di dolce.=Quisiera algo dulce.","In ufficio lavoro troppo e dormo poco. Ho molti colleghi, ma poche persone sono davvero amiche. Oggi voglio fare qualcosa di diverso: vado al cinema. Ho abbastanza tempo e non ho niente da studiare.","En la oficina trabajo demasiado y duermo poco. Tengo muchos compañeros, pero pocas personas son realmente amigas. Hoy quiero hacer algo diferente: voy al cine. Tengo bastante tiempo y no tengo nada que estudiar.","¿Qué hace demasiado?|Trabaja|Come|Viaja|0#¿Qué quiere hacer hoy?|Algo diferente|Dormir|Estudiar|0","Ho ___ amici.|molti|molto|molta#Lavoro ___.|troppo|troppi|troppe","Demasiado trabajo=Troppo lavoro#Algo dulce=Qualcosa di dolce"],
["Cambios y devoluciones","il negozio=la tienda;lo scontrino=el tique;il cambio=el cambio;il rimborso=el reembolso;la taglia=la talla;il saldo=las rebajas;troppo stretto=demasiado estrecho;troppo largo=demasiado ancho","Para cambiar o devolver: «Vorrei cambiare questa giacca», «Ho lo scontrino». Stretto, largo, corto y lungo describen cómo queda una prenda. «Ci sono i saldi» = hay rebajas.","Vorrei cambiare questa camicia.=Quisiera cambiar esta camisa.;È troppo stretta.=Es demasiado estrecha.;Ho lo scontrino.=Tengo el tique.;Ci sono i saldi.=Hay rebajas.","Ieri ho comprato un cappotto con i saldi, ma oggi vedo che è troppo stretto. Torno in negozio con lo scontrino e dico: «Vorrei cambiare questo cappotto con una taglia più grande.» La commessa è gentile e trova subito quello giusto.","Ayer compré un abrigo en las rebajas, pero hoy veo que es demasiado estrecho. Vuelvo a la tienda con el tique y digo: «Quisiera cambiar este abrigo por una talla más grande.» La dependienta es amable y encuentra enseguida el adecuado.","¿Qué problema tiene el abrigo?|Es demasiado estrecho|Es demasiado largo|Es feo|0#¿Qué lleva a la tienda?|El tique|Un regalo|El pasaporte|0","Vorrei ___ questa giacca.|cambiare|cambio|cambiato#Ho lo ___.|scontrino|saldo|rimborso","Es demasiado estrecho=È troppo stretto#Tengo el tique=Ho lo scontrino"],
["Ubicación en la ciudad","davanti a=delante de;dietro=detrás de;accanto a=al lado de;di fronte a=enfrente de;sopra=encima;sotto=debajo;tra=entre;in mezzo a=en medio de","Preposiciones de lugar: davanti a, dietro, accanto a, di fronte a, sopra, sotto, tra / fra. Con artículo: davanti alla stazione, accanto al bar.","La banca è accanto al bar.=El banco está al lado del bar.;Il parco è di fronte alla stazione.=El parque está enfrente de la estación.;Il gatto è sotto il tavolo.=El gato está debajo de la mesa.;Il bar è tra la posta e la farmacia.=El bar está entre correos y la farmacia.","Il mio ufficio è in centro, davanti alla stazione. Accanto c'è un bar dove prendo il caffè e di fronte c'è un piccolo parco. La banca è tra la farmacia e la posta, a due minuti a piedi.","Mi oficina está en el centro, delante de la estación. Al lado hay un bar donde tomo el café y enfrente hay un pequeño parque. El banco está entre la farmacia y correos, a dos minutos andando.","¿Qué hay enfrente de la oficina?|Un parque|Un banco|Una farmacia|0#¿Dónde está el banco?|Entre la farmacia y correos|Junto al bar|Detrás de la estación|0","L'ufficio è ___ alla stazione.|davanti|sopra|tra#Il bar è ___ la posta e la farmacia.|tra|sopra|dietro","Al lado del bar=Accanto al bar#Enfrente de la estación=Di fronte alla stazione"],
["Excusas y planes","avere un impegno=tener un compromiso;rimandare=aplazar;organizzare=organizar;mi dispiace=lo siento;non importa=no importa;che peccato=qué pena;magari=ojalá / quizá;va bene=vale","Para rechazar y proponer: «Mi dispiace, non posso. Magari un'altra volta?». Para aceptar: «Va bene, ci vediamo alle otto». «Magari» puede significar «ojalá» o «quizás».","Mi dispiace, ho un impegno.=Lo siento, tengo un compromiso.;Possiamo rimandare a domani?=¿Podemos aplazarlo a mañana?;Che peccato!=¡Qué pena!;Va bene, ci vediamo alle otto.=Vale, nos vemos a las ocho.","Luca scrive a Sara: «Stasera non posso uscire, ho un impegno di lavoro. Mi dispiace!» Sara risponde: «Che peccato! Magari possiamo rimandare a domani?» Luca dice: «Va bene, ci vediamo alle otto.»","Luca escribe a Sara: «Esta noche no puedo salir, tengo un compromiso de trabajo. ¡Lo siento!» Sara responde: «¡Qué pena! ¿Quizá podemos aplazarlo a mañana?» Luca dice: «Vale, nos vemos a las ocho.»","¿Por qué no puede salir Luca?|Está enfermo|Tiene un compromiso de trabajo|Está de viaje|1#¿Cuándo quedan?|Hoy|Mañana|El sábado|1","Mi ___, ho un impegno.|dispiace|piace|dico#Possiamo ___ a domani?|rimandare|rimando|rimandato","Lo siento=Mi dispiace#Nos vemos a las ocho=Ci vediamo alle otto"],
["Celebraciones","il compleanno=el cumpleaños;il matrimonio=la boda;il regalo=el regalo;gli auguri=las felicitaciones;il brindisi=el brindis;la torta=la tarta;festeggiare=celebrar;invitato=invitado","Felicitaciones: «Auguri!», «Buon compleanno!», «Tanti auguri di buon Natale!». «Festeggiare» = celebrar. Para brindar: «Cin cin!» o «Alla salute!».","Buon compleanno, Anna!=¡Feliz cumpleaños, Anna!;Auguri agli sposi!=¡Felicidades a los novios!;Cin cin!=¡Chin chin!;Festeggiamo con la torta.=Celebramos con la tarta.","Sabato scorso ho festeggiato il compleanno di mia sorella. Abbiamo invitato venti persone e abbiamo preparato una grande torta. Tutti hanno fatto un regalo e hanno detto: «Auguri!» Alla fine abbiamo brindato insieme.","El sábado pasado celebré el cumpleaños de mi hermana. Invitamos a veinte personas y preparamos una gran tarta. Todos le hicieron un regalo y dijeron: «¡Felicidades!» Al final brindamos juntos.","¿A cuántas personas invitaron?|Diez|Veinte|Treinta|1#¿Qué prepararon?|Una tarta|Una pizza|Ensalada|0","Buon ___!|compleanno|regalo|brindisi#___ agli sposi!|Auguri|Torta|Invitato","Feliz cumpleaños=Buon compleanno#Celebramos=Festeggiamo"],
["El imperativo formal","mi dica=dígame;prenda=tome;venga=venga;aspetti=espere;guardi=mire;si accomodi=siéntese;scusi=perdone;mi dia=deme","Imperativo formal (Lei): -are → -i (guardi), -ere / -ire → -a (prenda, venga). Frases hechas: «Si accomodi», «Mi dica», «Aspetti un momento». Negativo: non + el mismo verbo (non si preoccupi).","Si accomodi, prego.=Pase, siéntese, por favor.;Mi dica, come posso aiutarla?=Dígame, ¿en qué puedo ayudarle?;Aspetti un momento.=Espere un momento.;Non si preoccupi.=No se preocupe.","In un ufficio, un impiegato dice a una cliente: «Buongiorno, si accomodi. Mi dica, come posso aiutarla?» La cliente spiega il problema. L'impiegato risponde: «Non si preoccupi, aspetti un momento e controllo subito.»","En una oficina, un empleado dice a una clienta: «Buenos días, siéntese. Dígame, ¿en qué puedo ayudarla?» La clienta explica el problema. El empleado responde: «No se preocupe, espere un momento y lo compruebo enseguida.»","¿Quién habla primero?|La clienta|El empleado|Un amigo|1#¿Qué le pide al final?|Que espere|Que se vaya|Que pague|0","___ un momento.|Aspetti|Aspetta|Aspettare#___, prego.|Si accomodi|Ti accomodi|Accomodarsi","Espere un momento=Aspetti un momento#No se preocupe=Non si preoccupi"],
["Pronombres dobles","me lo=me lo;te la=te la;ce li=nos los;glielo=se lo;gliela=se la;gliele=se las;ve lo=os lo;me ne=me de eso","Cuando se juntan el pronombre indirecto y el directo, el indirecto cambia: mi → me, ti → te, ci → ce, vi → ve. Con gli / le + lo se forma glielo, gliela, glieli, gliele (se lo, se la…).","Me lo dai, per favore?=¿Me lo das, por favor?;Te la presento domani.=Te la presento mañana.;Glielo dico domani.=Se lo digo mañana.;Ce li ha portati Marco.=Nos los ha traído Marco.","Ho comprato un libro per Anna e domani glielo regalo. Luca cerca le mie chiavi: gliele porto stasera. Mia madre chiede il mio nuovo indirizzo e io glielo scrivo subito.","He comprado un libro para Anna y mañana se lo regalo. Luca busca mis llaves: se las llevo esta noche. Mi madre pregunta mi nueva dirección y yo se la escribo enseguida.","¿Cuándo regala el libro?|Hoy|Mañana|El sábado|1#¿Qué escribe a su madre?|La dirección|Una carta|Un poema|0","Il libro? Domani ___ regalo.|glielo|lo gli|gli lo#Le chiavi? Stasera ___ porto.|gliele|glieli|gliela","Me lo das=Me lo dai#Se lo digo=Glielo dico"],
["Reservar por teléfono","prenotare=reservar;il tavolo=la mesa;per quante persone?=¿para cuántas personas?;a nome di=a nombre de;confermare=confirmar;disdire=cancelar;il posto=el sitio;la sera=la noche","Al reservar se dice «Vorrei prenotare un tavolo per…», se da el nombre con «a nome di…» y se confirma con «Confermo». Para cancelar: «Vorrei disdire la prenotazione».","Vorrei prenotare un tavolo per quattro.=Quisiera reservar una mesa para cuatro.;A nome di Rossi.=A nombre de Rossi.;Per che ora?=¿Para qué hora?;Vorrei disdire la prenotazione.=Quisiera cancelar la reserva.","Telefono al ristorante: «Buonasera, vorrei prenotare un tavolo per quattro persone sabato sera.» «Per che ora?» «Alle otto, a nome di Rossi.» «Perfetto, confermo.» Il giorno dopo devo disdire, perché un amico è malato.","Llamo al restaurante: «Buenas tardes, quisiera reservar una mesa para cuatro personas el sábado por la noche.» «¿Para qué hora?» «A las ocho, a nombre de Rossi.» «Perfecto, lo confirmo.» Al día siguiente tengo que cancelar porque un amigo está enfermo.","¿Para cuántas personas reserva?|Dos|Cuatro|Seis|1#¿Por qué cancela después?|Llueve|Un amigo está enfermo|Cambia de plan|1","Vorrei ___ un tavolo.|prenotare|prenoto|prenotato#A ___ di Rossi.|nome|numero|posto","Una mesa para cuatro=Un tavolo per quattro#A nombre de Rossi=A nome di Rossi"],
["Quejas en el hotel","il reclamo=la queja;rotto=roto;l'aria condizionata=el aire acondicionado;il rumore=el ruido;sporco=sucio;l'asciugamano=la toalla;cambiare camera=cambiar de habitación;il direttore=el director","Para quejarte con educación: «Mi scusi, c'è un problema con…», «Non funziona…», «Vorrei cambiare camera». Usa el condicional para pedir: «Potrebbe aiutarmi?».","Mi scusi, c'è un problema.=Perdone, hay un problema.;L'aria condizionata non funziona.=El aire acondicionado no funciona.;La camera è troppo rumorosa.=La habitación es demasiado ruidosa.;Potrebbe cambiare gli asciugamani?=¿Podría cambiar las toallas?","Arrivo in camera e vedo che l'aria condizionata non funziona e gli asciugamani sono sporchi. Chiamo la reception: «Mi scusi, c'è un problema. Potrebbe mandare qualcuno?» L'impiegato chiede scusa e dopo dieci minuti risolve tutto.","Llego a la habitación y veo que el aire acondicionado no funciona y las toallas están sucias. Llamo a recepción: «Perdone, hay un problema. ¿Podría mandar a alguien?» El empleado se disculpa y a los diez minutos lo soluciona todo.","¿Qué no funciona?|La televisión|El aire acondicionado|La luz|1#¿Cuánto tardan en solucionarlo?|Diez minutos|Una hora|Un día|0","L'aria condizionata non ___.|funziona|funzionare|funzionato#Mi ___, c'è un problema.|scusi|scusa|scusare","Hay un problema=C'è un problema#Quisiera cambiar de habitación=Vorrei cambiare camera"],
["Tareas domésticas","pulire=limpiar;lavare i piatti=lavar los platos;stirare=planchar;fare il bucato=hacer la colada;passare l'aspirapolvere=pasar la aspiradora;buttare la spazzatura=sacar la basura;fare il letto=hacer la cama;cucinare=cocinar","Para repartir tareas: «Tocca a me / a te» (me toca / te toca). «Dobbiamo + infinitivo»: dobbiamo pulire. Frecuencia: ogni giorno, una volta a settimana.","Oggi tocca a me lavare i piatti.=Hoy me toca a mí lavar los platos.;Faccio il bucato il sabato.=Hago la colada los sábados.;Dobbiamo pulire la casa.=Tenemos que limpiar la casa.;Chi butta la spazzatura?=¿Quién saca la basura?","Nella mia famiglia dividiamo i lavori di casa. Io lavo i piatti dopo cena, mia sorella passa l'aspirapolvere e mio padre fa il bucato il sabato. Oggi tocca a me buttare la spazzatura.","En mi familia repartimos las tareas de la casa. Yo lavo los platos después de cenar, mi hermana pasa la aspiradora y mi padre hace la colada los sábados. Hoy me toca a mí sacar la basura.","¿Quién pasa la aspiradora?|La hermana|El padre|La madre|0#¿Qué le toca hoy a quien habla?|Sacar la basura|Planchar|Cocinar|0","Oggi ___ a me lavare i piatti.|tocca|tocco|toccano#Faccio il ___ il sabato.|bucato|spazzatura|pulire","Lavo los platos=Lavo i piatti#Hoy me toca a mí=Oggi tocca a me"],
["En el supermercado","il supermercato=el supermercado;il carrello=el carro;la cassa=la caja;il reparto=la sección;la lista della spesa=la lista de la compra;in offerta=en oferta;la confezione=el paquete;il sacchetto=la bolsa","En el supermercado: «Dov'è il reparto…?», «È in offerta?». Envases: una confezione di, un pacco di, una bottiglia di, una scatola di. «Fare la spesa» = hacer la compra.","Dov'è il reparto della frutta?=¿Dónde está la sección de fruta?;Faccio la spesa il sabato.=Hago la compra los sábados.;Questa pasta è in offerta.=Esta pasta está en oferta.;Una bottiglia di acqua, per favore.=Una botella de agua, por favor.","Il sabato faccio la spesa al supermercato con la lista. Prendo un carrello e cerco la pasta: è in offerta! Compro anche una bottiglia di olio e una confezione di pomodori. Alla cassa pago con la carta.","Los sábados hago la compra en el supermercado con la lista. Cojo un carro y busco la pasta: ¡está en oferta! Compro también una botella de aceite y un paquete de tomates. En caja pago con tarjeta.","¿Qué está en oferta?|La pasta|El aceite|La fruta|0#¿Cómo paga?|Con tarjeta|En efectivo|Con el móvil|0","Faccio la ___ il sabato.|spesa|cassa|offerta#Una ___ di olio.|bottiglia|carrello|lista","La lista de la compra=La lista della spesa#En oferta=In offerta"],
["Animales y mascotas","il cane=el perro;il gatto=el gato;l'uccello=el pájaro;il pesce rosso=el pez de colores;il coniglio=el conejo;portare a spasso=sacar a pasear;il veterinario=el veterinario;dare da mangiare=dar de comer","Verbos útiles: avere un animale, portare a spasso il cane, dare da mangiare al gatto. Con animales: mi piacciono i cani. Plural: il gatto → i gatti, il cane → i cani.","Ho un cane e due gatti.=Tengo un perro y dos gatos.;Porto a spasso il cane ogni mattina.=Saco a pasear al perro cada mañana.;Do da mangiare al gatto.=Doy de comer al gato.;Il veterinario è molto bravo.=El veterinario es muy bueno.","Ho un cane che si chiama Leo e due gatti. Ogni mattina porto a spasso Leo prima del lavoro. La sera do da mangiare ai gatti. Una volta al mese li porto dal veterinario per un controllo.","Tengo un perro que se llama Leo y dos gatos. Cada mañana saco a pasear a Leo antes del trabajo. Por la noche doy de comer a los gatos. Una vez al mes los llevo al veterinario para una revisión.","¿Cómo se llama el perro?|Leo|Max|Luna|0#¿Cuándo pasea al perro?|Por la mañana|Por la noche|A mediodía|0","Porto a ___ il cane.|spasso|mangiare|piedi#Do da ___ al gatto.|mangiare|spasso|veterinario","Tengo un perro=Ho un cane#El veterinario=Il veterinario"],
["Dar consejos","consigliare=aconsejar;il consiglio=el consejo;dovresti=deberías;ti consiglio di=te aconsejo que;secondo me=en mi opinión;se fossi in te=yo que tú;provare=probar;sarebbe meglio=sería mejor","Para aconsejar: «Dovresti + infinitivo», «Ti consiglio di + infinitivo», «Sarebbe meglio + infinitivo». «Se fossi in te» + condicional = yo que tú: se fossi in te, parlerei con lui.","Dovresti dormire di più.=Deberías dormir más.;Ti consiglio di provare questo ristorante.=Te aconsejo que pruebes este restaurante.;Sarebbe meglio partire presto.=Sería mejor salir temprano.;Se fossi in te, andrei dal medico.=Yo que tú iría al médico.","Un'amica mi dice che è sempre stanca. Le rispondo: «Dovresti dormire di più e mangiare meglio. Ti consiglio di fare una passeggiata ogni giorno. Se fossi in te, andrei anche dal medico.» Lei sorride e dice: «Grazie dei consigli!»","Una amiga me dice que siempre está cansada. Le respondo: «Deberías dormir más y comer mejor. Te aconsejo que des un paseo cada día. Yo que tú iría también al médico.» Ella sonríe y dice: «¡Gracias por los consejos!»","¿Qué le aconseja hacer cada día?|Dar un paseo|Correr|Estudiar|0#¿Qué problema tiene la amiga?|Está siempre cansada|Tiene fiebre|Está triste|0","___ dormire di più.|Dovresti|Devi|Dovevo#Ti ___ di fare una passeggiata.|consiglio|consigli|consigliare","Deberías descansar=Dovresti riposare#Sería mejor partir=Sarebbe meglio partire"],
["Pedir permiso y favores","posso=puedo;ti dispiace se=¿te importa si;per favore=por favor;mi puoi aiutare?=¿me puedes ayudar?;certo=claro;nessun problema=ningún problema;prestare=prestar;aprire=abrir","Para pedir permiso: «Posso + infinitivo?» o «Ti dispiace se + presente?». Para pedir un favor: «Mi puoi aiutare?». Para aceptar: «Certo!», «Nessun problema». Para rechazar: «Mi dispiace, ma…».","Posso aprire la finestra?=¿Puedo abrir la ventana?;Ti dispiace se esco prima?=¿Te importa si salgo antes?;Mi puoi prestare una penna?=¿Me puedes prestar un bolígrafo?;Certo, nessun problema!=¡Claro, ningún problema!","In classe chiedo alla mia compagna: «Mi puoi prestare una penna, per favore?» Lei risponde: «Certo!» Poi chiedo al professore: «Posso uscire un momento?» Lui dice: «Nessun problema, ma torni presto.»","En clase le pido a mi compañera: «¿Me puedes prestar un bolígrafo, por favor?» Ella responde: «¡Claro!» Luego pregunto al profesor: «¿Puedo salir un momento?» Él dice: «Ningún problema, pero vuelva pronto.»","¿Qué pide prestado?|Un bolígrafo|Un libro|Un móvil|0#¿Qué pregunta al profesor?|Si puede salir|Si puede hablar|Si puede comer|0","___ aprire la finestra?|Posso|Puoi|Può#Ti ___ se esco prima?|dispiace|piace|dispiaci","¿Puedo entrar?=Posso entrare?#Claro=Certo"],
["La escuela y la universidad","la scuola=la escuela;l'università=la universidad;la lezione=la clase;l'esame=el examen;i compiti=los deberes;il voto=la nota;la materia=la asignatura;superare=aprobar","Verbos de estudio: studiare, frequentare (cursar), dare un esame (presentarse), superare un esame (aprobarlo), bocciare (suspender). Las notas van del 1 al 10 en la escuela y del 18 al 30 en la universidad.","Frequento l'università di Bologna.=Curso en la universidad de Bolonia.;Domani ho un esame importante.=Mañana tengo un examen importante.;Ho superato l'esame con trenta.=He aprobado el examen con treinta.;Faccio i compiti ogni sera.=Hago los deberes cada noche.","Frequento l'università e studio economia. Domani ho un esame importante, quindi oggi ripasso tutta la giornata. Se lo supero, il voto sarà almeno ventiquattro. Dopo l'esame festeggio con gli amici.","Curso en la universidad y estudio economía. Mañana tengo un examen importante, así que hoy repaso todo el día. Si lo apruebo, la nota será al menos veinticuatro. Después del examen lo celebro con los amigos.","¿Qué estudia?|Economía|Derecho|Medicina|0#¿Qué hace hoy?|Repasa todo el día|Viaja|Descansa|0","Domani ho un ___.|esame|voto|compito#Ho ___ l'esame.|superato|superare|supero","El examen=L'esame#Los deberes=I compiti"],
["Escribir un correo","caro=querido;gentile=estimado;in allegato=adjunto;cordiali saluti=un cordial saludo;a presto=hasta pronto;ti scrivo per=te escribo para;rispondere=responder;l'oggetto=el asunto","Correo informal: «Caro Luca, … A presto!». Formal: «Gentile signora Rossi, … Cordiali saluti». Fórmulas: «Ti scrivo per…», «In allegato trovi…», «Resto in attesa di una risposta».","Caro Luca, ti scrivo per invitarti.=Querido Luca, te escribo para invitarte.;In allegato trovi il documento.=Adjunto encontrarás el documento.;Gentile signora Rossi,=Estimada señora Rossi,;Cordiali saluti.=Un cordial saludo.","Caro Luca, ti scrivo per invitarti alla mia festa di sabato. In allegato trovi la mappa con l'indirizzo. Spero di vederti! Fammi sapere se puoi venire. A presto, Marta.","Querido Luca, te escribo para invitarte a mi fiesta del sábado. Adjunto encontrarás el mapa con la dirección. ¡Espero verte! Hazme saber si puedes venir. Hasta pronto, Marta.","¿Para qué escribe Marta?|Para invitar a una fiesta|Para pedir dinero|Para cancelar|0#¿Qué adjunta?|Un mapa|Una foto|Una factura|0","Caro Luca, ti scrivo ___ invitarti.|per|di|con#In ___ trovi la mappa.|allegato|oggetto|saluti","Te escribo para invitarte=Ti scrivo per invitarti#Un cordial saludo=Cordiali saluti"],
["Las noticias","la notizia=la noticia;il giornale=el periódico;il titolo=el titular;l'articolo=el artículo;il giornalista=el periodista;accadere=ocurrir;secondo=según;la cronaca=la crónica","Para hablar de noticias: «Hai letto la notizia?», «Secondo il giornale…», «È successo che…». Los verbos succedere / accadere llevan «essere» en el pasado: è successo, è accaduto.","Hai letto la notizia di oggi?=¿Has leído la noticia de hoy?;Secondo il giornale, domani pioverà.=Según el periódico, mañana lloverá.;Cosa è successo?=¿Qué ha pasado?;Il titolo è molto interessante.=El titular es muy interesante.","Ogni mattina leggo il giornale al bar. Oggi il titolo parla di una grande festa in città. Secondo l'articolo, è venuta molta gente e il tempo era bellissimo. Il giornalista dice che la festa sarà ancora domani.","Cada mañana leo el periódico en el bar. Hoy el titular habla de una gran fiesta en la ciudad. Según el artículo, vino mucha gente y hacía un tiempo precioso. El periodista dice que la fiesta continuará mañana.","¿Dónde lee el periódico?|En el bar|En casa|En el tren|0#¿De qué habla el titular?|De una fiesta|De un accidente|De un partido|0","Secondo il ___, domani pioverà.|giornale|titolo|giornalista#Cosa è ___?|successo|succeduto|succedere","¿Qué ha pasado?=Cosa è successo?#Según el periódico=Secondo il giornale"],
["Postales y relatos de viaje","la cartolina=la postal;il paesaggio=el paisaje;il ricordo=el recuerdo;il souvenir=el souvenir;il panorama=la vista;indimenticabile=inolvidable;il tramonto=la puesta de sol;stupendo=estupendo","Para contar un viaje se mezclan passato prossimo (lo que hiciste) e imperfetto (cómo era): «Siamo andati a Capri. Faceva caldo e il mare era stupendo». Cierre típico: «Un abbraccio!».","Siamo andati a Capri.=Fuimos a Capri.;Il mare era stupendo.=El mar era estupendo.;Ti mando una cartolina.=Te mando una postal.;È stato un viaggio indimenticabile.=Ha sido un viaje inolvidable.","Cara Anna, ti scrivo da Capri! Siamo arrivati ieri e il mare era stupendo. Abbiamo visto il tramonto dal porto: un panorama indimenticabile. Domani visiteremo la grotta. Ti porto un piccolo ricordo. Un abbraccio, Paolo.","¡Querida Anna, te escribo desde Capri! Llegamos ayer y el mar era estupendo. Vimos la puesta de sol desde el puerto: una vista inolvidable. Mañana visitaremos la gruta. Te traigo un pequeño recuerdo. Un abrazo, Paolo.","¿Desde dónde escribe?|Desde Capri|Desde Roma|Desde Venecia|0#¿Qué visitarán mañana?|La gruta|El museo|La iglesia|0","Il mare ___ stupendo.|era|è stato|sarà#Ti mando una ___.|cartolina|panorama|tramonto","Un viaje inolvidable=Un viaggio indimenticabile#Un abrazo=Un abbraccio"],
["Cumplidos y reacciones","complimenti=enhorabuena;che bello!=¡qué bonito!;che bravo!=¡qué bueno!;mi piace molto=me gusta mucho;sono contento=estoy contento;che sorpresa!=¡qué sorpresa!;davvero?=¿de verdad?;sei gentile=eres amable","Para reaccionar: «Che + adjetivo o nombre!» (che bello!, che sorpresa!). Para felicitar: «Complimenti!», «Congratulazioni!». Para agradecer un cumplido: «Grazie, sei gentile!».","Che bella casa!=¡Qué casa tan bonita!;Complimenti per il lavoro!=¡Enhorabuena por el trabajo!;Davvero? Che sorpresa!=¿De verdad? ¡Qué sorpresa!;Grazie, sei gentile.=Gracias, eres amable.","Marta mostra la sua nuova casa agli amici. Luca dice: «Che bella casa! Complimenti!» Marta risponde: «Grazie, sei gentile!» Poi Anna porta un regalo e Marta dice: «Davvero? Che sorpresa!»","Marta enseña su nueva casa a los amigos. Luca dice: «¡Qué casa tan bonita! ¡Enhorabuena!» Marta responde: «¡Gracias, eres amable!» Luego Anna trae un regalo y Marta dice: «¿De verdad? ¡Qué sorpresa!»","¿Qué enseña Marta?|Su nueva casa|Su coche|Su jardín|0#¿Qué trae Anna?|Un regalo|Flores|Vino|0","Che ___ casa!|bella|bello|belle#___ per il lavoro!|Complimenti|Prego|Piacere","¡Qué sorpresa!=Che sorpresa!#¡Enhorabuena!=Complimenti!"],
["El pronombre relativo che","che=que;dove=donde;chi=quien;quello che=lo que;il libro che leggo=el libro que leo;la persona che conosco=la persona que conozco;la città dove abito=la ciudad donde vivo;qualcuno che=alguien que","«Che» une dos frases y no cambia nunca: il libro che leggo, la persona che conosco. «Dove» introduce lugares: la città dove abito. «Quello che» = lo que.","Il libro che leggo è bello.=El libro que leo es bonito.;La città dove abito è piccola.=La ciudad donde vivo es pequeña.;Conosco una persona che parla cinque lingue.=Conozco a una persona que habla cinco idiomas.;Quello che dici è vero.=Lo que dices es verdad.","Ho un amico che parla cinque lingue. Abita in una città dove c'è un grande porto. Il libro che sto leggendo racconta la sua storia. Quello che mi piace di più è la sua passione per i viaggi.","Tengo un amigo que habla cinco idiomas. Vive en una ciudad donde hay un gran puerto. El libro que estoy leyendo cuenta su historia. Lo que más me gusta es su pasión por los viajes.","¿Cuántos idiomas habla el amigo?|Tres|Cinco|Siete|1#¿Qué hay en su ciudad?|Un gran puerto|Una montaña|Un lago|0","Il libro ___ leggo è bello.|che|dove|chi#La città ___ abito è piccola.|dove|che|chi","El libro que leo=Il libro che leggo#La ciudad donde vivo=La città dove abito"],
["Hipótesis reales con se","se=si;allora=entonces;a meno che=a menos que;se piove=si llueve;se ho tempo=si tengo tiempo;se puoi=si puedes;altrimenti=de lo contrario;in caso di=en caso de","Hipótesis posible: se + presente → presente, futuro o imperativo. Se piove, resto a casa. Se avrò tempo, ti chiamerò. Se puoi, vieni! «Altrimenti» = de lo contrario.","Se piove, resto a casa.=Si llueve, me quedo en casa.;Se avrò tempo, ti chiamerò.=Si tengo tiempo, te llamaré.;Se puoi, vieni alla festa.=Si puedes, ven a la fiesta.;Studia, altrimenti non passi l'esame.=Estudia, de lo contrario no apruebas el examen.","Se domani fa bel tempo, andiamo al lago. Se Marco ha tempo, viene con noi. Se piove, restiamo a casa e guardiamo un film. Prenotiamo il picnic oggi, altrimenti non troviamo posto.","Si mañana hace buen tiempo, vamos al lago. Si Marco tiene tiempo, viene con nosotros. Si llueve, nos quedamos en casa y vemos una película. Reservamos el picnic hoy, de lo contrario no encontramos sitio.","¿Qué hacen si hace buen tiempo?|Van al lago|Se quedan en casa|Van al cine|0#¿Qué hacen si llueve?|Ven una película|Salen|Duermen|0","___ piove, resto a casa.|Se|Che|Dove#Studia, ___ non passi l'esame.|altrimenti|allora|se","Si llueve me quedo en casa=Se piove resto a casa#Si puedes ven=Se puoi vieni"],
["Salud y bienestar","la dieta=la dieta;lo stress=el estrés;il sonno=el sueño;l'allenamento=el entrenamiento;sano=sano;fare attenzione=tener cuidado;rilassarsi=relajarse;mangiare bene=comer bien","Para hablar de hábitos saludables: «Devo + infinitivo», «È importante + infinitivo», «Fa bene / Fa male» (es bueno / malo para la salud). Ej.: camminare fa bene.","Camminare fa bene alla salute.=Caminar es bueno para la salud.;È importante dormire otto ore.=Es importante dormir ocho horas.;Devo rilassarmi di più.=Tengo que relajarme más.;Mangio sano e faccio sport.=Como sano y hago deporte.","Quest'anno voglio vivere meglio. Mangio più verdura e faccio sport tre volte a settimana. Dormo otto ore a notte e cerco di rilassarmi dopo il lavoro. Lo stress fa male, quindi ogni sera faccio una passeggiata.","Este año quiero vivir mejor. Como más verdura y hago deporte tres veces por semana. Duermo ocho horas por la noche y trato de relajarme después del trabajo. El estrés es malo, así que cada noche doy un paseo.","¿Cuántas veces hace deporte?|Una|Tres|Cinco|1#¿Cuántas horas duerme?|Seis|Ocho|Diez|1","Camminare ___ bene.|fa|è|ha#È ___ dormire otto ore.|importante|importanza|importanti","Como sano=Mangio sano#Tengo que relajarme=Devo rilassarmi"],
["Amistad y relaciones","l'amicizia=la amistad;il fidanzato=el novio;la fidanzata=la novia;il compagno=la pareja;fidarsi=fiarse;litigare=discutir;fare pace=hacer las paces;volersi bene=quererse","«Voler bene» expresa cariño entre amigos y familia; «amare» se reserva al amor de pareja. Recíprocos: ci vediamo, ci sentiamo, ci vogliamo bene (nos vemos, hablamos, nos queremos).","Voglio molto bene a mia sorella.=Quiero mucho a mi hermana.;Ci sentiamo domani.=Hablamos mañana.;Ho litigato con un amico.=He discutido con un amigo.;Abbiamo fatto pace.=Hemos hecho las paces.","Ho un'amica che si chiama Chiara e ci vogliamo molto bene. Ci vediamo ogni settimana e ci sentiamo spesso al telefono. L'anno scorso abbiamo litigato, ma dopo due giorni abbiamo fatto pace.","Tengo una amiga que se llama Chiara y nos queremos mucho. Nos vemos cada semana y hablamos a menudo por teléfono. El año pasado discutimos, pero a los dos días hicimos las paces.","¿Cada cuánto se ven?|Cada semana|Cada mes|Cada día|0#¿Cuándo discutieron?|El año pasado|Ayer|Hace una semana|0","Ci ___ ogni settimana.|vediamo|vedi|vedete#Abbiamo fatto ___.|pace|amicizia|bene","Nos queremos mucho=Ci vogliamo molto bene#Hemos hecho las paces=Abbiamo fatto pace"],
["Mi ciudad natal","la città natale=la ciudad natal;il centro storico=el casco histórico;la chiesa=la iglesia;il fiume=el río;la gente=la gente;tranquillo=tranquilo;famoso per=famoso por;tipico=típico","Para describir un lugar: «È famosa per…», «C'è / Ci sono…», «È una città + adjetivo». Mezcla presente (cómo es) e imperfetto (cómo era): da piccolo giocavo nel centro storico.","La mia città è famosa per il vino.=Mi ciudad es famosa por el vino.;C'è un fiume nel centro.=Hay un río en el centro.;Il centro storico è molto bello.=El casco histórico es muy bonito.;La gente è molto ospitale.=La gente es muy hospitalaria.","Sono nato a Siena, una città piccola e tranquilla. È famosa per la piazza principale e per una grande corsa di cavalli. Da bambino giocavo nel centro storico con i miei amici. La gente è ospitale e il cibo è tipico e ottimo.","Nací en Siena, una ciudad pequeña y tranquila. Es famosa por la plaza principal y por una gran carrera de caballos. De niño jugaba en el casco histórico con mis amigos. La gente es hospitalaria y la comida es típica y excelente.","¿Cómo es la ciudad?|Pequeña y tranquila|Grande y ruidosa|Moderna|0#¿Dónde jugaba de niño?|En el casco histórico|En la playa|En el campo|0","È famosa ___ la piazza.|per|di|da#C'è un ___ nel centro.|fiume|fiumi|fiumo","Una ciudad tranquila=Una città tranquilla#Famosa por el vino=Famosa per il vino"],
["Repaso A2: una semana en Italia","la settimana=la semana;il programma=el plan;il treno=el tren;la visita=la visita;la cena=la cena;il ritorno=la vuelta;la partenza=la salida;il cambiamento=el cambio","Repaso A2: combina futuro (visiterò), passato prossimo (ho prenotato), imperfetto (era) y condicional (vorrei). Conectores útiles: prima, poi, dopo, infine.","Prima visiterò Roma, poi Firenze.=Primero visitaré Roma y luego Florencia.;Ho già prenotato il treno.=Ya he reservado el tren.;Vorrei cenare in un posto tipico.=Quisiera cenar en un sitio típico.;Infine tornerò a casa.=Por último volveré a casa.","Questa estate passerò una settimana in Italia. Ho già prenotato i treni e gli alberghi. Prima visiterò Roma, poi andrò a Firenze. Infine passerò due giorni a Venezia. Mi piacerebbe cenare ogni sera in un ristorante tipico.","Este verano pasaré una semana en Italia. Ya he reservado los trenes y los hoteles. Primero visitaré Roma y luego iré a Florencia. Por último pasaré dos días en Venecia. Me gustaría cenar cada noche en un restaurante típico.","¿Cuánto tiempo estará en Italia?|Una semana|Dos semanas|Un mes|0#¿Dónde estará al final?|En Venecia|En Roma|En Florencia|0","Ho ___ prenotato il treno.|già|ancora|mai#___ visiterò Roma, poi Firenze.|Prima|Infine|Ieri","Ya he reservado=Ho già prenotato#Primero Roma, luego Florencia=Prima Roma, poi Firenze"],
["Repaso final A2: mi historia","la storia=la historia;crescere=crecer;trasferirsi=mudarse;conoscere=conocer;il futuro=el futuro;il passato=el pasado;il presente=el presente;realizzare=realizar","Repaso A2: cuenta tu vida con passato prossimo (mi sono trasferito), imperfetto (abitavo), presente (lavoro) y futuro (realizzerò). Marcadores: da piccolo, poi, adesso, in futuro.","Sono cresciuto in campagna.=Crecí en el campo.;Mi sono trasferito a Milano nel 2020.=Me mudé a Milán en 2020.;Ora lavoro in un ufficio.=Ahora trabajo en una oficina.;In futuro realizzerò il mio sogno.=En el futuro realizaré mi sueño.","Sono cresciuto in un piccolo paese e da piccolo giocavo sempre all'aperto. A vent'anni mi sono trasferito a Milano per studiare. Ora lavoro in un ufficio e parlo italiano ogni giorno. In futuro realizzerò il mio sogno: aprire un ristorante.","Crecí en un pueblo pequeño y de niño jugaba siempre al aire libre. A los veinte años me mudé a Milán para estudiar. Ahora trabajo en una oficina y hablo italiano cada día. En el futuro realizaré mi sueño: abrir un restaurante.","¿Por qué se mudó a Milán?|Para estudiar|Para trabajar|Por amor|0#¿Cuál es su sueño?|Abrir un restaurante|Viajar|Ser médico|0","A vent'anni mi ___ trasferito a Milano.|sono|ho|ha#In futuro ___ il mio sogno.|realizzerò|realizzo|realizzato","Crecí en el campo=Sono cresciuto in campagna#Ahora trabajo en una oficina=Ora lavoro in un ufficio"]
