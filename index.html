["Primo Levi y la escritura de la memoria","la testimonianza=el testimonio;la memoria=la memoria;la chiarezza=la claridad;il linguaggio=el lenguaje;la dignità=la dignidad;lo scienziato=el científico;la precisione=la precisión;raccontare=narrar","Primo Levi (1919-1987), químico y escritor, publicó «Se questo è un uomo» (1947), testimonio de su deportación a Auschwitz. Su escritura es clara, precisa y casi científica, sin retórica. Defiende que recordar es un deber. Para comentar: «Il linguaggio è limpido», «La testimonianza non cerca effetti», «Ricordare è un dovere civile».","Il linguaggio è limpido e preciso.=El lenguaje es límpido y preciso.;La testimonianza non cerca effetti.=El testimonio no busca efectos.;Ricordare è un dovere civile.=Recordar es un deber cívico.;Levi era un chimico oltre che scrittore.=Levi era químico además de escritor.","Primo Levi, chimico e scrittore, raccontò in Se questo è un uomo la propria deportazione con un linguaggio limpido e preciso, quasi scientifico. La testimonianza non cerca effetti e rifiuta la retorica: preferisce la chiarezza, perché la dignità del racconto sta nei fatti. Per Levi, ricordare è un dovere civile.","Primo Levi, químico y escritor, narró en Se questo è un uomo su propia deportación con un lenguaje límpido y preciso, casi científico. El testimonio no busca efectos y rechaza la retórica: prefiere la claridad, porque la dignidad del relato está en los hechos. Para Levi, recordar es un deber cívico.","¿Cómo es su lenguaje?|Límpido y preciso|Barroco|Lleno de retórica|0#¿Qué es recordar para Levi?|Un deber cívico|Un adorno|Un juego|0","Il linguaggio è ___ e preciso.|limpido|limpida|limpidi#Ricordare è un ___ civile.|dovere|doveri|dovuto","El testimonio=La testimonianza#La claridad=La chiarezza"],
["Dario Fo y la sátira teatral","il giullare=el juglar;il grammelot=el grammelot;il teatro popolare=el teatro popular;la satira=la sátira;il potere=el poder;la farsa=la farsa;l'improvvisazione=la improvisación;il Nobel=el Nobel","Dario Fo (1926-2016), Nobel de Literatura en 1997, recuperó la figura del «giullare» medieval en «Mistero buffo» (1969). Usaba el «grammelot», un lenguaje inventado de sonidos y gestos, y una sátira feroz contra el poder. Para comentar: «Fo denuncia con la farsa», «Il pubblico ride e riflette», «Il grammelot sostituisce le parole».","Fo ricevette il Nobel nel 1997.=Fo recibió el Nobel en 1997.;Il giullare denuncia il potere con la farsa.=El juglar denuncia el poder con la farsa.;Il grammelot sostituisce le parole.=El grammelot sustituye a las palabras.;Il pubblico ride e riflette.=El público ríe y reflexiona.","Dario Fo, premio Nobel nel 1997, recuperò la figura del giullare medievale e la trasformò in uno strumento di satira. In Mistero buffo usa il grammelot, un linguaggio inventato in cui i suoni e i gesti sostituiscono le parole. Il pubblico ride, ma insieme riflette, perché la farsa denuncia con ironia gli abusi del potere.","Dario Fo, premio Nobel en 1997, recuperó la figura del juglar medieval y la transformó en un instrumento de sátira. En Mistero buffo usa el grammelot, un lenguaje inventado en el que los sonidos y los gestos sustituyen a las palabras. El público ríe, pero a la vez reflexiona, porque la farsa denuncia con ironía los abusos del poder.","¿Qué es el grammelot?|Un lenguaje inventado|Un instrumento|Una ciudad|0#¿Qué denuncia con ironía?|Los abusos del poder|La lluvia|La música|0","Fo ___ il Nobel nel 1997.|ricevette|ricevere|ricevuto#Il pubblico ride e ___.|riflette|riflettere|riflesso","El juglar=Il giullare#La farsa=La farsa"],
["Gadda y el pastiche lingüístico","il pastiche=el pastiche;il plurilinguismo=el plurilingüismo;il dialetto=el dialecto;il barocco=el barroco;la deformazione=la deformación;il grottesco=lo grotesco;il caos=el caos;la sintassi=la sintaxis","Carlo Emilio Gadda (1893-1973) mezcla dialecto, lenguaje técnico y registro culto en un estilo barroco: el «pastiche». Su novela «Quer pasticciaccio brutto de via Merulana» es un policíaco sin solución clara. Para comentar: «L'autore deforma la lingua…», «Il plurilinguismo riflette il caos del reale».","Gadda mescola dialetto e lingua colta.=Gadda mezcla dialecto y lengua culta.;La sintassi è volutamente complessa.=La sintaxis es deliberadamente compleja.;Il plurilinguismo riflette il caos del reale.=El plurilingüismo refleja el caos de lo real.;Il romanzo è un giallo senza soluzione.=La novela es un policíaco sin solución.","Gadda mescola dialetto romano, linguaggio tecnico e italiano colto in uno stile barocco e grottesco. La sintassi è volutamente complessa e il plurilinguismo riflette il caos del reale. Nel Pasticciaccio, un giallo senza soluzione definitiva, la deformazione della lingua diventa un modo di conoscere una realtà confusa e contraddittoria.","Gadda mezcla dialecto romano, lenguaje técnico e italiano culto en un estilo barroco y grotesco. La sintaxis es deliberadamente compleja y el plurilingüismo refleja el caos de lo real. En el Pasticciaccio, un policíaco sin solución definitiva, la deformación de la lengua se convierte en una manera de conocer una realidad confusa y contradictoria.","¿Qué mezcla Gadda?|Dialecto, técnica y lengua culta|Solo inglés|Solo latín|0#¿Cómo es el estilo?|Barroco y grotesco|Simple|Frío|0","Gadda ___ dialetto e lingua colta.|mescola|mescolare|mescolato#La sintassi è ___ complessa.|volutamente|voluto|volere","El caos=Il caos#Lo grotesco=Il grottesco"],
["Sciascia y la novela de denuncia","la giustizia=la justicia;l'inchiesta=la investigación;l'omertà=la ley del silencio;la Sicilia=Sicilia;il giallo=la novela policíaca;la denuncia=la denuncia;l'ingiustizia=la injusticia;il potere=el poder","Leonardo Sciascia (1921-1989) usa el género policíaco para denunciar el poder y la «omertà» en Sicilia (Il giorno della civetta, 1961). Para comentar: «L'autore denuncia…», «Il giallo diventa strumento di critica sociale», «Il finale resta aperto». Verbos: denunciare, svelare, indagare.","Sciascia denuncia l'omertà in Sicilia.=Sciascia denuncia la omertà en Sicilia.;Il giallo diventa strumento di critica sociale.=La novela policíaca se convierte en instrumento de crítica social.;L'ispettore indaga su un omicidio.=El inspector investiga un asesinato.;Il finale resta aperto.=El final queda abierto.","Sciascia usa il giallo come strumento di critica sociale: nel Giorno della civetta un ispettore indaga su un omicidio e si scontra con l'omertà. L'autore denuncia l'intreccio tra potere e illegalità, ma il finale resta aperto, a ricordare che la giustizia non è mai garantita. La sua lezione è un invito a non voltarsi dall'altra parte.","Sciascia usa la novela policíaca como instrumento de crítica social: en El día de la lechuza un inspector investiga un asesinato y choca con la omertà. El autor denuncia el entramado entre poder e ilegalidad, pero el final queda abierto, para recordar que la justicia nunca está garantizada. Su lección es una invitación a no mirar hacia otro lado.","¿Qué usa Sciascia como instrumento?|La novela policíaca|La poesía|El teatro|0#¿Cómo queda el final?|Abierto|Cerrado|Feliz|0","L'autore ___ l'omertà.|denuncia|denunciare|denunciato#Il finale ___ aperto.|resta|restare|restato","La justicia=La giustizia#La denuncia=La denuncia"],
["Montessori y la pedagogía","il metodo=el método;l'infanzia=la infancia;l'autonomia=la autonomía;l'ambiente preparato=el ambiente preparado;il materiale=el material;l'osservazione=la observación;la libertà=la libertad;lo sviluppo=el desarrollo","Maria Montessori (1870-1952) propone un método centrado en el niño: ambiente preparado, material sensorial y autonomía. El maestro observa y guía en lugar de imponer. Frase clave: «Aiutami a fare da solo». Para exponer: «Si fonda sul principio che…», «Mira a favorire…».","Il metodo si fonda sull'autonomia del bambino.=El método se funda en la autonomía del niño.;L'ambiente è preparato con cura.=El ambiente está preparado con cuidado.;Aiutami a fare da solo.=Ayúdame a hacerlo solo.;L'insegnante osserva e guida.=El maestro observa y guía.","Maria Montessori elaborò un metodo che si fonda sull'autonomia del bambino. L'ambiente è preparato con cura e il materiale stimola i sensi e la concentrazione. L'insegnante osserva e guida, senza imporre. Il motto «Aiutami a fare da solo» riassume l'idea che ogni bambino debba poter sviluppare liberamente le proprie capacità.","Maria Montessori elaboró un método que se funda en la autonomía del niño. El ambiente está preparado con cuidado y el material estimula los sentidos y la concentración. El maestro observa y guía, sin imponer. El lema «Ayúdame a hacerlo solo» resume la idea de que cada niño debe poder desarrollar libremente sus capacidades.","¿En qué se funda el método?|En la autonomía del niño|En la disciplina|En los exámenes|0#¿Qué hace el maestro?|Observa y guía|Impone|Ignora|0","Il metodo si ___ sull'autonomia.|fonda|fondare|fondato#L'ambiente è ___ con cura.|preparato|preparare|prepara","La infancia=L'infanzia#La autonomía=L'autonomia"],
["Fermi y la física del siglo XX","la fisica=la física;l'atomo=el átomo;il neutrone=el neutrón;il reattore=el reactor;il Premio Nobel=el Premio Nobel;la ricerca=la investigación;il laboratorio=el laboratorio;la scoperta=el descubrimiento","Enrico Fermi (1901-1954), Nobel de Física 1938, trabajó con neutrones y construyó en Chicago el primer reactor nuclear (1942). Para exponer ciencia: «Ha dimostrato che…», «Si è dedicato a…», «La scoperta ha aperto la strada a…».","Fermi vinse il Nobel per la fisica nel 1938.=Fermi ganó el Nobel de Física en 1938.;Ha dimostrato il ruolo dei neutroni.=Demostró el papel de los neutrones.;La scoperta ha aperto la strada a nuove ricerche.=El descubrimiento abrió el camino a nuevas investigaciones.;Costruì il primo reattore a Chicago.=Construyó el primer reactor en Chicago.","Enrico Fermi vinse il Nobel per la fisica nel 1938 per i suoi studi sui neutroni. Poco dopo emigrò negli Stati Uniti, dove costruì a Chicago il primo reattore nucleare. La sua ricerca ha aperto la strada a nuove applicazioni, ma ha anche posto problemi etici che la scienza non può ignorare.","Enrico Fermi ganó el Nobel de Física en 1938 por sus estudios sobre los neutrones. Poco después emigró a Estados Unidos, donde construyó en Chicago el primer reactor nuclear. Su investigación ha abierto el camino a nuevas aplicaciones, pero también ha planteado problemas éticos que la ciencia no puede ignorar.","¿Cuándo ganó el Nobel?|1938|1945|1901|0#¿Dónde construyó el reactor?|Chicago|Roma|Nueva York|0","Fermi ___ il Nobel nel 1938.|vinse|vincere|vinto#Ha ___ la strada a nuove ricerche.|aperto|aprire|apre","El átomo=L'atomo#El descubrimiento=La scoperta"],
["Rita Levi-Montalcini y la neurociencia","la neurobiologia=la neurobiología;la cellula=la célula;il fattore di crescita=el factor de crecimiento;la ricerca=la investigación;la senatrice a vita=la senadora vitalicia;la perseveranza=la perseverancia;la curiosità=la curiosidad;la divulgazione=la divulgación","Rita Levi-Montalcini (1909-2012), Nobel de Medicina 1986, descubrió el NGF (factor de crecimiento nervioso). Fue senadora vitalicia. Su vida simboliza la perseverancia ante la discriminación. Para exponer biografía: «Si è distinta per…», «È stata insignita del…», «Ha dedicato la vita a…».","Fu insignita del Nobel nel 1986.=Fue galardonada con el Nobel en 1986.;Scoprì il fattore di crescita nervoso.=Descubrió el factor de crecimiento nervioso.;Ha dedicato la vita alla ricerca.=Dedicó su vida a la investigación.;Si distinse per la sua perseveranza.=Se distinguió por su perseverancia.","Rita Levi-Montalcini ha dedicato la vita alla ricerca sulla neurobiologia. Nel 1986 fu insignita del Premio Nobel per la scoperta del fattore di crescita nervoso. Nominata senatrice a vita, si distinse anche per la divulgazione scientifica e per la perseveranza con cui affrontò ostacoli e discriminazioni, convinta che la curiosità sia il motore del sapere.","Rita Levi-Montalcini dedicó su vida a la investigación en neurobiología. En 1986 fue galardonada con el Premio Nobel por el descubrimiento del factor de crecimiento nervioso. Nombrada senadora vitalicia, se distinguió también por la divulgación científica y por la perseverancia con que afrontó obstáculos y discriminaciones, convencida de que la curiosidad es el motor del saber.","¿Qué descubrió?|El factor de crecimiento nervioso|Un virus|Un planeta|0#¿Qué fue después?|Senadora vitalicia|Ministra|Rectora|0","Fu ___ del Nobel nel 1986.|insignita|insignire|insigne#Ha ___ la vita alla ricerca.|dedicato|dedicare|dedica","La célula=La cellula#La perseverancia=La perseveranza"],
["Pavese y el mito","il mito=el mito;la solitudine=la soledad;la collina=la colina;la memoria=la memoria;l'infanzia=la infancia;il destino=el destino;la Resistenza=la Resistencia;la luna=la luna","Cesare Pavese (1908-1950) mezcla mito, memoria e infancia en una prosa esencial. Obras: «La luna e i falò» (1950), «Paesi tuoi» y «Dialoghi con Leucò». Su paisaje clave: las colinas de las Langhe. Para comentar: «Il mito diventa chiave di lettura…», «Il ritorno al paese è anche un ritorno a sé».","Pavese scrisse La luna e i falò nel 1950.=Pavese escribió La luna y las hogueras en 1950.;Il mito diventa chiave di lettura.=El mito se convierte en clave de lectura.;Il ritorno al paese è un ritorno a sé.=El regreso al pueblo es un regreso a uno mismo.;La collina evoca l'infanzia.=La colina evoca la infancia.","Ne La luna e i falò Pavese racconta il ritorno al paese di un uomo che ha fatto fortuna lontano. Le colline delle Langhe evocano l'infanzia e la memoria, mentre il mito diventa chiave di lettura del destino. Il ritorno al paese è anche un ritorno a sé, ma ciò che resta del passato è fragile e incerto.","En La luna y las hogueras Pavese cuenta el regreso al pueblo de un hombre que ha hecho fortuna lejos. Las colinas de las Langhe evocan la infancia y la memoria, mientras el mito se convierte en clave de lectura del destino. El regreso al pueblo es también un regreso a uno mismo, pero lo que queda del pasado es frágil e incierto.","¿Qué cuenta la novela?|El regreso al pueblo|Un viaje a la luna|Una guerra|0#¿Qué evocan las colinas?|La infancia y la memoria|La ciudad|El dinero|0","Il mito diventa chiave di ___.|lettura|leggere|letto#Il ritorno al paese è un ritorno a ___.|sé|se|sei","La soledad=La solitudine#La memoria=La memoria"],
["Repaso C2: estilo y registros","la padronanza=el dominio;lo stile=el estilo;il registro=el registro;la sfumatura=el matiz;la coerenza=la coherencia;l'efficacia=la eficacia;la concisione=la concisión;la chiarezza=la claridad","Repaso C2: un hablante de nivel C2 maneja todos los registros y elige estructuras según el efecto buscado: nominalización en lo formal, dislocación en lo oral, léxico culto en lo literario. Fórmulas finas: «Per così dire», «Se non altro», «Beninteso», «Tant'è vero che…».","Se non altro, è stato sincero.=Al menos ha sido sincero.;Beninteso, la scelta spetta a lei.=Por supuesto, la decisión es suya.;Tant'è vero che ha rinunciato.=Tanto es así que ha renunciado.;Per così dire, è una vittoria.=Por así decirlo, es una victoria.","La padronanza di una lingua si misura anche nella capacità di variare lo stile. Beninteso, non basta conoscere le regole: occorre scegliere il registro più efficace per ogni situazione. Se non altro, la chiarezza e la coerenza restano indispensabili, tant'è vero che anche i grandi scrittori correggono i testi più volte.","El dominio de una lengua se mide también en la capacidad de variar el estilo. Por supuesto, no basta conocer las reglas: hay que elegir el registro más eficaz para cada situación. Al menos la claridad y la coherencia siguen siendo indispensables, tanto es así que incluso los grandes escritores corrigen los textos varias veces.","¿Qué se mide también?|La capacidad de variar el estilo|La velocidad|La memoria|0#¿Qué sigue siendo indispensable?|Claridad y coherencia|Rapidez|Brevedad|0","___, la scelta spetta a lei.|Beninteso|Perciò|Siccome#Se non ___, è stato sincero.|altro|altri|altra","El estilo=Lo stile#La claridad=La chiarezza"],
["Repaso final C2: dominio integral","il traguardo=la meta;la competenza=la competencia;la maturità linguistica=la madurez lingüística;la lingua viva=la lengua viva;apprendere=aprender;perfezionarsi=perfeccionarse;l'autonomia=la autonomía;la curiosità=la curiosidad","Has completado el recorrido de A1 a C2. El dominio no es un punto final: la lengua es viva y se perfecciona leyendo, escuchando, escribiendo y conversando. Fórmula de cierre: «In definitiva, imparare una lingua è un percorso senza fine». Sigue con lecturas, cine, conversación y el tutor.","Ho raggiunto un buon livello di italiano.=He alcanzado un buen nivel de italiano.;La lingua è un organismo vivo.=La lengua es un organismo vivo.;Continuerò a perfezionarmi ogni giorno.=Seguiré perfeccionándome cada día.;La curiosità è il motore dell'apprendimento.=La curiosidad es el motor del aprendizaje.","Dopo anni di studio, ho raggiunto un livello avanzato di italiano. Ho capito che la lingua è un organismo vivo e che il traguardo non è un punto d'arrivo: continuerò a perfezionarmi leggendo, ascoltando e conversando ogni giorno. La curiosità resta il motore dell'apprendimento, e ogni nuova parola apre un mondo.","Tras años de estudio, he alcanzado un nivel avanzado de italiano. He comprendido que la lengua es un organismo vivo y que la meta no es un punto de llegada: seguiré perfeccionándome leyendo, escuchando y conversando cada día. La curiosidad sigue siendo el motor del aprendizaje, y cada palabra nueva abre un mundo.","¿Qué es la lengua?|Un organismo vivo|Un objeto fijo|Un examen|0#¿Cuál es el motor del aprendizaje?|La curiosidad|El miedo|El dinero|0","La lingua è un organismo ___.|vivo|viva|vivi#Continuerò a ___ ogni giorno.|perfezionarmi|perfezionare|perfezionato","Una lengua viva=Una lingua viva#Seguiré aprendiendo=Continuerò a imparare"]

function lector(){$('#hb').innerHTML=`<div class=card><textarea id=lt rows=4>${esc(RD(lv)[ri%RD(lv).length][0])}</textarea><button class=g onclick="ri++;lector()">Otro texto</button><button onclick="say($('#lt').value)">🔊 Escuchar</button><button class=g onclick="rec()">🎙 Grabar mi lectura</button><div id=rs></div><p class=m><b>Límites:</b> el reconocimiento de voz del navegador transcribe lo que entiende; no puntúa tu pronunciación real. Puede fallar por ruido, acento o micrófono, no mide entonación ni sonidos concretos y varía según el navegador (mejor en Safari o Chrome). Úsalo solo como guía y compara siempre con el audio modelo.</p></div>`}
function rec(){const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R)return $('#rs').innerHTML='<p class=bad>Tu navegador no admite reconocimiento de voz.</p>';const r=new R();r.lang='it-IT';r.onresult=e=>{const h=e.results[0][0].transcript,pool=nz(h).split(' '),tg=nz($('#lt').value).split(' ').filter(Boolean),miss=tg.filter(w=>{const i=pool.indexOf(w);if(i<0)return true;pool.splice(i,1);return false}),p=Math.round(100*(tg.length-miss.length)/tg.length);S.xp+=2;save();$('#rs').innerHTML=`<p>Coincidencia: <b>${p}%</b></p><p class=m>Se entendió: ${esc(h)}</p>${miss.length?`<p class=bad>No reconocidas: ${esc(miss.join(', '))}</p>`:'<p class=ok>Todas las palabras reconocidas.</p>'}`};r.onerror=e=>$('#rs').innerHTML='<p class=bad>'+(e.error=='not-allowed'?'Permite el micrófono en los ajustes del navegador.':e.error=='no-speech'?'No se detectó voz. Inténtalo de nuevo.':'Error: '+esc(e.error))+'</p>';$('#rs').textContent='Escuchando… lee el texto en voz alta.';r.onend=()=>{const x=$('#rs');if(x&&x.textContent.startsWith('Escuchando'))x.textContent='No se detectó voz. Inténtalo de nuevo.'};r.start()}
