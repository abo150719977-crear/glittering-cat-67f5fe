["El trapassato prossimo","avevo fatto=había hecho;ero andato=había ido;avevo già mangiato=ya había comido;prima di=antes de;già=ya;non ancora=todavía no;quando sono arrivato=cuando llegué;dopo che=después de que","Trapassato prossimo = imperfetto de avere / essere + participio: avevo mangiato, ero arrivato. Expresa una acción anterior a otra acción pasada: Quando sono arrivato, il film era già finito.","Quando sono arrivato, il film era già finito.=Cuando llegué, la película ya había terminado.;Avevo già mangiato.=Ya había comido.;Non avevo mai visto il mare.=Nunca había visto el mar.;Ero uscito prima di piovere.=Había salido antes de que lloviera.","Ieri sono arrivata alla stazione in ritardo: il treno era già partito. Avevo dimenticato il telefono a casa e non avevo controllato l'orario. Così ho dovuto aspettare due ore. La prossima volta preparerò tutto prima.","Ayer llegué a la estación con retraso: el tren ya había salido. Había olvidado el teléfono en casa y no había comprobado el horario. Así que tuve que esperar dos horas. La próxima vez lo prepararé todo antes.","¿Qué había pasado con el tren?|Ya había salido|Estaba cancelado|Llegaba tarde|0#¿Cuánto tuvo que esperar?|Una hora|Dos horas|Tres horas|1","Quando sono arrivato, il film ___ già finito.|era|è|sarà#Avevo già ___.|mangiato|mangio|mangiare","Ya había comido=Avevo già mangiato#Nunca había visto el mar=Non avevo mai visto il mare"],
["El condizionale passato","avrei voluto=habría querido;sarei andato=habría ido;avrei dovuto=debería haber;avrei potuto=podría haber;che peccato=qué pena;purtroppo=por desgracia;un rimpianto=un arrepentimiento;se avessi saputo=si hubiera sabido","Condizionale passato = condicional de avere / essere + participio: avrei mangiato, sarei andato. Expresa deseos no cumplidos y reproches suaves: Avrei voluto venire, ma non ho potuto.","Avrei voluto venire alla festa.=Me habría gustado venir a la fiesta.;Sarei andato volentieri.=Habría ido con gusto.;Avresti dovuto chiamarmi.=Deberías haberme llamado.;Avrei potuto studiare di più.=Podría haber estudiado más.","Ieri c'era una festa e avrei voluto andare, ma ho dovuto lavorare. Sarei andata volentieri con i miei amici. Avrei anche potuto chiedere un giorno libero, ma ormai era troppo tardi. Purtroppo non si può tornare indietro.","Ayer había una fiesta y me habría gustado ir, pero tuve que trabajar. Habría ido con gusto con mis amigos. También podría haber pedido un día libre, pero ya era demasiado tarde. Por desgracia no se puede volver atrás.","¿Por qué no fue a la fiesta?|Estaba enferma|Tuvo que trabajar|No quiso|1#¿Qué podría haber pedido?|Un día libre|Dinero|Ayuda|0","___ voluto venire.|Avrei|Ho|Avevo#Tu ___ dovuto chiamarmi.|avresti|hai|avevi","Habría ido=Sarei andato#Deberías haberme llamado=Avresti dovuto chiamarmi"],
["El congiuntivo presente","che io sia=que yo sea;che tu abbia=que tú tengas;che lui faccia=que él haga;che noi andiamo=que vayamos;che voi possiate=que podáis;che loro vengano=que vengan;bisogna che=hace falta que;è necessario che=es necesario que","Congiuntivo presente: -are → -i, -i, -i, -iamo, -iate, -ino; -ere / -ire → -a, -a, -a, -iamo, -iate, -ano. Irregulares: essere → sia, avere → abbia, fare → faccia, andare → vada. Se usa tras bisogna che, è necessario che, voglio che.","Bisogna che tu studi di più.=Hace falta que estudies más.;Voglio che lui venga.=Quiero que él venga.;È necessario che noi partiamo presto.=Es necesario que salgamos temprano.;Spero che sia vero.=Espero que sea verdad.","Domani c'è l'esame e bisogna che io studi tutta la sera. Mia madre vuole che io mangi bene e dorma otto ore. È necessario che io arrivi presto all'università. Spero che l'esame vada bene!","Mañana es el examen y hace falta que estudie toda la noche. Mi madre quiere que coma bien y duerma ocho horas. Es necesario que llegue pronto a la universidad. ¡Espero que el examen vaya bien!","¿Qué quiere su madre?|Que coma bien y duerma|Que viaje|Que trabaje|0#¿Qué espera?|Que el examen vaya bien|Que llueva|Que haga sol|0","Bisogna che tu ___ di più.|studi|studia|studierai#Voglio che lui ___.|venga|viene|verrà","Quiero que vengas=Voglio che tu venga#Espero que sea verdad=Spero che sia vero"],
["Congiuntivo: opinión y duda","penso che=pienso que;credo che=creo que;dubito che=dudo que;sembra che=parece que;è possibile che=es posible que;non so se=no sé si;mi pare che=me parece que;probabilmente=probablemente","Tras verbos de opinión, duda y posibilidad se usa congiuntivo: penso che sia, credo che abbia, dubito che venga. Si el sujeto es el mismo, se usa infinitivo: penso di partire. Con certeza va indicativo: so che è vero.","Penso che sia una buona idea.=Pienso que es una buena idea.;Credo che Luca abbia ragione.=Creo que Luca tiene razón.;Dubito che venga domani.=Dudo que venga mañana.;Penso di partire domani.=Pienso salir mañana.","Penso che l'italiano sia una lingua bellissima. Credo che sia difficile all'inizio, ma sembra che migliori con il tempo. Dubito che io parli perfettamente tra un anno. Però penso di continuare a studiare ogni giorno.","Pienso que el italiano es una lengua preciosa. Creo que es difícil al principio, pero parece que mejora con el tiempo. Dudo que hable perfectamente dentro de un año. Pero pienso seguir estudiando cada día.","¿Cómo le parece el italiano?|Preciosa|Aburrida|Fácil|0#¿Qué piensa hacer?|Seguir estudiando|Dejarlo|Viajar|0","Penso che ___ una buona idea.|sia|è|sarà#Penso ___ partire domani.|di|che|a","Creo que tiene razón=Credo che abbia ragione#Dudo que venga=Dubito che venga"],
["La forma pasiva","essere + participio=ser + participio;venire + participio=ser + participio (acción);da=por;il testo è scritto=el texto está escrito;la casa è stata costruita=la casa fue construida;il libro viene letto=el libro es leído;costruire=construir;il pittore=el pintor","Pasiva = essere / venire + participio + da + agente: il libro è scritto da Eco. Con «venire» se destaca la acción: il libro viene letto da tutti. En pasado: è stato scritto. El participio concuerda con el sujeto.","Il libro è stato scritto da Eco.=El libro fue escrito por Eco.;La casa è stata costruita nel 1900.=La casa fue construida en 1900.;Il quadro viene dipinto da un artista.=El cuadro es pintado por un artista.;Le lettere sono state spedite ieri.=Las cartas fueron enviadas ayer.","Il Colosseo è stato costruito più di duemila anni fa. Ogni anno viene visitato da milioni di turisti. Molte parti sono state restaurate, ma altre sono ancora danneggiate. Questo monumento è conosciuto in tutto il mondo.","El Coliseo fue construido hace más de dos mil años. Cada año es visitado por millones de turistas. Muchas partes han sido restauradas, pero otras siguen dañadas. Este monumento es conocido en todo el mundo.","¿Cuántos años tiene el Coliseo?|Más de dos mil|Mil|Quinientos|0#¿Quién lo visita cada año?|Millones de turistas|Pocos turistas|Solo italianos|0","Il libro è stato scritto ___ Eco.|da|di|per#La casa è stata ___.|costruita|costruito|costruire","Fue construido=È stato costruito#Es visitado por turistas=Viene visitato dai turisti"],
["Los relativos cui y il quale","cui=el que (con preposición);il quale=el cual;la persona con cui parlo=la persona con quien hablo;la città in cui vivo=la ciudad en la que vivo;la ragione per cui=la razón por la que;di cui=de quien / de lo que;a cui=a quien;quello di cui=aquello de lo que","«Cui» sustituye a «che» después de una preposición: la persona con cui parlo, la città in cui vivo, il libro di cui ti ho parlato. No lleva artículo (salvo «il cui» = cuyo). «Il quale» es más formal.","La persona con cui parlo è mia zia.=La persona con quien hablo es mi tía.;La città in cui vivo è molto bella.=La ciudad en la que vivo es muy bonita.;Il libro di cui ti ho parlato è qui.=El libro del que te hablé está aquí.;Questa è la ragione per cui studio.=Esta es la razón por la que estudio.","La casa in cui abito è vecchia, ma ha un giardino bellissimo. Il vicino con cui parlo ogni mattina è un signore molto gentile. Ieri mi ha dato il libro di cui mi aveva parlato. È la ragione per cui amo questo quartiere.","La casa en la que vivo es vieja, pero tiene un jardín precioso. El vecino con quien hablo cada mañana es un señor muy amable. Ayer me dio el libro del que me había hablado. Es la razón por la que amo este barrio.","¿Cómo es el jardín?|Precioso|Pequeño|Descuidado|0#¿Qué le dio el vecino?|Un libro|Una planta|Flores|0","La città in ___ vivo è bella.|cui|che|chi#La persona con ___ parlo è mia zia.|cui|che|dove","La ciudad en la que vivo=La città in cui vivo#La persona con quien hablo=La persona con cui parlo"],
["El discurso indirecto","ha detto che=ha dicho que;ha chiesto se=ha preguntado si;ha risposto che=ha respondido que;ha spiegato che=ha explicado que;ha raccontato che=ha contado que;mi ha detto di=me ha dicho que (orden);il giorno dopo=el día siguiente;il giorno prima=el día anterior","Discurso indirecto en pasado: presente → imperfetto («Sono stanco» → ha detto che era stanco); passato prossimo → trapassato; futuro → condizionale passato. También cambian: domani → il giorno dopo, ieri → il giorno prima.","Ha detto che era stanco.=Dijo que estaba cansado.;Ha chiesto se volevo venire.=Preguntó si quería venir.;Mi ha detto di aspettare.=Me dijo que esperara.;Ha spiegato che sarebbe partito il giorno dopo.=Explicó que partiría al día siguiente.","Ieri ho incontrato Paolo. Mi ha detto che era molto stanco perché aveva lavorato tutta la settimana. Mi ha chiesto se volevo uscire con lui. Gli ho risposto che sarei andata volentieri il giorno dopo.","Ayer me encontré con Paolo. Me dijo que estaba muy cansado porque había trabajado toda la semana. Me preguntó si quería salir con él. Le respondí que iría con gusto al día siguiente.","¿Por qué estaba cansado Paolo?|Había trabajado toda la semana|No había dormido|Estaba enfermo|0#¿Cuándo quedó en salir?|Al día siguiente|Esa noche|Nunca|0","Ha detto che ___ stanco.|era|è|sarà#Ha chiesto ___ volevo uscire.|se|che|di","Dijo que estaba cansado=Ha detto che era stanco#Preguntó si quería venir=Ha chiesto se volevo venire"],
["Deseos y esperanzas","spero che=espero que;mi auguro che=deseo que;desidero=deseo;vorrei che=querría que;magari=ojalá;sperare=esperar;il desiderio=el deseo;realizzarsi=hacerse realidad","«Spero che + congiuntivo» (spero che tu stia bene). «Vorrei che + congiuntivo imperfetto» (vorrei che fosse vero). Si el sujeto es el mismo: «Spero di + infinitivo». «Magari + imperfetto» = ojalá.","Spero che tu stia bene.=Espero que estés bien.;Spero di vederti presto.=Espero verte pronto.;Magari fosse vero!=¡Ojalá fuera verdad!;Vorrei che fosse già domani.=Querría que ya fuera mañana.","Quest'anno ho molti desideri. Spero di trovare un lavoro nuovo e spero che la mia famiglia stia bene. Vorrei che il tempo passasse più lentamente. Magari potessi viaggiare di più! Mi auguro che tutti questi desideri si realizzino.","Este año tengo muchos deseos. Espero encontrar un trabajo nuevo y espero que mi familia esté bien. Querría que el tiempo pasara más despacio. ¡Ojalá pudiera viajar más! Deseo que todos estos deseos se hagan realidad.","¿Qué espera encontrar?|Un trabajo nuevo|Una casa|Un coche|0#¿Qué le gustaría hacer más?|Viajar|Dormir|Estudiar|0","Spero ___ vederti presto.|di|che|a#Spero che tu ___ bene.|stia|stai|starai","Espero verte=Spero di vederti#Ojalá fuera verdad=Magari fosse vero"],
["Vida laboral: registro formal","la riunione=la reunión;il verbale=el acta;il cliente=el cliente;la scadenza=el plazo;il progetto=el proyecto;inviare=enviar;confermare=confirmar;in attesa di=a la espera de","Registro formal en el trabajo: «La informo che…», «Le scrivo in merito a…», «Resto in attesa di un riscontro». Verbos útiles: fissare una riunione (concertar una reunión), rispettare la scadenza (cumplir el plazo).","Le scrivo in merito al progetto.=Le escribo en relación con el proyecto.;La riunione è fissata per lunedì.=La reunión está fijada para el lunes.;Resto in attesa di una risposta.=Quedo a la espera de una respuesta.;Dobbiamo rispettare la scadenza.=Debemos cumplir el plazo.","Gentile dottor Bianchi, Le scrivo in merito al progetto. La riunione con il cliente è fissata per lunedì alle dieci. Le invio in allegato il verbale dell'ultimo incontro. Resto in attesa di un Suo riscontro. Cordiali saluti, Elena Verdi.","Estimado doctor Bianchi: le escribo en relación con el proyecto. La reunión con el cliente está fijada para el lunes a las diez. Le envío adjunto el acta de la última reunión. Quedo a la espera de su respuesta. Un cordial saludo, Elena Verdi.","¿Cuándo es la reunión?|El lunes a las diez|El martes|El viernes|0#¿Qué adjunta Elena?|El acta|Una factura|Un contrato|0","Le scrivo ___ merito al progetto.|in|di|con#Resto in ___ di un riscontro.|attesa|invio|scadenza","El plazo=La scadenza#Quedo a la espera=Resto in attesa"],
["Medio ambiente y reciclaje","l'ambiente=el medio ambiente;l'inquinamento=la contaminación;i rifiuti=los residuos;riciclare=reciclar;risparmiare l'energia=ahorrar energía;le energie rinnovabili=las energías renovables;il cambiamento climatico=el cambio climático;sostenibile=sostenible","Para hablar de medio ambiente: «È importante che + congiuntivo» (es importante que reciclemos) y «Dobbiamo + infinitivo». Expresiones: ridurre i rifiuti, proteggere l'ambiente.","È importante riciclare i rifiuti.=Es importante reciclar los residuos.;Dobbiamo ridurre l'inquinamento.=Debemos reducir la contaminación.;Uso l'energia solare.=Uso energía solar.;Il cambiamento climatico è un problema.=El cambio climático es un problema.","Nella mia città l'inquinamento è un problema grave. Per aiutare l'ambiente riciclo i rifiuti e vado al lavoro in bicicletta. È importante che tutti risparmino energia e usino le energie rinnovabili. Piccoli gesti possono fare una grande differenza.","En mi ciudad la contaminación es un problema grave. Para ayudar al medio ambiente reciclo los residuos y voy al trabajo en bicicleta. Es importante que todos ahorren energía y usen energías renovables. Los pequeños gestos pueden marcar una gran diferencia.","¿Cómo va al trabajo?|En bicicleta|En coche|En moto|0#¿Qué es importante?|Ahorrar energía|Comprar más|Viajar|0","Riciclo i ___.|rifiuti|rifiuto|rifiutare#È importante che tutti ___ energia.|risparmino|risparmiano|risparmiare","Reciclar=Riciclare#La contaminación=L'inquinamento"],
["Tecnología y redes sociales","i social=las redes sociales;il profilo=el perfil;condividere=compartir;la privacy=la privacidad;la notifica=la notificación;l'app=la aplicación;seguire=seguir;connesso=conectado","Para opinar sobre tecnología: «Penso che + congiuntivo» (penso che i social siano utili). Verbos útiles: condividere (compartir), seguire (seguir), postare (publicar).","Condivido molte foto online.=Comparto muchas fotos en línea.;Penso che i social siano utili.=Pienso que las redes sociales son útiles.;Segui questo profilo?=¿Sigues este perfil?;Devo controllare la privacy.=Tengo que revisar la privacidad.","Uso i social ogni giorno per seguire gli amici e condividere foto. Penso che siano utili, ma credo che passiamo troppo tempo connessi. Per questo ho disattivato quasi tutte le notifiche. Cerco di controllare anche la privacy del mio profilo.","Uso las redes sociales cada día para seguir a los amigos y compartir fotos. Pienso que son útiles, pero creo que pasamos demasiado tiempo conectados. Por eso he desactivado casi todas las notificaciones. También intento controlar la privacidad de mi perfil.","¿Para qué usa las redes?|Para seguir amigos y compartir fotos|Para trabajar|Para jugar|0#¿Qué ha desactivado?|Las notificaciones|El perfil|La cuenta|0","Penso che i social ___ utili.|siano|sono|saranno#Condivido molte ___.|foto|fotografato|fotografare","Comparto fotos=Condivido foto#La privacidad=La privacy"],
["Imprevistos y reclamaciones","l'imprevisto=el imprevisto;il bagaglio smarrito=el equipaje perdido;il rimborso=el reembolso;il reclamo=la reclamación;la compagnia=la compañía;il volo cancellato=el vuelo cancelado;risarcire=indemnizar;nonostante=a pesar de","Para reclamar: «Vorrei presentare un reclamo», «Chiedo un rimborso». Con pasiva: «Il mio bagaglio è stato smarrito». «Nonostante» = a pesar de.","Il mio bagaglio è stato smarrito.=Mi equipaje ha sido extraviado.;Vorrei presentare un reclamo.=Quisiera presentar una reclamación.;Il volo è stato cancellato.=El vuelo ha sido cancelado.;Chiedo un rimborso del biglietto.=Pido el reembolso del billete.","Sono arrivata a Roma, ma il mio bagaglio è stato smarrito. Mi sono rivolta alla compagnia aerea e ho presentato un reclamo. Mi hanno detto che il bagaglio sarebbe arrivato il giorno dopo. Nonostante tutto, ho mantenuto la calma.","Llegué a Roma, pero mi equipaje fue extraviado. Me dirigí a la compañía aérea y presenté una reclamación. Me dijeron que el equipaje llegaría al día siguiente. A pesar de todo, mantuve la calma.","¿Qué pasó con el equipaje?|Fue extraviado|Fue robado|Se rompió|0#¿Cuándo llegaría?|Al día siguiente|En una semana|Esa noche|0","Il bagaglio è stato ___.|smarrito|smarrire|smarrisco#Vorrei presentare un ___.|reclamo|rimborso|volo","Una reclamación=Un reclamo#El vuelo fue cancelado=Il volo è stato cancellato"],
["El congiuntivo imperfetto","che io parlassi=que yo hablara;che tu avessi=que tuvieras;che lui fosse=que él fuera;che noi andassimo=que fuéramos;che voi faceste=que hicierais;che loro dicessero=que dijeran;pensavo che=pensaba que;speravo che=esperaba que","Congiuntivo imperfetto: -are → -assi, -assi, -asse, -assimo, -aste, -assero; -ere → -essi…; -ire → -issi…. Irregulares: fossi, facessi, dicessi, bevessi. Se usa tras un verbo en pasado: pensavo che fosse tardi.","Pensavo che fosse tardi.=Pensaba que era tarde.;Speravo che tu venissi.=Esperaba que vinieras.;Credevo che avessero fame.=Creía que tenían hambre.;Volevo che tutti parlassero.=Quería que todos hablaran.","Ieri pensavo che la festa fosse alle otto, ma era alle sette. Speravo che Luca mi aspettasse, però quando sono arrivata erano già tutti a tavola. Gli amici credevano che io fossi malata, ma ero solo in ritardo!","Ayer pensaba que la fiesta era a las ocho, pero era a las siete. Esperaba que Luca me esperara, pero cuando llegué ya estaban todos a la mesa. ¡Los amigos creían que estaba enferma, pero solo llegaba tarde!","¿Cuándo era realmente la fiesta?|A las siete|A las ocho|A las nueve|0#¿Qué creían los amigos?|Que estaba enferma|Que no iba a venir|Que se había perdido|0","Pensavo che ___ tardi.|fosse|era|sia#Speravo che tu ___.|venissi|vieni|venga","Pensaba que era tarde=Pensavo che fosse tardi#Esperaba que vinieras=Speravo che tu venissi"],
["Hipótesis con se (irreal)","se avessi tempo=si tuviera tiempo;se potessi=si pudiera;se fossi ricco=si fuera rico;viaggerei=viajaría;comprerei=compraría;vivrei=viviría;farei=haría;sarei=sería","Hipótesis poco probable o irreal en presente: se + congiuntivo imperfetto, condizionale presente. Ej.: Se avessi tempo, viaggerei di più. Nunca se usa el condicional en la parte con «se».","Se avessi tempo, viaggerei di più.=Si tuviera tiempo, viajaría más.;Se fossi ricco, comprerei una casa.=Si fuera rico, compraría una casa.;Se potessi, vivrei in Italia.=Si pudiera, viviría en Italia.;Che cosa faresti, se vincessi alla lotteria?=¿Qué harías si ganaras la lotería?","Se avessi un anno libero, viaggerei per l'Italia. Visiterei tutte le regioni e mangerei i piatti tipici di ogni città. Se potessi, vivrei qualche mese in Sicilia e imparerei a cucinare con una nonna del posto.","Si tuviera un año libre, viajaría por Italia. Visitaría todas las regiones y comería los platos típicos de cada ciudad. Si pudiera, viviría unos meses en Sicilia y aprendería a cocinar con una abuela del lugar.","¿Qué haría con un año libre?|Viajar por Italia|Estudiar|Trabajar|0#¿Dónde viviría unos meses?|En Sicilia|En Roma|En Milán|0","Se ___ tempo, viaggerei.|avessi|ho|avrei#Se potessi, ___ in Italia.|vivrei|vivo|vivessi","Si pudiera, viajaría=Se potessi viaggerei#Si fuera rico=Se fossi ricco"],
["Trámites y burocracia","il documento=el documento;il modulo=el formulario;la domanda=la solicitud;l'ufficio=la oficina;lo sportello=la ventanilla;la fila=la cola;firmare=firmar;la carta d'identità=el documento de identidad","Para trámites: «Devo presentare una domanda», «Che documenti servono?», «Dove devo firmare?». «Servire» = hacer falta y concuerda con lo que hace falta: serve un documento, servono due documenti.","Che documenti servono?=¿Qué documentos hacen falta?;Devo compilare questo modulo.=Tengo que rellenar este formulario.;Dove devo firmare?=¿Dónde tengo que firmar?;C'è molta fila allo sportello.=Hay mucha cola en la ventanilla.","Oggi vado all'ufficio per rinnovare la carta d'identità. C'è molta fila allo sportello. Devo compilare un modulo e presentare due documenti e una foto. L'impiegata controlla tutto, mi dice dove firmare e mi dà un appuntamento per martedì.","Hoy voy a la oficina para renovar el documento de identidad. Hay mucha cola en la ventanilla. Tengo que rellenar un formulario y presentar dos documentos y una foto. La empleada lo comprueba todo, me dice dónde firmar y me da una cita para el martes.","¿Qué documentos presenta?|Dos y una foto|Solo una foto|Cinco|0#¿Cuándo es la cita?|El martes|El lunes|El viernes|0","Che documenti ___?|servono|serve|servire#Devo ___ questo modulo.|compilare|compilo|compilato","Hay mucha cola=C'è molta fila#¿Dónde tengo que firmar?=Dove devo firmare?"],
["El gerundio","parlando=hablando;mangiando=comiendo;partendo=saliendo;stando=estando;facendo=haciendo;avendo=teniendo;essendo=siendo;mentre=mientras","Gerundio: -are → -ando, -ere / -ire → -endo. Irregulares: facendo, dicendo, bevendo. Expresa modo, causa o simultaneidad: studio ascoltando musica. «Stare + gerundio» = acción en curso (sto leggendo).","Sto leggendo un libro.=Estoy leyendo un libro.;Studio ascoltando la musica.=Estudio escuchando música.;Essendo stanco, sono andato a letto.=Estando cansado, me fui a la cama.;Camminando, ho incontrato Anna.=Caminando, me encontré con Anna.","Ieri stavo tornando a casa camminando quando ho incontrato un vecchio amico. Parlando del più e del meno, abbiamo deciso di prendere un caffè. Essendo molto stanca, ho bevuto un cappuccino e sono tornata a casa presto.","Ayer volvía a casa andando cuando me encontré con un viejo amigo. Hablando de esto y aquello, decidimos tomar un café. Estando muy cansada, tomé un capuchino y volví pronto a casa.","¿Con quién se encontró?|Con un viejo amigo|Con su jefe|Con su hermana|0#¿Qué bebió?|Un capuchino|Té|Agua|0","Sto ___ un libro.|leggendo|leggere|letto#Studio ___ musica.|ascoltando|ascolto|ascoltato","Estoy leyendo=Sto leggendo#Caminando=Camminando"],
["Pronombres dobles en pasado","gliel'ho detto=se lo he dicho;te l'ho dato=te lo he dado;me l'hanno portato=me lo han traído;ce l'ha spiegato=nos lo ha explicado;gliele ho comprate=se las he comprado;te le ho mandate=te las he mandado;gliel'ho chiesto=se lo he pedido;ve l'ho detto=os lo he dicho","Con pronombres dobles y passato prossimo, lo y la se apostrofan (me l'ha dato, gliel'ho detto) y el participio concuerda con el objeto directo: le chiavi? Te le ho date. Con li y le no se apostrofa.","Il regalo? Gliel'ho dato ieri.=¿El regalo? Se lo di ayer.;Le foto? Te le ho mandate.=¿Las fotos? Te las he mandado.;Me l'ha detto Marco.=Me lo ha dicho Marco.;Ce l'hanno spiegato bene.=Nos lo han explicado bien.","Marta mi chiede: «Hai dato il regalo a Luca?» Rispondo: «Sì, gliel'ho dato ieri.» Poi dice: «E le foto della festa?» «Te le ho mandate ieri sera.» Marta sorride: «Allora me le guardo subito!»","Marta me pregunta: «¿Le has dado el regalo a Luca?» Respondo: «Sí, se lo di ayer.» Luego dice: «¿Y las fotos de la fiesta?» «Te las mandé anoche.» Marta sonríe: «¡Entonces me las miro enseguida!»","¿Cuándo le dio el regalo?|Ayer|Hoy|Mañana|0#¿Qué le mandó anoche?|Las fotos|El regalo|Un mensaje|0","Il regalo? ___ ho dato ieri.|Gliel'|Glielo|Gli l'#Le foto? Te le ho ___.|mandate|mandato|mandata","Se lo he dicho=Gliel'ho detto#Te las he mandado=Te le ho mandate"],
["Arte y cultura","il museo=el museo;la mostra=la exposición;il dipinto=el cuadro;la scultura=la escultura;l'artista=el artista;il biglietto d'ingresso=la entrada;la guida=la guía;il capolavoro=la obra maestra","Para hablar de arte: «Mi ha colpito…» (me ha impactado), «Mi è piaciuto soprattutto…», «È stato dipinto da…» (pasiva). Verbos: ammirare, esporre, visitare. Ej.: la mostra mi ha colpito molto.","Ho visitato una mostra di Caravaggio.=He visitado una exposición de Caravaggio.;Questo dipinto è stato fatto nel 1600.=Este cuadro fue hecho en 1600.;La guida era molto preparata.=La guía estaba muy preparada.;Mi ha colpito la scultura.=Me ha impactado la escultura.","Domenica scorsa ho visitato una mostra a Firenze con una guida molto preparata. Mi sono piaciuti soprattutto i dipinti del Rinascimento. Una scultura mi ha colpito per la sua bellezza. Il biglietto costava quindici euro, ma ne è valsa la pena.","El domingo pasado visité una exposición en Florencia con una guía muy preparada. Me gustaron sobre todo los cuadros del Renacimiento. Una escultura me impactó por su belleza. La entrada costaba quince euros, pero mereció la pena.","¿Dónde fue la exposición?|En Florencia|En Roma|En Milán|0#¿Cuánto costaba la entrada?|Quince euros|Diez euros|Veinte euros|0","Una scultura mi ha ___.|colpito|colpire|colpisco#Ho visitato una ___ di Caravaggio.|mostra|mostro|mostre","Una exposición=Una mostra#Me ha impactado=Mi ha colpito"],
["Dinero y banco","il conto corrente=la cuenta corriente;il prestito=el préstamo;il mutuo=la hipoteca;il risparmio=el ahorro;l'interesse=el interés;prelevare=sacar dinero;versare=ingresar;il bonifico=la transferencia","Verbos bancarios: aprire un conto, prelevare, versare, fare un bonifico, chiedere un prestito. Para pedir información: «Vorrei sapere quali sono le condizioni del mutuo». Planes: se risparmio, comprerò una casa.","Vorrei aprire un conto corrente.=Quisiera abrir una cuenta corriente.;Devo fare un bonifico.=Tengo que hacer una transferencia.;Qual è il tasso di interesse?=¿Cuál es el tipo de interés?;Ho chiesto un mutuo per la casa.=He pedido una hipoteca para la casa.","Voglio comprare una casa, quindi vado in banca. Chiedo informazioni su un mutuo e sul tasso di interesse. L'impiegato spiega che devo aprire un conto corrente e versare i miei risparmi. Mi dà un modulo da compilare e mi fissa un appuntamento.","Quiero comprar una casa, así que voy al banco. Pido información sobre una hipoteca y sobre el tipo de interés. El empleado explica que debo abrir una cuenta corriente e ingresar mis ahorros. Me da un formulario para rellenar y me fija una cita.","¿Para qué va al banco?|Para comprar una casa|Para cambiar dinero|Para pagar una multa|0#¿Qué debe abrir?|Una cuenta corriente|Una tarjeta|Un seguro|0","Vorrei ___ un conto corrente.|aprire|apro|aperto#Devo fare un ___.|bonifico|prelevare|risparmio","Una hipoteca=Un mutuo#Una transferencia=Un bonifico"],
["Alquilar un coche","noleggiare=alquilar;la patente=el carné de conducir;l'assicurazione=el seguro;il serbatoio=el depósito;la benzina=la gasolina;il chilometraggio=el kilometraje;la restituzione=la devolución;la cauzione=la fianza","Para alquilar: «Vorrei noleggiare una macchina per tre giorni», «È inclusa l'assicurazione?», «Il serbatoio deve essere pieno alla restituzione». Con «dovere» se expresan obligaciones: deve restituire l'auto entro le sei.","Vorrei noleggiare una macchina.=Quisiera alquilar un coche.;È inclusa l'assicurazione?=¿Está incluido el seguro?;Ho la patente internazionale.=Tengo el carné internacional.;Deve restituire l'auto entro le sei.=Debe devolver el coche antes de las seis.","Vado in Sicilia e voglio noleggiare una macchina per tre giorni. Mostro la patente e chiedo se l'assicurazione è inclusa. L'impiegato risponde di sì e spiega che devo restituire l'auto con il serbatoio pieno. Pago la cauzione e parto contento.","Voy a Sicilia y quiero alquilar un coche durante tres días. Enseño el carné y pregunto si el seguro está incluido. El empleado responde que sí y explica que debo devolver el coche con el depósito lleno. Pago la fianza y salgo contento.","¿Cuántos días alquila el coche?|Tres|Cinco|Siete|0#¿Cómo debe devolverlo?|Con el depósito lleno|Limpio|Sin seguro|0","Vorrei ___ una macchina.|noleggiare|noleggio|noleggiato#È inclusa l'___?|assicurazione|patente|benzina","El seguro está incluido=L'assicurazione è inclusa#Quisiera alquilar un coche=Vorrei noleggiare una macchina"],
["Estudiar en el extranjero","all'estero=en el extranjero;la borsa di studio=la beca;l'Erasmus=el Erasmus;iscriversi=matricularse;la lingua=el idioma;l'esperienza=la experiencia;la residenza=la residencia;l'alloggio=el alojamiento","Para hablar de planes y requisitos: «Per iscrivermi devo + infinitivo», «Se ottengo la borsa di studio, partirò». Para expresar objetivo: «per + infinitivo» (per imparare l'italiano).","Vorrei studiare all'estero.=Quisiera estudiar en el extranjero.;Ho chiesto una borsa di studio.=He pedido una beca.;Mi sono iscritto all'università.=Me he matriculado en la universidad.;Cerco un alloggio vicino al campus.=Busco alojamiento cerca del campus.","L'anno prossimo vorrei fare l'Erasmus a Bologna per imparare meglio l'italiano. Ho già chiesto una borsa di studio e mi sono iscritta all'università. Se la ottengo, cercherò un alloggio vicino al campus. Questa esperienza sarà importante per il mio futuro.","El año próximo me gustaría hacer el Erasmus en Bolonia para aprender mejor el italiano. Ya he pedido una beca y me he matriculado en la universidad. Si la consigo, buscaré alojamiento cerca del campus. Esta experiencia será importante para mi futuro.","¿Dónde quiere hacer el Erasmus?|En Bolonia|En Roma|En Milán|0#¿Qué ha pedido?|Una beca|Un préstamo|Un visado|0","Vorrei studiare ___.|all'estero|a estero|nell'estero#Mi sono ___ all'università.|iscritto|iscrivo|iscrivere","Una beca=Una borsa di studio#Busco alojamiento=Cerco un alloggio"],
["Organizar un evento","organizzare=organizar;l'invito=la invitación;la lista degli invitati=la lista de invitados;il locale=el local;il budget=el presupuesto;confermare=confirmar;il menù=el menú;i dettagli=los detalles","Para organizar usa el futuro, el imperativo y «bisogna che + congiuntivo»: bisogna che tutti confermino. Para repartir tareas: «Mi occupo io dei dettagli» (me encargo yo). «Occuparsi di» = encargarse de.","Mi occupo io della musica.=Yo me encargo de la música.;Bisogna che tutti confermino.=Hace falta que todos confirmen.;Ho prenotato il locale.=He reservado el local.;Quanti invitati ci saranno?=¿Cuántos invitados habrá?","Sto organizzando una festa per i quarant'anni di mio padre. Ho prenotato un locale e ho preparato la lista degli invitati. Mia sorella si occupa del menù e io mi occupo degli inviti. Bisogna che tutti confermino entro venerdì.","Estoy organizando una fiesta por los cuarenta años de mi padre. He reservado un local y he preparado la lista de invitados. Mi hermana se encarga del menú y yo me encargo de las invitaciones. Hace falta que todos confirmen antes del viernes.","¿Qué celebran?|Los cuarenta años del padre|Una boda|Una graduación|0#¿Quién se encarga del menú?|La hermana|El padre|Un amigo|0","Mi ___ io degli inviti.|occupo|occupa|occupano#Bisogna che tutti ___.|confermino|confermano|confermeranno","Me encargo de la música=Mi occupo della musica#La lista de invitados=La lista degli invitati"],
["Hipótesis imposibles del pasado","se avessi saputo=si hubiera sabido;se fossi andato=si hubiera ido;avrei fatto=habría hecho;sarei venuto=habría venido;purtroppo=por desgracia;è troppo tardi=es demasiado tarde;rimpiangere=lamentar;un'occasione=una oportunidad","Hipótesis imposible en el pasado: se + trapassato congiuntivo (avessi / fossi + participio) y condizionale passato. Ej.: se avessi studiato, avrei superato l'esame. Expresa arrepentimiento o hechos que no ocurrieron.","Se avessi saputo, sarei venuto.=Si hubiera sabido, habría venido.;Se avessi studiato, avrei superato l'esame.=Si hubiera estudiado, habría aprobado el examen.;Se fossimo partiti prima, saremmo arrivati in tempo.=Si hubiéramos salido antes, habríamos llegado a tiempo.;Se non avesse piovuto, saremmo andati al mare.=Si no hubiera llovido, habríamos ido a la playa.","Ieri ho perso il treno e sono arrivato tardi al colloquio. Se mi fossi alzato prima, sarei arrivato in tempo. Se avessi controllato l'orario, non avrei fatto questo errore. Purtroppo è troppo tardi, ma la prossima volta sarò più attento.","Ayer perdí el tren y llegué tarde a la entrevista. Si me hubiera levantado antes, habría llegado a tiempo. Si hubiera comprobado el horario, no habría cometido este error. Por desgracia es demasiado tarde, pero la próxima vez estaré más atento.","¿Qué perdió?|El tren|El autobús|La cartera|0#¿Qué hará la próxima vez?|Estar más atento|Faltar|Ir en coche|0","Se mi ___ alzato prima, sarei arrivato.|fossi|sono|avessi#Se avessi studiato, ___ superato l'esame.|avrei|ho|avessi","Si hubiera sabido=Se avessi saputo#Habría venido=Sarei venuto"],
["Debatir: acuerdo y desacuerdo","sono d'accordo=estoy de acuerdo;non sono d'accordo=no estoy de acuerdo;hai ragione=tienes razón;hai torto=te equivocas;secondo me=en mi opinión;al contrario=al contrario;tuttavia=sin embargo;in effetti=en efecto","Para debatir con educación: «Capisco il tuo punto di vista, però…», «In parte hai ragione, ma…», «Secondo me…». Conectores de contraste: però, tuttavia, al contrario, invece.","Hai ragione, non ci avevo pensato.=Tienes razón, no había pensado en ello.;Capisco il tuo punto di vista, però non sono d'accordo.=Entiendo tu punto de vista, pero no estoy de acuerdo.;In effetti è una buona idea.=En efecto, es una buena idea.;Al contrario, penso che sia sbagliato.=Al contrario, pienso que es un error.","Con i miei colleghi discutiamo se lavorare da casa. Anna dice che è più comodo, ma io non sono del tutto d'accordo: capisco il suo punto di vista, però il contatto con le persone è importante. In effetti, forse la soluzione migliore è un po' di entrambe le cose.","Con mis compañeros discutimos si trabajar desde casa. Anna dice que es más cómodo, pero yo no estoy del todo de acuerdo: entiendo su punto de vista, pero el contacto con las personas es importante. En efecto, quizá la mejor solución sea un poco de ambas cosas.","¿Qué discuten?|Trabajar desde casa|Cambiar de oficina|Subir sueldos|0#¿Qué solución proponen?|Un poco de ambas cosas|Solo oficina|Solo casa|0","Hai ___, non ci avevo pensato.|ragione|torto|bene#___ me, è una buona idea.|Secondo|Sopra|Dopo","Tienes razón=Hai ragione#No estoy de acuerdo=Non sono d'accordo"],
["Verbos con preposición fija","pensare a=pensar en;dipendere da=depender de;finire di=terminar de;cominciare a=empezar a;sognare di=soñar con;credere in=creer en;fidarsi di=fiarse de;abituarsi a=acostumbrarse a","Muchos verbos van con una preposición fija: pensare a, dipendere da, finire di, cominciare a, fidarsi di. Se aprenden junto al verbo. Ej.: dipende dal tempo, non mi fido di lui, mi sto abituando al clima.","Penso a te ogni giorno.=Pienso en ti cada día.;Dipende dal tempo.=Depende del tiempo.;Ho finito di studiare.=He terminado de estudiar.;Mi sto abituando al clima.=Me estoy acostumbrando al clima.","Da quando mi sono trasferita in Italia, mi sto abituando a una nuova vita. Ho cominciato a lavorare in un ufficio e penso spesso alla mia famiglia. Sogno di tornare a casa per Natale, ma dipende dal lavoro. Finirò di studiare per l'esame questa settimana.","Desde que me mudé a Italia, me estoy acostumbrando a una nueva vida. He empezado a trabajar en una oficina y pienso a menudo en mi familia. Sueño con volver a casa por Navidad, pero depende del trabajo. Terminaré de estudiar para el examen esta semana.","¿A qué se está acostumbrando?|A una nueva vida|Al clima|A la comida|0#¿De qué depende volver a casa?|Del trabajo|Del dinero|Del tiempo|0","Dipende ___ tempo.|dal|al|nel#Ho finito ___ studiare.|di|a|da","Pienso en ti=Penso a te#Me estoy acostumbrando=Mi sto abituando"],
["Conectores concesivos","sebbene=aunque;benché=aunque;nonostante=a pesar de;anche se=aunque;purché=con tal de que;a meno che=a menos que;affinché=para que;prima che=antes de que","Sebbene, benché, purché, a meno che, affinché y prima che llevan congiuntivo: sebbene sia stanco, esco. «Anche se» lleva indicativo y «nonostante» puede ir con un nombre: nonostante la pioggia, siamo usciti.","Sebbene sia stanco, vado a correre.=Aunque estoy cansado, voy a correr.;Esco purché non piova.=Salgo con tal de que no llueva.;Te lo dico affinché tu sappia.=Te lo digo para que sepas.;Nonostante la pioggia, siamo usciti.=A pesar de la lluvia, salimos.","Sebbene sia molto occupata, domani esco con le amiche. Andiamo al mare, purché non piova. Ho prenotato un tavolo prima che finiscano i posti. Nonostante il lavoro, voglio divertirmi: te lo dico affinché tu non mi chiami!","Aunque estoy muy ocupada, mañana salgo con las amigas. Vamos a la playa, con tal de que no llueva. He reservado una mesa antes de que se acaben los sitios. A pesar del trabajo, quiero divertirme: ¡te lo digo para que no me llames!","¿A dónde van?|Al mar|A la montaña|Al cine|0#¿Qué ha hecho antes de que se acaben los sitios?|Reservar una mesa|Comprar entradas|Cambiar el plan|0","___ sia stanco, esco.|Sebbene|Nonostante|Perché#Esco ___ non piova.|purché|sebbene|nonostante","Aunque esté cansado=Sebbene sia stanco#A pesar de la lluvia=Nonostante la pioggia"],
["Expresiones idiomáticas","in bocca al lupo=¡mucha suerte!;crepi=gracias (respuesta);non vedo l'ora=estoy impaciente;costare un occhio della testa=costar un ojo de la cara;prendere in giro=burlarse de;fare una figuraccia=quedar fatal;avere le mani in pasta=estar metido en el asunto;essere al verde=estar sin blanca","Los modismos no se traducen palabra por palabra. «In bocca al lupo!» se responde «Crepi!». «Non vedo l'ora di + infinitivo» expresa impaciencia. Úsalos en contexto para sonar natural.","In bocca al lupo per l'esame!=¡Mucha suerte en el examen!;Non vedo l'ora di partire.=Estoy impaciente por salir.;Questo vestito costa un occhio della testa.=Este vestido cuesta un ojo de la cara.;Sono al verde fino a fine mese.=Estoy sin blanca hasta fin de mes.","Domani ho un esame importante e non vedo l'ora che finisca! Mio fratello mi dice: «In bocca al lupo!» e io rispondo: «Crepi!» Dopo l'esame voglio comprare un vestito, ma costa un occhio della testa e sono un po' al verde.","Mañana tengo un examen importante y ¡estoy impaciente por que termine! Mi hermano me dice: «¡Mucha suerte!» y yo respondo: «¡Gracias!» Después del examen quiero comprar un vestido, pero cuesta un ojo de la cara y estoy un poco sin blanca.","¿Qué responde a «in bocca al lupo»?|Crepi|Prego|Ciao|0#¿Por qué no compra el vestido?|Es muy caro|Es feo|No hay talla|0","In bocca al ___!|lupo|gatto|cane#Non vedo l'___ di partire.|ora|ore|orario","Mucha suerte=In bocca al lupo#Estoy impaciente por salir=Non vedo l'ora di partire"],
["Cine y series: la reseña","il regista=el director;la trama=la trama;il personaggio=el personaje;la sceneggiatura=el guion;la colonna sonora=la banda sonora;la recensione=la reseña;noioso=aburrido;coinvolgente=absorbente","Para opinar: «Mi è piaciuto perché…», «La trama è coinvolgente / prevedibile», «Lo consiglio / Non lo consiglio». Para no desvelar el final: «Non ti dico il finale!». Mezcla passato prossimo (lo que viste) e imperfetto (cómo era).","La trama era molto coinvolgente.=La trama era muy absorbente.;Il regista ha fatto un ottimo lavoro.=El director ha hecho un trabajo excelente.;Non ti dico il finale!=¡No te cuento el final!;Lo consiglio a tutti.=Se lo recomiendo a todos.","Ieri sera ho visto un film italiano al cinema. La trama era coinvolgente e i personaggi erano molto umani. La colonna sonora mi è piaciuta moltissimo, ma la sceneggiatura era un po' lenta nella prima parte. In generale lo consiglio, ma non ti dico il finale!","Anoche vi una película italiana en el cine. La trama era absorbente y los personajes eran muy humanos. La banda sonora me gustó muchísimo, pero el guion era un poco lento en la primera parte. En general la recomiendo, ¡pero no te cuento el final!","¿Qué le gustó muchísimo?|La banda sonora|El final|El cine|0#¿Qué fallo tuvo el guion?|Era lento al principio|Era confuso|Era corto|0","La trama era molto ___.|coinvolgente|coinvolgere|coinvolto#Lo ___ a tutti.|consiglio|consigli|consiglia","Lo recomiendo=Lo consiglio#La banda sonora=La colonna sonora"],
["Medios de comunicación","i media=los medios;la televisione=la televisión;il telegiornale=el telediario;la stampa=la prensa;le fake news=las noticias falsas;informarsi=informarse;la fonte=la fuente;affidabile=fiable","Para hablar de información: «Mi informo attraverso…», «Questa fonte non è affidabile», «Bisogna verificare le notizie». Con «che» + congiuntivo para opinar: penso che i media abbiano molto potere.","Mi informo online ogni mattina.=Me informo en línea cada mañana.;Questa fonte non è affidabile.=Esta fuente no es fiable.;Bisogna verificare le notizie.=Hay que verificar las noticias.;Penso che i media abbiano molto potere.=Pienso que los medios tienen mucho poder.","Ogni mattina mi informo leggendo giornali online e ascoltando il telegiornale. Penso che sia importante verificare le fonti perché le fake news sono molto diffuse. Non mi fido di un sito se non è affidabile e confronto sempre più notizie.","Cada mañana me informo leyendo periódicos en línea y escuchando el telediario. Pienso que es importante verificar las fuentes porque las noticias falsas están muy extendidas. No me fío de un sitio si no es fiable y siempre comparo varias noticias.","¿Cómo se informa?|Leyendo periódicos y escuchando el telediario|Solo en redes|Con amigos|0#¿Qué verifica siempre?|Las fuentes|Los precios|Los horarios|0","Questa fonte non è ___.|affidabile|affidabili|affidare#Mi ___ online ogni mattina.|informo|informa|informare","Las noticias falsas=Le fake news#Hay que verificar=Bisogna verificare"],
["Vivir en otro país","trasferirsi=mudarse;l'espatriato=el expatriado;la nostalgia=la nostalgia;l'integrazione=la integración;le usanze=las costumbres;sentirsi a casa=sentirse como en casa;la differenza=la diferencia;adattarsi=adaptarse","Para contar tu experiencia: «Da quando mi sono trasferito…» (desde que me mudé), «All'inizio… poi…» (al principio… luego), «Mi manca…» (echo de menos). «Mancare» concuerda con lo que se echa de menos: mi manca la famiglia, mi mancano gli amici.","Mi manca la mia famiglia.=Echo de menos a mi familia.;Mi mancano gli amici.=Echo de menos a los amigos.;All'inizio era difficile adattarsi.=Al principio era difícil adaptarse.;Ora mi sento a casa.=Ahora me siento como en casa.","Da quando mi sono trasferito a Torino, la mia vita è cambiata. All'inizio era difficile adattarsi alle usanze e mi mancavano molto gli amici. Poi ho imparato la lingua e ho conosciuto persone fantastiche. Ora mi sento davvero a casa.","Desde que me mudé a Turín, mi vida ha cambiado. Al principio era difícil adaptarse a las costumbres y echaba mucho de menos a los amigos. Luego aprendí el idioma y conocí a personas fantásticas. Ahora me siento de verdad como en casa.","¿Qué echaba de menos?|A los amigos|La comida|El clima|0#¿Cómo se siente ahora?|Como en casa|Solo|Cansado|0","Mi ___ la mia famiglia.|manca|mancano|mancare#Mi ___ gli amici.|mancano|manca|mancare","Echo de menos a mi familia=Mi manca la mia famiglia#Me siento como en casa=Mi sento a casa"],
["Compras en línea y garantías","l'ordine=el pedido;la consegna=la entrega;la spedizione=el envío;il reso=la devolución;la garanzia=la garantía;difettoso=defectuoso;il rimborso=el reembolso;il corriere=el mensajero","Para reclamar: «Ho ordinato… ma non è ancora arrivato», «Il prodotto è difettoso, vorrei un rimborso». Verbos: ordinare, spedire, restituire. Plazos: entro quattordici giorni (dentro de catorce días).","Ho ordinato un telefono online.=He pedido un teléfono en línea.;Il pacco non è ancora arrivato.=El paquete aún no ha llegado.;Il prodotto è difettoso.=El producto es defectuoso.;Vorrei restituirlo entro quattordici giorni.=Quisiera devolverlo dentro de catorce días.","Una settimana fa ho ordinato una giacca online. Il corriere l'ha consegnata ieri, ma purtroppo la zip è difettosa. Scrivo al servizio clienti e chiedo un rimborso. La garanzia dura due anni, quindi posso restituirla senza problemi.","Hace una semana pedí una chaqueta en línea. El mensajero la entregó ayer, pero por desgracia la cremallera es defectuosa. Escribo al servicio de atención al cliente y pido un reembolso. La garantía dura dos años, así que puedo devolverla sin problemas.","¿Qué tiene defectuoso?|La cremallera|El color|La talla|0#¿Cuánto dura la garantía?|Dos años|Un año|Seis meses|0","Il prodotto è ___.|difettoso|difetto|difettare#Vorrei un ___.|rimborso|corriere|ordine","La devolución=Il reso#Un reembolso=Un rimborso"],
["Emociones complejas","deluso=decepcionado;preoccupato=preocupado;orgoglioso=orgulloso;sollevato=aliviado;imbarazzato=avergonzado;nostalgico=nostálgico;arrabbiato=enfadado;commosso=conmovido","Para expresar emociones: «Sono + adjetivo», «Mi sento + adjetivo», «Mi dispiace che + congiuntivo». Ej.: mi dispiace che tu sia deluso. «Che peccato!» y «Che sollievo!» son exclamaciones útiles.","Mi sento un po' deluso.=Me siento un poco decepcionado.;Sono orgoglioso di te.=Estoy orgulloso de ti.;Mi dispiace che tu sia preoccupato.=Me da pena que estés preocupado.;Che sollievo!=¡Qué alivio!","Ieri ho ricevuto una bella notizia: mia sorella ha vinto una borsa di studio. Sono molto orgogliosa di lei e anche un po' commossa. All'inizio ero preoccupata perché l'esame era difficile, ma ora sono sollevata. Che sollievo!","Ayer recibí una buena noticia: mi hermana ha ganado una beca. Estoy muy orgullosa de ella y también un poco conmovida. Al principio estaba preocupada porque el examen era difícil, pero ahora estoy aliviada. ¡Qué alivio!","¿Qué ganó la hermana?|Una beca|Un premio|Un viaje|0#¿Cómo se siente ahora?|Aliviada|Enfadada|Triste|0","Sono ___ di te.|orgoglioso|orgoglio|orgogliosi#Mi dispiace che tu ___ deluso.|sia|sei|sarai","Estoy orgulloso=Sono orgoglioso#¡Qué alivio!=Che sollievo!"],
["Averías y reparaciones","il guasto=la avería;riparare=reparar;l'idraulico=el fontanero;l'elettricista=el electricista;la perdita=la fuga;il rubinetto=el grifo;la lampadina=la bombilla;il preventivo=el presupuesto","Para explicar un problema: «C'è una perdita d'acqua», «Non funziona più…», «Si è rotto…». Para pedir una reparación: «Potrebbe venire a controllare?», «Quanto costa il preventivo?». «Farsi + infinitivo» = encargar algo: mi faccio riparare la lavatrice.","C'è una perdita d'acqua in bagno.=Hay una fuga de agua en el baño.;Il rubinetto non funziona più.=El grifo ya no funciona.;Potrebbe venire a controllare?=¿Podría venir a revisarlo?;Quanto costa il preventivo?=¿Cuánto cuesta el presupuesto?","Stamattina ho scoperto una perdita d'acqua in bagno: il rubinetto era rotto. Ho chiamato l'idraulico e gli ho chiesto un preventivo. Lui è venuto subito, ha riparato il guasto in un'ora e mi ha dato una fattura. Ora tutto funziona.","Esta mañana descubrí una fuga de agua en el baño: el grifo estaba roto. Llamé al fontanero y le pedí un presupuesto. Vino enseguida, reparó la avería en una hora y me dio una factura. Ahora todo funciona.","¿Qué estaba roto?|El grifo|La lavadora|La puerta|0#¿Cuánto tardó en repararlo?|Una hora|Un día|Una semana|0","C'è una ___ d'acqua.|perdita|guasto|preventivo#Potrebbe ___ a controllare?|venire|viene|venuto","Hay una avería=C'è un guasto#El presupuesto=Il preventivo"],
["Historia de Italia","l'impero=el imperio;la repubblica=la república;il Rinascimento=el Renacimiento;l'unità d'Italia=la unificación de Italia;la guerra=la guerra;il re=el rey;la storia=la historia;il secolo=el siglo","Para contar historia se usa el passato remoto en textos escritos (fu, nacque, costruirono) y el passato prossimo en la lengua hablada. Siglos: il Quattrocento (siglo XV). Fechas: nel 1861 = en 1861.","Roma fu fondata nel 753 a.C.=Roma fue fundada en el 753 a. C.;Il Rinascimento nacque a Firenze.=El Renacimiento nació en Florencia.;L'Italia si unì nel 1861.=Italia se unificó en 1861.;La Repubblica nacque nel 1946.=La República nació en 1946.","Roma fu fondata, secondo la tradizione, nel 753 a.C. e diventò un grande impero. Nel Quattrocento il Rinascimento nacque a Firenze e cambiò l'arte e la scienza. L'Italia si unì in un solo Stato nel 1861 e dal 1946 è una repubblica.","Roma fue fundada, según la tradición, en el 753 a. C. y se convirtió en un gran imperio. En el siglo XV el Renacimiento nació en Florencia y cambió el arte y la ciencia. Italia se unió en un solo Estado en 1861 y desde 1946 es una república.","¿Dónde nació el Renacimiento?|En Florencia|En Roma|En Venecia|0#¿Desde cuándo es república?|1946|1861|1900|0","L'Italia si unì ___ 1861.|nel|al|dal#Roma ___ fondata nel 753 a.C.|fu|sarà|fosse","El Renacimiento=Il Rinascimento#La república=La repubblica"],
["El futuro anteriore","avrò finito=habré terminado;sarò arrivato=habré llegado;appena=en cuanto;dopo che=después de que;quando=cuando;entro=antes de;sarà già partito=ya habrá salido;chissà=quién sabe","Futuro anteriore = futuro de avere / essere + participio: avrò finito, sarò arrivato. Expresa una acción futura anterior a otra futura (appena avrò finito, ti chiamerò) o una suposición sobre el pasado (sarà già partito).","Appena avrò finito, ti chiamerò.=En cuanto haya terminado, te llamaré.;Quando sarò arrivato, ti scriverò.=Cuando haya llegado, te escribiré.;Dopo che avremo mangiato, usciremo.=Después de que hayamos comido, saldremos.;Sarà già partito.=Ya habrá salido.","Domani avrò molto da fare. Appena avrò finito il lavoro, andrò in palestra. Quando sarò arrivata a casa, preparerò la cena e poi ti chiamerò. Chissà, forse tu sarai già partito per le vacanze!","Mañana tendré mucho que hacer. En cuanto haya terminado el trabajo, iré al gimnasio. Cuando haya llegado a casa, prepararé la cena y luego te llamaré. ¡Quién sabe, quizá tú ya habrás salido de vacaciones!","¿Qué hará al terminar el trabajo?|Ir al gimnasio|Dormir|Salir de viaje|0#¿Qué prepara al llegar a casa?|La cena|El desayuno|Un postre|0","Appena ___ finito, ti chiamerò.|avrò|ho|avevo#Quando ___ arrivato, ti scriverò.|sarò|ero|sono","En cuanto haya terminado=Appena avrò finito#Ya habrá salido=Sarà già partito"],
["La cocina regional italiana","il sugo=la salsa;la pasta fresca=la pasta fresca;il risotto=el risotto;l'olio d'oliva=el aceite de oliva;il pesce=el pescado;la specialità=la especialidad;tipico=típico;la ricetta=la receta","Cada región tiene sus platos: al Nord il risotto e la polenta, al Centro la pasta e i legumi, al Sud il pesce e i pomodori. Para recomendar: «Ti consiglio di provare…», «È una specialità di…».","Il risotto è una specialità del Nord.=El risotto es una especialidad del Norte.;Ti consiglio di provare la pasta fresca.=Te aconsejo que pruebes la pasta fresca.;Questo sugo usa solo prodotti locali.=Esta salsa usa solo productos locales.;Mi dai la ricetta?=¿Me das la receta?","In Italia ogni regione ha le sue specialità. A Milano mangio il risotto, a Roma la carbonara e in Sicilia il pesce fresco con l'olio d'oliva. Ti consiglio di provare la pasta fresca fatta in casa: la ricetta è semplice e il sugo è ottimo.","En Italia cada región tiene sus especialidades. En Milán como risotto, en Roma carbonara y en Sicilia pescado fresco con aceite de oliva. Te aconsejo que pruebes la pasta fresca hecha en casa: la receta es sencilla y la salsa es excelente.","¿Qué come en Milán?|Risotto|Carbonara|Pescado|0#¿Qué aconseja probar?|Pasta fresca|Pizza|Helado|0","Il risotto è una ___ del Nord.|specialità|specialista|speciale#Ti consiglio ___ provare la pasta.|di|a|da","Una especialidad=Una specialità#La receta=La ricetta"],
["Las regiones de Italia","il Nord=el Norte;il Centro=el Centro;il Sud=el Sur;la regione=la región;la costa=la costa;l'isola=la isla;la pianura=la llanura;le Alpi=los Alpes","Italia tiene 20 regiones. Preposiciones: «in Toscana», «in Sicilia» (regiones e islas) y «a Roma» (ciudades). Para ubicar: «a nord di», «a sud di», «al centro».","Firenze è in Toscana.=Florencia está en la Toscana.;Palermo è in Sicilia.=Palermo está en Sicilia.;Milano è a nord di Roma.=Milán está al norte de Roma.;Le Alpi sono nel Nord Italia.=Los Alpes están en el norte de Italia.","L'Italia ha venti regioni. Nel Nord ci sono le Alpi e la pianura del Po, al Centro la Toscana con Firenze, e nel Sud la costa e le isole come la Sicilia e la Sardegna. Ogni regione ha il suo dialetto e le sue tradizioni.","Italia tiene veinte regiones. En el Norte están los Alpes y la llanura del Po, en el Centro la Toscana con Florencia, y en el Sur la costa y las islas como Sicilia y Cerdeña. Cada región tiene su dialecto y sus tradiciones.","¿Cuántas regiones tiene Italia?|Veinte|Quince|Treinta|0#¿Qué hay en el Norte?|Los Alpes|Volcanes|Desierto|0","Firenze è ___ Toscana.|in|a|di#Milano è a ___ di Roma.|nord|nordo|norte","En el Sur=Nel Sud#Veinte regiones=Venti regioni"],
["Generaciones y familia","i genitori=los padres;i nonni=los abuelos;la generazione=la generación;i giovani=los jóvenes;gli anziani=los mayores;l'educazione=la educación;il rispetto=el respeto;il conflitto=el conflicto","Para comparar épocas: «Una volta…» (antes), «Oggi invece…» (hoy, en cambio), «Ai miei tempi…» (en mis tiempos). Usa el imperfetto para el pasado: una volta le famiglie erano più numerose.","Una volta le famiglie erano più grandi.=Antes las familias eran más grandes.;Ai miei tempi si studiava di più.=En mis tiempos se estudiaba más.;Oggi invece i giovani usano il telefono.=Hoy en cambio los jóvenes usan el móvil.;C'è molto rispetto per gli anziani.=Hay mucho respeto por los mayores.","Mio nonno dice: «Ai miei tempi si viveva in famiglie grandi e si rispettavano gli anziani.» Oggi invece i giovani vivono spesso lontano dai genitori. Secondo me ogni generazione ha pregi e difetti, e il dialogo è la chiave per evitare conflitti.","Mi abuelo dice: «En mis tiempos se vivía en familias grandes y se respetaba a los mayores.» Hoy en cambio los jóvenes viven a menudo lejos de sus padres. En mi opinión cada generación tiene virtudes y defectos, y el diálogo es la clave para evitar conflictos.","¿Cómo eran las familias antes?|Grandes|Pequeñas|Inexistentes|0#¿Qué es la clave según quien habla?|El diálogo|El dinero|El silencio|0","Una ___ le famiglie erano grandi.|volta|tempo|giorno#Ai miei ___ si studiava di più.|tempi|tempo|anni","En mis tiempos=Ai miei tempi#Los jóvenes=I giovani"],
["Carta de presentación","la lettera di presentazione=la carta de presentación;l'esperienza=la experiencia;le competenze=las competencias;la candidatura=la candidatura;il posto=el puesto;disponibile=disponible;allegare=adjuntar;distinti saluti=atentamente","Estructura formal: saludo (Gentile…), motivo (Mi candido per…), experiencia (Ho lavorato per…), cierre (Resto a disposizione per un colloquio) y despedida (Distinti saluti). Se usa el registro formal.","Mi candido per il posto di assistente.=Me presento al puesto de asistente.;Ho tre anni di esperienza.=Tengo tres años de experiencia.;Allego il mio curriculum.=Adjunto mi currículum.;Resto a disposizione per un colloquio.=Quedo a su disposición para una entrevista.","Gentile dottoressa Bianchi, mi candido per il posto di assistente amministrativo. Ho tre anni di esperienza in un ufficio e parlo bene inglese e italiano. Allego il mio curriculum e resto a disposizione per un colloquio. Distinti saluti, Paolo Verdi.","Estimada doctora Bianchi, me presento al puesto de asistente administrativo. Tengo tres años de experiencia en una oficina y hablo bien inglés e italiano. Adjunto mi currículum y quedo a su disposición para una entrevista. Atentamente, Paolo Verdi.","¿A qué puesto se presenta?|Asistente administrativo|Camarero|Ingeniero|0#¿Cuántos años de experiencia tiene?|Tres|Cinco|Uno|0","Allego il mio ___.|curriculum|colloquio|posto#Resto a ___ per un colloquio.|disposizione|disponibile|dispone","Adjunto mi currículum=Allego il mio curriculum#Quedo a su disposición=Resto a disposizione"],
["Voluntariado y solidaridad","il volontariato=el voluntariado;l'associazione=la asociación;aiutare=ayudar;il bisogno=la necesidad;la solidarietà=la solidaridad;donare=donar;impegnarsi=comprometerse;la comunità=la comunidad","Para hablar de compromiso social: «Mi impegno a…», «Faccio volontariato presso…», «Ho deciso di aiutare…». Con «affinché» + congiuntivo expresas finalidad: lavoro affinché tutti abbiano un'opportunità.","Faccio volontariato ogni sabato.=Hago voluntariado cada sábado.;L'associazione aiuta le famiglie in difficoltà.=La asociación ayuda a familias en dificultades.;Ho donato dei vestiti.=He donado ropa.;La solidarietà è molto importante.=La solidaridad es muy importante.","Ogni sabato faccio volontariato in un'associazione che aiuta le famiglie in difficoltà. Distribuiamo cibo e vestiti e ascoltiamo i bisogni della comunità. Mi impegno perché penso che la solidarietà renda migliore la società. Ho imparato molto da questa esperienza.","Cada sábado hago voluntariado en una asociación que ayuda a familias en dificultades. Repartimos comida y ropa y escuchamos las necesidades de la comunidad. Me comprometo porque pienso que la solidaridad mejora la sociedad. He aprendido mucho de esta experiencia.","¿Cuándo hace voluntariado?|Cada sábado|Cada día|Cada mes|0#¿Qué reparten?|Comida y ropa|Libros|Dinero|0","Faccio ___ ogni sabato.|volontariato|volontario|volontà#Ho ___ dei vestiti.|donato|dono|donare","La solidaridad=La solidarietà#Hago voluntariado=Faccio volontariato"],
["Comprar una casa","comprare casa=comprar casa;l'agenzia immobiliare=la agencia inmobiliaria;la visita=la visita;il prezzo=el precio;il notaio=el notario;il rogito=la escritura;la caparra=la señal;ristrutturare=reformar","Para comprar: «Cerchiamo un appartamento di… metri quadrati», «Vorremmo visitarlo». Pasos: visita, proposta d'acquisto, caparra, rogito dal notaio. «Ristrutturare» = reformar.","Cerchiamo un appartamento di ottanta metri quadrati.=Buscamos un piso de ochenta metros cuadrados.;Vorremmo visitarlo sabato.=Querríamos visitarlo el sábado.;Dobbiamo versare la caparra.=Tenemos que pagar la señal.;Firmeremo il rogito dal notaio.=Firmaremos la escritura ante el notario.","Io e mia moglie cerchiamo un appartamento di ottanta metri quadrati. L'agenzia immobiliare ci ha mostrato una casa da ristrutturare ma a un buon prezzo. Se ci piace, verseremo la caparra e firmeremo il rogito dal notaio tra due mesi.","Mi mujer y yo buscamos un piso de ochenta metros cuadrados. La agencia inmobiliaria nos ha enseñado una casa para reformar pero a buen precio. Si nos gusta, pagaremos la señal y firmaremos la escritura ante el notario dentro de dos meses.","¿De cuántos metros busca el piso?|Ochenta|Cincuenta|Cien|0#¿Dónde firmarán la escritura?|Ante el notario|En el banco|En la agencia|0","Cerchiamo un ___ di ottanta metri.|appartamento|appartamenti|appartare#Verseremo la ___.|caparra|rogito|visita","Comprar casa=Comprare casa#La agencia inmobiliaria=L'agenzia immobiliare"],
["Naturaleza y aventura","la montagna=la montaña;il sentiero=el sendero;lo zaino=la mochila;la tenda=la tienda de campaña;il rifugio=el refugio;la cima=la cima;l'escursione=la excursión;il panorama=el panorama","Para planear una excursión: «Bisogna portare…», «Conviene partire presto», «Se il tempo regge, saliremo fino alla cima» (si el tiempo aguanta). Pasado: siamo saliti, siamo scesi.","Conviene partire presto.=Conviene salir temprano.;Il sentiero è lungo ma bellissimo.=El sendero es largo pero precioso.;Se il tempo regge, saliremo in cima.=Si el tiempo aguanta, subiremos a la cima.;Abbiamo dormito in un rifugio.=Hemos dormido en un refugio.","Domenica abbiamo fatto un'escursione in montagna. Siamo partiti presto con lo zaino pieno e abbiamo seguito un sentiero lungo ma bellissimo. In cima il panorama era stupendo. La sera abbiamo dormito in un rifugio e siamo scesi il giorno dopo.","El domingo hicimos una excursión en la montaña. Salimos temprano con la mochila llena y seguimos un sendero largo pero precioso. En la cima el panorama era estupendo. Por la noche dormimos en un refugio y bajamos al día siguiente.","¿Dónde durmieron?|En un refugio|En una tienda|En un hotel|0#¿Cómo era el sendero?|Largo pero precioso|Corto|Peligroso|0","Il sentiero è lungo ___ bellissimo.|ma|perché|quindi#Abbiamo dormito in un ___.|rifugio|zaino|panorama","Una mochila=Uno zaino#Si el tiempo aguanta=Se il tempo regge"],
["Carta de reclamación formal","il reclamo=la reclamación;rivolgersi=dirigirse;il disservizio=el mal servicio;il risarcimento=la indemnización;la ricevuta=el recibo;il ritardo=el retraso;il danno=el daño;in attesa di=a la espera de","Carta formal de queja: motivo (Mi rivolgo a Voi per segnalare…), hechos (Il giorno… ho acquistato…), petición (Chiedo il rimborso / un risarcimento) y cierre (In attesa di un Vostro riscontro, porgo distinti saluti).","Mi rivolgo a Voi per segnalare un problema.=Me dirijo a ustedes para señalar un problema.;Chiedo un risarcimento per il danno.=Pido una indemnización por el daño.;Allego la ricevuta.=Adjunto el recibo.;In attesa di un Vostro riscontro, porgo distinti saluti.=A la espera de su respuesta, les saludo atentamente.","Spettabile azienda, mi rivolgo a Voi per segnalare un disservizio. Il 3 maggio ho acquistato una lavatrice che è arrivata con un mese di ritardo e con un danno. Allego la ricevuta e chiedo un risarcimento. In attesa di un Vostro riscontro, porgo distinti saluti.","Estimada empresa, me dirijo a ustedes para señalar un mal servicio. El 3 de mayo compré una lavadora que llegó con un mes de retraso y con un daño. Adjunto el recibo y pido una indemnización. A la espera de su respuesta, les saludo atentamente.","¿Qué compró?|Una lavadora|Un frigorífico|Un móvil|0#¿Qué pide?|Una indemnización|Un descuento|Una factura|0","Mi ___ a Voi per segnalare un problema.|rivolgo|rivolge|rivolgono#Chiedo un ___.|risarcimento|ricevuta|ritardo","Pido una indemnización=Chiedo un risarcimento#Adjunto el recibo=Allego la ricevuta"],
["Los jóvenes y el trabajo","i giovani=los jóvenes;la disoccupazione=el desempleo;il contratto=el contrato;precario=precario;il tirocinio=las prácticas;lo stipendio=el sueldo;la carriera=la carrera profesional;l'opportunità=la oportunidad","Para dar una opinión argumentada: «Dal mio punto di vista…», «Il problema è che…», «Una possibile soluzione sarebbe…». Recuerda: il problema è che molti contratti sono precari.","Molti giovani hanno un contratto precario.=Muchos jóvenes tienen un contrato precario.;Il problema è che gli stipendi sono bassi.=El problema es que los sueldos son bajos.;Un tirocinio è un'opportunità.=Unas prácticas son una oportunidad.;Una soluzione sarebbe creare più lavoro.=Una solución sería crear más trabajo.","Dal mio punto di vista, il problema è che molti giovani hanno solo contratti precari e stipendi bassi. Un tirocinio può essere un'opportunità, ma non basta. Una possibile soluzione sarebbe investire nella formazione e creare più posti di lavoro stabili.","Desde mi punto de vista, el problema es que muchos jóvenes solo tienen contratos precarios y sueldos bajos. Unas prácticas pueden ser una oportunidad, pero no bastan. Una posible solución sería invertir en formación y crear más puestos de trabajo estables.","¿Cuál es el problema?|Contratos precarios y sueldos bajos|Falta de ganas|Demasiado ocio|0#¿Qué solución propone?|Invertir en formación|Subir impuestos|Cerrar empresas|0","Il ___ è che gli stipendi sono bassi.|problema|problemi|probleme#Una soluzione ___ investire.|sarebbe|sarà|è stata","El desempleo=La disoccupazione#Un contrato precario=Un contratto precario"],
["Especialistas y tratamientos","lo specialista=el especialista;il cardiologo=el cardiólogo;il dermatologo=el dermatólogo;gli esami del sangue=los análisis de sangre;la terapia=la terapia;la prevenzione=la prevención;la diagnosi=el diagnóstico;prenotare una visita=pedir cita para una consulta","Para pedir cita: «Vorrei prenotare una visita dal cardiologo». Para describir síntomas: «Da una settimana ho…», «Mi capita di…» (me pasa que). «Sottoporsi a» = someterse a: mi sono sottoposto a degli esami.","Vorrei prenotare una visita dal dermatologo.=Quisiera pedir cita con el dermatólogo.;Mi sono sottoposto a degli esami del sangue.=Me he sometido a unos análisis de sangre.;Mi capita di avere mal di testa.=Me pasa que tengo dolor de cabeza.;La prevenzione è fondamentale.=La prevención es fundamental.","Da una settimana ho dei dolori al petto, quindi prenoto una visita dal cardiologo. Mi sottopongo a degli esami del sangue e a un controllo. Il dottore dice che la diagnosi è buona e che la prevenzione è fondamentale: devo fare più movimento.","Desde hace una semana tengo dolores en el pecho, así que pido cita con el cardiólogo. Me someto a unos análisis de sangre y a una revisión. El doctor dice que el diagnóstico es bueno y que la prevención es fundamental: debo hacer más ejercicio.","¿A qué especialista va?|Al cardiólogo|Al dermatólogo|Al dentista|0#¿Qué debe hacer?|Más ejercicio|Dormir más|Comer menos|0","Vorrei ___ una visita.|prenotare|prenoto|prenotato#La ___ è fondamentale.|prevenzione|prevenire|previene","Los análisis de sangre=Gli esami del sangue#El diagnóstico=La diagnosi"],
["Verbos pronominales","farcela=conseguirlo;cavarsela=apañárselas;andarsene=irse;smetterla=dejarlo ya;prendersela=tomárselo a mal;metterci=tardar;volerci=hacer falta;starci=estar de acuerdo","Los verbos pronominales llevan partículas fijas (ci, la, ne): farcela (conseguirlo), cavarsela (apañárselas), andarsene (irse), prendersela (enfadarse). No se traducen literalmente: ce la faccio = lo consigo; me ne vado = me voy.","Ce la faccio, non ti preoccupare.=Lo consigo, no te preocupes.;Me la cavo bene con l'italiano.=Me apaño bien con el italiano.;Non te la prendere!=¡No te lo tomes a mal!;Ci vogliono due ore per arrivare.=Hacen falta dos horas para llegar.","Questo mese ho molto lavoro, ma ce la faccio. Me la cavo bene anche con l'italiano. Ieri Marco se l'è presa perché non ho risposto, ma gli ho detto: «Non te la prendere!» Ci vogliono due ore per arrivare da lui, quindi me ne vado presto.","Este mes tengo mucho trabajo, pero lo consigo. También me apaño bien con el italiano. Ayer Marco se lo tomó a mal porque no respondí, pero le dije: «¡No te lo tomes a mal!» Hacen falta dos horas para llegar a su casa, así que me voy temprano.","¿Por qué se enfadó Marco?|No respondió|Llegó tarde|Perdió algo|0#¿Cuánto se tarda en llegar?|Dos horas|Una hora|Tres horas|0","Ce la ___, non ti preoccupare.|faccio|fai|fa#___ vogliono due ore.|Ci|Ne|La","Lo consigo=Ce la faccio#No te lo tomes a mal=Non te la prendere"],
["El texto argumentativo","innanzitutto=en primer lugar;inoltre=además;infatti=en efecto;pertanto=por lo tanto;in conclusione=en conclusión;da un lato=por un lado;dall'altro=por otro;a mio parere=a mi parecer","Un texto argumentativo se organiza con conectores: innanzitutto (introducción), inoltre / infatti (apoyo), da un lato… dall'altro (contraste), pertanto (consecuencia) e in conclusione (cierre). Evita repetir «e poi».","Innanzitutto, vorrei spiegare il problema.=En primer lugar, quisiera explicar el problema.;Da un lato è comodo, dall'altro è costoso.=Por un lado es cómodo, por otro es caro.;Pertanto, credo che sia meglio rimandare.=Por lo tanto, creo que es mejor aplazar.;In conclusione, sono favorevole.=En conclusión, estoy a favor.","Innanzitutto, credo che l'uso della bicicletta in città sia utile. Da un lato riduce l'inquinamento, dall'altro fa bene alla salute. Inoltre costa poco. Pertanto sono favorevole a creare più piste ciclabili. In conclusione, la città diventerebbe più vivibile.","En primer lugar, creo que el uso de la bicicleta en la ciudad es útil. Por un lado reduce la contaminación, por otro es bueno para la salud. Además cuesta poco. Por lo tanto estoy a favor de crear más carriles bici. En conclusión, la ciudad sería más habitable.","¿A favor de qué está?|Más carriles bici|Más coches|Menos parques|0#¿Qué ventaja menciona de costes?|Cuesta poco|Es gratis|Es caro|0","___, credo che sia utile.|Innanzitutto|Pertanto|Infatti#Da un lato è comodo, ___ è costoso.|dall'altro|inoltre|quindi","En conclusión=In conclusione#Por un lado=Da un lato"],
["Causa y consecuencia","perché=porque;siccome=como;dato che=dado que;quindi=por tanto;perciò=por eso;di conseguenza=en consecuencia;grazie a=gracias a;a causa di=a causa de","Causa: «perché» (detrás) y «siccome / dato che» (al inicio): siccome pioveva, sono rimasto a casa. Consecuencia: quindi, perciò, di conseguenza. «Grazie a» es positivo y «a causa di» es negativo o neutro.","Siccome pioveva, sono rimasto a casa.=Como llovía, me quedé en casa.;Sono in ritardo a causa del traffico.=Llego tarde por el tráfico.;Ho superato l'esame grazie a te.=He aprobado el examen gracias a ti.;Ho studiato molto, quindi sono tranquillo.=He estudiado mucho, así que estoy tranquilo.","Ieri sono arrivato in ritardo a causa del traffico. Siccome avevo una riunione importante, ho chiamato subito il capo. Grazie a lui, la riunione è stata rimandata di mezz'ora. Di conseguenza ho potuto partecipare e tutto è andato bene.","Ayer llegué tarde por el tráfico. Como tenía una reunión importante, llamé enseguida al jefe. Gracias a él, la reunión se aplazó media hora. En consecuencia pude participar y todo fue bien.","¿Por qué llegó tarde?|Por el tráfico|Por la lluvia|Por un accidente|0#¿Qué hizo el jefe?|Aplazó la reunión|Canceló la reunión|Lo despidió|0","___ pioveva, sono rimasto a casa.|Siccome|Quindi|Grazie#Ho studiato molto, ___ sono tranquillo.|quindi|siccome|perché","Gracias a ti=Grazie a te#A causa del tráfico=A causa del traffico"],
["Repaso B1: contar una experiencia","l'esperienza=la experiencia;ricordare=recordar;all'inizio=al principio;poi=luego;alla fine=al final;sono rimasto=me quedé;ho imparato=aprendí;mi è piaciuto=me gustó","Repaso B1: narra una experiencia mezclando tiempos: passato prossimo (acciones), imperfetto (descripciones), trapassato (lo anterior) y condizionale (reflexión). Ej.: all'inizio non conoscevo nessuno, ma poi ho conosciuto molte persone.","All'inizio non conoscevo nessuno.=Al principio no conocía a nadie.;Poi ho conosciuto molte persone.=Luego conocí a mucha gente.;Avevo già studiato italiano a scuola.=Ya había estudiado italiano en el colegio.;Rifarei questa esperienza.=Repetiría esta experiencia.","L'anno scorso sono andato a studiare a Bologna. All'inizio non conoscevo nessuno e avevo paura di non capire la lingua. Poi ho conosciuto molti studenti e ho imparato tanto. Alla fine sono rimasto sei mesi e rifarei questa esperienza anche domani.","El año pasado me fui a estudiar a Bolonia. Al principio no conocía a nadie y tenía miedo de no entender el idioma. Luego conocí a muchos estudiantes y aprendí mucho. Al final me quedé seis meses y repetiría esta experiencia incluso mañana.","¿Dónde estudió?|En Bolonia|En Roma|En Milán|0#¿Cuánto tiempo se quedó?|Seis meses|Un año|Un mes|0","All'inizio non ___ nessuno.|conoscevo|ho conosciuto|conoscerò#Alla fine ___ sei mesi.|sono rimasto|rimarrei|rimanere","Al principio no conocía a nadie=All'inizio non conoscevo nessuno#Repetiría esta experiencia=Rifarei questa esperienza"],
["Repaso final B1: planes, hipótesis y consejos","il progetto=el proyecto;il consiglio=el consejo;l'ipotesi=la hipótesis;il sogno=el sueño;realizzare=realizar;l'obiettivo=el objetivo;il traguardo=la meta;costruire=construir","Repaso final B1: combina congiuntivo (penso che sia), periodo ipotetico (se potessi, andrei), futuro anteriore (quando avrò finito) y consejos (dovresti, ti consiglio di). Ya puedes defender una opinión, contar planes e imaginar situaciones.","Penso che sia un buon obiettivo.=Pienso que es un buen objetivo.;Se potessi, cambierei lavoro.=Si pudiera, cambiaría de trabajo.;Quando avrò finito, partirò.=Cuando haya terminado, saldré.;Ti consiglio di realizzare il tuo sogno.=Te aconsejo que realices tu sueño.","Il mio obiettivo è lavorare in Italia. Penso che sia possibile, anche se non sarà facile. Quando avrò finito gli studi, cercherò un lavoro a Milano. Se potessi, resterei lì per sempre. Un amico mi ha consigliato di prepararmi bene al colloquio, e lo farò.","Mi objetivo es trabajar en Italia. Pienso que es posible, aunque no será fácil. Cuando haya terminado los estudios, buscaré un trabajo en Milán. Si pudiera, me quedaría allí para siempre. Un amigo me ha aconsejado que me prepare bien para la entrevista, y lo haré.","¿Dónde quiere trabajar?|En Italia|En España|En Francia|0#¿Qué aconsejó un amigo?|Prepararse bien|Viajar|Estudiar más|0","Penso che ___ possibile.|sia|è|sarà#Se potessi, ___ lì per sempre.|resterei|resto|resterò","Mi objetivo=Il mio obiettivo#Si pudiera, cambiaría=Se potessi cambierei"]

["Congiuntivo con superlativos","il più bello che=el más bonito que;il migliore che=el mejor que;l'unico che=el único que;il primo che=el primero que;l'ultimo che=el último que;il più interessante=el más interesante;che io sappia=que yo sepa;per quanto ne sappia=por lo que sé","Tras superlativos relativos y palabras como «unico», «primo», «ultimo» se usa el congiuntivo: è il film più bello che io abbia visto; è l'unico che sappia la verità. Expresión útil: «che io sappia» (que yo sepa).","È il film più bello che io abbia visto.=Es la película más bonita que he visto.;È l'unico che sappia guidare.=Es el único que sabe conducir.;Che io sappia, non c'è nessun problema.=Que yo sepa, no hay ningún problema.;Sei la persona più gentile che conosca.=Eres la persona más amable que conozco.","Ho appena letto il libro più emozionante che io abbia mai letto. È l'unico romanzo che mi abbia fatto piangere. Il protagonista è la persona più coraggiosa che io conosca, anche se non esiste! Che io sappia, esiste anche un film, ma non l'ho ancora visto.","Acabo de leer el libro más emocionante que he leído nunca. Es la única novela que me ha hecho llorar. El protagonista es la persona más valiente que conozco, ¡aunque no existe! Que yo sepa, también existe una película, pero todavía no la he visto.","¿Qué le provocó la novela?|Lloró|Se aburrió|Se enfadó|0#¿Ha visto la película?|Todavía no|Sí|Dos veces|0","È il film più bello che io ___ visto.|abbia|ho|avrò#È l'unico che ___ la verità.|sappia|sa|saprà","La persona más amable que conozco=La persona più gentile che conosca#Que yo sepa=Che io sappia"],
["El congiuntivo trapassato","che avesse detto=que hubiera dicho;che fosse partito=que hubiera salido;pensavo che avesse capito=pensaba que había entendido;temevo che fosse successo=temía que hubiera pasado;speravo che avessero vinto=esperaba que hubieran ganado;sebbene avesse studiato=aunque hubiera estudiado;come se=como si;nonostante fosse=a pesar de que fuera","Congiuntivo trapassato = congiuntivo imperfetto de avere / essere + participio: avesse fatto, fosse partito. Se usa con verbos en pasado para expresar algo anterior: pensavo che fosse già partito. También tras «come se»: parla come se avesse visto un fantasma.","Pensavo che fosse già partito.=Pensaba que ya había salido.;Temevo che fosse successo qualcosa.=Temía que hubiera pasado algo.;Parla come se avesse visto un fantasma.=Habla como si hubiera visto un fantasma.;Speravo che avessero vinto.=Esperaba que hubieran ganado.","Ieri aspettavo Luca, ma non è arrivato. Pensavo che fosse già partito e temevo che fosse successo qualcosa. Poi ho scoperto che aveva perso il telefono. Quando è arrivato, parlava come se avesse corso una maratona, ma era solo felice di vedermi.","Ayer esperaba a Luca, pero no llegó. Pensaba que ya había salido y temía que hubiera pasado algo. Luego descubrí que había perdido el teléfono. Cuando llegó, hablaba como si hubiera corrido una maratón, pero solo estaba feliz de verme.","¿Por qué no llegaba Luca?|Perdió el teléfono|Perdió el tren|Se durmió|0#¿Cómo hablaba al llegar?|Como si hubiera corrido una maratón|Muy despacio|En voz baja|0","Pensavo che ___ già partito.|fosse|era|sia#Parla come se ___ visto un fantasma.|avesse|ha|avrà","Pensaba que había llegado=Pensavo che fosse arrivato#Como si hubiera visto=Come se avesse visto"],
["Hipótesis mixtas","se avessi studiato=si hubiera estudiado;ora sarei=ahora sería;se fossi=si fuera;avrei fatto=habría hecho;probabilmente=probablemente;in quel caso=en ese caso;altrimenti=de lo contrario;a quest'ora=a estas horas","Hipótesis mixta: condición en el pasado y consecuencia en el presente: se avessi studiato (pasado), ora avrei un lavoro migliore (presente). O al revés: se fossi più coraggioso (presente), avrei accettato (pasado).","Se avessi studiato, ora avrei un lavoro migliore.=Si hubiera estudiado, ahora tendría un trabajo mejor.;Se fossi più coraggioso, avrei accettato.=Si fuera más valiente, habría aceptado.;A quest'ora saremmo già arrivati.=A estas horas ya habríamos llegado.;Se non avessi perso il treno, sarei qui.=Si no hubiera perdido el tren, estaría aquí.","Spesso penso al passato. Se avessi studiato medicina, ora sarei un medico. Se fossi più coraggioso, avrei accettato quel lavoro a Londra. Naturalmente non è facile cambiare, ma a quest'ora la mia vita sarebbe molto diversa. L'importante è imparare da ogni scelta.","A menudo pienso en el pasado. Si hubiera estudiado medicina, ahora sería médico. Si fuera más valiente, habría aceptado aquel trabajo en Londres. Naturalmente no es fácil cambiar, pero a estas horas mi vida sería muy diferente. Lo importante es aprender de cada elección.","¿Qué sería si hubiera estudiado medicina?|Médico|Profesor|Abogado|0#¿Dónde estaba el trabajo?|En Londres|En Milán|En Madrid|0","Se avessi studiato, ora ___ medico.|sarei|sono|fossi#Se fossi più coraggioso, ___ accettato.|avrei|ho|avessi","Ahora sería médico=Ora sarei medico#Habría aceptado=Avrei accettato"],
["Pasiva con andare y si pasivante","va fatto=hay que hacerlo;vanno letti=hay que leerlos;si dice=se dice;si vendono=se venden;si può=se puede;non va dimenticato=no hay que olvidarlo;è da fare=está por hacer;da evitare=a evitar","«Andare + participio» expresa obligación en pasiva: il lavoro va fatto = hay que hacerlo. El «si passivante» concuerda con el plural: si vendono case (se venden casas). «Essere da + infinitivo» expresa algo por hacer: è da evitare.","Il lavoro va fatto subito.=El trabajo hay que hacerlo enseguida.;Queste regole vanno rispettate.=Estas reglas hay que respetarlas.;Si vendono biglietti online.=Se venden entradas en línea.;Questo errore è da evitare.=Este error hay que evitarlo.","Nella mia azienda ci sono regole precise. I documenti vanno consegnati entro le cinque e le password non vanno condivise. Si lavora dal lunedì al venerdì e si accettano solo richieste scritte. Un errore da evitare è dimenticare di salvare i file.","En mi empresa hay normas precisas. Los documentos hay que entregarlos antes de las cinco y las contraseñas no hay que compartirlas. Se trabaja de lunes a viernes y solo se aceptan solicitudes escritas. Un error que hay que evitar es olvidar guardar los archivos.","¿Cuándo hay que entregar los documentos?|Antes de las cinco|Por la mañana|El viernes|0#¿Qué error hay que evitar?|No guardar los archivos|Llegar pronto|Hablar mucho|0","Le regole ___ rispettate.|vanno|va|vado#Si ___ biglietti online.|vendono|vende|venduto","Hay que hacerlo=Va fatto#Se venden casas=Si vendono case"],
